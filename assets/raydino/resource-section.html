<script type="application/json" class="resource-data">{"id": "raydino", "line": "RayX", "name": "RayDino（恐龙）", "english_name": "RayDino", "model": "RayDino", "resources_page": "products/raydino/resources.html", "documents": [{"id": "manual", "title": "用户手册", "version": "V1.2", "date": "2026.11.23", "pdf": "../../PDF/raydino/RayDino-manual-V1.2.pdf", "online": "../../index.html#raydino/manual", "pages": 11, "bytes": 2997068, "summary": "安全、启动、日常操作、电池充电与维护", "html": "\u003ch2 id=\"s1\">1 安全须知\u003c/h2>\n\u003ch3 id=\"s1-1\">1.1 使用环境\u003c/h3>\n\u003cp>在平整、干燥、稳固且无杂物的地面使用机器人。保持机器人在视线范围内，远离台阶、桌沿、水源、热源及易碎物品。\u003c/p>\n\u003cp>开始行走、转向或执行技能前，确认周围有足够活动空间，人员和物品不会进入机器人的运动范围。初次操作时，小幅推动摇杆，先进行短距离测试。\u003c/p>\n\u003ch3 id=\"s1-2\">1.2 运动部件\u003c/h3>\n\u003cp>机器人动作时，将手指、头发、衣物和线缆远离头部、关节及嘴部。夹取物品时，不将手指伸入嘴部接触区域。\u003c/p>\n\u003cp>不要在关节带力时强行扳动头部或肢体。搬运前关闭机器人电源，托住机身主体，不提拉头部、嘴部、腿部或线缆。\u003c/p>\n\u003cp>机器人尚未完成初始化、恢复站姿前，不发送行走和技能指令。不要在倒地或卡住状态下反复触发动作。\u003c/p>\n\u003ch3 id=\"s1-3\">1.3 电池与充电\u003c/h3>\n\u003cp>电池应从机器人上拆下后，通过白色插头连接配套充电转换器充电；黄色插头在充电时与机器人保持断开。拆装电池前，先关闭机器人并确认断电。仅使用与交付电池匹配的充电设备，不自行拆解电池。\u003c/p>\n\u003cp>电池、线缆或充电设备出现破损、鼓包、异味或异常发热时，停止使用。充电过程中保持设备干燥、通风，远离热源和易燃物品，并全程有人值守。\u003c/p>\n\u003ch3 id=\"s1-4\">1.4 异常处理\u003c/h3>\n\u003cp>出现持续抖动、动作异常、卡住或跌倒时，停止继续发送动作指令，让周围人员远离运动部件。不要用手硬掰关节，不反复尝试技能动作。\u003c/p>\n\u003cp>若机器人仍能响应遥控器，可按 START 菜单键使机器人回到倒地姿态，待动作结束后关闭手柄，再关闭尾部电源。\u003c/p>\n\u003cp>若遥控器无法控制机器人，不接触运动关节；确认能够安全触及尾部电源开关后再关闭电源。无法安全操作或异常持续时，联系交付方或技术支持处理。\u003c/p>\n\u003ch2 id=\"s2\">2 认识 RayDino\u003c/h2>\n\u003ch3 id=\"s2-1\">2.1 产品概述\u003c/h3>\n\u003cp>RayDino 是一款面向科技爱好者和开发者的小型双足机器人。机身具备头部和双腿关节，可接收控制端指令执行行走、坐站、夹取物品及踢腿等动作。\u003c/p>\n\u003cp>机身摄像头用于采集图像，麦克风和扬声器用于声音采集与播放。电源开关位于机器人的尾部，电池可在关机断电后拆卸更换。\u003c/p>\n\u003cdiv class=\"raydino-views\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:420px;margin:24px auto;text-align:center;\">\u003cfigure style=\"margin:0;min-width:0;\">\u003cimg alt=\"RayDino 本体侧前方\" src=\"assets/raydino/robot.png\" style=\"display:block;width:100%;height:240px;max-width:190px;margin:0 auto;object-fit:contain;\"/>\u003cfigcaption style=\"margin-top:8px;font-size:12px;color:#65756d;\">侧前方\u003c/figcaption>\u003c/figure>\u003cfigure style=\"margin:0;min-width:0;\">\u003cimg alt=\"RayDino 本体背面\" src=\"assets/raydino/rear.png\" style=\"display:block;width:100%;height:240px;max-width:190px;margin:0 auto;object-fit:contain;\"/>\u003cfigcaption style=\"margin-top:8px;font-size:12px;color:#65756d;\">背面\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003ch3 id=\"s2-2\">2.2 主要部件\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>部件\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>头部与嘴部\u003c/td>\n\u003ctd>调整头部姿态，通过嘴部开合夹取适配的小件物品。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>颈部与躯干\u003c/td>\n\u003ctd>连接头部和下肢，参与姿态调整。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>腿部与足部\u003c/td>\n\u003ctd>支撑机身并执行行走、坐站及踢腿等动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>摄像头\u003c/td>\n\u003ctd>采集前方图像。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>麦克风与扬声器\u003c/td>\n\u003ctd>采集声音，播放语音及提示音。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>快拆电池与尾部电源开关\u003c/td>\n\u003ctd>提供电能，并用于接通或关闭机器人电源。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s2-3\">2.3 电源与控制端\u003c/h3>\n\u003cp>使用尾部电源开关接通或关闭机器人电源。机器人与已配对的实体遥控器连接后，可通过遥控器完成初始化、姿态切换和动作控制。\u003c/p>\n\u003cp>长按 START 菜单键完成初始化与使能时，机器人仍处于倒地状态；随后短按一次 START，机器人恢复站姿，才可开始行走。结束使用时，再按 START 回到倒地姿态后关机。\u003c/p>\n\u003ch2 id=\"s3\">3 使用前准备与启动\u003c/h2>\n\u003ch3 id=\"s3-1\">3.1 开箱与安装电池\u003c/h3>\n\u003cp>在平整地面打开包装，检查机身、电池、遥控器和随箱附件有无可见损伤。按随箱交付清单核对物品，发现破损或缺件时先联系交付方。\u003c/p>\n\u003cp>确认尾部电源处于关闭状态，将配套电池按正确方向装入安装位置并固定，连接黄色供电插头；白色充电插头收置妥当，不接入机器人供电接口。检查电池是否固定可靠，不强行插装，不带电拆装。首次安装请由交付人员示范。\u003c/p>\n\u003ch3 id=\"s3-2\">3.2 上电前摆放与检查\u003c/h3>\n\u003cp>上电前，将机器人平放在地面，使头部和关节自然伸直。检查关节、足部及线缆有无异物、破损或松动，清理周围的障碍物。\u003c/p>\n\u003cp>确认电池状态满足使用需要。需要充电时，按第 5 章将电池拆下充电，不通过机身直接给电池充电。\u003c/p>\n\u003ch3 id=\"s3-3\">3.3 启动步骤\u003c/h3>\n\u003col>\n\u003cli>\n\u003cp>将机器人按上述要求平放在地面，人员远离关节和嘴部的运动范围。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>操作机器人尾部的电源开关，接通机器人电源。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>打开已配对的实体遥控器，确认遥控器已连接目标机器人。首次配对由交付人员协助完成。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>长按遥控器 START 菜单键，完成机器人的初始化与使能。此时机器人仍保持倒地状态，不需要用手将其摆放直立。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>确认周围活动空间充足，短按一次 START 菜单键，使机器人恢复站姿。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>等待机器人站姿稳定，再用十字方向键左键或右键选择行走模式。小幅推动左摇杆测试前进和后退，再用右摇杆测试转向。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"s3-4\">3.4 启动检查\u003c/h3>\n\u003cp>只有在机器人恢复站姿并保持稳定、遥控器连接正确后，才继续行走或执行技能。若机器人没有按预期恢复站姿，或出现持续抖动、碰撞和卡住，按第 6 章检查，不强行扳动机身。\u003c/p>\n\u003ch2 id=\"s4\">4 日常操作与结束使用\u003c/h2>\n\u003ch3 id=\"s4-1\">4.1 移动与姿态控制\u003c/h3>\n\u003cp>先用十字方向键选择模式，再操作摇杆。十字方向键的左键和右键均用于进入行走模式，不直接控制机器人的转向。切换模式前，将摇杆回中。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>十字方向键\u003c/th>\n\u003cth>控制模式\u003c/th>\n\u003cth>左摇杆\u003c/th>\n\u003cth>右摇杆\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>按上\u003c/td>\n\u003ctd>头部控制\u003c/td>\n\u003ctd>控制头部运动\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按下\u003c/td>\n\u003ctd>躯干控制\u003c/td>\n\u003ctd>控制躯干运动\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按左或按右\u003c/td>\n\u003ctd>行走控制\u003c/td>\n\u003ctd>前进与后退\u003c/td>\n\u003ctd>左右转向\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>行走模式下，向前或向后推动左摇杆控制前进或后退；向左或向右推动右摇杆控制相应转向。操作时保持机器人在视线内，避免靠近台阶、桌沿或障碍物。\u003c/p>\n\u003ch3 id=\"s4-2\">4.2 基础动作\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>按键\u003c/th>\n\u003cth>对应动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>坐下／站立切换\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>从地面夹取物品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X\u003c/td>\n\u003ctd>前滚翻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左肩键／右肩键\u003c/td>\n\u003ctd>左踢腿／右踢腿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左扳机／右扳机\u003c/td>\n\u003ctd>控制嘴部开合度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>每次完成一个动作后再进行下一项操作。夹取物品时选择适配的小件物品，不强行夹取；踢腿和前滚翻前，确认对应腿部及机身前后有足够空间。\u003c/p>\n\u003ch3 id=\"s4-3\">4.3 结束使用与关机\u003c/h3>\n\u003col>\n\u003cli>\n\u003cp>结束当前动作输入，将摇杆回中，在平整地面为机身姿态变化留出空间。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>按 START 菜单键，使机器人回到倒地姿态；等待动作完成，确认机身已停止运动。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>关闭遥控器。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>关闭机器人尾部的电源开关。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>需要搬运、更换电池或充电时，确认机器人已经断电后再操作。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>关闭手柄不能代替关闭机器人电源。不要在机器人尚未停止运动时提起或装箱。\u003c/p>\n\u003ch2 id=\"s5\">5 电池充电与日常维护\u003c/h2>\n\u003cp>本章适用于 JP30P1-2S1P 配套电池及 iMars S10 充电转换器。电池拆下后，通过白色插头连接转换器，再由转换器的 USB 线连接电源完成充电。黄色插头用于给机器人供电；充电时黄色插头保持断开，不连接机器人。\u003c/p>\n\u003ch3 id=\"s5-1\">5.1 电池参数\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>参数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>电池组型号\u003c/td>\n\u003ctd>JP30P1-2S1P\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组合方式\u003c/td>\n\u003ctd>2S1P，即两节电芯串联\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标称容量\u003c/td>\n\u003ctd>3000 mAh\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标称电压\u003c/td>\n\u003ctd>7.36 V\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池标称充电电流\u003c/td>\n\u003ctd>1.5 A（0.5C）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池最大充电电流\u003c/td>\n\u003ctd>3 A（1C）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配套充电转换器\u003c/td>\n\u003ctd>Gens ace iMars S10；最大充电电流 0.8 A\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>电池的标称、最大充电电流属于电池规格，不是需要用户在转换器上设置的数值。本套充电方式使用配套转换器管理充电，不按电池最大充电电流自行更换充电方案。\u003c/p>\n\u003ch3 id=\"s5-2\">5.2 识别两个插头与充电转换器\u003c/h3>\n\u003cp>电池引出两组连接线，按插头颜色区分用途。\u003c/p>\n\u003ctable style=\"table-layout:fixed;width:100%;\">\u003ccolgroup>\u003ccol style=\"width:28%\"/>\u003ccol style=\"width:28%\"/>\u003ccol style=\"width:44%\"/>\u003c/colgroup>\n\u003cthead>\n\u003ctr>\n\u003cth>部件\u003c/th>\n\u003cth>用途\u003c/th>\n\u003cth>使用要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>黄色插头\u003c/td>\n\u003ctd>连接机器人，向机器人供电\u003c/td>\n\u003ctd>机器人关机后才能插拔；充电时不连接。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>白色三孔插头\u003c/td>\n\u003ctd>连接配套充电转换器的电池接口\u003c/td>\n\u003ctd>充电时使用；按接口定位方向插入，不错位、不反插。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>充电转换器的 USB 接口\u003c/td>\n\u003ctd>通过 USB 线连接电源\u003c/td>\n\u003ctd>使用配套 USB 线及支持 5 V、额定输出电流不低于 2 A 的电源；不使用仅支持 5 V / 1 A 的电源。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cimg alt=\"电池本体及黄色、白色插头\" src=\"assets/raydino/charging/battery.jpg\" style=\"display:block;width:auto;height:auto;max-width:100%;max-height:280px;object-fit:contain;margin:18px auto;\"/>\u003c/p>\n\u003cp>图 5-1 电池引出的黄色供电插头与白色充电插头。\u003c/p>\n\u003cp>\u003cimg alt=\"iMars S10充电转换器\" src=\"assets/raydino/charging/charger.png\" style=\"display:block;width:auto;height:auto;max-width:100%;max-height:280px;object-fit:contain;margin:18px auto;\"/>\u003c/p>\n\u003cp>图 5-2 配套 iMars S10 充电转换器。\u003c/p>\n\u003cp>只使用配套电池和转换器，不将白色插头直接接入 USB 电源，不把黄色插头接到充电转换器的其他接口。插拔时握住插头外壳，不拉扯导线，不用金属物接触或跨接插头端子。\u003c/p>\n\u003ch3 id=\"s5-3\">5.3 关机、拆下电池与检查\u003c/h3>\n\u003col>\n\u003cli>按第 4.3 节结束使用：摇杆回中，按 START 使机器人回到倒地姿态，待动作结束后关闭遥控器，再关闭机器人尾部电源。\u003c/li>\n\u003cli>确认机器人已经断电，握住黄色插头外壳，将电池与机器人断开，再按电池固定结构的拆卸方式取出电池。首次拆装由交付人员示范。\u003c/li>\n\u003cli>检查电池外壳、导线、两个插头、转换器和 USB 线。出现鼓包、破损、裸线、异味或异常发热时，不进行充电。\u003c/li>\n\u003cli>将电池和转换器放在干燥、通风、稳定且不易燃的台面上。电池过冷或使用后明显发热时，先恢复至常温；充电全程有人照看。\u003c/li>\n\u003c/ol>\n\u003cp>充电前，确认黄色插头已经与机器人断开。不边充电边运行机器人，不通过机器人机身给电池充电。\u003c/p>\n\u003ch3 id=\"s5-4\">5.4 连接与开始充电\u003c/h3>\n\u003cp>充电连接关系如下。黄色供电插头不参与该连接。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>电池侧\u003c/th>\n\u003cth>中间设备\u003c/th>\n\u003cth>电源侧\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>电池白色三孔插头\u003c/td>\n\u003ctd>充电转换器的电池接口 → USB 接口\u003c/td>\n\u003ctd>USB 线 → 5 V USB 电源\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003col>\n\u003cli>先将 USB 线连接到充电转换器，再把 USB 线另一端插入符合第 5.2 节要求的电源，并接通电源。\u003c/li>\n\u003cli>观察转换器指示灯。正常接通电源时，绿灯闪烁 3 次；此时仅表示转换器通电，不表示电池充满。\u003c/li>\n\u003cli>将电池的白色三孔插头按定位方向对准转换器的电池接口，平直插入并确认牢固。遇到明显阻力时停止，重新检查方向和位置，不强行插入。\u003c/li>\n\u003cli>确认转换器进入充电指示状态，电池及导线连接稳定。配套普通电池充电时，红灯闪烁。\u003c/li>\n\u003cli>保持黄色插头悬空并远离导电物，不连接机器人。充电期间不移动、挤压电池，不覆盖电池或转换器，不离开现场。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg alt=\"白色插头接入充电转换器的实拍\" src=\"assets/raydino/charging/connected.jpg\" style=\"display:block;width:auto;height:auto;max-width:100%;max-height:280px;object-fit:contain;margin:18px auto;\"/>\u003c/p>\n\u003cp>图 5-3 白色插头接入转换器，USB 线连接电源侧；黄色插头保持断开。\u003c/p>\n\u003ch3 id=\"s5-5\">5.5 指示灯、充满与断开\u003c/h3>\n\u003cp>以下灯语适用于配套 iMars S10 充电转换器。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指示灯\u003c/th>\n\u003cth>含义与操作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接通电源时绿灯闪烁 3 次\u003c/td>\n\u003ctd>转换器已通电；不代表电池充满。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>红灯闪烁\u003c/td>\n\u003ctd>正在充电；保持连接并照看充电过程。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>绿灯持续常亮\u003c/td>\n\u003ctd>充电完成；按下述步骤断开。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>红灯持续常亮\u003c/td>\n\u003ctd>异常提示；停止充电并检查连接、电源和电池状态。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003col>\n\u003cli>确认绿灯持续常亮，且电池、导线和转换器无异常。\u003c/li>\n\u003cli>先关闭 USB 电源或拔下电源侧 USB 线，切断转换器输入电源。\u003c/li>\n\u003cli>握住白色插头外壳，将电池从转换器断开，避免拉扯线材。\u003c/li>\n\u003cli>再次检查电池和插头。需要重新装机时，确认机器人尾部电源处于关闭状态，再安装固定电池并连接黄色供电插头。\u003c/li>\n\u003cli>检查白色充电插头已与转换器分离，线材收置妥当、不受挤压后，才按第 3 章启动机器人。\u003c/li>\n\u003c/ol>\n\u003cp>不要只按充电时长判断充满，不把刚通电时的绿灯闪烁误认为充电完成。\u003c/p>\n\u003ch3 id=\"s5-6\">5.6 充电常见问题\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>检查与处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接通 USB 电源后无指示\u003c/td>\n\u003ctd>检查电源是否开启、USB 线是否插牢，以及电源是否支持 5 V 且额定输出电流不低于 2 A；不使用仅 5 V / 1 A 的电源。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池接入后没有开始充电\u003c/td>\n\u003ctd>先断开电源，确认使用的是白色三孔插头，插入方向、位置和接触状态正确，再重新连接。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>红灯持续常亮\u003c/td>\n\u003ctd>先切断输入电源，再断开电池；检查插接、电源规格及电池状态。无法排除时暂停使用并联系技术支持。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池鼓包、异味、冒烟或异常发热\u003c/td>\n\u003ctd>立即停止使用，人员远离；能够安全操作时切断外部电源。不要继续插拔、挤压或拆解异常电池，联系技术支持处理。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s5-7\">5.7 清洁与检查\u003c/h3>\n\u003cp>关机断电后，用柔软干布清洁机身和摄像头表面。不冲洗，不向关节及接口灌入清洁液，不用硬物擦划镜片。\u003c/p>\n\u003cp>使用前后检查关节、紧固件、足部、线缆和电池接触部位。发现结构破损、线缆损伤、明显松动或持续异常时，停止使用并联系技术人员，不自行拆修带力关节和电气部件。\u003c/p>\n\u003ch3 id=\"s5-8\">5.8 存放与软件维护\u003c/h3>\n\u003cp>长期不使用时，将电池与机器人、充电转换器及电源断开，保护好黄色和白色插头，避免端子与金属物接触。本体、电池和转换器存放于干燥、通风、避免日晒的位置，远离热源、腐蚀性、易燃和易爆物品。电池的存放电量及维护周期按配套电池说明执行。\u003c/p>\n\u003cp>软件更新使用与本机版本匹配的工具和升级包。更新前结束机器人动作，保持供电及连接稳定；不清楚版本兼容性或升级失败时，联系交付方或技术支持，不反复断电或使用来源不明的升级包。\u003c/p>\n\u003ch2 id=\"s6\">6 常见问题与故障排除\u003c/h2>\n\u003cp>出现异常时，先暂停操作，并确保周围人员远离机器人运动范围。下表列出可由用户确认的项目；无法排除时，联系交付方或技术支持。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>检查与处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>无法开机\u003c/td>\n\u003ctd>确认配套电池安装可靠、尾部电源已开启。检查电池和电源部位有无可见损伤；仍无法启动时停止尝试并联系技术支持。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>遥控器连接失败\u003c/td>\n\u003ctd>确认已打开机器人和手柄电源，连接的是目标设备。首次使用或配对信息变更后，请交付人员协助检查配对配置。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已连接但无法行走\u003c/td>\n\u003ctd>先确认已长按 START 完成初始化与使能，再短按 START 恢复站姿。待站姿稳定后，按方向键左或右选择行走模式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左摇杆控制头部或躯干\u003c/td>\n\u003ctd>当前处于头部或躯干模式。将摇杆回中，按方向键左或右切回行走模式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>动作异常 卡住或跌倒\u003c/td>\n\u003ctd>停止继续发送动作指令，人员远离运动部件。按第 1.4 节处理，不硬掰关节，不反复触发动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池或充电设备异常\u003c/td>\n\u003ctd>出现破损、鼓包、异味或异常发热时停止使用，不自行拆解；联系技术人员检查。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s6-1\">6.1 异常后恢复使用\u003c/h3>\n\u003cp>重新操作前，确认机身、关节、足部和线缆无明显损伤，活动范围内无障碍物。涉及碰撞、关节卡住或电气异常时，请先由技术人员检查。\u003c/p>\n\u003cp>需要重新启动时，先完成正常关机，再按第 3 章的摆放、上电、连接、初始化和恢复站姿流程操作。不要直接在倒地或异常状态下反复触发行走和技能。\u003c/p>\n\u003ch3 id=\"s6-2\">6.2 联系技术支持\u003c/h3>\n\u003cp>报修时提供能够获取的设备编号、交付信息、软件版本、异常发生前的操作，以及能够说明问题的照片或视频。联系交付方获取对应的处理建议；在问题未排除前暂停使用。\u003c/p>\n\u003ch2 id=\"s7\">7 技术参数\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>参数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>产品名称\u003c/td>\n\u003ctd>RayDino\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>产品类型\u003c/td>\n\u003ctd>小型双足机器人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>站立高度\u003c/td>\n\u003ctd>280 mm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>整机重量\u003c/td>\n\u003ctd>约 950 g\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全身自由度\u003c/td>\n\u003ctd>15 个；头部 5 个，双腿共 10 个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前进速度\u003c/td>\n\u003ctd>0.2 m/s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>续航时间\u003c/td>\n\u003ctd>约 0.75 h，视使用情况变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>通信方式\u003c/td>\n\u003ctd>Wi-Fi、蓝牙\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>续航表现随动作类型、使用频率和实际工况变化。使用时留意电池状态，不在电量不足时继续执行连续运动。\u003c/p>\n\u003ch2 id=\"s8\">8 收纳 运输与相关资料\u003c/h2>\n\u003ch3 id=\"s8-1\">8.1 收纳与运输\u003c/h3>\n\u003cp>装箱前，按第 4.3 节让机器人回到倒地姿态并关闭电源。需要调整收纳姿态时，在断电状态下按交付人员示范的方法操作，不逆关节方向强行扳动。\u003c/p>\n\u003cp>将机器人放入专用包装箱，电池、遥控器及附件放入对应卡位。确认设备固定可靠后再合盖，必要时使用缓冲材料，避免运输中的挤压、撞击、摩擦和振动。\u003c/p>\n\u003ch3 id=\"s8-2\">8.2 相关资料与售后\u003c/h3>\n\u003cp>实体遥控器按键位置、控制模式和动作指令，参阅随附《遥控器使用指南》第 2 章“按钮映射”和第 4 章“基本操作”。Web 状态查询与板端维护见《BSP 技术与接口手册》第 2、6、7 章；应用开发见《应用开发与 API 参考》第 1～6 章。\u003c/p>\n\u003cp>电池与充电设备的具体操作，参阅相应配套说明。保修范围及服务事项按随产品交付的保修文件办理；送修前先与交付方确认寄送设备、附件和包装要求。\u003c/p>"}, {"id": "controller", "title": "遥控器使用指南", "version": "V1.1", "date": "2026.11.18", "pdf": "../../PDF/raydino/RayDino-controller-V1.1.pdf", "online": "../../index.html#raydino/controller", "pages": 5, "bytes": 1794784, "summary": "按键图、控制模式、动作指令与结束使用", "html": "\u003ch2 id=\"s1\">1 简介\u003c/h2>\n\u003cp>遥控器用于控制小恐龙机器人的行走、头部及躯干运动，并触发坐下、站立、夹取物品和踢腿等动作。使用前，请先了解按键位置和控制模式，并在平整、干燥、无障碍物的地面操作。\u003c/p>\n\u003ch2 id=\"s2\">2 按钮映射\u003c/h2>\n\u003cp>\u003cimg alt=\"遥控器按钮映射\" src=\"assets/raydino/controller.png\"/>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>按键或部件\u003c/th>\n\u003cth>默认控制功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>左摇杆\u003c/td>\n\u003ctd>行走模式：前进／后退；其他模式：头部／躯干控制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>右摇杆\u003c/td>\n\u003ctd>行走模式：左右转向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>十字方向键\u003c/td>\n\u003ctd>上：头部；下：躯干；左或右：行走模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>START 菜单键\u003c/td>\n\u003ctd>长按：初始化与使能；短按：切换倒地／站立姿态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>A 键\u003c/td>\n\u003ctd>坐下／站立切换\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>B 键\u003c/td>\n\u003ctd>从地面夹取物品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>X 键\u003c/td>\n\u003ctd>前滚翻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>左肩键\u003c/td>\n\u003ctd>左踢腿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>右肩键\u003c/td>\n\u003ctd>右踢腿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>左扳机\u003c/td>\n\u003ctd>嘴部开合度控制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11\u003c/td>\n\u003ctd>右扳机\u003c/td>\n\u003ctd>嘴部开合度控制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"s3\">3 连接与使用准备\u003c/h2>\n\u003ch3 id=\"s3-1\">3.1 连接遥控器\u003c/h3>\n\u003cp>使用前，确认机器人已上电，并完成遥控器开机及与目标机器人的连接。开关机及配对操作应按随附手柄型号说明执行。连接过程中不要推动摇杆或按下技能键。\u003c/p>\n\u003cp>需要管理手柄配对时，可打开配套工具，点击“扫描”，找到目标机器人名称，点击“打开网页”，进入“手柄配对”入口。首次使用建议由交付人员完成连接配置。\u003c/p>\n\u003ch3 id=\"s3-2\">3.2 初始化与姿态恢复\u003c/h3>\n\u003col>\n\u003cli>\n\u003cp>上电前，将机器人平放在地面，使关节和头部自然伸直。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>机器人上电、遥控器连接完成后，长按 START 菜单键，初始化机器人。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>长按完成初始化与使能后，机器人仍保持倒地状态，不需要用手摆放直立。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>确认周围留有活动空间，短按一次 START 菜单键，使机器人恢复站姿。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>确认机器人姿态稳定后，再选择控制模式并进行遥控操作。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>注意：长按 START 菜单键用于初始化机器人，短按用于切换倒地／站立姿态。初始化不等于关机，START 菜单键不能作为专用急停键使用。\u003c/p>\n\u003ch2 id=\"s4\">4 基本操作\u003c/h2>\n\u003ch3 id=\"s4-1\">4.1 选择控制模式\u003c/h3>\n\u003cp>先使用十字方向键选择模式，再操作摇杆。十字方向键的“左”和“右”均用于进入行走模式，不直接控制机器人向左或向右运动。切换模式前，请将摇杆回中。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>十字方向键\u003c/th>\n\u003cth>控制模式\u003c/th>\n\u003cth>左摇杆功能\u003c/th>\n\u003cth>右摇杆功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>按上\u003c/td>\n\u003ctd>头部控制\u003c/td>\n\u003ctd>控制头部运动\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按下\u003c/td>\n\u003ctd>躯干控制\u003c/td>\n\u003ctd>控制躯干运动\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按左或按右\u003c/td>\n\u003ctd>行走控制\u003c/td>\n\u003ctd>前进、后退\u003c/td>\n\u003ctd>左右转向\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>“—”表示该模式下未列出右摇杆操作。摇杆回中指松开摇杆，使其回到中央位置。\u003c/p>\n\u003ch3 id=\"s4-2\">4.2 行走遥控\u003c/h3>\n\u003cp>进入行走模式后，向前推动左摇杆控制前进，向后推动控制后退；向左或向右推动右摇杆控制相应转向。首次操作请小幅推动摇杆，先进行短距离移动。\u003c/p>\n\u003ch3 id=\"s4-3\">4.3 头部与躯干遥控\u003c/h3>\n\u003cp>按十字方向键上键进入头部模式，操作左摇杆控制头部；按下键进入躯干模式，操作左摇杆控制躯干。操作前确认头部和机身周围无障碍物，避免强行扳动带力关节。\u003c/p>\n\u003ch2 id=\"s5\">5 遥控指令速查\u003c/h2>\n\u003cp>以下为机器人默认按键绑定。技能按键可由软件重新绑定，功能以当前交付配置为准。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>按键或部件\u003c/th>\n\u003cth>操作\u003c/th>\n\u003cth>对应功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>START 菜单键\u003c/td>\n\u003ctd>长按\u003c/td>\n\u003ctd>初始化与使能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>START 菜单键\u003c/td>\n\u003ctd>短按\u003c/td>\n\u003ctd>切换倒地／站立姿态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>十字方向键\u003c/td>\n\u003ctd>上／下\u003c/td>\n\u003ctd>选择头部／躯干控制模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>十字方向键\u003c/td>\n\u003ctd>左或右\u003c/td>\n\u003ctd>选择行走控制模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左摇杆\u003c/td>\n\u003ctd>前后推动\u003c/td>\n\u003ctd>行走模式下前进／后退\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>右摇杆\u003c/td>\n\u003ctd>左右推动\u003c/td>\n\u003ctd>行走模式下左右转向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A 键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>坐下／站立切换（sit_toggle）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B 键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>从地面夹取物品（ground_pick）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左肩键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>左踢腿（kick_left）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>右肩键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>右踢腿（kick_right）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X 键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>前滚翻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左右扳机\u003c/td>\n\u003ctd>改变按压程度\u003c/td>\n\u003ctd>控制嘴部开合度，与输入线性对应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>夹取物品时，选择适配的小件物品，确认嘴部与物品接触区域无人手靠近。踢腿前，确保对应腿部及前方无障碍物。完成一个技能动作后再进行下一项操作。\u003c/p>\n\u003ch2 id=\"s6\">6 使用注意事项\u003c/h2>\n\u003cp>• 机器人动作时，保持可见并留出活动空间，远离台阶、桌沿、水源和易碎物品。\u003c/p>\n\u003cp>• 切换模式或状态前先将摇杆回中。不要连续快速按下技能键，不要在关节带力时搬动或强行调整机身。\u003c/p>\n\u003cp>• 结束使用时，将摇杆回中，停止发送技能指令；按 START 使机器人回到倒地姿态，待动作结束后关闭手柄，再关闭机器人尾部电源。不要通过关闭手柄代替机器人断电。本体启动、充电和异常处理见《用户手册》第 3、5 和 1.4 节。\u003c/p>\n\u003cp>• 遥控器保持干燥，避免跌落、碰撞和液体进入。清洁时用柔软干布擦拭，不自行拆解或改变手柄硬件。\u003c/p>\n\u003ch2 id=\"s7\">7 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>处理方法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>已连接但无法行走\u003c/td>\n\u003ctd>确认已完成初始化、机器人姿态稳定；选择行走模式后再操作摇杆。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左摇杆控制头部或躯干\u003c/td>\n\u003ctd>将摇杆回中，按十字方向键左或右，切换到行走模式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>技能按键与说明不一致\u003c/td>\n\u003ctd>核对当前软件按键绑定，确认是否修改过配置。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无法连接或反应异常\u003c/td>\n\u003ctd>暂停操作，检查目标设备和连接配置；仍无法恢复时联系交付或技术人员。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>"}, {"id": "api", "title": "应用开发与 API 参考", "version": "V1.1", "date": "2026.11.18", "pdf": "../../PDF/raydino/RayDino-api-V1.1.pdf", "online": "../../index.html#raydino/api", "pages": 7, "bytes": 977694, "summary": "应用连接、请求契约、技能结果、事件、音频与资源清理", "html": "\u003cp>业务应用通过 \u003ccode>@raydiculousx/js-sdk/host/app\u003c/code> 的 \u003ccode>connectApp()\u003c/code> 获取 \u003ccode>RaydiculousX\u003c/code>；自行提供 \u003ccode>url\u003c/code>、\u003ccode>jti\u003c/code>、\u003ccode>sn\u003c/code> 时使用根入口 \u003ccode>connectDirect()\u003c/code>。两者均等控制通道建立且能力查询完成才返回。初始化不会自动运动。\u003c/p>\n\u003ch2 id=\"s1\">1 初始化与上下文\u003c/h2>\n\u003cpre>\u003ccode class=\"language-ts\">import { RaydiculousXError } from '@raydiculousx/js-sdk';\nimport { connectApp } from '@raydiculousx/js-sdk/host/app';\n\nconst robot = await connectApp(); // 默认信任同源 Host\nrobot.on('context', () =&gt; console.log(robot.context));\n\u003c/code>\u003c/pre>\n\u003cp>跨域应用的 \u003ccode>expectedHostOrigin\u003c/code> 必须来自应用可信配置，不能读取 URL 中自报的来源。重复的相同初始化复用 Promise；冲突配置、未完成退出或缺少可信宿主会失败。\u003c/p>\n\u003cp>\u003ccode>connectApp\u003c/code> 可配置 \u003ccode>signal\u003c/code> 和 \u003ccode>timeoutMs\u003c/code>（默认 45000 ms）。\u003ccode>connectDirect\u003c/code> 默认建连超时 20000 ms，接受 \u003ccode>requestTimeoutMs\u003c/code>、\u003ccode>cleanupTimeoutMs\u003c/code>、\u003ccode>iceServers\u003c/code>、\u003ccode>appId\u003c/code>、主题与业务配置，完整字段见包内 \u003ccode>DirectConnectionOptions\u003c/code> 声明（SDK 包内 \u003ccode>dist/lib/direct.d.ts\u003c/code>）。访问凭据不会出现在上下文中。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>属性\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>mode\u003c/code>\u003c/td>\n\u003ctd>固定为 \u003ccode>direct\u003c/code>；独立与商店启动采用同一连接实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>context: RobotContext\u003c/code>\u003c/td>\n\u003ctd>机器人 ID、应用 ID、本地会话、连接代次、连接状态、能力、最近状态快照、主题与公开配置的副本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>disposed\u003c/code>\u003c/td>\n\u003ctd>已进入离场或关闭，不能再发起请求；不代表异步清理已经结束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sitting\u003c/code>\u003c/td>\n\u003ctd>最近确认的坐姿状态；未知时为 null\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>peerConnection\u003c/code>\u003c/td>\n\u003ctd>当前机器人 WebRTC 连接；关闭后为 null\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>robotAudioTrack\u003c/code>\u003c/td>\n\u003ctd>已协商接收的机器人音轨；尚无音轨时为 null\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>context.capabilities\u003c/code> 使用 \u003ccode>move\u003c/code>、\u003ccode>skills\u003c/code>、\u003ccode>status\u003c/code>、\u003ccode>video\u003c/code>、\u003ccode>audioOut\u003c/code>、\u003ccode>audioIn\u003c/code>，每项含 \u003ccode>supported\u003c/code> 和 \u003ccode>schemaVersion\u003c/code>。连接状态为 \u003ccode>connecting\u003c/code>、\u003ccode>ready\u003c/code> 或 \u003ccode>disconnected\u003c/code>；断线不自动重连或重放动作。\u003c/p>\n\u003ch2 id=\"s2\">2 请求选项\u003c/h2>\n\u003cp>\u003ccode>RequestOptions\u003c/code> 包含 \u003ccode>timeoutMs\u003c/code>（1～120000 ms）与 \u003ccode>signal\u003c/code>。单次超时配置优先，其次使用连接级 \u003ccode>requestTimeoutMs\u003c/code>；均未配置时，技能 \u003ccode>wait=true\u003c/code> 为 35000 ms，其他请求为 5000 ms。超时和取消仅结束本地等待，不证明设备撤销动作；停止运动应主动调用 \u003ccode>stop()\u003c/code>。\u003c/p>\n\u003ch2 id=\"s3\">3 动作与查询\u003c/h2>\n\u003cp>这五个方法返回 Promise。\u003ccode>await\u003c/code> 得到经过 SDK 校验的设备 RPC 结果，不含 JSON-RPC 外层封装。参数错误、传输错误和非法响应通过 Promise 拒绝传递。回执字段不符合运行时校验时，错误为 \u003ccode>INVALID_RESPONSE\u003c/code>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>SDK 方法\u003c/th>\n\u003cth>设备 RPC\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>move()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.move\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stop()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.stop\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>doSkill()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.do\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>getStatus()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.status\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>getCapabilities()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.capabilities\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>request()\u003c/code> 使用同一白名单与参数校验。其他方法（包括上位机协议中的 \u003ccode>robot.reset\u003c/code>）不属于应用 SDK 的设备请求接口。\u003c/p>\n\u003ch3 id=\"s3-1\">3.1 \u003ccode>move(params, options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">move(params: MoveParams, options?: RequestOptions): Promise&lt;AcceptedResult&gt;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003ccode>MoveParams\u003c/code> 字段\u003c/th>\n\u003cth>单位\u003c/th>\n\u003cth>约束\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>vx: number\u003c/code>\u003c/td>\n\u003ctd>m/s\u003c/td>\n\u003ctd>必填，有限数。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>vy?: number\u003c/code>\u003c/td>\n\u003ctd>m/s\u003c/td>\n\u003ctd>可选，有限数；省略时发送 \u003ccode>0\u003c/code>。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>vyaw: number\u003c/code>\u003c/td>\n\u003ctd>rad/s\u003c/td>\n\u003ctd>必填，有限数。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>SDK 仅发送这三个速度分量，不裁剪速度、不设置持续时间，也不自动定时续发。设备速度范围和执行策略由上位机定义。参数中出现 \u003ccode>duration_s\u003c/code> 会以 \u003ccode>INVALID_ARGUMENT\u003c/code> 拒绝，包括显式传入 \u003ccode>undefined\u003c/code> 的情况。\u003c/p>\n\u003cp>\u003ccode>await robot.move(...)\u003c/code> 得到 \u003ccode>AcceptedResult\u003c/code>，其中 \u003ccode>accepted\u003c/code> 必须为 \u003ccode>true\u003c/code>，表示速度请求已受理：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ \"accepted\": true }\n\u003c/code>\u003c/pre>\n\u003cp>SDK 不保证该回执提供移动进度或完成时间。设备看门狗、持续运动与控制频率约束由设备端协议约定，部署方需向上位机维护者确认；App 不应把本地 Promise 等待时间当作运动时长。\u003c/p>\n\u003ch3 id=\"s3-2\">3.2 \u003ccode>stop(options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">stop(options?: RequestOptions): Promise&lt;AcceptedResult&gt;\n\u003c/code>\u003c/pre>\n\u003cp>请求停车，\u003ccode>await robot.stop()\u003c/code> 得到与 \u003ccode>move()\u003c/code> 相同的 \u003ccode>AcceptedResult\u003c/code>，即上例的 \u003ccode>{ \"accepted\": true }\u003c/code>，表示停车请求已受理。回执不保证硬件已停稳或技能已取消。\u003c/p>\n\u003cp>停车使用同一设备通道，绕过移动频率限制，但仍可能因背压或断连失败，不等同于实体急停。\u003c/p>\n\u003ch3 id=\"s3-3\">3.3 \u003ccode>doSkill(skill, wait?, options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">doSkill(skill: string, wait?: boolean, options?: RequestOptions): Promise&lt;SkillResult&gt;\ndoSkill(skill: string, options?: RequestOptions): Promise&lt;SkillResult&gt;\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>skill\u003c/code> 必须是非空白字符串，长度最多 \u003ccode>256\u003c/code> 个 UTF-16 代码单元。SDK 保留原始名称，不自动裁剪空白或转换大小写；可用名称由设备的接入约定提供。\u003c/p>\n\u003cp>SDK 默认发送 \u003ccode>{ skill, wait: true }\u003c/code>，第二个参数传 \u003ccode>false\u003c/code> 时发送 \u003ccode>{ skill, wait: false }\u003c/code>。第二个参数也可以直接传本地请求配置，此时 \u003ccode>wait\u003c/code> 取默认值。\u003c/p>\n\u003cp>SDK 通过 \u003ccode>robot.status\u003c/code> 的 \u003ccode>policies.sitting\u003c/code> 和遥测的 \u003ccode>sit\u003c/code>、\u003ccode>stand\u003c/code> 更新 \u003ccode>robot.sitting\u003c/code>。该属性为 \u003ccode>null\u003c/code> 时，调用左踢、右踢、拾取或翻滚会先查询姿态。已知坐姿时，SDK 在本地返回 \u003ccode>accepted: false\u003c/code> 和起身提示。应用应由用户手动选择 \u003ccode>sit_toggle\u003c/code>，站起后重新选择目标动作。设备缺少姿态字段时，技能是否受理由设备决定。\u003c/p>\n\u003cp>支持完成回执的设备在 \u003ccode>wait: true\u003c/code> 时可返回以下结果。\u003ccode>durationMs\u003c/code> 是设备报告的耗时，单位为毫秒。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>设备结果\u003c/th>\n\u003cth>SDK 解析的回执示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>已确认执行完成\u003c/td>\n\u003ctd>\u003ccode>{\"accepted\": true, \"completed\": true, \"durationMs\": 1452.4}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等待超时，尚未确认完成\u003c/td>\n\u003ctd>\u003ccode>{\"accepted\": true, \"completed\": false, \"status\": \"timed_out\", \"durationMs\": 30000.0}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>两种回执都会正常解析 Promise。应用可用 \u003ccode>result.completed === true\u003c/code> 判断执行完成。仅含 \u003ccode>accepted\u003c/code> 的回执也有效，完成状态未知。\u003c/p>\n\u003cp>\u003ccode>SkillResult.accepted\u003c/code> 表示技能是否受理，\u003ccode>reason?: string\u003c/code> 为设备提供的未受理说明，可以省略。例如，未受理且未提供原因时，\u003ccode>await robot.doSkill(...)\u003c/code> 得到：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ \"accepted\": false }\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>accepted: false\u003c/code> 是正常业务结果，Promise 仍然完成，App 应检查该字段；\u003ccode>accepted: true\u003c/code> 也不表示技能完成。上位机返回 \u003ccode>reason: null\u003c/code> 时，SDK 将其归一为省略 \u003ccode>reason\u003c/code>；其他非字符串原因视为非法响应。协议或执行异常仍以 Promise 拒绝传递。\u003c/p>\n\u003ch3 id=\"s3-4\">3.4 \u003ccode>getStatus(options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">getStatus(options?: RequestOptions): Promise&lt;RobotStatus&gt;\n\u003c/code>\u003c/pre>\n\u003cp>查询执行器状态快照。例如，\u003ccode>await robot.getStatus()\u003c/code> 可以得到：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ \"state\": \"READY\", \"faultReason\": null }\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>state: ExecutorState\u003c/code> 为 \u003ccode>INIT | READY | RUNNING | FAULT\u003c/code>，表示当前执行器状态；\u003ccode>faultReason: string | null\u003c/code> 为故障说明，无故障时为 \u003ccode>null\u003c/code>。两者都是必需字段。设备提供的额外 JSON 诊断字段会被保留，但名称和结构不作保证。\u003ccode>RobotStatus\u003c/code> 不要求关节数组，与 \u003ccode>onTelemetry()\u003c/code> 接收的遥测类型不同。\u003c/p>\n\u003ch3 id=\"s3-5\">3.5 \u003ccode>getCapabilities(options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">getCapabilities(options?: RequestOptions): Promise&lt;RobotCapabilities&gt;\n\u003c/code>\u003c/pre>\n\u003cp>每次调用都发送查询，不缓存结果。\u003ccode>await robot.getCapabilities()\u003c/code> 得到包含以下全部必需字段的 \u003ccode>RobotCapabilities\u003c/code>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回字段\u003c/th>\n\u003cth>类型、含义与约束\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>protocol\u003c/code>\u003c/td>\n\u003ctd>固定字符串 \u003ccode>'v1'\u003c/code>，设备协议版本。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dof\u003c/code>\u003c/td>\n\u003ctd>固定数值 \u003ccode>15\u003c/code>，设备自由度。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>jointNames\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>string[]\u003c/code>，按设备顺序排列的 \u003ccode>15\u003c/code> 个非空关节名。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>maxCommandHz\u003c/code>\u003c/td>\n\u003ctd>正有限数，指令发送频率上限，单位 Hz；SDK 据此限制移动频率。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>telemetryHz\u003c/code>\u003c/td>\n\u003ctd>正有限数，遥测频率，单位 Hz；无新帧时设备可不推送。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hasVideo\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>boolean\u003c/code>，设备是否支持视频输出。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hasAudioOut\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>boolean\u003c/code>，设备是否支持音频输出。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hasAudioIn\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>boolean\u003c/code>，设备是否支持音频采集。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>音视频布尔字段描述设备能力。\u003ccode>hasAudioOut\u003c/code> 为 true 时仍需完成具有发送方向的 WebRTC 音频协商，才能使用 第 5 章“流式音频输出”。当前上位机根据运行环境中的 \u003ccode>aplay\u003c/code> 是否可用报告该字段，实际声音输出还取决于 ALSA 设备和权限；传入机器人音轨可通过 \u003ccode>robotAudioTrack\u003c/code> 读取；能力值不等于已协商出可用音轨。设备侧的具体配置由上位机部署方提供。\u003c/p>\n\u003ch3 id=\"s3-6\">3.6 由界面操作触发技能\u003c/h3>\n\u003cp>以下函数可由 App 的按钮事件调用；定义它不会发送机器人动作。\u003ccode>skill\u003c/code> 应来自已配置的设备技能列表。\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">import { RaydiculousXError } from '@raydiculousx/js-sdk';\nimport type { RaydiculousX } from '@raydiculousx/js-sdk';\n\nexport async function runSelectedSkill(\n  robot: RaydiculousX,\n  skill: string,\n  showMessage: (message: string) =&gt; void,\n): Promise&lt;void&gt; {\n  if (robot.disposed || robot.context.connectionState !== 'ready') {\n    showMessage('机器人尚未连接');\n    return;\n  }\n  try {\n    const result = await robot.doSkill(skill);\n    if (result.completed === true) {\n      showMessage('动作已执行完成');\n    } else if (result.status === 'timed_out') {\n      showMessage('设备等待超时，尚未确认动作完成');\n    } else {\n      showMessage(result.accepted ? '动作请求已受理' : result.reason ?? '动作未被接受');\n    }\n  } catch (error) {\n    showMessage(error instanceof RaydiculousXError ? `${error.code}: ${error.message}` : '请求失败');\n  }\n}\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s4\">4 事件与生命周期\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>onTelemetry(handler)\u003c/code>：接收经过校验的机器人状态；\u003ccode>onFault(handler)\u003c/code>：接收故障通知。\u003c/li>\n\u003cli>\u003ccode>on('context', handler)\u003c/code>：接收连接与上下文变化；首次状态请直接读取 \u003ccode>context\u003c/code>，订阅不回放。\u003c/li>\n\u003cli>\u003ccode>on('robot.audio.error', handler)\u003c/code>：接收上位机音频播放失败通知，payload 为 \u003ccode>{ reason: string, message: string }\u003c/code>。原因码由设备提供，例如 \u003ccode>audio_out_unavailable\u003c/code>、\u003ccode>audio_out_failed\u003c/code>；该事件不等于执行器 FAULT 或连接断开。\u003c/li>\n\u003cli>每个订阅返回独立退订函数。设备事件名为 \u003ccode>robot.state\u003c/code>、\u003ccode>robot.fault\u003c/code>、\u003ccode>robot.audio.error\u003c/code>，上下文事件名为 \u003ccode>context\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>request(method, params?, options?)\u003c/code>：仅开放五种机器人方法；不提供 Host 自定义路由。\u003c/li>\n\u003cli>\u003ccode>setAppState(state)\u003c/code>：将 JSON 业务状态通知外壳，不修改机器人状态。自行使用 \u003ccode>connectDirect()\u003c/code> 时需提供 \u003ccode>onAppState\u003c/code> 回调；没有回调时仅检查连接就绪，不校验或转发业务状态。\u003c/li>\n\u003cli>\u003ccode>requestLeave(reason?)\u003c/code>：请外壳协调退出；自行使用 connectDirect 且没有退出回调时清理本实例。\u003c/li>\n\u003cli>\u003ccode>onLeave(handler)\u003c/code>：登记应用资源清理，接收 \u003ccode>reason\u003c/code>、\u003ccode>deadline\u003c/code>；离场开始后不能再发送动作。\u003c/li>\n\u003cli>\u003ccode>await dispose()\u003c/code>：拒绝新请求、取消本地等待，等待清理回调、本地音频释放与必要的停车受理，最后尝试释放 PC/WSS。返回 \u003ccode>complete\u003c/code>、\u003ccode>failed\u003c/code> 或 \u003ccode>timeout\u003c/code>；超时不终止尚未完成的清理任务，\u003ccode>failed\u003c/code> 不保证信令已关闭，也不证明物理停稳或设备音频缓冲已清空。\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-ts\">const offAudioError = robot.on('robot.audio.error', payload =&gt; {\n  // on() 的公开 payload 类型为 JsonValue，使用前先收窄字段。\n  if (payload &amp;&amp; typeof payload === 'object' &amp;&amp; !Array.isArray(payload)\n      &amp;&amp; typeof payload.reason === 'string' &amp;&amp; typeof payload.message === 'string') {\n    console.warn(payload.reason, payload.message);\n  }\n});\nrobot.onLeave(offAudioError);\n\u003c/code>\u003c/pre>\n\u003cp>播放错误是异步通知，不会把已完成的 \u003ccode>writeAudio()\u003c/code> 或 \u003ccode>drainAudioOutput()\u003c/code> 改成失败；应用应订阅事件更新播放状态。初始化后是否有声音，还需设备端或现场反馈确认。\u003c/p>\n\u003ch2 id=\"s5\">5 流式音频输出\u003c/h2>\n\u003cp>音频与动作使用同一个客户端和 WebRTC 连接。\u003ccode>openAudioOutput(signal)\u003c/code> 必须传入 \u003ccode>AbortSignal\u003c/code>，要求设备 audioOut 能力及已协商发送方向；PCM 在业务页面排程并替换本页的 sender。应在用户操作的处理函数内打开音频，以满足浏览器播放策略；取消信号会结束初始化并释放本地输出。\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">const audioLifetime = new AbortController();\nawait robot.openAudioOutput(audioLifetime.signal);\n// 逐块调用 robot.writeAudio(pcm)，结束本次输出时：\naudioLifetime.abort();\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>完成语义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>openAudioOutput(signal: AbortSignal)\u003c/code>\u003c/td>\n\u003ctd>本页音频输出驱动准备完成；不代表设备已经发声\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>writeAudio(samples)\u003c/code>\u003c/td>\n\u003ctd>将 24 kHz 单声道 Float32 PCM 排入本页队列；每块 1～24000 个有限样本，值在 -1～1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>clearAudioOutput()\u003c/code>\u003c/td>\n\u003ctd>停止并移除本地已排程的音频片段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setAudioVolume(value)\u003c/code>\u003c/td>\n\u003ctd>设置发送端增益；有限数裁剪到 0～1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>drainAudioOutput()\u003c/code>\u003c/td>\n\u003ctd>等待本地排程结束，最长约 35 秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>closeAudioOutput()\u003c/code>\u003c/td>\n\u003ctd>发起媒体释放；不关闭机器人控制连接，完整退出由 dispose 等待\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>队列最多 30 秒。清空和排程结束都不是设备扬声器回执；不能撤回已经进入设备缓冲的声音。\u003c/p>\n\u003ch2 id=\"s6\">6 错误处理\u003c/h2>\n\u003cp>机器人请求以 \u003ccode>RaydiculousXError\u003c/code> 拒绝，含 \u003ccode>code\u003c/code>、\u003ccode>source\u003c/code> 与 \u003ccode>message\u003c/code>；例如参数错误 \u003ccode>INVALID_ARGUMENT\u003c/code>、不可用 \u003ccode>NOT_READY\u003c/code>、离场 \u003ccode>APP_DISPOSED\u003c/code>、超时 \u003ccode>REQUEST_TIMEOUT\u003c/code>、取消 \u003ccode>ABORTED\u003c/code>。设备错误保留字符串错误码及 \u003ccode>daemon\u003c/code> 来源，不自动重试。\u003c/p>\n\u003cp>初始化的 \u003ccode>DirectConnectionError\u003c/code> 还包含 \u003ccode>cleanupResult\u003c/code>；清理失败时不能自动交接下一连接。窗口被关闭或强制认证失效仅能尽力清理，设备端断线保护仍负责兜底。音频和启动配置也可能抛出普通 Error，调用方应处理所有拒绝。\u003c/p>\n\u003cp>类型与详细参数以包内的 客户端声明（SDK 包内 \u003ccode>dist/lib/raydiculousx.d.ts\u003c/code>）、直连配置声明（SDK 包内 \u003ccode>dist/lib/direct.d.ts\u003c/code>） 为准。\u003c/p>"}, {"id": "bsp", "title": "BSP 技术与接口手册", "version": "V1.1", "date": "2026.11.18", "pdf": "../../PDF/raydino/RayDino-bsp-V1.1.pdf", "online": "../../index.html#raydino/bsp", "pages": 26, "bytes": 1073222, "summary": "板端升级、状态查询、Web控制、音视频、ToF、模型配置与标定", "html": "\u003cp>本手册面向 RayDino（恐龙）的板端维护与接口集成。应用内 JS SDK 的连接、请求和生命周期见《应用开发与 API 参考》第 1～6 章；本册介绍 Web 遥控台、板端命令和硬件设备接口。运行命令前应确认操作目标为当前交付设备。涉及运动、标定和升级时，先结束其他控制端操作，确保活动范围内无人接触关节。\u003c/p>\n\u003ch2 id=\"s1\">1 接口层级与使用准备\u003c/h2>\n\u003ch3 id=\"s1-1\">1.1 连接入口\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层级\u003c/th>\n\u003cth>入口\u003c/th>\n\u003cth>用途与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>App JS SDK\u003c/td>\n\u003ctd>@raydiculousx/js-sdk\u003c/td>\n\u003ctd>由可信 Host 或直连配置建立控制通道；不自动运动，不自动定时续发 move。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web 遥控台 HTTP\u003c/td>\n\u003ctd>示例默认 http://127.0.0.1:8000\u003c/td>\n\u003ctd>Python 示例通过 HTTP 查询与控制。远程运行时将 --host 改为机器人实际 IP。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>板端控制服务\u003c/td>\n\u003ctd>robotctl、robotd\u003c/td>\n\u003ctd>维护、配置、策略与设备控制；不等同于 App SDK 的五种请求白名单。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>视频信令\u003c/td>\n\u003ctd>ws://\u003crobot_host>:8443\u003c/robot_host>\u003c/td>\n\u003ctd>receive_video.py 使用的 webrtcsink 信令；端口号不表示使用 TLS。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>音频与测距\u003c/td>\n\u003ctd>ALSA、I2C-3\u003c/td>\n\u003ctd>需要匹配的板端设备、驱动和访问权限。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Web 示例访问的是 8000 端口的 HTTP 服务。资料中另列的 9872 端口不作为这些 HTTP 示例的默认值，也不能据此推定其传输格式、认证或完整协议。接入其他端口前先确认对应服务配置。\u003c/p>\n\u003ch3 id=\"s1-2\">1.2 环境与结果判断\u003c/h3>\n\u003cp>状态查询、运动和技能脚本使用 Python 3 标准库；交互运动模式还使用 termios、tty 与 select，应在支持终端控制的环境运行。视频脚本使用 aiortc、av、opencv-python 和 websockets；代码调用 aiortc 私有属性并包含针对 aiortc 1.10.1 的候选解析说明，需使用与该实现兼容的运行环境。ToF 示例需要 vl53l5cx 驱动模块和 I2C 访问权限。\u003c/p>\n\u003cp>先使用只读状态查询确认目标 IP、Web 服务和设备状态，再发送运动或技能请求。网络请求超时不代表机器人停止；HTTP 请求成功不等于设备已停稳或技能完成。需要停车时发送停止请求，并观察设备。异常处理见《用户手册》第 1.4 节。\u003c/p>\n\u003ch2 id=\"s2\">2 状态查询与遥测\u003c/h2>\n\u003ch3 id=\"s2-1\">2.1 GET 接口\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>接口\u003c/th>\n\u003cth>示例读取的主要内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>/api/version\u003c/td>\n\u003ctd>web 名称、版本、构建时间与 Python；dinosaur 主程序版本、revision、robotd、current 和 source。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/info\u003c/td>\n\u003ctd>dinosaur_name、IP、hostname、Wi-Fi MAC、手柄 MAC/名称、camera.port。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/status\u003c/td>\n\u003ctd>running、vx、vyaw、remaining、feed 连接和错误、CSV 开启状态与当前文件信息。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/health\u003c/td>\n\u003ctd>healthy、电池 volts/percent、电机 max_c/mean_c/hottest、CPU 温度、IMU ready、内存与系统负载。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/telemetry\u003c/td>\n\u003ctd>最新 IMU 姿态与舵机状态；roll_deg/pitch_deg/yaw_deg 单位为度，angle_deg 为度，temp_c 为摄氏度，volt_v 为伏。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/subscribe?since=N\u003c/td>\n\u003ctd>seq、connected/error 与增量 items；逐帧显示 t、policy、applied 和 targets5。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>这些内容是 Web 遥控台的响应字段，与 App SDK 的 RobotStatus 不同，不应将 /api/status 的结构直接当作 getStatus() 返回值。无遥测首帧时，示例提示等待 robot.subscribe 数据；不能把空帧当作全零或正常状态。\u003c/p>\n\u003ch3 id=\"s2-2\">2.2 查询步骤\u003c/h3>\n\u003col>\n\u003cli>在机器人本机运行时可使用脚本默认的 127.0.0.1:8000；远程查询时设置 --host 为机器人实际 IP。\u003c/li>\n\u003cli>先查询 version 和 info，确认版本与设备身份，再查询 status、health 和 telemetry。\u003c/li>\n\u003cli>增量订阅从 since=0 开始，依据返回 seq 推进游标；示例每次轮询间隔 0.3 s，--secs 控制本地轮询总时长。\u003c/li>\n\u003cli>请求失败时检查服务地址和错误内容，不用反复发送运动请求来测试连通性。\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode class=\"language-sh\">python3 robot_api_get_data.py --host 192.168.1.100 --mode info\npython3 robot_api_get_data.py --host 192.168.1.100 --mode subscribe --secs 10\n\u003c/code>\u003c/pre>\n\u003cp>192.168.1.100 是示例地址。完整脚本见第 9.2 节。\u003c/p>\n\u003ch2 id=\"s3\">3 Web 运动与技能接口\u003c/h2>\n\u003ch3 id=\"s3-1\">3.1 运动与停车\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>请求\u003c/th>\n\u003cth>语义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>POST /api/move\u003c/td>\n\u003ctd>{\"vx\": number, \"vyaw\": number, \"secs\": number}\u003c/td>\n\u003ctd>vx 单位 m/s，vyaw 单位 rad/s，secs 单位 s；示例正 vx 前进，正 vyaw 左转。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST /api/stop\u003c/td>\n\u003ctd>{}\u003c/td>\n\u003ctd>请求停止 Web 运动；检查响应与实际设备状态。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST /api/skill\u003c/td>\n\u003ctd>{\"skill\": string}\u003c/td>\n\u003ctd>Web 服务将技能名透传到 robot.do。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Web 运动示例说明：服务端 Mover 以 10 Hz 续发 robot.move，到 secs 结束时补发全零速度。该逻辑属于此 Web 服务，不是 JS SDK 的行为；JS SDK move() 不设置持续时间，也不自动续发。不要向 JS SDK move() 传入 Web 层的 secs 或 duration_s。Web 响应和 SDK 校验后的 RPC 结果也不是同一种封装。\u003c/p>\n\u003cp>robot_api_move.py 的默认线速度为 0.2 m/s、角速度为 0.5 rad/s、时长为 1.0 s。这些是示例默认值，不是设备限值。操作时使用当前设备允许的范围，并保持足够空间。\u003c/p>\n\u003cp>交互模式支持 W/A/S/D、空格停止、Q 或 Ctrl+C 退出；方向键转义序列会被忽略。退出时脚本尝试 POST /api/stop；如果网络失败，该尝试不构成物理停稳保证。完整脚本见第 9.3 节。\u003c/p>\n\u003ch3 id=\"s3-2\">3.2 技能结果\u003c/h3>\n\u003cp>常用技能名为 sit_toggle、ground_pick、kick_right、kick_left 和 roll_over。脚本的 list 只显示内置名称，不查询设备能力；其他名称会透传，是否可用由设备配置决定。\u003c/p>\n\u003cp>Web 成功示例结构包含 ok、message 和 result；失败结构包含 ok=false、error 和 result。示例将 ok=true 显示为请求已接受，不凭该字段断言动作完成。不要将 result 与《应用开发与 API 参考》第 3.3 节的 SkillResult 无条件等同；需按实际返回结构判断受理与完成状态。完整脚本见第 9.4 节。\u003c/p>\n\u003ch2 id=\"s4\">4 视频、音频与 ToF\u003c/h2>\n\u003ch3 id=\"s4-1\">4.1 WebRTC 视频\u003c/h3>\n\u003cp>receive_video.py 通过 ws://\u003crobot_host>:8443 与 webrtcsink 信令服务建立会话，可预览、写 MP4 或保存 JPEG 帧序列。预览窗口按 Q 或 Esc 退出，也可使用 --duration 指定秒数。此脚本与 App SDK 的 robotAudioTrack 或 App Host 连接流程不同。\u003c/robot_host>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">python3 -m pip install aiortc av opencv-python websockets\npython3 receive_video.py 192.168.1.100 --duration 10\npython3 receive_video.py 192.168.1.100 --output video.mp4 --duration 10\npython3 receive_video.py 192.168.1.100 --save-frames ./frames/ --duration 10\n\u003c/code>\u003c/pre>\n\u003cp>安装依赖本身不代表已满足设备服务的兼容条件；需按第 1.2 节匹配视频实现。预览要求图形显示环境；没有显示环境时使用文件输出。完整视频代码见第 9.5 节。\u003c/p>\n\u003ch3 id=\"s4-2\">4.2 板端音频\u003c/h3>\n\u003cp>麦克风示例通过 aic3104 的 PGA Capture Volume 设置录音增益，并从 hw:1,0 以 cd 格式录制 10 s。扬声器示例调整 Line Playback Volume 后播放同一文件。aic3104、hw:1,0 和控制项均是指定板端配置，不是所有 Linux 设备的通用标识。\u003c/p>\n\u003cp>录音前确认采集设备匹配，播放前确认输出设备匹配并选择适当音量。ALSA 命令运行在机器人板端；它们不替代 JS SDK 的 24 kHz 单声道 Float32 PCM 流式接口。完整命令见第 9.6～9.7 节。\u003c/p>\n\u003ch3 id=\"s4-3\">4.3 ToF 测距\u003c/h3>\n\u003cp>示例使用 I2C_BUS=3 的 VL53L5CX，地址 0x29，分辨率 8×8，共 64 个区域；设置测距频率 15 Hz，以 0.05 s 轮询数据就绪状态。轮询周期不等于传感器实际出帧频率。\u003c/p>\n\u003cp>distance_mm 按行优先排列，单位 mm；示例仅接受 target_status 为 5 或 9 且距离大于 0 的数据。无效单元显示 ---，颜色按当前有效距离范围动态映射，红近蓝远。颜色反映相对范围，不是固定距离阈值。退出时停止测距。完整脚本见第 9.8 节。\u003c/p>\n\u003ch2 id=\"s5\">5 配置、模型与设备命名\u003c/h2>\n\u003ch3 id=\"s5-1\">5.1 配置位置与模式\u003c/h3>\n\u003cp>板端配置文件为 /etc/robot/robot.toml，用于技能与按键关系等配置。模式可出现 walk 或 roller；模式名称不表示当前设备已交付相应运动能力。不要仅因存在 roller.onnx 就将轮滑列为可用功能。修改前保留当前配置，并使用与固件匹配的字段结构，不推测缺失的技能持续时间或速度配置键。\u003c/p>\n\u003ch3 id=\"s5-2\">5.2 ONNX 模型路径\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用途\u003c/th>\n\u003cth>路径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>行走\u003c/td>\n\u003ctd>/home/radxa/onnx/walk.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>轮滑\u003c/td>\n\u003ctd>/home/radxa/onnx/roller.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>坐下／起立\u003c/td>\n\u003ctd>/home/radxa/onnx/sitstand.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恢复\u003c/td>\n\u003ctd>/home/radxa/onnx/standup.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地面拾取\u003c/td>\n\u003ctd>/home/radxa/onnx/groundpick.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>翻滚\u003c/td>\n\u003ctd>/home/radxa/onnx/roulade.onnx\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>以下命令用于管理命名策略。\u003cname> 和 \u003cpath.onnx> 为占位参数，应替换为匹配设备的策略名与模型文件路径；命令的存在不保证任意模型与控制器兼容。\u003c/path.onnx>\u003c/name>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">robotctl policy add &lt;name&gt; &lt;path.onnx&gt;\nrobotctl policy remove &lt;name&gt;\nrobotctl policy list\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s5-3\">5.3 设置与显示设备名称\u003c/h3>\n\u003cpre>\u003ccode class=\"language-sh\">sudo robotctl system set-name &lt;新名称&gt;\n\u003c/code>\u003c/pre>\n\u003cp>显示名称按以下优先级确定：环境变量 DINOSAUR_NAME；robotctl system info 的 name 字段（如 dinosaur-7d2b）；socket.gethostname()。设置名称后若显示未变化，先检查高优先级环境变量。上述设备广播与程序内部标识保持实际值，不因产品展示名为 RayDino（恐龙）而改写为新的接口名。\u003c/p>\n\u003ch2 id=\"s6\">6 手柄配对与舵机标定\u003c/h2>\n\u003ch3 id=\"s6-1\">6.1 板端手柄配对\u003c/h3>\n\u003cp>以下为维护人员使用的板端流程：先遗忘配对并移除旧连接，再进入配对。\u003cmac> 是目标手柄的真实蓝牙地址，不应直接照抄或替换为其他设备地址。执行前结束遥控操作，确保机器人不会因失去控制端而造成危险。\u003c/mac>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">sudo -n robotctl pad forget\nbluetoothctl disconnect &lt;MAC&gt;\nbluetoothctl remove &lt;MAC&gt;\nsudo -n robotctl pad pair\n\u003c/code>\u003c/pre>\n\u003cp>sudo -n 不交互询问密码，权限不足时会直接失败。进入配对后，还需要按实际手柄型号进入配对模式并确认连接；这些命令不代表自动完成全部物理配对步骤。普通用户的启动和已配对连接流程见《用户手册》第 3 章。\u003c/p>\n\u003ch3 id=\"s6-2\">6.2 标定操作与关节标识\u003c/h3>\n\u003cp>标定会修改后续运动所依赖的零位。仅由熟悉机械零位和该版本标定流程的维护人员，在符合标定姿态要求时执行，不将它用作日常启动或常规故障恢复步骤。标定完成后先确认零位和关节运动方向，再恢复运动控制。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">sudo robotctl configure servo zero\nsudo robotctl configure servo zero &lt;name&gt;\n\u003c/code>\u003c/pre>\n\u003cp>第一条为全标定，第二条为单关节标定。可用名称如下；此列表用于识别 name，不定义控制数组顺序。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">left_hip_yaw left_hip_roll left_hip_pitch left_knee left_ankle\nneck_pitch head_pitch head_yaw head_roll mouth\nright_hip_yaw right_hip_roll right_hip_pitch right_knee right_ankle\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s7\">7 主程序离线升级\u003c/h2>\n\u003ch3 id=\"s7-1\">7.1 升级前提\u003c/h3>\n\u003cp>使用由对应发布流程制作、与设备兼容的离线发布包；包内需包含唯一版本的 \u003cversion>.manifest.json 和 .tar.zst 产物。脚本需要 root 权限。结束动作并保持供电稳定后再升级；升级会切换服务，不在运行任务中执行。\u003c/version>\u003c/p>\n\u003cp>默认解包位置为调用用户主目录下的 duck-sideload/release。updaterd.service 使用 PrivateTmp=yes，/tmp 与 /var/tmp 不适合放置需由 updaterd 读取的发布目录。--dir 必须是允许的绝对路径；脚本会替换该路径下 release 子目录的内容，应使用专门目录。\u003c/p>\n\u003ch3 id=\"s7-2\">7.2 普通升级与检查\u003c/h3>\n\u003cpre>\u003ccode class=\"language-sh\">sudo sh offline-deploy.sh &lt;release.tar.gz&gt; --dry-run\nsudo sh offline-deploy.sh &lt;release.tar.gz&gt;\nsudo robotctl update status\nsudo robotctl update log\nsudo robotctl health\n\u003c/code>\u003c/pre>\n\u003cp>普通路径调用 robotctl update apply daemon --from \u003crelease目录> --version &lt;版本&gt;，执行校验与健康检查，失败按更新器的回退机制处理。--dry-run 用于预检查，不执行版本切换；仍会解包到 release 目录。脚本最后的 current 链接和命令退出码之外，还应检查 update status、日志及实际运行服务的版本。脚本提示 updaterd 与 btd 在回复后约 5 s 重启，健康检查可用于确认各服务实际版本。\u003c/release目录>\u003c/p>\n\u003ch3 id=\"s7-3\">7.3 旧更新器引导模式\u003c/h3>\n\u003cp>--bootstrap 专用于已安装 updaterd 但版本过旧、不支持 apply --from 的板卡。它停止 robotd，使用 updaterd install --from \u003crelease目录> --force，随后重启 updaterd 和 robotd。此路径关闭正常 on_apply 与健康门控，且不提供普通升级的自动回退；不要将其作为升级失败后的通用重试选项。板卡完全没有安装环境时，需要配套安装流程或出厂镜像，本脚本不完成首次系统安装。\u003c/release目录>\u003c/p>\n\u003cp>完整升级脚本见第 9.1 节。出现错误时先确认 installed updaterd / robotctl 的接口版本与日志，再决定是否适用引导模式。\u003c/p>\n\u003ch2 id=\"s8\">8 示例文件与调用边界\u003c/h2>\n\u003cp>本册第 9 章完整列出示例代码，在线文档可下载同名文件。脚本在各自列明的本机、Web 服务或媒体环境运行，不会因为打开文档而执行。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>运行位置 / 用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>offline-deploy.sh\u003c/td>\n\u003ctd>机器人板端；离线升级。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>robot_api_get_data.py\u003c/td>\n\u003ctd>可访问 Web 遥控台的 Python 环境；只读查询。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>robot_api_move.py\u003c/td>\n\u003ctd>可访问 Web 遥控台的终端；运动与停车。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>robot_api_skill.py\u003c/td>\n\u003ctd>可访问 Web 遥控台的 Python 环境；技能请求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>receive_video.py\u003c/td>\n\u003ctd>具有匹配依赖的接收端；WebRTC 视频。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>microphone-test.sh / speaker-test.sh\u003c/td>\n\u003ctd>机器人板端；录音与播放。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tof_matrix.py\u003c/td>\n\u003ctd>机器人板端；I2C ToF 测距。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>App 的应用状态、音频发送和离场清理仍使用《应用开发与 API 参考》第 4～6 章的客户端接口。维护命令不应直接搬入应用请求白名单。运动参数、认证和服务访问范围按设备实际部署配置使用。\u003c/p>\n\u003ch2 id=\"s9\">9 完整示例代码\u003c/h2>\n\u003ch3 id=\"s9-1\">9.1 offline-deploy.sh\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/offline-deploy.sh\">下载 offline-deploy.sh\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">#!/bin/sh\n# Install a release from a tarball on a board with no network.\n#\n#   sudo sh offline-deploy.sh duck-offline-&lt;version&gt;.tar.gz\n#   sudo sh offline-deploy.sh /media/usb/release.tar.gz --bootstrap\n#\n# The tarball is what `scripts/offline-package.sh` makes: a release directory. This unpacks it\n# somewhere `updaterd` can read and applies it, which means every check a download gets —\n# signature, hash, compatibility, disk space, the atomic swap, the health gate, auto-rollback.\n# `--from` changes where the bytes come from and nothing else.\n#\n# **Not `/tmp`, and not `/var/tmp`.** `updaterd.service` sets `PrivateTmp=yes`, so the daemon has\n# its own copies of both; a release unpacked there is not the one it reads, and the failure is a\n# preflight error against a directory whose `ls` lists the file it says is missing. The default is\n# `~/duck-sideload` in the *invoking* user's home — outside that namespace, and needing no root\n# to write.\n#\n# `--bootstrap` is for a board whose installed `updaterd` predates `apply --from` and cannot be\n# asked to use it. It runs `updaterd install --from`, which forces `on_apply` and the health gate\n# off, so it stops `robotd` first and restarts it after. One install, no auto-rollback; every\n# later deploy is the ordinary path.\nset -eu\ndie()  { printf '\\033[31merror:\\033[0m %s\\n' \"$*\" &gt;&amp;2; exit 1; }\nTAR=\"\"\nDIR=\"\"\nBOOTSTRAP=no\nDRY_RUN=no\nwhile [ $# -gt 0 ]; do\n    case \"$1\" in\n        --dir) [ $# -ge 2 ] || die \"--dir needs a directory\" ; DIR=\"$2\" ; shift ;;\n        --bootstrap) BOOTSTRAP=yes ;;\n        --dry-run) DRY_RUN=yes ;;\n        -h|--help) sed -n '2,12p' \"$0\" | sed 's/^# \\{0,1\\}//'; exit 0 ;;\n        -*) die \"unknown argument: $1  (try --help)\" ;;\n        *) [ -z \"$TAR\" ] || die \"one tarball at a time: $TAR is already named\"\n           TAR=\"$1\" ;;\n    esac\n    shift\ndone\n[ -n \"$TAR\" ] || die \"no tarball named — offline-deploy.sh &lt;release.tar.gz&gt;\"\n[ -f \"$TAR\" ] || die \"no such file: $TAR\"\n[ \"$(id -u)\" -eq 0 ] || die \"run this as root: sudo sh offline-deploy.sh $TAR\"\n# The invoking user's home, so a deploy as `sudo sh` does not unpack into /root and then puzzle\n# whoever looks for it. SUDO_USER is unset when this is run from a root shell, which is fine.\nif [ -z \"$DIR\" ]; then\n    home=\"\"\n    if [ -n \"${SUDO_USER:-}\" ] &amp;&amp; command -v getent &gt;/dev/null 2&gt;&amp;1; then\n        home=\"$(getent passwd \"$SUDO_USER\" | cut -d: -f6)\" || home=\"\"\n    fi\n    DIR=\"${home:-$HOME}/duck-sideload\"\nfi\ncase \"$DIR\" in\n    /) die \"refusing to use / as the sideload directory\" ;;\n    /tmp|/tmp/*|/var/tmp|/var/tmp/*)\n        die \"$DIR is invisible to updaterd: the unit sets PrivateTmp=yes, so /tmp and /var/tmp \\\nare its own. Anywhere else works — the default, ~/duck-sideload, does.\" ;;\n    /*) ;;\n    *) die \"--dir must be an absolute path, got $DIR\" ;;\nesac\nRELEASE=\"$DIR/release\"\n# A tarball is data off a USB stick, so its member names are not trusted: an absolute path or a\n# `..` would write outside $RELEASE.\nif tar -tzf \"$TAR\" | grep -Eq '(^/|(^|/)\\.\\.(/|$))'; then\n    die \"$TAR holds a member with an absolute path or .., which is not a release\"\nfi\necho \"==&gt; unpacking $(basename \"$TAR\") into $RELEASE\"\n# The whole directory is replaced rather than added to, so a second deploy does not leave two\n# versions where something has to pick one. `$RELEASE` is a directory of this script's own making,\n# which is why this is not `rm -rf \"$DIR\"`.\nrm -rf \"$RELEASE\"\nmkdir -p \"$RELEASE\"\n# `--no-same-owner` because the uids in the tarball are the *packaging* host's, which mean nothing\n# here; everything under a release is read by updaterd, which runs as root.\ntar --no-same-owner -xzf \"$TAR\" -C \"$RELEASE\"\nVERSION=\"\"\nothers=\"\"\nfor f in \"$RELEASE\"/*.manifest.json; do\n    [ -f \"$f\" ] || continue\n    # The unversioned `manifest.json` a published release serves is not a version directory entry.\n    case \"${f##*/}\" in manifest.json) continue ;; esac\n    v=\"${f##*/}\"\n    v=\"${v%.manifest.json}\"\n    if [ -z \"$VERSION\" ]; then\n        VERSION=\"$v\"\n    else\n        others=\"$others $v\"\n    fi\ndone\n[ -n \"$VERSION\" ] || die \"no &lt;version&gt;.manifest.json in $TAR — that is not a release directory\"\n# One release per directory, so `--from` cannot pick a version other than the one this deploy was\n# asked for. A tarball of two dists is a packaging mistake, not something to choose from.\n[ -z \"$others\" ] || die \"$TAR holds more than one release: $VERSION$others — pack one dist\"\nartifact=no\nfor f in \"$RELEASE\"/*.tar.zst; do\n    [ -f \"$f\" ] || continue\n    artifact=yes\n    break\ndone\n[ \"$artifact\" = yes ] || die \"no .tar.zst artifact in $TAR — that is not a release directory\"\nROBOTCTL=/usr/local/bin/robotctl\n[ -x \"$ROBOTCTL\" ] || ROBOTCTL=/opt/robot/daemon/current/bin/robotctl\nUPDATERD=/opt/robot/daemon/current/bin/updaterd\nif [ \"$BOOTSTRAP\" = yes ]; then\n    [ -x \"$UPDATERD\" ] || die \"no $UPDATERD, so there is no release to bootstrap from. A board \\\nwith nothing installed needs scripts/install.sh once, over a network, or a factory image.\"\n    if [ \"$DRY_RUN\" = yes ]; then\n        echo \"==&gt; would stop robotd, then:\"\n        echo \"    $UPDATERD install --from $RELEASE --force\"\n        echo \"    systemctl restart updaterd; systemctl start robotd\"\n        exit 0\n    fi\n    echo \"==&gt; installing daemon $VERSION, ungated (--bootstrap)\"\n    # `updaterd install --force` refuses while `robotd` answers, because the objection is about a\n    # *working* robot losing its safety net.\n    systemctl stop robotd\n    \"$UPDATERD\" install --from \"$RELEASE\" --force\n    # Never restarted during an update — it is the process performing it — so the resident daemon\n    # would otherwise keep running the old binary, which is the one that cannot do `--from`.\n    echo \"==&gt; restarting updaterd and robotd\"\n    systemctl restart updaterd\n    systemctl start robotd\nelse\n    [ -x \"$ROBOTCTL\" ] || die \"no robotctl on this board, so there is no release to update. A \\\nboard with nothing installed needs scripts/install.sh once, over a network — or --bootstrap if \\\nthe only problem is an installed updaterd too old to take --from.\"\n    if [ \"$DRY_RUN\" = yes ]; then\n        echo \"==&gt; would apply (fetch, verify, compatibility, space checks; no swap):\"\n        echo \"    $ROBOTCTL update apply daemon --from $RELEASE --version $VERSION --dry-run\"\n        \"$ROBOTCTL\" update apply daemon --from \"$RELEASE\" --version \"$VERSION\" --dry-run\n        exit 0\n    fi\n    echo \"==&gt; applying daemon $VERSION\"\n    status=0\n    \"$ROBOTCTL\" update apply daemon --from \"$RELEASE\" --version \"$VERSION\" || status=$?\n    if [ \"$status\" -ne 0 ]; then\n        # Exit 2 is bad usage, and on a board that has never had a build with `--from` that is\n        # how the API mismatch surfaces: the daemon refuses the call rather than ignoring the\n        # option and installing from its configured source.\n        if [ \"$status\" -eq 2 ]; then\n            echo \"If robotctl and updaterd disagree about the API version, this board's installed\" &gt;&amp;2\n            echo \"release predates 'apply --from'. Deliver it once, ungated:\" &gt;&amp;2\n            echo \"    sudo sh $0 $TAR --bootstrap\" &gt;&amp;2\n        else\n            echo \"The board keeps running what it was on — a failed apply rolls back.\" &gt;&amp;2\n            echo \"    sudo robotctl update status   # and: sudo robotctl update log\" &gt;&amp;2\n        fi\n        exit \"$status\"\n    fi\nfi\necho \"==&gt; current -&gt; $(readlink -f /opt/robot/daemon/current 2&gt;/dev/null || echo '?')\"\necho \"    updaterd and btd restart five seconds after the apply replies; 'robotctl health' prints\"\necho \"    the release each daemon is actually running from.\"\necho \"    The unpacked release stays in $RELEASE, so re-applying needs no tarball:\"\necho \"    sudo robotctl update apply daemon --from $RELEASE\"\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-2\">9.2 robot_api_get_data.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/robot_api_get_data.py\">下载 robot_api_get_data.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nrobot_api_get_data.py —— 从机器人 Web 遥控台拉数据的示例\n它演示这些 GET 接口：\n    /api/version             Web 台版本 + dinosaur 主程序版本\n    /api/info                设备信息（名称/IP/WiFi/手柄/摄像头端口）\n    /api/status              当前运动状态 + 订阅连接 + CSV 状态\n    /api/health              电池电压/电量、电机最高温度、CPU 温度、IMU ready、系统负载\n    /api/telemetry           最新一帧的 IMU 姿态和每关节温度/电压/在线\n    /api/subscribe?since=N   驱动状态增量流（轮询 since=seq，拿 seq 之后的新帧）\n用法:\n    python3 robot_api_get_data.py --mode info\n    python3 robot_api_get_data.py --mode subscribe --secs 10\n    python3 robot_api_get_data.py --mode all --host 192.168.1.100\n\"\"\"\nimport argparse\nimport json\nimport sys\nimport time\nimport urllib.error\nimport urllib.request\ndef http_get_json(url, timeout=10.0):\n    req = urllib.request.Request(url, headers={\"Accept\": \"application/json\"})\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as resp:\n            return json.loads(resp.read().decode(\"utf-8\"))\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(\"utf-8\", \"replace\")\n        raise RuntimeError(f\"HTTP {e.code}: {body}\") from e\n    except urllib.error.URLError as e:\n        raise RuntimeError(f\"连接失败: {e.reason}\") from e\n# ---------------------------------------------------------------------------\n# 各模式\n# ---------------------------------------------------------------------------\ndef mode_version(base):\n    v = http_get_json(base + \"/api/version\")\n    w = v.get(\"web\") or {}\n    d = v.get(\"dinosaur\") or {}\n    print(\"=== /api/version ===\")\n    print(f\"Web       : {w.get('name')} v{w.get('version')}  \"\n          f\"编译于 {w.get('build_time')}  (python {w.get('python')})\")\n    print(f\"dinosaur  : {d.get('version')}\"\n          + (f\" (rev {d.get('revision')})\" if d.get(\"revision\") else \"\"))\n    if d.get(\"robotd\"):\n        print(f\"  robotd  : {d.get('robotd')}\")\n    if d.get(\"current\"):\n        print(f\"  release : {d.get('current')}\")\n    print(f\"  来源    : {d.get('source')}\")\ndef mode_info(base):\n    info = http_get_json(base + \"/api/info\")\n    print(\"=== /api/info ===\")\n    print(f\"恐龙名    : {info.get('dinosaur_name')}\")\n    ip = info.get(\"ip\") or {}\n    print(f\"IP        : {ip.get('primary')}  (all={ip.get('all')})\")\n    print(f\"hostname  : {ip.get('hostname')}\")\n    wifi = info.get(\"wifi\") or {}\n    print(f\"WiFi MAC  : {wifi.get('mac')}  ({wifi.get('iface')})\")\n    pad = info.get(\"pad\") or {}\n    print(f\"手柄 MAC  : {pad.get('mac')}  ({pad.get('name')})\")\n    cam = info.get(\"camera\") or {}\n    print(f\"摄像头端口: {cam.get('port')}\")\ndef mode_status(base):\n    s = http_get_json(base + \"/api/status\")\n    print(\"=== /api/status ===\")\n    print(f\"运行中    : {s.get('running')}\")\n    print(f\"vx / vyaw : {s.get('vx')} / {s.get('vyaw')}\")\n    print(f\"剩余      : {s.get('remaining')} s\")\n    f = s.get(\"feed\") or {}\n    print(f\"订阅连接  : {f.get('connected')}  err={f.get('error')!r}\")\n    c = s.get(\"csv\") or {}\n    print(f\"CSV 开启  : {c.get('enabled')}\")\n    cur = c.get(\"current\")\n    if cur:\n        print(f\"CSV 文件  : {cur.get('name')}  行数={cur.get('rows')}  大小={cur.get('size')}\")\ndef mode_health(base):\n    h = http_get_json(base + \"/api/health\")\n    print(\"=== /api/health ===\")\n    print(f\"healthy  : {h.get('healthy')}\")\n    b = h.get(\"battery\") or {}\n    print(f\"电池     : {b.get('volts')} V  {b.get('percent')}%\")\n    m = h.get(\"motors\") or {}\n    print(f\"电机温度 : max={m.get('max_c')} °C  mean={m.get('mean_c')}  hottest={m.get('hottest')}\")\n    print(f\"CPU 温度 : {h.get('cpu_temp_c')} °C\")\n    imu = h.get(\"imu\") or {}\n    print(f\"IMU      : ready={imu.get('ready')}  stale={imu.get('consecutive_stale_blocks')}\")\n    sys_ = h.get(\"system\") or {}\n    print(f\"内存     : {sys_.get('mem_used_kb')}/{sys_.get('mem_total_kb')} kB \"\n          f\"({sys_.get('mem_pct')}%)\")\n    print(f\"负载     : 1m={sys_.get('load_1m')}  5m={sys_.get('load_5m')}  \"\n          f\"15m={sys_.get('load_15m')}\")\n    if h.get(\"error\"):\n        print(f\"error    : {h.get('error')}\")\ndef mode_telemetry(base):\n    t = http_get_json(base + \"/api/telemetry\")\n    print(\"=== /api/telemetry ===\")\n    if not t:\n        print(\"尚无数据（等待 robot.subscribe 首帧）\")\n        return\n    imu = t.get(\"imu\") or {}\n    print(f\"IMU      : online={imu.get('online')}  \"\n          f\"roll={imu.get('roll_deg')}  pitch={imu.get('pitch_deg')}  \"\n          f\"yaw={imu.get('yaw_deg')}\")\n    print(f\"           gravity={imu.get('gravity')}  \"\n          f\"fallen={imu.get('fallen')}  limp={imu.get('limp')}\")\n    print()\n    print(f\"{'关节':&lt;12} {'在线':&lt;6} {'温度°C':&gt;8} {'角度°':&gt;9} {'电压V':&gt;8}\")\n    for s in t.get(\"servos\") or []:\n        print(f\"{s['name']:&lt;12} {str(s['online']):&lt;6} {str(s['temp_c']):&gt;8} \"\n              f\"{str(s['angle_deg']):&gt;9} {str(s['volt_v']):&gt;8}\")\n    rep = t.get(\"reported\") or {}\n    print()\n    print(f\"上报能力 : temps={rep.get('temps')}  volts={rep.get('volts')}  \"\n          f\"online_explicit={rep.get('online_explicit')}\")\ndef mode_subscribe(base, secs):\n    print(f\"=== /api/subscribe 轮询 {secs:.1f}s ===\")\n    since = 0\n    deadline = time.time() + secs\n    total = 0\n    connected_seen = None\n    while time.time() &lt; deadline:\n        try:\n            d = http_get_json(f\"{base}/api/subscribe?since={since}\")\n        except RuntimeError as e:\n            print(f\"请求失败: {e}\")\n            time.sleep(1.0)\n            continue\n        if connected_seen is None:\n            connected_seen = d.get(\"connected\")\n            print(f\"订阅连接 : {connected_seen}  err={d.get('error')!r}\")\n        items = d.get(\"items\") or []\n        seq = d.get(\"seq\") or since\n        for it in items:\n            total += 1\n            print(f\"[{it['t']}] policy={it['policy']}  \"\n                  f\"applied={it['applied']}  targets5={it['targets5']}\")\n            since = it[\"seq\"]\n        if not items:\n            since = seq\n        # 与服务端 pollFeed 同样的节奏，别把 daemon 打爆\n        time.sleep(0.3)\n    print(f\"共收到 {total} 帧，最新 seq={since}\")\n# ---------------------------------------------------------------------------\ndef main():\n    p = argparse.ArgumentParser(description=\"从机器人 Web 遥控台拉数据的示例\")\n    p.add_argument(\"--host\", default=\"127.0.0.1\", help=\"机器人 IP（默认 127.0.0.1）\")\n    p.add_argument(\"--port\", type=int, default=8000, help=\"Web 台端口（默认 8000）\")\n    p.add_argument(\"--mode\", default=\"info\",\n                   choices=[\"version\", \"info\", \"status\", \"health\", \"telemetry\",\n                            \"subscribe\", \"all\"],\n                   help=\"拉哪个接口（默认 info）\")\n    p.add_argument(\"--secs\", type=float, default=5.0,\n                   help=\"subscribe 模式持续秒数（默认 5）\")\n    args = p.parse_args()\n    base = f\"http://{args.host}:{args.port}\"\n    try:\n        if args.mode in (\"version\", \"all\"):\n            mode_version(base)\n            print()\n        if args.mode in (\"info\", \"all\"):\n            mode_info(base)\n            print()\n        if args.mode in (\"status\", \"all\"):\n            mode_status(base)\n            print()\n        if args.mode in (\"health\", \"all\"):\n            mode_health(base)\n            print()\n        if args.mode in (\"telemetry\", \"all\"):\n            mode_telemetry(base)\n            print()\n        if args.mode in (\"subscribe\", \"all\"):\n            mode_subscribe(base, args.secs)\n    except RuntimeError as e:\n        print(f\"错误: {e}\", file=sys.stderr)\n        sys.exit(1)\nif __name__ == \"__main__\":\n    main()\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-3\">9.3 robot_api_move.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/robot_api_move.py\">下载 robot_api_move.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nrobot_api_move.py —— 通过 Web 遥控台发运动命令的示例\n用法:\n    python3 robot_api_move.py fwd   --speed 0.2 --secs 1.0\n    python3 robot_api_move.py back  --speed 0.1 --secs 0.5\n    python3 robot_api_move.py left  --turn  0.5 --secs 0.5   # 正值 = 左转\n    python3 robot_api_move.py right --turn  0.5 --secs 0.5\n    python3 robot_api_move.py stop\n    python3 robot_api_move.py interactive                    # 键盘遥控\n说明:\n    Web 台的 Mover 会以 HZ=10Hz 反复发 robot.move，secs 到点后自动补一帧\n    全零停止；所以一次点击不用再额外 stop。\n    interactive 模式退出时会显式 POST /api/stop，避免留下残余线程。\n\"\"\"\nimport argparse\nimport json\nimport sys\nimport urllib.error\nimport urllib.request\ndef post_json(url, payload, timeout=10.0):\n    data = json.dumps(payload or {}).encode(\"utf-8\")\n    req = urllib.request.Request(\n        url, data=data, method=\"POST\",\n        headers={\"Content-Type\": \"application/json\", \"Accept\": \"application/json\"},\n    )\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as resp:\n            return json.loads(resp.read().decode(\"utf-8\"))\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(\"utf-8\", \"replace\")\n        raise RuntimeError(f\"HTTP {e.code}: {body}\") from e\n    except urllib.error.URLError as e:\n        raise RuntimeError(f\"连接失败: {e.reason}\") from e\ndef api_move(base, vx, vyaw, secs):\n    return post_json(f\"{base}/api/move\", {\"vx\": vx, \"vyaw\": vyaw, \"secs\": secs})\ndef api_stop(base):\n    return post_json(f\"{base}/api/stop\", {})\n# ---------------------------------------------------------------------------\n# 交互模式：termios cbreak + select，一按键立刻发送\n# ---------------------------------------------------------------------------\ndef interactive(base, speed, turn, secs):\n    import os\n    import select\n    import termios\n    import tty\n    mapping = {\n        \"w\": ( speed,  0.0, \"前进\"),\n        \"W\": ( speed,  0.0, \"前进\"),\n        \"s\": (-speed,  0.0, \"后退\"),\n        \"S\": (-speed,  0.0, \"后退\"),\n        \"a\": ( 0.0,   turn, \"左转\"),\n        \"A\": ( 0.0,   turn, \"左转\"),\n        \"d\": ( 0.0,  -turn, \"右转\"),\n        \"D\": ( 0.0,  -turn, \"右转\"),\n    }\n    fd = sys.stdin.fileno()\n    old = termios.tcgetattr(fd)\n    try:\n        tty.setcbreak(fd)\n        print(\"交互遥控（q 退出）:\")\n        print(f\"  w 前进   s 后退   a 左转   d 右转   空格 停止\")\n        print(f\"  参数: vx={speed} m/s  vyaw={turn} rad/s  secs={secs}\")\n        while True:\n            r, _, _ = select.select([sys.stdin], [], [], 0.1)\n            if not r:\n                continue\n            ch = sys.stdin.read(1)\n            if ch in (\"q\", \"Q\", \"\\x03\"):        # q 或 Ctrl+C\n                break\n            if ch == \" \":\n                try:\n                    api_stop(base)\n                    print(\"\\n■ 已发送停止\")\n                except RuntimeError as e:\n                    print(f\"\\n停止失败: {e}\")\n                continue\n            if ch == \"\\x1b\":                       # 方向键转义序列，忽略剩余两字节\n                try:\n                    sys.stdin.read(2)\n                except Exception:\n                    pass\n                continue\n            if ch in mapping:\n                vx, vyaw, label = mapping[ch]\n                try:\n                    res = api_move(base, vx, vyaw, secs)\n                    print(f\"\\n{label}: vx={res.get('vx')}  \"\n                          f\"vyaw={res.get('vyaw')}  {res.get('secs')}s\")\n                except RuntimeError as e:\n                    print(f\"\\n{label} 失败: {e}\")\n    finally:\n        termios.tcsetattr(fd, termios.TCSADRAIN, old)\n        print(\"\\n退出交互，发送停止\")\n        try:\n            api_stop(base)\n        except RuntimeError as e:\n            print(f\"停止失败: {e}\")\n# ---------------------------------------------------------------------------\ndef main():\n    p = argparse.ArgumentParser(description=\"通过 Web 遥控台发运动命令的示例\")\n    p.add_argument(\"direction\",\n                   choices=[\"fwd\", \"back\", \"left\", \"right\", \"stop\", \"interactive\"])\n    p.add_argument(\"--host\", default=\"127.0.0.1\", help=\"机器人 IP（默认 127.0.0.1）\")\n    p.add_argument(\"--port\", type=int, default=8000, help=\"Web 台端口（默认 8000）\")\n    p.add_argument(\"--speed\", type=float, default=0.2,\n                   help=\"前进/后退速度 m/s（默认 0.2）\")\n    p.add_argument(\"--turn\", type=float, default=0.5,\n                   help=\"左/右转 vyaw rad/s（默认 0.5）\")\n    p.add_argument(\"--secs\", type=float, default=1.0,\n                   help=\"单次运动持续秒数（默认 1.0）\")\n    args = p.parse_args()\n    base = f\"http://{args.host}:{args.port}\"\n    try:\n        if args.direction == \"stop\":\n            print(api_stop(base))\n        elif args.direction == \"interactive\":\n            interactive(base, args.speed, args.turn, args.secs)\n        else:\n            vx = vyaw = 0.0\n            if args.direction == \"fwd\":\n                vx = args.speed\n            elif args.direction == \"back\":\n                vx = -args.speed\n            elif args.direction == \"left\":\n                vyaw = args.turn\n            elif args.direction == \"right\":\n                vyaw = -args.turn\n            print(api_move(base, vx, vyaw, args.secs))\n    except RuntimeError as e:\n        print(f\"错误: {e}\", file=sys.stderr)\n        sys.exit(1)\nif __name__ == \"__main__\":\n    main()\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-4\">9.4 robot_api_skill.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/robot_api_skill.py\">下载 robot_api_skill.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nrobot_api_skill.py —— 通过 Web 遥控台触发动作技能的示例\n用法:\n    python3 robot_api_skill.py list                 # 列出脚本内置的常用技能\n    python3 robot_api_skill.py sit_toggle\n    python3 robot_api_skill.py ground_pick\n    python3 robot_api_skill.py kick_right\n    python3 robot_api_skill.py kick_left\n    python3 robot_api_skill.py roll_over\n    python3 robot_api_skill.py &lt;任意技能名&gt;          # 技能名直接透传给 robotd\n说明:\n    请求走 POST /api/skill，服务端再把 {\"skill\": ...} 走 robot.do 推给 robotd。\n    服务端响应结构：\n        成功 → {\"ok\": true,  \"message\": \"...\", \"result\": {...}}\n        失败 → {\"ok\": false, \"error\": \"...\", \"result\": {...}}\n\"\"\"\nimport argparse\nimport json\nimport sys\nimport urllib.error\nimport urllib.request\nKNOWN_SKILLS = {\n    \"sit_toggle\": \"坐下 / 站立（切换）\",\n    \"ground_pick\": \"从地上捡东西\",\n    \"kick_right\": \"右踢腿\",\n    \"kick_left\": \"左踢腿\",\n    \"roll_over\": \"翻滚\",\n}\ndef post_json(url, payload, timeout=15.0):\n    data = json.dumps(payload or {}).encode(\"utf-8\")\n    req = urllib.request.Request(\n        url, data=data, method=\"POST\",\n        headers={\"Content-Type\": \"application/json\", \"Accept\": \"application/json\"},\n    )\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as resp:\n            return json.loads(resp.read().decode(\"utf-8\"))\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(\"utf-8\", \"replace\")\n        raise RuntimeError(f\"HTTP {e.code}: {body}\") from e\n    except urllib.error.URLError as e:\n        raise RuntimeError(f\"连接失败: {e.reason}\") from e\ndef list_skills():\n    print(\"脚本内置常用技能：\")\n    for name, desc in KNOWN_SKILLS.items():\n        print(f\"  {name:&lt;14} {desc}\")\n    print()\n    print(\"其它技能名也可以直接传：python3 robot_api_skill.py &lt;技能名&gt;\")\ndef run_skill(base, skill):\n    resp = post_json(f\"{base}/api/skill\", {\"skill\": skill})\n    if resp.get(\"ok\"):\n        print(f\"[OK] {skill}: {resp.get('message') or '已接受'}\")\n        result = resp.get(\"result\") or {}\n        if result:\n            print(f\"   result: {result}\")\n    else:\n        print(f\"[ERROR] {skill}: {resp.get('error') or resp.get('message') or '失败'}\",\n              file=sys.stderr)\n        result = resp.get(\"result\") or {}\n        if result:\n            print(f\"   result: {result}\", file=sys.stderr)\n        sys.exit(1)\ndef main():\n    p = argparse.ArgumentParser(description=\"通过 Web 遥控台触发动作技能的示例\")\n    p.add_argument(\"skill\", nargs=\"?\",\n                   help=\"技能名；或 'list' 列出内置技能\")\n    p.add_argument(\"--host\", default=\"127.0.0.1\", help=\"机器人 IP（默认 127.0.0.1）\")\n    p.add_argument(\"--port\", type=int, default=8000, help=\"Web 台端口（默认 8000）\")\n    args = p.parse_args()\n    if not args.skill or args.skill == \"list\":\n        list_skills()\n        return\n    base = f\"http://{args.host}:{args.port}\"\n    try:\n        run_skill(base, args.skill)\n    except RuntimeError as e:\n        print(f\"错误: {e}\", file=sys.stderr)\n        sys.exit(1)\nif __name__ == \"__main__\":\n    main()\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-5\">9.5 receive_video.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/receive_video.py\">下载 receive_video.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">#!/usr/bin/env python3\n\"\"\"\n从 duck robot 的 8443 端口（webrtcsink 信令服务器）获取视频流。\n用法:\n    # 预览视频窗口\n    python3 scripts/receive_video.py &lt;robot_host&gt;\n    # 保存到 MP4 文件\n    python3 scripts/receive_video.py &lt;robot_host&gt; --output output.mp4\n    # 保存为 JPEG 帧序列\n    python3 scripts/receive_video.py &lt;robot_host&gt; --save-frames ./frames/\n依赖:\n    pip install aiortc av opencv-python websockets\n\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport asyncio\nimport json\nimport os\nimport signal\nimport sys\nfrom pathlib import Path\nfrom typing import Optional\nimport av\nimport cv2\nimport websockets\nfrom aiortc import (\n    RTCIceCandidate,\n    RTCIceServer,\n    RTCConfiguration,\n    RTCPeerConnection,\n    RTCSessionDescription,\n    VideoStreamTrack,\n)\n# ─── 状态 ───────────────────────────────────────────────────────────────\nclass State:\n    def __init__(self) -&gt; None:\n        self.pc: Optional[RTCPeerConnection] = None\n        self.session_id: Optional[str] = None\n        self._frame_queue: asyncio.Queue = asyncio.Queue(maxsize=10)\n        self._ice_outbox: asyncio.Queue[str] = asyncio.Queue()\n    def put_frame(self, frame) -&gt; None:\n        # 满了就丢最旧的，保持最新\n        try:\n            self._frame_queue.put_nowait(frame)\n        except asyncio.QueueFull:\n            try:\n                self._frame_queue.get_nowait()\n                self._frame_queue.put_nowait(frame)\n            except asyncio.QueueEmpty:\n                pass\n    async def get_frame(self):\n        return await self._frame_queue.get()\n    def enqueue_ice(self, candidate_str: str) -&gt; None:\n        \"\"\"本地 ICE 候选入出箱，信令循环会把它发给服务器。\"\"\"\n        self._ice_outbox.put_nowait(candidate_str)\n    async def close(self) -&gt; None:\n        if self.pc is not None:\n            try:\n                await self.pc.close()\n            except Exception:\n                pass\n            self.pc = None\nstate = State()\nshutdown = asyncio.Event()\n# ─── 信令 ───────────────────────────────────────────────────────────────\ndef _ice_candidate_to_sdp_str(cand: RTCIceCandidate) -&gt; str:\n    \"\"\"把 aiortc 的 RTCIceCandidate 还原成 `candidate:...` 字符串。\"\"\"\n    parts = [\n        \"candidate:\", str(cand.foundation), str(cand.component),\n        cand.protocol, str(cand.priority), cand.ip, str(cand.port),\n        \"typ\", cand.type,\n    ]\n    if cand.relatedAddress is not None and cand.relatedPort is not None:\n        parts += [\"raddr\", cand.relatedAddress, \"rport\", str(cand.relatedPort)]\n    if cand.tcpType is not None:\n        parts += [\"tcptype\", cand.tcpType]\n    return \" \".join(parts)\ndef _parse_ice_candidate(sdp_str: str, sdp_mid: str | None, sdp_mline_index: int | None) -&gt; RTCIceCandidate | None:\n    \"\"\"把 RFC 8445 的 candidate: 行解析成 aiortc 1.10.1 的 RTCIceCandidate。\n    格式: candidate:&lt;foundation&gt; &lt;component&gt; &lt;protocol&gt; &lt;priority&gt; &lt;ip&gt; &lt;port&gt;\n          typ &lt;cand-type&gt; [raddr &lt;rel-ip&gt; rport &lt;rel-port&gt;] [tcptype &lt;tcp-type&gt;] ...\n    返回 None 代表这条不能解析（比如空 candidate 或 end-of-ca
