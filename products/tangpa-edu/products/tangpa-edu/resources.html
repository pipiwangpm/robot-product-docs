<script type="application/json" class="resource-data">{"id": "tangpa-edu", "line": "双足机器人", "name": "镋钯 · EDU 配置", "english_name": "TangPa", "resources_page": "products/tangpa-edu/resources.html", "videos": [{"id": "guide-1", "title": "如何安装电池", "category": "日常操作", "status": "ready", "src": "../../assets/videos/guide-1.mp4", "poster": "../../assets/videos/guide-1.jpg"}, {"id": "guide-2", "title": "启动镋钯机器人", "category": "日常操作", "status": "ready", "src": "../../assets/videos/guide-2.mp4", "poster": "../../assets/videos/guide-2.jpg"}, {"id": "guide-3", "title": "遥控模式操作说明", "category": "日常操作", "status": "ready", "src": "../../assets/videos/guide-3.mp4", "poster": "../../assets/videos/guide-3.jpg"}, {"id": "guide-4", "title": "关闭机器与电池充电", "category": "日常操作", "status": "ready", "src": "../../assets/videos/guide-4.mp4", "poster": "../../assets/videos/guide-4.jpg"}, {"id": "guide-5", "title": "启动镋钯机器人（开发者模式）", "category": "开发调试", "status": "ready", "src": "../../assets/videos/guide-5.mp4", "poster": "../../assets/videos/guide-5.jpg"}], "documents": [{"id": "user-manual", "title": "用户手册", "summary": "安全、开箱、开关机、电池充电、配网、跟随与日常维护", "html": "\u003ch2 id=\"s1\">1 适用范围与安全\u003c/h2>\u003cp>本册适用于镋钯 TangPa 双足机器人 EDU 配置，面向日常操作人员。遥控器、工装和 SDK 的专项操作分别见相应分册。\u003c/p>\u003cp>机器人并非玩具，不恰当的使用可能会对机器人本身及人员或周边环境造成危险。\u003c/p>\u003cp>严禁将机器人用于从事任何被法律法规禁止的活动。\u003c/p>\u003cp>16岁以下人员不适合操作机器人。\u003c/p>\u003cp>严禁在醉酒、用药等意识受影响的状态下操作机器人。\u003c/p>\u003cp>机器人在运行过程中，请务必与非操作人员保持2米以上的距离。\u003c/p>\u003cp>严禁通过故意推搡、脚踹等方式干扰机器人的运行。\u003c/p>\u003cp>请勿在不适合的环境中使用本机器人。\u003c/p>\u003cp>在开始使用前，请务必认真阅读本说明书。\u003c/p>\u003cp>机器人存在倾倒风险。关节停止出力前必须建立可靠支撑；发生失控时，人员避开倾倒及关节运动区域。禁止上下楼梯，不依赖机器人作出关键安全决策。\u003c/p>\u003ch3 id=\"s1-1\">1.1 使用环境\u003c/h3>\u003cp>在干燥、平整的硬化地面使用。工作温度控制在 0～35℃；禁止在坡度大于 5° 的地面运行。雨雪、雷电、沙尘等恶劣环境下停止使用。\u003c/p>\u003ch2 id=\"s2\">2 开箱与结构\u003c/h2>\u003ch3 id=\"s2-1\">2.1 交付物清点\u003c/h3>\u003cp>逐项检查包装、数量与外观，确认电池无鼓包、破损，配件无明显变形。装箱物品如下；序列号与具体交付型号见随箱铭牌和交付记录。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>物料\u003c/th>\u003cth>规格/图号\u003c/th>\u003cth>数量\u003c/th>\u003cth>单位\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>镋钯双足机器人\u003c/td>\u003ctd>型号\u003c/td>\u003ctd>\u003c/td>\u003ctd>序列号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>镋钯双足机器人\u003c/td>\u003ctd>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>台\u003c/td>\u003c/tr>\u003ctr>\u003ctd>遥控器\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>套\u003c/td>\u003c/tr>\u003ctr>\u003ctd>电池\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>个\u003c/td>\u003c/tr>\u003ctr>\u003ctd>充电器\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>个\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱一\u003c/td>\u003ctd>TP01.GZ.001\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱二\u003c/td>\u003ctd>TP01.GZ.002\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱三\u003c/td>\u003ctd>TP01.GZ.003\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>卡片D\u003c/td>\u003ctd>TP01.GZ.004\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>提手\u003c/td>\u003ctd>/\u003c/td>\u003ctd>2\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>左脚底板IMU标定工装\u003c/td>\u003ctd>TP01.GZ.011\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>右脚底板IMU标定工装\u003c/td>\u003ctd>TP01.GZ.010\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>头托左\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>头托右\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>把手\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>后背靠背\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>底板组件\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>底座组件\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内六角圆柱头螺钉\u003c/td>\u003ctd>M3X10\u003c/td>\u003ctd>16\u003c/td>\u003ctd>颗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内六角圆柱头螺钉\u003c/td>\u003ctd>M4X10\u003c/td>\u003ctd>3\u003c/td>\u003ctd>颗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内六角圆柱头螺钉\u003c/td>\u003ctd>M4X14\u003c/td>\u003ctd>4\u003c/td>\u003ctd>颗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内六角圆柱头螺钉\u003c/td>\u003ctd>M4X25\u003c/td>\u003ctd>4\u003c/td>\u003ctd>颗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内六角圆柱头螺钉\u003c/td>\u003ctd>M4X50\u003c/td>\u003ctd>2\u003c/td>\u003ctd>颗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>不锈钢双通螺柱\u003c/td>\u003ctd>M3X30\u003c/td>\u003ctd>8\u003c/td>\u003ctd>根\u003c/td>\u003c/tr>\u003ctr>\u003ctd>平垫\u003c/td>\u003ctd>M6\u003c/td>\u003ctd>2\u003c/td>\u003ctd>颗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>产品说明书\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>合格证\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>张\u003c/td>\u003c/tr>\u003ctr>\u003ctd>保修卡\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>张\u003c/td>\u003c/tr>\u003ctr>\u003ctd>铭牌\u003c/td>\u003ctd>/\u003c/td>\u003ctd>1\u003c/td>\u003ctd>张\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch3 id=\"s2-2\">2.2 结构识别\u003c/h3>\u003cp>1 屏幕；2 天线；3 交互模组；4 电池盖板；5 开关；6 电量显示；7 急停开关；8 快拆连接杆安装位；9 扩展设备安装位；10 定位标签立柱；11 定位标签。\u003c/p>\u003cfigure>\u003cimg alt=\"机器人结构及部件位置\" src=\"assets/manual/image1.png\"/>\u003cfigcaption>机器人结构及部件位置\u003c/figcaption>\u003c/figure>\u003ch2 id=\"s3\">3 开机、急停与关机\u003c/h2>\u003ch3 id=\"s3-1\">3.1 准备与开机\u003c/h3>\u003cp>开关机及装卸电池前，必须让机器人坐立于滑座并保持稳定。滑座组装见《技术与维护手册》第 2 节。\u003c/p>\u003cfigure>\u003cimg alt=\"滑座支撑状态\" src=\"assets/manual/image2.png\"/>\u003cfigcaption>滑座支撑状态\u003c/figcaption>\u003c/figure>\u003col>\u003cli>检查滑座与机器人稳定，周围无人和障碍物，急停按钮已释放。\u003c/li>\u003cli>电池开关短按一次后长按约 3 秒，启动本体电源。\u003c/li>\u003cli>遥控器短按一次后长按开机。按《遥控器操作手册》第 2 节完成初始状态确认和电机使能。\u003c/li>\u003cli>确认关节完成使能后，将机器人平稳放置到水平、坚实地面，继续执行对应运行模式步骤。\u003c/li>\u003cli>若遥控器间歇蜂鸣，先检查本体、遥控器电量和连接状态，停止继续启动运动。\u003c/li>\u003c/ol>\u003ch3 id=\"s3-2\">3.2 急停与复位\u003c/h3>\u003cp>硬急停：出现失控等意外状况时，按下机身后侧偏下位置的急停按钮。所有关节停止出力，软件功能继续运行。注意关节失去出力后的倾倒风险。\u003c/p>\u003cp>硬急停复位：先在滑座保护下通过电池开关关闭本体，再释放急停按钮，重新执行本册第 3.1 节开机流程。不要在无支撑状态下解除急停。\u003c/p>\u003cp>软急停：G 拨杆向左并按 A 键，使 A 键灯亮。恢复时先在滑座保护下重新使能电机，再按本册第 3.1 节开机流程继续。\u003c/p>\u003ch3 id=\"s3-3\">3.3 关机\u003c/h3>\u003col>\u003cli>结束任务与运动，使机器人处于滑座可靠保护状态。\u003c/li>\u003cli>进入软急停或硬急停，确认人员避开关节运动范围。\u003c/li>\u003cli>长按电池开关约 3 秒关闭本体。拆装电池前确认本体已断电。\u003c/li>\u003c/ol>\u003ch2 id=\"s4\">4 电池、充电与存储\u003c/h2>\u003ch3 id=\"s4-1\">4.1 电池拆装\u003c/h3>\u003cp>拆装前按第 3.3 节关机并保持滑座支撑。打开电池仓盖，两侧滑动卡扣向内收，电池弹出后双手稳妥提出。安装时核对防呆方向，装入并检查锁定后关闭盖板。不要强插或拉扯端子。\u003c/p>\u003cfigure>\u003cimg alt=\"电池防呆结构\" src=\"assets/manual/image3.png\"/>\u003cfigcaption>电池防呆结构\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s4-2\">4.2 充电\u003c/h3>\u003col>\u003cli>使用随设备匹配的电池与充电器，核对铭牌，检查无鼓包、破损、受潮或端子损伤。\u003c/li>\u003cli>将快拆电池从已关机且可靠支撑的本体取下。\u003c/li>\u003cli>先连接充电器与电池，再接通输入电源。红灯表示充电中，绿灯表示完成。\u003c/li>\u003cli>完成充电后停止供电，再收纳连接线缆和电池；出现异常发热、破损或非预期指示时停止使用并联系支持。\u003c/li>\u003c/ol>\u003cp>充电环境温度为 0～45℃。电池每格电量对应约 25%；低于 15% 时电池指示灯持续闪烁，低于 10% 时屏幕红闪。收到低电提示后结束任务，在滑座保护下关机并更换或充电。不要依赖自动低电停机。\u003c/p>\u003ch3 id=\"s4-3\">4.3 存储与检查\u003c/h3>\u003cp>电池存储温度 0～40℃。长期停用前将电量充至 70% 以上。每次使用前检查电池无鼓包；异常电池停止使用。避免过充、受潮、挤压和碰撞。遥控器的充电要求见《遥控器操作手册》第 1 节。\u003c/p>\u003ch2 id=\"s5\">5 连接与运行模式\u003c/h2>\u003ch3 id=\"s5-1\">5.1 AP 配网\u003c/h3>\u003col>\u003cli>本体开机后，手机连接 Robot-Setup Wi-Fi 热点。\u003c/li>\u003cli>打开自动出现的配网页，选择目标 Wi-Fi 或手动输入网络名称。\u003c/li>\u003cli>输入目标网络密码并点击“连接”。\u003c/li>\u003cli>观察机器人左下角反馈：密码错误时重新连接并输入；成功时显示机器 IP，记录该地址。\u003c/li>\u003cli>需要切换 Wi-Fi 时重启机器人，重复上述流程。\u003c/li>\u003c/ol>\u003cp>若手机未打开配网页，使用本机交付的配网入口或联系技术支持获取入口地址。配网成功以机器人显示 IP 为准。\u003c/p>\u003cfigure>\u003cimg alt=\"机器人网络连接反馈\" src=\"assets/manual/image6.png\"/>\u003cfigcaption>机器人网络连接反馈\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s5-2\">5.2 遥控模式\u003c/h3>\u003cp>遥控模式为默认模式，使用出厂配套遥控器。先完成开机及电机使能，再进入控制模型。完整按键、状态切换和模式退出见《遥控器操作手册》第 2～4 节。\u003c/p>\u003ch3 id=\"s5-3\">5.3 队列跟随\u003c/h3>\u003col>\u003cli>确认已开通 App 和机器人管理平台（SaaS）服务，定位配置可用。\u003c/li>\u003cli>分别使机器人进入控制模型下的稳定站立状态，将 G 拨杆向右进入跟随模式。\u003c/li>\u003cli>使用遥控器将队列调整到位，在 App 或 SaaS 中设置一致的队列顺序。\u003c/li>\u003cli>遥控首台机器人，其余机器人依序跟随。每台机器人均保留对应遥控器供接管。\u003c/li>\u003c/ol>\u003cp>最多 10 台，包含首台。直线跟随间距约 1.8 m，普通用户不可调整。定位失败且未被遥控接管时，后序机器人原地站立。队列相对定位存在误差，必须保持现场监护。人员跟随的启用由现场配置和交付服务提供。\u003c/p>\u003ch3 id=\"s5-4\">5.4 开发者模式\u003c/h3>\u003cp>仅由授权开发人员使用。进入方法见《遥控器操作手册》第 4 节；退出开发者模式需在滑座保护下关机。软件集成见《SDK 使用指南》第 1～4 节。\u003c/p>\u003ch2 id=\"s6\">6 日常维护与故障处理\u003c/h2>\u003col>\u003cli>每次使用前检查电池、外壳、结构和紧固件；发现松动或异常立即停用，交由有权限人员检查。\u003c/li>\u003cli>不要使用湿毛巾擦拭，避免水滴进入电气设备。\u003c/li>\u003cli>留意踏步声以外的碰撞或摩擦噪音，出现异常时关停，不在原因未排除时继续运行。\u003c/li>\u003cli>按维护要求至少每 180 天安排一次 IMU 标定，由授权技术人员执行《技术与维护手册》第 4 节。\u003c/li>\u003c/ol>\u003ctable>\u003cthead>\u003ctr>\u003cth>现象\u003c/th>\u003cth>处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>前倾、侧倾或摇晃\u003c/td>\u003ctd>结束运动并在支撑保护下关机，安排技术人员检查及标定。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>遥控器蜂鸣或无响应\u003c/td>\u003ctd>核对电量、对应设备、开机与模式状态，不连续试按或强行运动。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>队列不齐或跟随中断\u003c/td>\u003ctd>检查队列顺序与定位状态，组织接管并停止异常任务。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>续航变化\u003c/td>\u003ctd>记录温度、运动强度和屏幕播放内容，排查电池状态。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>报修时提供序列号、交付配置、固件版本、发生时间、操作步骤与现场照片。使用随箱保修卡及交付联系人获取支持。\u003c/p>", "version": "V1.0", "date": "2026.11.17", "pdf": "../../pdf/tangpa-edu/镋钯机器人用户手册-V1.0.pdf", "online": "../../../../index.html#tangpa-edu/user-manual", "pages": 8, "bytes": 2295754}, {"id": "remote-manual", "title": "遥控器操作手册", "summary": "按键、灯态、使能、站立行走、软急停及模式切换", "html": "\u003ch2 id=\"s1\">1 识别与使用前检查\u003c/h2>\u003cp>本册适用于镋钯 TangPa EDU 配套遥控器。遥控器出厂与机器人一一配对，开机后自动连接；多机现场先核对本体与遥控器对应关系。保持视线内操作。\u003c/p>\u003cfigure>\u003cimg alt=\"遥控器按键及拨杆\" src=\"assets/manual/image7.png\"/>\u003cfigcaption>遥控器按键及拨杆\u003c/figcaption>\u003c/figure>\u003cp>遥控器使用内置可充电锂电池，使用符合 CCC、UL 或 CE 认证要求的 5 V / 2 A 电源适配器。禁止使用高于 5 V 的充电器。\u003c/p>\u003ch2 id=\"s2\">2 开机与进入控制模型\u003c/h2>\u003cp>先执行《用户手册》第 3.1 节的滑座支撑与本体开机步骤。使能前不要解除支撑。\u003c/p>\u003col>\u003cli>初始状态：所有按键指示灯熄灭，G、H 拨杆回中。\u003c/li>\u003cli>H 拨杆向左，按 A 键，A 键灯亮，启动电机。\u003c/li>\u003cli>各关节使能后，将机器人平稳放到水平坚实地面。\u003c/li>\u003cli>关闭 A 键使灯熄灭，再将 H 拨杆回中，启动 IMU 等传感器及控制模型。\u003c/li>\u003cli>按 A 键使用控制模型，默认进入站立状态，随后关闭 A 键。\u003c/li>\u003c/ol>\u003cp>软急停：G 拨杆向左并按 A 键，使 A 键灯亮。需要恢复时，在可靠支撑下重新使能，执行《用户手册》第 3.1～3.2 节。硬急停会使关节停止出力，按《用户手册》第 3.2 节处理。\u003c/p>\u003ch2 id=\"s3\">3 站立、行走与动作控制\u003c/h2>\u003cp>同一按键的作用随状态和 A 键灯态变化。先确认状态，再缓慢操作单个控制件。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>状态\u003c/th>\u003cth>动作\u003c/th>\u003cth>按键\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>软急停\u003c/td>\u003ctd>\u003c/td>\u003ctd>G拨杆往左+A键（A键亮）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>进入行走状态\u003c/td>\u003ctd>\u003c/td>\u003ctd>B键\u003c/td>\u003c/tr>\u003ctr>\u003ctd>进入站立状态\u003c/td>\u003ctd>\u003c/td>\u003ctd>D键\u003c/td>\u003c/tr>\u003ctr>\u003ctd>原地跳舞\u003c/td>\u003ctd>\u003c/td>\u003ctd>在站立状态下，按D键\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>躯干俯仰角\u003c/td>\u003ctd>左侧大摇杆前（Y1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>下蹲\u003c/td>\u003ctd>左侧大摇杆后（Y1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>躯干偏转角\u003c/td>\u003ctd>左侧大摇杆左右（X1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>头部滚转角\u003c/td>\u003ctd>A键熄灭，H拨杆左右\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>头部俯仰角\u003c/td>\u003ctd>右侧大摇杆前后（Y2）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>头部偏转角\u003c/td>\u003ctd>右侧大摇杆左右（X2）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>躯干滚转角\u003c/td>\u003ctd>小摇杆左右（X3）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>颈部伸缩\u003c/td>\u003ctd>A键常亮，H键左右拨动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立状态下的操作\u003c/td>\u003ctd>天线前后\u003c/td>\u003ctd>小摇杆前后（Y3）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>行走状态下的操作\u003c/td>\u003ctd>头部偏转角\u003c/td>\u003ctd>H拨杆左右\u003c/td>\u003c/tr>\u003ctr>\u003ctd>行走状态下的操作\u003c/td>\u003ctd>直走\u003c/td>\u003ctd>左侧大摇杆前后（Y1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>行走状态下的操作\u003c/td>\u003ctd>横移\u003c/td>\u003ctd>左侧大摇杆左右（X1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>行走状态下的操作\u003c/td>\u003ctd>转向\u003c/td>\u003ctd>右侧大摇杆左右（X2）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>D 键用于进入站立状态；已经站立时再按 D 键会触发原地跳舞。不要将连续按 D 键当作通用停止操作。动作异常时使用已掌握的急停流程。\u003c/p>\u003ch2 id=\"s4\">4 跟随与开发者模式\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth>模式\u003c/th>\u003cth>进入条件与操作\u003c/th>\u003cth>退出/结束\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>跟随\u003c/td>\u003ctd>控制模型下稳定站立，G 拨杆向右；队列配置见《用户手册》第 5.3 节。\u003c/td>\u003ctd>异常时使用对应遥控器接管；需要结束使用时，支撑后按关机流程停机。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开发者\u003c/td>\u003ctd>H 拨杆向右并按 A 键；电机使能后平稳放到地面，关闭 A 键，H 回中。\u003c/td>\u003ctd>在滑座保护下按《用户手册》第 3.3 节关机。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>开发者模式下的指令、订阅和标定由授权人员使用。不要同时运行多个电机控制流程。\u003c/p>\u003ch2 id=\"s5\">5 异常与结束使用\u003c/h2>\u003cp>遥控器间歇蜂鸣时，检查本体及遥控器状态和连接。按键无反应时先核对设备对应关系、当前模式与 A 键灯态，不反复试按。失联时保护现场并采取已掌握的停机措施，不假定本体会自动停车。\u003c/p>\u003cp>结束任务后，先在滑座保护下完成本体关机，再收纳遥控器。避免摇杆、拨杆受压，避免受潮及碰撞。充电异常或设备损伤时停止使用，提供本体与遥控器标识联系支持。\u003c/p>", "version": "V1.0", "date": "2026.11.17", "pdf": "../../pdf/tangpa-edu/镋钯机器人遥控器操作手册-V1.0.pdf", "online": "../../../../index.html#tangpa-edu/remote-manual", "pages": 5, "bytes": 1705359}, {"id": "technical-manual", "title": "技术与维护手册", "summary": "滑座装配、关节校零位、最新 IMU 工装安装与授权标定", "html": "\u003ch2 id=\"s1\">1 权限与准备\u003c/h2>\u003cp>本册适用于镋钯 TangPa EDU 配置的装配和授权维护人员。拆壳、校零、IMU 标定会影响运动控制，须由具备相应权限和培训的人员执行。机械拆装前关机并建立可靠支撑；上电调试时人员避开关节与倾倒范围。\u003c/p>\u003ch2 id=\"s2\">2 滑座装配\u003c/h2>\u003cp>识别把手、后背靠背、底板组件和底座组件。\u003c/p>\u003cfigure>\u003cimg alt=\"把手\" src=\"assets/manual/image8.png\"/>\u003cfigcaption>把手\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"后背靠背\" src=\"assets/manual/image9.png\"/>\u003cfigcaption>后背靠背\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"底板组件\" src=\"assets/manual/image10.png\"/>\u003cfigcaption>底板组件\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"底座组件\" src=\"assets/manual/image11.png\"/>\u003cfigcaption>底座组件\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s2-1\">2.1 装配步骤 1\u003c/h3>\u003cp>用 4 颗 M4×25 内六角圆柱头螺钉，将把手安装到后背靠板。\u003c/p>\u003cfigure>\u003cimg alt=\"滑座装配连接位置\" src=\"assets/manual/image12.png\"/>\u003cfigcaption>滑座装配连接位置\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s2-2\">2.2 装配步骤 2\u003c/h3>\u003cp>用 3 颗 M4×10 内六角圆柱头螺钉，将后背靠板安装到底板组件。\u003c/p>\u003cfigure>\u003cimg alt=\"滑座装配连接位置\" src=\"assets/manual/image13.png\"/>\u003cfigcaption>滑座装配连接位置\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s2-3\">2.3 装配步骤 3\u003c/h3>\u003cp>用 4 颗 M4×14 螺钉将底座组件安装到底板；再用 2 颗 M4×50 螺钉及 2 颗 M6 平垫，将底座组件安装到把手。\u003c/p>\u003cfigure>\u003cimg alt=\"滑座装配连接位置\" src=\"assets/manual/image14.png\"/>\u003cfigcaption>滑座装配连接位置\u003c/figcaption>\u003c/figure>\u003cp>装配完成后检查连接无松动、底座及接触面稳定。紧固作业使用该交付配置规定的工艺，不以相近规格替代；提手和头托不能自行作为吊装点。\u003c/p>\u003ch2 id=\"s3\">3 关节电机校零\u003c/h2>\u003ch3 id=\"s3-1\">3.1 准备与编号\u003c/h3>\u003cp>将调试电脑接入机器人所在网络。按维护权限拆下头部小门及左、右、前胸壳，露出校准位。头部小门有 4 颗螺钉。\u003c/p>\u003cfigure>\u003cimg alt=\"头部小门\" src=\"assets/manual/image16.png\"/>\u003cfigcaption>头部小门\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"躯体覆盖件位置\" src=\"assets/manual/image17.png\"/>\u003cfigcaption>躯体覆盖件位置\u003c/figcaption>\u003c/figure>\u003cp>本节校零对象共 14 个电机：头颈 1、2、3、4；躯体 11、12、13、14；左腿 15、17、19；右腿 16、18、20。该计数为本节校零电机范围。\u003c/p>\u003cfigure>\u003cimg alt=\"上半身电机编号\" src=\"assets/manual/image18.png\"/>\u003cfigcaption>上半身电机编号\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"下半身电机编号\" src=\"assets/manual/image19.png\"/>\u003cfigcaption>下半身电机编号\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s3-2\">3.2 工装对应关系\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth>工装\u003c/th>\u003cth>电机号\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>卡片 D\u003c/td>\u003ctd>1、3、11、12、15、16、17、18、19、20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱一\u003c/td>\u003ctd>13、14\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱二\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱三\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cfigure>\u003cimg alt=\"卡片 D\" src=\"assets/manual/image20.png\"/>\u003cfigcaption>卡片 D\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"标定柱一\" src=\"assets/manual/image21.png\"/>\u003cfigcaption>标定柱一\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"标定柱二\" src=\"assets/manual/image22.png\"/>\u003cfigcaption>标定柱二\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"标定柱三\" src=\"assets/manual/image23.png\"/>\u003cfigcaption>标定柱三\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s3-3\">3.3 逐关节对齐校零位\u003c/h3>\u003cp>按下列实物图确认对应电机的机械校零位。头颈自上而下为 4、3、2、1；左右躯体及腿部自上而下分别为 11、13、15、17、19 和 12、14、16、18、20。\u003c/p>\u003cfigure>\u003cimg alt=\"1 号电机校零位\" src=\"assets/manual/image24.png\"/>\u003cfigcaption>1 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"2 号电机校零位\" src=\"assets/manual/image25.png\"/>\u003cfigcaption>2 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"3 号电机校零位\" src=\"assets/manual/image26.png\"/>\u003cfigcaption>3 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"4 号电机校零位\" src=\"assets/manual/image27.png\"/>\u003cfigcaption>4 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"11 号电机校零位\" src=\"assets/manual/image28.png\"/>\u003cfigcaption>11 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"13 号电机校零位\" src=\"assets/manual/image29.png\"/>\u003cfigcaption>13 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"15 号电机校零位\" src=\"assets/manual/image30.png\"/>\u003cfigcaption>15 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"17 号电机校零位\" src=\"assets/manual/image31.png\"/>\u003cfigcaption>17 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"19 号电机校零位\" src=\"assets/manual/image32.png\"/>\u003cfigcaption>19 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"12 号电机校零位\" src=\"assets/manual/image33.png\"/>\u003cfigcaption>12 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"14 号电机校零位\" src=\"assets/manual/image34.png\"/>\u003cfigcaption>14 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"16 号电机校零位\" src=\"assets/manual/image35.png\"/>\u003cfigcaption>16 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"18 号电机校零位\" src=\"assets/manual/image36.png\"/>\u003cfigcaption>18 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"20 号电机校零位\" src=\"assets/manual/image37.png\"/>\u003cfigcaption>20 号电机校零位\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s3-4\">3.4 调用标定接口与结果\u003c/h3>\u003cp>确认机械位置和工装正确后，调用 MotorCalibration，指定对应 motor_id。《API 接口参考》第 2 节列出接口与状态语义。返回 STATUS_OK 仅表示已收到子系统状态；必须继续检查 response.state：succeeded 才是标定成功，failed 或 rejected 应停止并处理 message 中的原因。不得仅凭返回码 0 判断校零完成。\u003c/p>\u003ch2 id=\"s4\">4 IMU 工装与标定\u003c/h2>\u003ch3 id=\"s4-1\">4.1 工装安装\u003c/h3>\u003col>\u003cli>关机并可靠支撑，拆下左、右脚掌外观件；每侧拆下脚底最上面和最下面共 4 颗 M3×16 内六角沉头螺钉，保留原件。\u003c/li>\u003cli>每侧用 4 颗 M3×10 内六角圆柱头螺钉，将 4 根 M3×30 双通螺柱固定在对应脚底板 IMU 工装上。\u003c/li>\u003cli>每侧再用 4 颗 M3×10 内六角圆柱头螺钉，将脚掌连接到该侧 4 根螺柱上。两侧共用 16 颗 M3×10 和 8 根螺柱。\u003c/li>\u003cli>核对左右工装方向、连接与稳定性，再进行标定准备。\u003c/li>\u003c/ol>\u003cfigure>\u003cimg alt=\"脚底外观件拆卸螺钉位置\" src=\"assets/manual/image38.png\"/>\u003cfigcaption>脚底外观件拆卸螺钉位置\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"脚掌外观件拆下后\" src=\"assets/manual/image39.png\"/>\u003cfigcaption>脚掌外观件拆下后\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"右脚底板 IMU 工装\" src=\"assets/manual/image40.png\"/>\u003cfigcaption>右脚底板 IMU 工装\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"左脚底板 IMU 工装\" src=\"assets/manual/image41.png\"/>\u003cfigcaption>左脚底板 IMU 工装\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"双脚与 IMU 工装连接\" src=\"assets/manual/image42.png\"/>\u003cfigcaption>双脚与 IMU 工装连接\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s4-2\">4.2 标定条件\u003c/h3>\u003cp>机器人周围没有人员、线缆或障碍物妨碍关节归零。\u003c/p>\u003cp>机器人的标定工装已安装好。\u003c/p>\u003cp>地面坚硬、水平、稳定，不要在地毯、软垫或振动平台上标定。\u003c/p>\u003cp>IMU 已可靠固定，外壳和安装支架没有松动。\u003c/p>\u003cp>当前没有正常模式、调试模式或其他电机控制流程正在运行。\u003c/p>\u003cp>OTA 升级未在进行。\u003c/p>\u003cp>建议在机器人和 IMU 温度稳定后进行标定。标定期间不要触碰机器人。\u003c/p>\u003cp>开关机阶段保持滑座支撑。进入落地标定阶段前，由授权人员确认标准姿态、支撑转移方式和现场防倾倒安排。\u003c/p>\u003ch3 id=\"s4-3\">4.3 标定操作\u003c/h3>\u003col>\u003cli>手柄的G拨杆往右+B键，机器人所有关节回到零位。\u003c/li>\u003cli>将机器人放置到规定的标准落地姿态。\u003c/li>\u003cli>确认双脚或规定支撑点完全接触地面。\u003c/li>\u003cli>确认机器人没有摇晃、悬空或受到外力。\u003c/li>\u003cli>G拨杆往中+B键。\u003c/li>\u003cli>等待机器人完全静止。\u003c/li>\u003cli>手柄的G拨杆往右+B键。\u003c/li>\u003cli>等待一分钟后，标定结束。\u003c/li>\u003c/ol>\u003cp>等待时间结束后，由授权人员检查姿态及标定状态；异常时停止恢复运行。不要以经过一分钟作为唯一合格判据。\u003c/p>\u003ch3 id=\"s4-4\">4.4 恢复外观与维护\u003c/h3>\u003cp>在可靠支撑下关机，拆除标定工装，再分别使用每侧原有 4 颗 M3×16 沉头螺钉恢复脚掌外观件。复核连接和外观后再上电检查。至少每 180 天安排 IMU 标定；站姿异常时先停用并排查。\u003c/p>\u003ch2 id=\"s5\">5 配置、诊断与维护记录\u003c/h2>\u003cp>AP 配网见《用户手册》第 5.1 节。开发机配置与日志见《SDK 使用指南》第 2～3 节。系统状态、诊断和电量接口见《API 接口参考》第 3 节。\u003c/p>\u003cp>维护记录应包含本体序列号、软硬件版本、原因、受影响电机、工装、操作人员、时间及结果。标定失败、结构松动或异常摩擦未排除前，不恢复常规运行。\u003c/p>", "version": "V1.0", "date": "2026.11.17", "pdf": "../../pdf/tangpa-edu/镋钯机器人技术与维护手册-V1.0.pdf", "online": "../../../../index.html#tangpa-edu/technical-manual", "pages": 12, "bytes": 12173649}, {"id": "sdk-guide", "title": "SDK 使用指南", "summary": "发行前提、CMake、连接配置、日志、只读起步与示例", "html": "\u003ch2 id=\"s1\">1 环境与发行包\u003c/h2>\u003cp>Tangpa SDK 提供 ControlApiClient 和 SystemApiClient，分别用于控制/订阅/UWB 配置，以及诊断/状态/电量读取。采用 C++17 和 CMake。开始构建前，应取得与设备系统及架构匹配的完整 SDK 发行包，包含头文件、库文件及 CMake 包配置。\u003c/p>\u003cp>随附 SDK 资料包包含说明、示例、配置和 proto 协议定义，不能代替完整 SDK 二进制发行包。先确认完整发行包可被 find_package(tangpa_sdk_client REQUIRED) 找到。\u003c/p>\u003ch2 id=\"s2\">2 工程与构建\u003c/h2>\u003ch3 id=\"s2-1\">2.1 CMake 工程配置\u003c/h3>\n\u003cp>SDK 提供了 CMake 包配置文件，通过 \u003ccode>find_package\u003c/code> 即可引入。\u003c/p>\n\u003cp>\u003cstrong>项目目录结构：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>my_project/\n  CMakeLists.txt        # 顶层 CMake\n  main.cpp              # 源代码\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>CMakeLists.txt：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-cmake\">cmake_minimum_required(VERSION 3.8)\nproject(\"my_project\" VERSION 1.0.0 LANGUAGES CXX)\n\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\n\n# 将 SDK 根目录加入搜索路径（指向 SDK 包的顶级目录）\nlist(APPEND CMAKE_PREFIX_PATH \"/path/to/tangpa_sdk_client\")\nfind_package(tangpa_sdk_client REQUIRED)\n\nadd_executable(my_app main.cpp)\ntarget_link_libraries(my_app PRIVATE tangpa_sdk_client::chric_tangpa_sdk_module_api)\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>构建：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">cd my_project\nmkdir build &amp;&amp; cd build\ncmake ..\nmake -j$(nproc)\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>关于运行时库路径\u003c/strong>：SDK 的所有 .so 均内置 \u003ccode>$ORIGIN\u003c/code> 相对 RPATH，无需设置 \u003ccode>LD_LIBRARY_PATH\u003c/code>。将 SDK 目录整体移动到任意位置均可正常运行。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"s2-2\">2.2 就地构建（SDK 自带的 CMake 模板）\u003c/h3>\n\u003cp>SDK 包内已包含 CMake 模板项目，可直接在此基础上开发：\u003c/p>\n\u003cpre>\u003ccode class=\"language-cmake\"># 指向 SDK 自己\nlist(APPEND CMAKE_PREFIX_PATH \"${CMAKE_SOURCE_DIR}\")\nfind_package(tangpa_sdk_client REQUIRED)\n\u003c/code>\u003c/pre>\n\u003cp>就地构建时，CMake 会为二进制注入 SDK 库的绝对路径 RUNPATH。如果不需要，请在 \u003ccode>find_package\u003c/code> 之前设置：\u003c/p>\n\u003cpre>\u003ccode class=\"language-cmake\">set(CMAKE_SKIP_BUILD_RPATH ON)\n\u003c/code>\u003c/pre>\u003ch2 id=\"s3\">3 连接、配置与日志\u003c/h2>\u003cp>192.168.1.100:50051 为示例目标地址，替换为本体显示的实际 IP 和服务端口。localhost 仅适用于客户端和服务端在同一机器运行的场景。\u003c/p>\u003cp>SDK 通过 \u003ccode>config/config.yaml\u003c/code> 管理配置。\u003ccode>InterfacesClient\u003c/code> 构造时会自动加载并初始化日志系统。\u003c/p>\n\u003ch3 id=\"s3-1\">3.1 gRPC 客户端\u003c/h3>\n\u003cpre>\u003ccode class=\"language-yaml\">grpc_client:\n  connection:\n    default_target: \"192.168.1.100:50051\"\n    channel_ready_timeout_ms: 5000    # 通道就绪超时 (ms)\n  channel:\n    max_receive_mb: 100               # 最大接收消息大小 (MB)\n    max_send_mb: 100                  # 最大发送消息大小 (MB)\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s3-2\">3.2 日志\u003c/h3>\n\u003cpre>\u003ccode class=\"language-yaml\">logging:\n  log_level: 3                        # 0=FATAL, 1=ERROR, 2=WARN, 3=INFO, 4=DEBUG\n  log_dir: \"SDK-Client/logs\"          # 日志目录（相对可执行程序路径或绝对路径）\n  max_file_size_mb: 3                 # 单文件最大大小 (MB)\n  max_files_per_level: 10             # 每级别最多保留文件数\n  enable_async: true                  # true=异步写, false=同步写\n  enable_console_output: true         # true=控制台输出\n  enable_simple_output: true          # true=简洁格式, false=详细格式（含文件、行号、函数名）\n\u003c/code>\u003c/pre>\n\u003cp>日志按级别分目录输出，文件命名格式为 \u003ccode>log_&lt;pid&gt;_&lt;日期&gt;_&lt;时间&gt;_&lt;纳秒&gt;.txt\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode>SDK-Client/logs/\n  fatal/\n  error/\n  warning/\n  info/\n  debug/\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>编程方式控制（在创建任何 SDK 对象之前调用）：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-cpp\">#include \"chric/common/Log/wlog.hpp\"\n\n// 使用自定义配置文件\nWLogInitWithConfig(\"path/to/my_config.yaml\");\n\n// 或使用默认配置（DEBUG 级别，自动生成日志目录）\nWLogInit();\n\u003c/code>\u003c/pre>\u003ch2 id=\"s4\">4 只读起步示例\u003c/h2>\u003cp>先进行只读诊断，确认 Connect 成功且接口返回值为 0 后，再使用返回数据。下面示例不发送运动指令。\u003c/p>\u003cpre>\u003ccode class=\"language-cpp\">#include &lt;iostream&gt;\n#include \"chric/robot/tangpa/tangpa_system_api.h\"\n\nusing namespace humanoid_robot::sdk_client::robot;\nint main() {\n    tangpa_system_api::SystemApiClient client;\n    auto status = client.Connect(\"192.168.1.100\", 50051);\n    if (!status) {\n        std::cerr &lt;&lt; status.message() &lt;&lt; std::endl;\n        return 1;\n    }\n    tangpa_system_api::RobotStatus robot;\n    uint32_t rc = client.GetRobotStatus(robot);\n    if (rc == 0) std::cout &lt;&lt; robot.DebugString() &lt;&lt; std::endl;\n    client.Disconnect();\n    return rc == 0 ? 0 : 2;\n}\n\u003c/code>\u003c/pre>\u003cp>订阅接口返回大于 0 的订阅 ID 才表示成功；保存 ID，在回调使用完成后取消订阅，再断开客户端。连接返回 Status；业务查询通常返回 uint32_t；Disconnect 返回 void，IsConnected 返回 bool。\u003c/p>\u003ch2 id=\"s5\">5 示例与故障排查\u003c/h2>\u003cp>SDK 包内 \u003ccode>examples/\u003c/code> 目录提供了可编译运行的示例代码。\u003c/p>\n\u003cp>\u003cstrong>构建：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">cd tangpa_sdk_client\nmkdir build &amp;&amp; cd build\ncmake ..\nmake -j$(nproc)\n\u003c/code>\u003c/pre>\n\u003cp>构建完成后二进制在 \u003ccode>bin/\u003c/code> 目录下。有 data 文件的示例（如 benchmark）会输出到独立子目录，同时自动复制其 \u003ccode>data/\u003c/code> 文件夹。CMake 会自动将 \u003ccode>config/\u003c/code> 复制到构建目录，无需手动操作。\u003c/p>\n\u003cp>\u003cstrong>运行：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\"># 无 data 依赖的示例（平铺在 bin/ 下）\n./bin/CHRIC_SDKClient_test\n./bin/system_test_gui\n\n# 有 data 依赖的示例（独立子目录）\n./bin/tangpa_api_benchmark/CHRIC_SDKClient_benchmark\n./bin/control_test_gui/control_test_gui\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>示例\u003c/th>\n\u003cth>二进制\u003c/th>\n\u003cth>运行路径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>功能测试\u003c/td>\n\u003ctd>\u003ccode>CHRIC_SDKClient_test\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>./bin/CHRIC_SDKClient_test\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>性能基准\u003c/td>\n\u003ctd>\u003ccode>CHRIC_SDKClient_benchmark\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>./bin/tangpa_api_benchmark/CHRIC_SDKClient_benchmark\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>控制API交互测试\u003c/td>\n\u003ctd>\u003ccode>control_test_gui\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>./bin/control_test_gui/control_test_gui\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统API交互测试\u003c/td>\n\u003ctd>\u003ccode>system_test_gui\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>./bin/system_test_gui\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>运行前请确保已根据实际环境修改 \u003ccode>config/config.yaml\u003c/code> 中的 \u003ccode>default_target\u003c/code> 地址和端口。\u003c/p>\n\u003c/blockquote>\u003cp>运动与标定示例只在授权开发环境、机械支撑和现场监护下运行。发送函数非阻塞返回不代表动作完成；断开连接也不能作为停止运动指令。具体契约见《API 接口参考》第 1～3 节。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>问题\u003c/th>\u003cth>检查顺序\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>找不到 CMake 包\u003c/td>\u003ctd>完整发行包是否存在；CMAKE_PREFIX_PATH 是否指向正确根目录；架构和依赖是否匹配。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>连接失败\u003c/td>\u003ctd>本体 IP、服务端口、网络可达性及服务运行状态。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>无数据/订阅无回调\u003c/td>\u003ctd>返回码/订阅 ID；对应服务与数据流；网络及日志。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "version": "V1.0", "date": "2026.11.17", "pdf": "../../pdf/tangpa-edu/镋钯机器人SDK使用指南-V1.0.pdf", "online": "../../../../index.html#tangpa-edu/sdk-guide", "pages": 6, "bytes": 971034}, {"id": "api-reference", "title": "API 接口参考", "summary": "客户端签名、返回语义、错误码、订阅与协议字段", "html": "\u003ch2 id=\"s1\">1 接口约定\u003c/h2>\u003cp>本册为 Tangpa SDK C++ 客户端接口参考。命名空间保留 humanoid_robot::sdk_client::robot 及 tangpa_control_api、tangpa_system_api。连接返回 Status，发布/查询/取消订阅返回 uint32_t，订阅返回 uint64_t ID，断开返回 void，连接状态返回 bool。\u003c/p>\u003cp>请求被接受、发布函数返回和最终运动完成是不同状态。MotorCalibration 返回 0 时仍需检查 response.state；failed 和 rejected 不是成功。运动发布接口不提供动作完成保证。\u003c/p>\u003ch2 id=\"s2\">2 ControlApiClient\u003c/h2>\u003ch3 id=\"s2-1\">2.1 连接管理\u003c/h3>\n\u003cpre>\u003ccode class=\"language-cpp\">Status Connect(const std::string&amp; server_address, int port);\nStatus Connect(const std::string&amp; target);\nStatus Connect();\nvoid Disconnect();\nbool IsConnected() const;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>重载\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>Connect(address, port)\u003c/code>\u003c/td>\n\u003ctd>指定地址和端口连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Connect(target)\u003c/code>\u003c/td>\n\u003ctd>指定完整目标字符串连接（如 \u003ccode>\"192.168.0.1:50051\"\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Connect()\u003c/code>\u003c/td>\n\u003ctd>读取 \u003ccode>config/config.yaml\u003c/code> 中 \u003ccode>grpc_client.connection.default_target\u003c/code> 自动连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Disconnect()\u003c/code>\u003c/td>\n\u003ctd>断开连接\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>注意：\u003c/strong> 已连接时重复调用 \u003ccode>Connect\u003c/code> 会返回错误，需先调用 \u003ccode>Disconnect()\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"s2-2\">2.2 数据快照：GetImuData\u003c/h3>\u003cpre>\u003ccode class=\"language-cpp\">uint32_t GetImuData(Imu&amp; imu_status);\n\u003c/code>\u003c/pre>\n\u003cp>获取一次 IMU 数据快照。\u003ccode>imu_status\u003c/code> 为 sensor_msgs/Imu（\u003ca href=\"assets/sdk/data/proto/ros2/sensor_msgs/Imu.proto\">proto\u003c/a>）。网络通信超时 5 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>IMU 子系统错误，未获取到数据\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层通信错误，返回数据序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层服务端异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s2-3\">2.3 控制接口（gRPC）\u003c/h3>\n\u003ch4 id=\"s2-3-1\">2.3.1 MotorCalibration\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t MotorCalibration(const MotorCalibrationRequest&amp; request, MotorCalibrationResponse&amp; response);\n\u003c/code>\u003c/pre>\n\u003cp>对指定电机（\u003ccode>motor_id\u003c/code>）执行标定。\u003ccode>request\u003c/code> 为 \u003ccode>MotorCalibrationRequest\u003c/code>（\u003ca href=\"assets/sdk/data/proto/api_service/tangpa/proto/control.proto\">proto\u003c/a>），包含 motor_id；\u003ccode>response\u003c/code> 为 \u003ccode>MotorCalibrationResponse\u003c/code>（\u003ca href=\"assets/sdk/data/proto/api_service/tangpa/proto/control.proto\">proto\u003c/a>），含 state、motor_id、message。服务超时 5 秒，网络通信超时 30 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接口层通信错误，参数解析失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_INVALID_PARAMETER\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200006\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层通信错误，参数反序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_DESERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000004\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端错误，响应序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端超时（有/无缓存）\u003c/td>\n\u003ctd>\u003ccode>ERROR_TIMEOUT\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000001\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端，异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收到子系统 succeeded/failed/rejected\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s2-4\">2.4 控制接口（发布）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t SendMotorControl(const Cmotorcommand&amp; command);\nuint32_t SendJoyControl(const Joy&amp; command);\n\u003c/code>\u003c/pre>\n\u003cp>非阻塞，直接返回。适用高频控制场景，无需超时。\u003c/p>\n\u003ch3 id=\"s2-5\">2.5 订阅接口\u003c/h3>\n\u003cpre>\u003ccode class=\"language-cpp\">uint64_t SubscribeImu(const std::function&lt;void(const std::shared_ptr&lt;const Imu&gt;&amp;)&gt;&amp; callback);\nuint64_t SubscribeJoy(const std::function&lt;void(const std::shared_ptr&lt;const Joy&gt;&amp;)&gt;&amp; callback);\nuint64_t SubscribeJointState(const std::function&lt;void(const std::shared_ptr&lt;const JointState&gt;&amp;)&gt;&amp; callback);\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>回调参数类型\u003c/th>\n\u003cth>proto\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>Imu\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"assets/sdk/data/proto/ros2/sensor_msgs/Imu.proto\">Imu.proto\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Joy\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"assets/sdk/data/proto/ros2/sensor_msgs/Joy.proto\">Joy.proto\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>JointState\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"assets/sdk/data/proto/ros2/sensor_msgs/JointState.proto\">JointState.proto\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>&gt; 0\u003c/code>\u003c/td>\n\u003ctd>订阅 ID，用于取消订阅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003ctd>订阅失败\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t UnsubscribeImu(uint64_t subscription_id);\nuint32_t UnsubscribeJoy(uint64_t subscription_id);\nuint32_t UnsubscribeJointState(uint64_t subscription_id);\n\u003c/code>\u003c/pre>\n\u003cp>SDK 自动管理数据流：首次订阅启用服务端发布，最后取消时停止发布。订阅/取消为本地操作，无网络超时。\u003c/p>\n\u003ch3 id=\"s2-6\">2.6 UWB 配置与数据订阅\u003c/h3>\n\u003ch4 id=\"s2-6-1\">2.6.1 SetUWBConfigurator\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t SetUWBConfigurator(const UWBRequestHardware&amp; request);\n\u003c/code>\u003c/pre>\n\u003cp>配置 UWB 硬件参数。\u003ccode>request\u003c/code> 为 \u003ccode>UWBRequestHardware\u003c/code>（\u003ca href=\"assets/sdk/data/proto/api_service/tangpa/proto/control.proto\">proto\u003c/a>），含 target_device、target_role、baud。服务超时 5 秒，网络通信超时 30 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接口层通信错误，参数解析失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_INVALID_PARAMETER\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200006\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层通信错误，参数反序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_DESERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000004\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子系统错误，configurator client 超时\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>configurator 子系统错误，参数设置失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>trigger client 子系统错误，超时\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子系统错误，trigger 执行失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端，异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s2-6-2\">2.6.2 SetUWBConfigManager\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t SetUWBConfigManager(const UWBRequestConfig&amp; request);\n\u003c/code>\u003c/pre>\n\u003cp>配置 UWB 跟随参数。\u003ccode>request\u003c/code> 为 \u003ccode>UWBRequestConfig\u003c/code>（\u003ca href=\"assets/sdk/data/proto/api_service/tangpa/proto/control.proto\">proto\u003c/a>），含 target_role、target_distance。服务超时 5 秒，网络通信超时 30 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接口层通信错误，参数解析失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_INVALID_PARAMETER\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200006\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层通信错误，参数反序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_DESERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000004\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子系统错误，config client 超时\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子系统错误，config 参数设置失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端，异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s2-6-3\">2.6.3 SubscribeUWBData\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint64_t SubscribeUWBData(const std::function&lt;void(const std::shared_ptr&lt;const LinktrackNodeframe7&gt;&amp;)&gt;&amp; callback);\n\u003c/code>\u003c/pre>\n\u003cp>订阅 UWB 定位数据。\u003ccode>callback\u003c/code> 参数为 \u003ccode>LinktrackNodeframe7\u003c/code>（\u003ca href=\"assets/sdk/data/proto/tangpa_ros2_interfaces/control/nlink_parser/LinktrackNodeframe7.proto\">proto\u003c/a>），含 role、id、nodes 等字段。通过 zenoh 频道 \u003ccode>zenoh/nlink_linktrack_nodeframe7\u003c/code> 接收数据。SDK 自动管理数据流：首次订阅启用服务端发布，最后取消时停止发布。无网络超时。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>&gt; 0\u003c/code>\u003c/td>\n\u003ctd>订阅 ID，用于取消订阅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003ctd>订阅失败\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s2-6-4\">2.6.4 UnsubscribeUWBData\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t UnsubscribeUWBData(uint64_t subscription_id);\n\u003c/code>\u003c/pre>\n\u003cp>取消 UWB 定位数据订阅。本地操作，无网络超时。\u003c/p>\u003ch2 id=\"s3\">3 SystemApiClient\u003c/h2>\u003ch3 id=\"s3-1\">3.1 连接管理\u003c/h3>\n\u003cpre>\u003ccode class=\"language-cpp\">Status Connect(const std::string&amp; server_address, int port);\nStatus Connect(const std::string&amp; target);\nStatus Connect();\nvoid Disconnect();\nbool IsConnected() const;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>重载\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>Connect(address, port)\u003c/code>\u003c/td>\n\u003ctd>指定地址和端口连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Connect(target)\u003c/code>\u003c/td>\n\u003ctd>指定完整目标字符串连接（如 \u003ccode>\"192.168.0.1:50051\"\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Connect()\u003c/code>\u003c/td>\n\u003ctd>读取 \u003ccode>config/config.yaml\u003c/code> 中 \u003ccode>grpc_client.connection.default_target\u003c/code> 自动连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Disconnect()\u003c/code>\u003c/td>\n\u003ctd>断开连接\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>注意：\u003c/strong> 已连接时重复调用 \u003ccode>Connect\u003c/code> 会返回错误，需先调用 \u003ccode>Disconnect()\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"s3-2\">3.2 数据获取\u003c/h3>\n\u003ch4 id=\"s3-2-1\">3.2.1 GetDiagnosticData\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t GetDiagnosticData(DiagnosticMessage&amp; diagnostic_message);\n\u003c/code>\u003c/pre>\n\u003cp>获取诊断数据。\u003ccode>diagnostic_message\u003c/code> 为 \u003ccode>DiagnosticMessage\u003c/code>（\u003ca href=\"assets/sdk/data/proto/api_service/tangpa/proto/system.proto\">proto\u003c/a>），含 messages（DiagnosticArray）和 result（int32）。网络通信超时 5 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>子系统错误，未获取到数据\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端错误，序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s3-2-2\">3.2.2 GetRobotStatus\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t GetRobotStatus(RobotStatus&amp; robot_status);\n\u003c/code>\u003c/pre>\n\u003cp>获取机器人状态。\u003ccode>robot_status\u003c/code> 为 \u003ccode>RobotStatus\u003c/code>（\u003ca href=\"assets/sdk/data/proto/api_service/tangpa/proto/system.proto\">proto\u003c/a>），含 state_id、state_desc、battery、error_codes。网络通信超时 5 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>子系统错误，未获取到数据\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端错误，序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端异常（含 JSON 解析异常）\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s3-2-3\">3.2.3 GetBatteryPercentage\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t GetBatteryPercentage(BatteryPercentage&amp; battery_percentage);\n\u003c/code>\u003c/pre>\n\u003cp>获取电池电量百分比。\u003ccode>battery_percentage\u003c/code> 为 \u003ccode>BatteryPercentage\u003c/code>（\u003ca href=\"assets/sdk/data/proto/api_service/tangpa/proto/system.proto\">proto\u003c/a>），含 info（电池信息）。网络通信超时 5 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>子系统错误，未获取到数据\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端错误，序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c
