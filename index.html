td>视频信令\u003c/td>\n\u003ctd>ws://\u003crobot_host>:8443\u003c/robot_host>\u003c/td>\n\u003ctd>receive_video.py 使用的 webrtcsink 信令；端口号不表示使用 TLS。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>音频与测距\u003c/td>\n\u003ctd>ALSA、I2C-3\u003c/td>\n\u003ctd>需要匹配的板端设备、驱动和访问权限。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Web 示例访问的是 8000 端口的 HTTP 服务。资料中另列的 9872 端口不作为这些 HTTP 示例的默认值，也不能据此推定其传输格式、认证或完整协议。接入其他端口前先确认对应服务配置。\u003c/p>\n\u003ch3 id=\"s1-2\">1.2 环境与结果判断\u003c/h3>\n\u003cp>状态查询、运动和技能脚本使用 Python 3 标准库；交互运动模式还使用 termios、tty 与 select，应在支持终端控制的环境运行。视频脚本使用 aiortc、av、opencv-python 和 websockets；代码调用 aiortc 私有属性并包含针对 aiortc 1.10.1 的候选解析说明，需使用与该实现兼容的运行环境。ToF 示例需要 vl53l5cx 驱动模块和 I2C 访问权限。\u003c/p>\n\u003cp>先使用只读状态查询确认目标 IP、Web 服务和设备状态，再发送运动或技能请求。网络请求超时不代表机器人停止；HTTP 请求成功不等于设备已停稳或技能完成。需要停车时发送停止请求，并观察设备。异常处理见《用户手册》第 1.4 节。\u003c/p>\n\u003ch2 id=\"s2\">2 状态查询与遥测\u003c/h2>\n\u003ch3 id=\"s2-1\">2.1 GET 接口\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>接口\u003c/th>\n\u003cth>示例读取的主要内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>/api/version\u003c/td>\n\u003ctd>web 名称、版本、构建时间与 Python；dinosaur 主程序版本、revision、robotd、current 和 source。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/info\u003c/td>\n\u003ctd>dinosaur_name、IP、hostname、Wi-Fi MAC、手柄 MAC/名称、camera.port。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/status\u003c/td>\n\u003ctd>running、vx、vyaw、remaining、feed 连接和错误、CSV 开启状态与当前文件信息。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/health\u003c/td>\n\u003ctd>healthy、电池 volts/percent、电机 max_c/mean_c/hottest、CPU 温度、IMU ready、内存与系统负载。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/telemetry\u003c/td>\n\u003ctd>最新 IMU 姿态与舵机状态；roll_deg/pitch_deg/yaw_deg 单位为度，angle_deg 为度，temp_c 为摄氏度，volt_v 为伏。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/api/subscribe?since=N\u003c/td>\n\u003ctd>seq、connected/error 与增量 items；逐帧显示 t、policy、applied 和 targets5。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>这些内容是 Web 遥控台的响应字段，与 App SDK 的 RobotStatus 不同，不应将 /api/status 的结构直接当作 getStatus() 返回值。无遥测首帧时，示例提示等待 robot.subscribe 数据；不能把空帧当作全零或正常状态。\u003c/p>\n\u003ch3 id=\"s2-2\">2.2 查询步骤\u003c/h3>\n\u003col>\n\u003cli>在机器人本机运行时可使用脚本默认的 127.0.0.1:8000；远程查询时设置 --host 为机器人实际 IP。\u003c/li>\n\u003cli>先查询 version 和 info，确认版本与设备身份，再查询 status、health 和 telemetry。\u003c/li>\n\u003cli>增量订阅从 since=0 开始，依据返回 seq 推进游标；示例每次轮询间隔 0.3 s，--secs 控制本地轮询总时长。\u003c/li>\n\u003cli>请求失败时检查服务地址和错误内容，不用反复发送运动请求来测试连通性。\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode class=\"language-sh\">python3 robot_api_get_data.py --host 192.168.1.100 --mode info\npython3 robot_api_get_data.py --host 192.168.1.100 --mode subscribe --secs 10\n\u003c/code>\u003c/pre>\n\u003cp>192.168.1.100 是示例地址。完整脚本见第 9.2 节。\u003c/p>\n\u003ch2 id=\"s3\">3 Web 运动与技能接口\u003c/h2>\n\u003ch3 id=\"s3-1\">3.1 运动与停车\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>请求\u003c/th>\n\u003cth>语义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>POST /api/move\u003c/td>\n\u003ctd>{\"vx\": number, \"vyaw\": number, \"secs\": number}\u003c/td>\n\u003ctd>vx 单位 m/s，vyaw 单位 rad/s，secs 单位 s；示例正 vx 前进，正 vyaw 左转。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST /api/stop\u003c/td>\n\u003ctd>{}\u003c/td>\n\u003ctd>请求停止 Web 运动；检查响应与实际设备状态。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST /api/skill\u003c/td>\n\u003ctd>{\"skill\": string}\u003c/td>\n\u003ctd>Web 服务将技能名透传到 robot.do。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Web 运动示例说明：服务端 Mover 以 10 Hz 续发 robot.move，到 secs 结束时补发全零速度。该逻辑属于此 Web 服务，不是 JS SDK 的行为；JS SDK move() 不设置持续时间，也不自动续发。不要向 JS SDK move() 传入 Web 层的 secs 或 duration_s。Web 响应和 SDK 校验后的 RPC 结果也不是同一种封装。\u003c/p>\n\u003cp>robot_api_move.py 的默认线速度为 0.2 m/s、角速度为 0.5 rad/s、时长为 1.0 s。这些是示例默认值，不是设备限值。操作时使用当前设备允许的范围，并保持足够空间。\u003c/p>\n\u003cp>交互模式支持 W/A/S/D、空格停止、Q 或 Ctrl+C 退出；方向键转义序列会被忽略。退出时脚本尝试 POST /api/stop；如果网络失败，该尝试不构成物理停稳保证。完整脚本见第 9.3 节。\u003c/p>\n\u003ch3 id=\"s3-2\">3.2 技能结果\u003c/h3>\n\u003cp>常用技能名为 sit_toggle、ground_pick、kick_right、kick_left 和 roll_over。脚本的 list 只显示内置名称，不查询设备能力；其他名称会透传，是否可用由设备配置决定。\u003c/p>\n\u003cp>Web 成功示例结构包含 ok、message 和 result；失败结构包含 ok=false、error 和 result。示例将 ok=true 显示为请求已接受，不凭该字段断言动作完成。不要将 result 与《应用开发与 API 参考》第 3.3 节的 SkillResult 无条件等同；需按实际返回结构判断受理与完成状态。完整脚本见第 9.4 节。\u003c/p>\n\u003ch2 id=\"s4\">4 视频、音频与 ToF\u003c/h2>\n\u003ch3 id=\"s4-1\">4.1 WebRTC 视频\u003c/h3>\n\u003cp>receive_video.py 通过 ws://\u003crobot_host>:8443 与 webrtcsink 信令服务建立会话，可预览、写 MP4 或保存 JPEG 帧序列。预览窗口按 Q 或 Esc 退出，也可使用 --duration 指定秒数。此脚本与 App SDK 的 robotAudioTrack 或 App Host 连接流程不同。\u003c/robot_host>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">python3 -m pip install aiortc av opencv-python websockets\npython3 receive_video.py 192.168.1.100 --duration 10\npython3 receive_video.py 192.168.1.100 --output video.mp4 --duration 10\npython3 receive_video.py 192.168.1.100 --save-frames ./frames/ --duration 10\n\u003c/code>\u003c/pre>\n\u003cp>安装依赖本身不代表已满足设备服务的兼容条件；需按第 1.2 节匹配视频实现。预览要求图形显示环境；没有显示环境时使用文件输出。完整视频代码见第 9.5 节。\u003c/p>\n\u003ch3 id=\"s4-2\">4.2 板端音频\u003c/h3>\n\u003cp>麦克风示例通过 aic3104 的 PGA Capture Volume 设置录音增益，并从 hw:1,0 以 cd 格式录制 10 s。扬声器示例调整 Line Playback Volume 后播放同一文件。aic3104、hw:1,0 和控制项均是指定板端配置，不是所有 Linux 设备的通用标识。\u003c/p>\n\u003cp>录音前确认采集设备匹配，播放前确认输出设备匹配并选择适当音量。ALSA 命令运行在机器人板端；它们不替代 JS SDK 的 24 kHz 单声道 Float32 PCM 流式接口。完整命令见第 9.6～9.7 节。\u003c/p>\n\u003ch3 id=\"s4-3\">4.3 ToF 测距\u003c/h3>\n\u003cp>示例使用 I2C_BUS=3 的 VL53L5CX，地址 0x29，分辨率 8×8，共 64 个区域；设置测距频率 15 Hz，以 0.05 s 轮询数据就绪状态。轮询周期不等于传感器实际出帧频率。\u003c/p>\n\u003cp>distance_mm 按行优先排列，单位 mm；示例仅接受 target_status 为 5 或 9 且距离大于 0 的数据。无效单元显示 ---，颜色按当前有效距离范围动态映射，红近蓝远。颜色反映相对范围，不是固定距离阈值。退出时停止测距。完整脚本见第 9.8 节。\u003c/p>\n\u003ch2 id=\"s5\">5 配置、模型与设备命名\u003c/h2>\n\u003ch3 id=\"s5-1\">5.1 配置位置与模式\u003c/h3>\n\u003cp>板端配置文件为 /etc/robot/robot.toml，用于技能与按键关系等配置。模式可出现 walk 或 roller；模式名称不表示当前设备已交付相应运动能力。不要仅因存在 roller.onnx 就将轮滑列为可用功能。修改前保留当前配置，并使用与固件匹配的字段结构，不推测缺失的技能持续时间或速度配置键。\u003c/p>\n\u003ch3 id=\"s5-2\">5.2 ONNX 模型路径\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用途\u003c/th>\n\u003cth>路径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>行走\u003c/td>\n\u003ctd>/home/radxa/onnx/walk.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>轮滑\u003c/td>\n\u003ctd>/home/radxa/onnx/roller.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>坐下／起立\u003c/td>\n\u003ctd>/home/radxa/onnx/sitstand.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恢复\u003c/td>\n\u003ctd>/home/radxa/onnx/standup.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地面拾取\u003c/td>\n\u003ctd>/home/radxa/onnx/groundpick.onnx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>翻滚\u003c/td>\n\u003ctd>/home/radxa/onnx/roulade.onnx\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>以下命令用于管理命名策略。\u003cname> 和 \u003cpath.onnx> 为占位参数，应替换为匹配设备的策略名与模型文件路径；命令的存在不保证任意模型与控制器兼容。\u003c/path.onnx>\u003c/name>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">robotctl policy add &lt;name&gt; &lt;path.onnx&gt;\nrobotctl policy remove &lt;name&gt;\nrobotctl policy list\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s5-3\">5.3 设置与显示设备名称\u003c/h3>\n\u003cpre>\u003ccode class=\"language-sh\">sudo robotctl system set-name &lt;新名称&gt;\n\u003c/code>\u003c/pre>\n\u003cp>显示名称按以下优先级确定：环境变量 DINOSAUR_NAME；robotctl system info 的 name 字段（如 dinosaur-7d2b）；socket.gethostname()。设置名称后若显示未变化，先检查高优先级环境变量。上述设备广播与程序内部标识保持实际值，不因产品展示名为 RayDino（恐龙）而改写为新的接口名。\u003c/p>\n\u003ch2 id=\"s6\">6 手柄配对与舵机标定\u003c/h2>\n\u003ch3 id=\"s6-1\">6.1 板端手柄配对\u003c/h3>\n\u003cp>以下为维护人员使用的板端流程：先遗忘配对并移除旧连接，再进入配对。\u003cmac> 是目标手柄的真实蓝牙地址，不应直接照抄或替换为其他设备地址。执行前结束遥控操作，确保机器人不会因失去控制端而造成危险。\u003c/mac>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">sudo -n robotctl pad forget\nbluetoothctl disconnect &lt;MAC&gt;\nbluetoothctl remove &lt;MAC&gt;\nsudo -n robotctl pad pair\n\u003c/code>\u003c/pre>\n\u003cp>sudo -n 不交互询问密码，权限不足时会直接失败。进入配对后，还需要按实际手柄型号进入配对模式并确认连接；这些命令不代表自动完成全部物理配对步骤。普通用户的启动和已配对连接流程见《用户手册》第 3 章。\u003c/p>\n\u003ch3 id=\"s6-2\">6.2 标定操作与关节标识\u003c/h3>\n\u003cp>标定会修改后续运动所依赖的零位。仅由熟悉机械零位和该版本标定流程的维护人员，在符合标定姿态要求时执行，不将它用作日常启动或常规故障恢复步骤。标定完成后先确认零位和关节运动方向，再恢复运动控制。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">sudo robotctl configure servo zero\nsudo robotctl configure servo zero &lt;name&gt;\n\u003c/code>\u003c/pre>\n\u003cp>第一条为全标定，第二条为单关节标定。可用名称如下；此列表用于识别 name，不定义控制数组顺序。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">left_hip_yaw left_hip_roll left_hip_pitch left_knee left_ankle\nneck_pitch head_pitch head_yaw head_roll mouth\nright_hip_yaw right_hip_roll right_hip_pitch right_knee right_ankle\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s7\">7 主程序离线升级\u003c/h2>\n\u003ch3 id=\"s7-1\">7.1 升级前提\u003c/h3>\n\u003cp>使用由对应发布流程制作、与设备兼容的离线发布包；包内需包含唯一版本的 \u003cversion>.manifest.json 和 .tar.zst 产物。脚本需要 root 权限。结束动作并保持供电稳定后再升级；升级会切换服务，不在运行任务中执行。\u003c/version>\u003c/p>\n\u003cp>默认解包位置为调用用户主目录下的 duck-sideload/release。updaterd.service 使用 PrivateTmp=yes，/tmp 与 /var/tmp 不适合放置需由 updaterd 读取的发布目录。--dir 必须是允许的绝对路径；脚本会替换该路径下 release 子目录的内容，应使用专门目录。\u003c/p>\n\u003ch3 id=\"s7-2\">7.2 普通升级与检查\u003c/h3>\n\u003cpre>\u003ccode class=\"language-sh\">sudo sh offline-deploy.sh &lt;release.tar.gz&gt; --dry-run\nsudo sh offline-deploy.sh &lt;release.tar.gz&gt;\nsudo robotctl update status\nsudo robotctl update log\nsudo robotctl health\n\u003c/code>\u003c/pre>\n\u003cp>普通路径调用 robotctl update apply daemon --from \u003crelease目录> --version &lt;版本&gt;，执行校验与健康检查，失败按更新器的回退机制处理。--dry-run 用于预检查，不执行版本切换；仍会解包到 release 目录。脚本最后的 current 链接和命令退出码之外，还应检查 update status、日志及实际运行服务的版本。脚本提示 updaterd 与 btd 在回复后约 5 s 重启，健康检查可用于确认各服务实际版本。\u003c/release目录>\u003c/p>\n\u003ch3 id=\"s7-3\">7.3 旧更新器引导模式\u003c/h3>\n\u003cp>--bootstrap 专用于已安装 updaterd 但版本过旧、不支持 apply --from 的板卡。它停止 robotd，使用 updaterd install --from \u003crelease目录> --force，随后重启 updaterd 和 robotd。此路径关闭正常 on_apply 与健康门控，且不提供普通升级的自动回退；不要将其作为升级失败后的通用重试选项。板卡完全没有安装环境时，需要配套安装流程或出厂镜像，本脚本不完成首次系统安装。\u003c/release目录>\u003c/p>\n\u003cp>完整升级脚本见第 9.1 节。出现错误时先确认 installed updaterd / robotctl 的接口版本与日志，再决定是否适用引导模式。\u003c/p>\n\u003ch2 id=\"s8\">8 示例文件与调用边界\u003c/h2>\n\u003cp>本册第 9 章完整列出示例代码，在线文档可下载同名文件。脚本在各自列明的本机、Web 服务或媒体环境运行，不会因为打开文档而执行。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>运行位置 / 用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>offline-deploy.sh\u003c/td>\n\u003ctd>机器人板端；离线升级。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>robot_api_get_data.py\u003c/td>\n\u003ctd>可访问 Web 遥控台的 Python 环境；只读查询。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>robot_api_move.py\u003c/td>\n\u003ctd>可访问 Web 遥控台的终端；运动与停车。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>robot_api_skill.py\u003c/td>\n\u003ctd>可访问 Web 遥控台的 Python 环境；技能请求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>receive_video.py\u003c/td>\n\u003ctd>具有匹配依赖的接收端；WebRTC 视频。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>microphone-test.sh / speaker-test.sh\u003c/td>\n\u003ctd>机器人板端；录音与播放。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tof_matrix.py\u003c/td>\n\u003ctd>机器人板端；I2C ToF 测距。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>App 的应用状态、音频发送和离场清理仍使用《应用开发与 API 参考》第 4～6 章的客户端接口。维护命令不应直接搬入应用请求白名单。运动参数、认证和服务访问范围按设备实际部署配置使用。\u003c/p>\n\u003ch2 id=\"s9\">9 完整示例代码\u003c/h2>\n\u003ch3 id=\"s9-1\">9.1 offline-deploy.sh\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/offline-deploy.sh\">下载 offline-deploy.sh\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">#!/bin/sh\n# Install a release from a tarball on a board with no network.\n#\n#   sudo sh offline-deploy.sh duck-offline-&lt;version&gt;.tar.gz\n#   sudo sh offline-deploy.sh /media/usb/release.tar.gz --bootstrap\n#\n# The tarball is what `scripts/offline-package.sh` makes: a release directory. This unpacks it\n# somewhere `updaterd` can read and applies it, which means every check a download gets —\n# signature, hash, compatibility, disk space, the atomic swap, the health gate, auto-rollback.\n# `--from` changes where the bytes come from and nothing else.\n#\n# **Not `/tmp`, and not `/var/tmp`.** `updaterd.service` sets `PrivateTmp=yes`, so the daemon has\n# its own copies of both; a release unpacked there is not the one it reads, and the failure is a\n# preflight error against a directory whose `ls` lists the file it says is missing. The default is\n# `~/duck-sideload` in the *invoking* user's home — outside that namespace, and needing no root\n# to write.\n#\n# `--bootstrap` is for a board whose installed `updaterd` predates `apply --from` and cannot be\n# asked to use it. It runs `updaterd install --from`, which forces `on_apply` and the health gate\n# off, so it stops `robotd` first and restarts it after. One install, no auto-rollback; every\n# later deploy is the ordinary path.\nset -eu\ndie()  { printf '\\033[31merror:\\033[0m %s\\n' \"$*\" &gt;&amp;2; exit 1; }\nTAR=\"\"\nDIR=\"\"\nBOOTSTRAP=no\nDRY_RUN=no\nwhile [ $# -gt 0 ]; do\n    case \"$1\" in\n        --dir) [ $# -ge 2 ] || die \"--dir needs a directory\" ; DIR=\"$2\" ; shift ;;\n        --bootstrap) BOOTSTRAP=yes ;;\n        --dry-run) DRY_RUN=yes ;;\n        -h|--help) sed -n '2,12p' \"$0\" | sed 's/^# \\{0,1\\}//'; exit 0 ;;\n        -*) die \"unknown argument: $1  (try --help)\" ;;\n        *) [ -z \"$TAR\" ] || die \"one tarball at a time: $TAR is already named\"\n           TAR=\"$1\" ;;\n    esac\n    shift\ndone\n[ -n \"$TAR\" ] || die \"no tarball named — offline-deploy.sh &lt;release.tar.gz&gt;\"\n[ -f \"$TAR\" ] || die \"no such file: $TAR\"\n[ \"$(id -u)\" -eq 0 ] || die \"run this as root: sudo sh offline-deploy.sh $TAR\"\n# The invoking user's home, so a deploy as `sudo sh` does not unpack into /root and then puzzle\n# whoever looks for it. SUDO_USER is unset when this is run from a root shell, which is fine.\nif [ -z \"$DIR\" ]; then\n    home=\"\"\n    if [ -n \"${SUDO_USER:-}\" ] &amp;&amp; command -v getent &gt;/dev/null 2&gt;&amp;1; then\n        home=\"$(getent passwd \"$SUDO_USER\" | cut -d: -f6)\" || home=\"\"\n    fi\n    DIR=\"${home:-$HOME}/duck-sideload\"\nfi\ncase \"$DIR\" in\n    /) die \"refusing to use / as the sideload directory\" ;;\n    /tmp|/tmp/*|/var/tmp|/var/tmp/*)\n        die \"$DIR is invisible to updaterd: the unit sets PrivateTmp=yes, so /tmp and /var/tmp \\\nare its own. Anywhere else works — the default, ~/duck-sideload, does.\" ;;\n    /*) ;;\n    *) die \"--dir must be an absolute path, got $DIR\" ;;\nesac\nRELEASE=\"$DIR/release\"\n# A tarball is data off a USB stick, so its member names are not trusted: an absolute path or a\n# `..` would write outside $RELEASE.\nif tar -tzf \"$TAR\" | grep -Eq '(^/|(^|/)\\.\\.(/|$))'; then\n    die \"$TAR holds a member with an absolute path or .., which is not a release\"\nfi\necho \"==&gt; unpacking $(basename \"$TAR\") into $RELEASE\"\n# The whole directory is replaced rather than added to, so a second deploy does not leave two\n# versions where something has to pick one. `$RELEASE` is a directory of this script's own making,\n# which is why this is not `rm -rf \"$DIR\"`.\nrm -rf \"$RELEASE\"\nmkdir -p \"$RELEASE\"\n# `--no-same-owner` because the uids in the tarball are the *packaging* host's, which mean nothing\n# here; everything under a release is read by updaterd, which runs as root.\ntar --no-same-owner -xzf \"$TAR\" -C \"$RELEASE\"\nVERSION=\"\"\nothers=\"\"\nfor f in \"$RELEASE\"/*.manifest.json; do\n    [ -f \"$f\" ] || continue\n    # The unversioned `manifest.json` a published release serves is not a version directory entry.\n    case \"${f##*/}\" in manifest.json) continue ;; esac\n    v=\"${f##*/}\"\n    v=\"${v%.manifest.json}\"\n    if [ -z \"$VERSION\" ]; then\n        VERSION=\"$v\"\n    else\n        others=\"$others $v\"\n    fi\ndone\n[ -n \"$VERSION\" ] || die \"no &lt;version&gt;.manifest.json in $TAR — that is not a release directory\"\n# One release per directory, so `--from` cannot pick a version other than the one this deploy was\n# asked for. A tarball of two dists is a packaging mistake, not something to choose from.\n[ -z \"$others\" ] || die \"$TAR holds more than one release: $VERSION$others — pack one dist\"\nartifact=no\nfor f in \"$RELEASE\"/*.tar.zst; do\n    [ -f \"$f\" ] || continue\n    artifact=yes\n    break\ndone\n[ \"$artifact\" = yes ] || die \"no .tar.zst artifact in $TAR — that is not a release directory\"\nROBOTCTL=/usr/local/bin/robotctl\n[ -x \"$ROBOTCTL\" ] || ROBOTCTL=/opt/robot/daemon/current/bin/robotctl\nUPDATERD=/opt/robot/daemon/current/bin/updaterd\nif [ \"$BOOTSTRAP\" = yes ]; then\n    [ -x \"$UPDATERD\" ] || die \"no $UPDATERD, so there is no release to bootstrap from. A board \\\nwith nothing installed needs scripts/install.sh once, over a network, or a factory image.\"\n    if [ \"$DRY_RUN\" = yes ]; then\n        echo \"==&gt; would stop robotd, then:\"\n        echo \"    $UPDATERD install --from $RELEASE --force\"\n        echo \"    systemctl restart updaterd; systemctl start robotd\"\n        exit 0\n    fi\n    echo \"==&gt; installing daemon $VERSION, ungated (--bootstrap)\"\n    # `updaterd install --force` refuses while `robotd` answers, because the objection is about a\n    # *working* robot losing its safety net.\n    systemctl stop robotd\n    \"$UPDATERD\" install --from \"$RELEASE\" --force\n    # Never restarted during an update — it is the process performing it — so the resident daemon\n    # would otherwise keep running the old binary, which is the one that cannot do `--from`.\n    echo \"==&gt; restarting updaterd and robotd\"\n    systemctl restart updaterd\n    systemctl start robotd\nelse\n    [ -x \"$ROBOTCTL\" ] || die \"no robotctl on this board, so there is no release to update. A \\\nboard with nothing installed needs scripts/install.sh once, over a network — or --bootstrap if \\\nthe only problem is an installed updaterd too old to take --from.\"\n    if [ \"$DRY_RUN\" = yes ]; then\n        echo \"==&gt; would apply (fetch, verify, compatibility, space checks; no swap):\"\n        echo \"    $ROBOTCTL update apply daemon --from $RELEASE --version $VERSION --dry-run\"\n        \"$ROBOTCTL\" update apply daemon --from \"$RELEASE\" --version \"$VERSION\" --dry-run\n        exit 0\n    fi\n    echo \"==&gt; applying daemon $VERSION\"\n    status=0\n    \"$ROBOTCTL\" update apply daemon --from \"$RELEASE\" --version \"$VERSION\" || status=$?\n    if [ \"$status\" -ne 0 ]; then\n        # Exit 2 is bad usage, and on a board that has never had a build with `--from` that is\n        # how the API mismatch surfaces: the daemon refuses the call rather than ignoring the\n        # option and installing from its configured source.\n        if [ \"$status\" -eq 2 ]; then\n            echo \"If robotctl and updaterd disagree about the API version, this board's installed\" &gt;&amp;2\n            echo \"release predates 'apply --from'. Deliver it once, ungated:\" &gt;&amp;2\n            echo \"    sudo sh $0 $TAR --bootstrap\" &gt;&amp;2\n        else\n            echo \"The board keeps running what it was on — a failed apply rolls back.\" &gt;&amp;2\n            echo \"    sudo robotctl update status   # and: sudo robotctl update log\" &gt;&amp;2\n        fi\n        exit \"$status\"\n    fi\nfi\necho \"==&gt; current -&gt; $(readlink -f /opt/robot/daemon/current 2&gt;/dev/null || echo '?')\"\necho \"    updaterd and btd restart five seconds after the apply replies; 'robotctl health' prints\"\necho \"    the release each daemon is actually running from.\"\necho \"    The unpacked release stays in $RELEASE, so re-applying needs no tarball:\"\necho \"    sudo robotctl update apply daemon --from $RELEASE\"\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-2\">9.2 robot_api_get_data.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/robot_api_get_data.py\">下载 robot_api_get_data.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nrobot_api_get_data.py —— 从机器人 Web 遥控台拉数据的示例\n它演示这些 GET 接口：\n    /api/version             Web 台版本 + dinosaur 主程序版本\n    /api/info                设备信息（名称/IP/WiFi/手柄/摄像头端口）\n    /api/status              当前运动状态 + 订阅连接 + CSV 状态\n    /api/health              电池电压/电量、电机最高温度、CPU 温度、IMU ready、系统负载\n    /api/telemetry           最新一帧的 IMU 姿态和每关节温度/电压/在线\n    /api/subscribe?since=N   驱动状态增量流（轮询 since=seq，拿 seq 之后的新帧）\n用法:\n    python3 robot_api_get_data.py --mode info\n    python3 robot_api_get_data.py --mode subscribe --secs 10\n    python3 robot_api_get_data.py --mode all --host 192.168.1.100\n\"\"\"\nimport argparse\nimport json\nimport sys\nimport time\nimport urllib.error\nimport urllib.request\ndef http_get_json(url, timeout=10.0):\n    req = urllib.request.Request(url, headers={\"Accept\": \"application/json\"})\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as resp:\n            return json.loads(resp.read().decode(\"utf-8\"))\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(\"utf-8\", \"replace\")\n        raise RuntimeError(f\"HTTP {e.code}: {body}\") from e\n    except urllib.error.URLError as e:\n        raise RuntimeError(f\"连接失败: {e.reason}\") from e\n# ---------------------------------------------------------------------------\n# 各模式\n# ---------------------------------------------------------------------------\ndef mode_version(base):\n    v = http_get_json(base + \"/api/version\")\n    w = v.get(\"web\") or {}\n    d = v.get(\"dinosaur\") or {}\n    print(\"=== /api/version ===\")\n    print(f\"Web       : {w.get('name')} v{w.get('version')}  \"\n          f\"编译于 {w.get('build_time')}  (python {w.get('python')})\")\n    print(f\"dinosaur  : {d.get('version')}\"\n          + (f\" (rev {d.get('revision')})\" if d.get(\"revision\") else \"\"))\n    if d.get(\"robotd\"):\n        print(f\"  robotd  : {d.get('robotd')}\")\n    if d.get(\"current\"):\n        print(f\"  release : {d.get('current')}\")\n    print(f\"  来源    : {d.get('source')}\")\ndef mode_info(base):\n    info = http_get_json(base + \"/api/info\")\n    print(\"=== /api/info ===\")\n    print(f\"恐龙名    : {info.get('dinosaur_name')}\")\n    ip = info.get(\"ip\") or {}\n    print(f\"IP        : {ip.get('primary')}  (all={ip.get('all')})\")\n    print(f\"hostname  : {ip.get('hostname')}\")\n    wifi = info.get(\"wifi\") or {}\n    print(f\"WiFi MAC  : {wifi.get('mac')}  ({wifi.get('iface')})\")\n    pad = info.get(\"pad\") or {}\n    print(f\"手柄 MAC  : {pad.get('mac')}  ({pad.get('name')})\")\n    cam = info.get(\"camera\") or {}\n    print(f\"摄像头端口: {cam.get('port')}\")\ndef mode_status(base):\n    s = http_get_json(base + \"/api/status\")\n    print(\"=== /api/status ===\")\n    print(f\"运行中    : {s.get('running')}\")\n    print(f\"vx / vyaw : {s.get('vx')} / {s.get('vyaw')}\")\n    print(f\"剩余      : {s.get('remaining')} s\")\n    f = s.get(\"feed\") or {}\n    print(f\"订阅连接  : {f.get('connected')}  err={f.get('error')!r}\")\n    c = s.get(\"csv\") or {}\n    print(f\"CSV 开启  : {c.get('enabled')}\")\n    cur = c.get(\"current\")\n    if cur:\n        print(f\"CSV 文件  : {cur.get('name')}  行数={cur.get('rows')}  大小={cur.get('size')}\")\ndef mode_health(base):\n    h = http_get_json(base + \"/api/health\")\n    print(\"=== /api/health ===\")\n    print(f\"healthy  : {h.get('healthy')}\")\n    b = h.get(\"battery\") or {}\n    print(f\"电池     : {b.get('volts')} V  {b.get('percent')}%\")\n    m = h.get(\"motors\") or {}\n    print(f\"电机温度 : max={m.get('max_c')} °C  mean={m.get('mean_c')}  hottest={m.get('hottest')}\")\n    print(f\"CPU 温度 : {h.get('cpu_temp_c')} °C\")\n    imu = h.get(\"imu\") or {}\n    print(f\"IMU      : ready={imu.get('ready')}  stale={imu.get('consecutive_stale_blocks')}\")\n    sys_ = h.get(\"system\") or {}\n    print(f\"内存     : {sys_.get('mem_used_kb')}/{sys_.get('mem_total_kb')} kB \"\n          f\"({sys_.get('mem_pct')}%)\")\n    print(f\"负载     : 1m={sys_.get('load_1m')}  5m={sys_.get('load_5m')}  \"\n          f\"15m={sys_.get('load_15m')}\")\n    if h.get(\"error\"):\n        print(f\"error    : {h.get('error')}\")\ndef mode_telemetry(base):\n    t = http_get_json(base + \"/api/telemetry\")\n    print(\"=== /api/telemetry ===\")\n    if not t:\n        print(\"尚无数据（等待 robot.subscribe 首帧）\")\n        return\n    imu = t.get(\"imu\") or {}\n    print(f\"IMU      : online={imu.get('online')}  \"\n          f\"roll={imu.get('roll_deg')}  pitch={imu.get('pitch_deg')}  \"\n          f\"yaw={imu.get('yaw_deg')}\")\n    print(f\"           gravity={imu.get('gravity')}  \"\n          f\"fallen={imu.get('fallen')}  limp={imu.get('limp')}\")\n    print()\n    print(f\"{'关节':&lt;12} {'在线':&lt;6} {'温度°C':&gt;8} {'角度°':&gt;9} {'电压V':&gt;8}\")\n    for s in t.get(\"servos\") or []:\n        print(f\"{s['name']:&lt;12} {str(s['online']):&lt;6} {str(s['temp_c']):&gt;8} \"\n              f\"{str(s['angle_deg']):&gt;9} {str(s['volt_v']):&gt;8}\")\n    rep = t.get(\"reported\") or {}\n    print()\n    print(f\"上报能力 : temps={rep.get('temps')}  volts={rep.get('volts')}  \"\n          f\"online_explicit={rep.get('online_explicit')}\")\ndef mode_subscribe(base, secs):\n    print(f\"=== /api/subscribe 轮询 {secs:.1f}s ===\")\n    since = 0\n    deadline = time.time() + secs\n    total = 0\n    connected_seen = None\n    while time.time() &lt; deadline:\n        try:\n            d = http_get_json(f\"{base}/api/subscribe?since={since}\")\n        except RuntimeError as e:\n            print(f\"请求失败: {e}\")\n            time.sleep(1.0)\n            continue\n        if connected_seen is None:\n            connected_seen = d.get(\"connected\")\n            print(f\"订阅连接 : {connected_seen}  err={d.get('error')!r}\")\n        items = d.get(\"items\") or []\n        seq = d.get(\"seq\") or since\n        for it in items:\n            total += 1\n            print(f\"[{it['t']}] policy={it['policy']}  \"\n                  f\"applied={it['applied']}  targets5={it['targets5']}\")\n            since = it[\"seq\"]\n        if not items:\n            since = seq\n        # 与服务端 pollFeed 同样的节奏，别把 daemon 打爆\n        time.sleep(0.3)\n    print(f\"共收到 {total} 帧，最新 seq={since}\")\n# ---------------------------------------------------------------------------\ndef main():\n    p = argparse.ArgumentParser(description=\"从机器人 Web 遥控台拉数据的示例\")\n    p.add_argument(\"--host\", default=\"127.0.0.1\", help=\"机器人 IP（默认 127.0.0.1）\")\n    p.add_argument(\"--port\", type=int, default=8000, help=\"Web 台端口（默认 8000）\")\n    p.add_argument(\"--mode\", default=\"info\",\n                   choices=[\"version\", \"info\", \"status\", \"health\", \"telemetry\",\n                            \"subscribe\", \"all\"],\n                   help=\"拉哪个接口（默认 info）\")\n    p.add_argument(\"--secs\", type=float, default=5.0,\n                   help=\"subscribe 模式持续秒数（默认 5）\")\n    args = p.parse_args()\n    base = f\"http://{args.host}:{args.port}\"\n    try:\n        if args.mode in (\"version\", \"all\"):\n            mode_version(base)\n            print()\n        if args.mode in (\"info\", \"all\"):\n            mode_info(base)\n            print()\n        if args.mode in (\"status\", \"all\"):\n            mode_status(base)\n            print()\n        if args.mode in (\"health\", \"all\"):\n            mode_health(base)\n            print()\n        if args.mode in (\"telemetry\", \"all\"):\n            mode_telemetry(base)\n            print()\n        if args.mode in (\"subscribe\", \"all\"):\n            mode_subscribe(base, args.secs)\n    except RuntimeError as e:\n        print(f\"错误: {e}\", file=sys.stderr)\n        sys.exit(1)\nif __name__ == \"__main__\":\n    main()\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-3\">9.3 robot_api_move.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/robot_api_move.py\">下载 robot_api_move.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nrobot_api_move.py —— 通过 Web 遥控台发运动命令的示例\n用法:\n    python3 robot_api_move.py fwd   --speed 0.2 --secs 1.0\n    python3 robot_api_move.py back  --speed 0.1 --secs 0.5\n    python3 robot_api_move.py left  --turn  0.5 --secs 0.5   # 正值 = 左转\n    python3 robot_api_move.py right --turn  0.5 --secs 0.5\n    python3 robot_api_move.py stop\n    python3 robot_api_move.py interactive                    # 键盘遥控\n说明:\n    Web 台的 Mover 会以 HZ=10Hz 反复发 robot.move，secs 到点后自动补一帧\n    全零停止；所以一次点击不用再额外 stop。\n    interactive 模式退出时会显式 POST /api/stop，避免留下残余线程。\n\"\"\"\nimport argparse\nimport json\nimport sys\nimport urllib.error\nimport urllib.request\ndef post_json(url, payload, timeout=10.0):\n    data = json.dumps(payload or {}).encode(\"utf-8\")\n    req = urllib.request.Request(\n        url, data=data, method=\"POST\",\n        headers={\"Content-Type\": \"application/json\", \"Accept\": \"application/json\"},\n    )\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as resp:\n            return json.loads(resp.read().decode(\"utf-8\"))\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(\"utf-8\", \"replace\")\n        raise RuntimeError(f\"HTTP {e.code}: {body}\") from e\n    except urllib.error.URLError as e:\n        raise RuntimeError(f\"连接失败: {e.reason}\") from e\ndef api_move(base, vx, vyaw, secs):\n    return post_json(f\"{base}/api/move\", {\"vx\": vx, \"vyaw\": vyaw, \"secs\": secs})\ndef api_stop(base):\n    return post_json(f\"{base}/api/stop\", {})\n# ---------------------------------------------------------------------------\n# 交互模式：termios cbreak + select，一按键立刻发送\n# ---------------------------------------------------------------------------\ndef interactive(base, speed, turn, secs):\n    import os\n    import select\n    import termios\n    import tty\n    mapping = {\n        \"w\": ( speed,  0.0, \"前进\"),\n        \"W\": ( speed,  0.0, \"前进\"),\n        \"s\": (-speed,  0.0, \"后退\"),\n        \"S\": (-speed,  0.0, \"后退\"),\n        \"a\": ( 0.0,   turn, \"左转\"),\n        \"A\": ( 0.0,   turn, \"左转\"),\n        \"d\": ( 0.0,  -turn, \"右转\"),\n        \"D\": ( 0.0,  -turn, \"右转\"),\n    }\n    fd = sys.stdin.fileno()\n    old = termios.tcgetattr(fd)\n    try:\n        tty.setcbreak(fd)\n        print(\"交互遥控（q 退出）:\")\n        print(f\"  w 前进   s 后退   a 左转   d 右转   空格 停止\")\n        print(f\"  参数: vx={speed} m/s  vyaw={turn} rad/s  secs={secs}\")\n        while True:\n            r, _, _ = select.select([sys.stdin], [], [], 0.1)\n            if not r:\n                continue\n            ch = sys.stdin.read(1)\n            if ch in (\"q\", \"Q\", \"\\x03\"):        # q 或 Ctrl+C\n                break\n            if ch == \" \":\n                try:\n                    api_stop(base)\n                    print(\"\\n■ 已发送停止\")\n                except RuntimeError as e:\n                    print(f\"\\n停止失败: {e}\")\n                continue\n            if ch == \"\\x1b\":                       # 方向键转义序列，忽略剩余两字节\n                try:\n                    sys.stdin.read(2)\n                except Exception:\n                    pass\n                continue\n            if ch in mapping:\n                vx, vyaw, label = mapping[ch]\n                try:\n                    res = api_move(base, vx, vyaw, secs)\n                    print(f\"\\n{label}: vx={res.get('vx')}  \"\n                          f\"vyaw={res.get('vyaw')}  {res.get('secs')}s\")\n                except RuntimeError as e:\n                    print(f\"\\n{label} 失败: {e}\")\n    finally:\n        termios.tcsetattr(fd, termios.TCSADRAIN, old)\n        print(\"\\n退出交互，发送停止\")\n        try:\n            api_stop(base)\n        except RuntimeError as e:\n            print(f\"停止失败: {e}\")\n# ---------------------------------------------------------------------------\ndef main():\n    p = argparse.ArgumentParser(description=\"通过 Web 遥控台发运动命令的示例\")\n    p.add_argument(\"direction\",\n                   choices=[\"fwd\", \"back\", \"left\", \"right\", \"stop\", \"interactive\"])\n    p.add_argument(\"--host\", default=\"127.0.0.1\", help=\"机器人 IP（默认 127.0.0.1）\")\n    p.add_argument(\"--port\", type=int, default=8000, help=\"Web 台端口（默认 8000）\")\n    p.add_argument(\"--speed\", type=float, default=0.2,\n                   help=\"前进/后退速度 m/s（默认 0.2）\")\n    p.add_argument(\"--turn\", type=float, default=0.5,\n                   help=\"左/右转 vyaw rad/s（默认 0.5）\")\n    p.add_argument(\"--secs\", type=float, default=1.0,\n                   help=\"单次运动持续秒数（默认 1.0）\")\n    args = p.parse_args()\n    base = f\"http://{args.host}:{args.port}\"\n    try:\n        if args.direction == \"stop\":\n            print(api_stop(base))\n        elif args.direction == \"interactive\":\n            interactive(base, args.speed, args.turn, args.secs)\n        else:\n            vx = vyaw = 0.0\n            if args.direction == \"fwd\":\n                vx = args.speed\n            elif args.direction == \"back\":\n                vx = -args.speed\n            elif args.direction == \"left\":\n                vyaw = args.turn\n            elif args.direction == \"right\":\n                vyaw = -args.turn\n            print(api_move(base, vx, vyaw, args.secs))\n    except RuntimeError as e:\n        print(f\"错误: {e}\", file=sys.stderr)\n        sys.exit(1)\nif __name__ == \"__main__\":\n    main()\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-4\">9.4 robot_api_skill.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/robot_api_skill.py\">下载 robot_api_skill.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nrobot_api_skill.py —— 通过 Web 遥控台触发动作技能的示例\n用法:\n    python3 robot_api_skill.py list                 # 列出脚本内置的常用技能\n    python3 robot_api_skill.py sit_toggle\n    python3 robot_api_skill.py ground_pick\n    python3 robot_api_skill.py kick_right\n    python3 robot_api_skill.py kick_left\n    python3 robot_api_skill.py roll_over\n    python3 robot_api_skill.py &lt;任意技能名&gt;          # 技能名直接透传给 robotd\n说明:\n    请求走 POST /api/skill，服务端再把 {\"skill\": ...} 走 robot.do 推给 robotd。\n    服务端响应结构：\n        成功 → {\"ok\": true,  \"message\": \"...\", \"result\": {...}}\n        失败 → {\"ok\": false, \"error\": \"...\", \"result\": {...}}\n\"\"\"\nimport argparse\nimport json\nimport sys\nimport urllib.error\nimport urllib.request\nKNOWN_SKILLS = {\n    \"sit_toggle\": \"坐下 / 站立（切换）\",\n    \"ground_pick\": \"从地上捡东西\",\n    \"kick_right\": \"右踢腿\",\n    \"kick_left\": \"左踢腿\",\n    \"roll_over\": \"翻滚\",\n}\ndef post_json(url, payload, timeout=15.0):\n    data = json.dumps(payload or {}).encode(\"utf-8\")\n    req = urllib.request.Request(\n        url, data=data, method=\"POST\",\n        headers={\"Content-Type\": \"application/json\", \"Accept\": \"application/json\"},\n    )\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as resp:\n            return json.loads(resp.read().decode(\"utf-8\"))\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(\"utf-8\", \"replace\")\n        raise RuntimeError(f\"HTTP {e.code}: {body}\") from e\n    except urllib.error.URLError as e:\n        raise RuntimeError(f\"连接失败: {e.reason}\") from e\ndef list_skills():\n    print(\"脚本内置常用技能：\")\n    for name, desc in KNOWN_SKILLS.items():\n        print(f\"  {name:&lt;14} {desc}\")\n    print()\n    print(\"其它技能名也可以直接传：python3 robot_api_skill.py &lt;技能名&gt;\")\ndef run_skill(base, skill):\n    resp = post_json(f\"{base}/api/skill\", {\"skill\": skill})\n    if resp.get(\"ok\"):\n        print(f\"[OK] {skill}: {resp.get('message') or '已接受'}\")\n        result = resp.get(\"result\") or {}\n        if result:\n            print(f\"   result: {result}\")\n    else:\n        print(f\"[ERROR] {skill}: {resp.get('error') or resp.get('message') or '失败'}\",\n              file=sys.stderr)\n        result = resp.get(\"result\") or {}\n        if result:\n            print(f\"   result: {result}\", file=sys.stderr)\n        sys.exit(1)\ndef main():\n    p = argparse.ArgumentParser(description=\"通过 Web 遥控台触发动作技能的示例\")\n    p.add_argument(\"skill\", nargs=\"?\",\n                   help=\"技能名；或 'list' 列出内置技能\")\n    p.add_argument(\"--host\", default=\"127.0.0.1\", help=\"机器人 IP（默认 127.0.0.1）\")\n    p.add_argument(\"--port\", type=int, default=8000, help=\"Web 台端口（默认 8000）\")\n    args = p.parse_args()\n    if not args.skill or args.skill == \"list\":\n        list_skills()\n        return\n    base = f\"http://{args.host}:{args.port}\"\n    try:\n        run_skill(base, args.skill)\n    except RuntimeError as e:\n        print(f\"错误: {e}\", file=sys.stderr)\n        sys.exit(1)\nif __name__ == \"__main__\":\n    main()\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-5\">9.5 receive_video.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/receive_video.py\">下载 receive_video.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">#!/usr/bin/env python3\n\"\"\"\n从 duck robot 的 8443 端口（webrtcsink 信令服务器）获取视频流。\n用法:\n    # 预览视频窗口\n    python3 scripts/receive_video.py &lt;robot_host&gt;\n    # 保存到 MP4 文件\n    python3 scripts/receive_video.py &lt;robot_host&gt; --output output.mp4\n    # 保存为 JPEG 帧序列\n    python3 scripts/receive_video.py &lt;robot_host&gt; --save-frames ./frames/\n依赖:\n    pip install aiortc av opencv-python websockets\n\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport asyncio\nimport json\nimport os\nimport signal\nimport sys\nfrom pathlib import Path\nfrom typing import Optional\nimport av\nimport cv2\nimport websockets\nfrom aiortc import (\n    RTCIceCandidate,\n    RTCIceServer,\n    RTCConfiguration,\n    RTCPeerConnection,\n    RTCSessionDescription,\n    VideoStreamTrack,\n)\n# ─── 状态 ───────────────────────────────────────────────────────────────\nclass State:\n    def __init__(self) -&gt; None:\n        self.pc: Optional[RTCPeerConnection] = None\n        self.session_id: Optional[str] = None\n        self._frame_queue: asyncio.Queue = asyncio.Queue(maxsize=10)\n        self._ice_outbox: asyncio.Queue[str] = asyncio.Queue()\n    def put_frame(self, frame) -&gt; None:\n        # 满了就丢最旧的，保持最新\n        try:\n            self._frame_queue.put_nowait(frame)\n        except asyncio.QueueFull:\n            try:\n                self._frame_queue.get_nowait()\n                self._frame_queue.put_nowait(frame)\n            except asyncio.QueueEmpty:\n                pass\n    async def get_frame(self):\n        return await self._frame_queue.get()\n    def enqueue_ice(self, candidate_str: str) -&gt; None:\n        \"\"\"本地 ICE 候选入出箱，信令循环会把它发给服务器。\"\"\"\n        self._ice_outbox.put_nowait(candidate_str)\n    async def close(self) -&gt; None:\n        if self.pc is not None:\n            try:\n                await self.pc.close()\n            except Exception:\n                pass\n            self.pc = None\nstate = State()\nshutdown = asyncio.Event()\n# ─── 信令 ───────────────────────────────────────────────────────────────\ndef _ice_candidate_to_sdp_str(cand: RTCIceCandidate) -&gt; str:\n    \"\"\"把 aiortc 的 RTCIceCandidate 还原成 `candidate:...` 字符串。\"\"\"\n    parts = [\n        \"candidate:\", str(cand.foundation), str(cand.component),\n        cand.protocol, str(cand.priority), cand.ip, str(cand.port),\n        \"typ\", cand.type,\n    ]\n    if cand.relatedAddress is not None and cand.relatedPort is not None:\n        parts += [\"raddr\", cand.relatedAddress, \"rport\", str(cand.relatedPort)]\n    if cand.tcpType is not None:\n        parts += [\"tcptype\", cand.tcpType]\n    return \" \".join(parts)\ndef _parse_ice_candidate(sdp_str: str, sdp_mid: str | None, sdp_mline_index: int | None) -&gt; RTCIceCandidate | None:\n    \"\"\"把 RFC 8445 的 candidate: 行解析成 aiortc 1.10.1 的 RTCIceCandidate。\n    格式: candidate:&lt;foundation&gt; &lt;component&gt; &lt;protocol&gt; &lt;priority&gt; &lt;ip&gt; &lt;port&gt;\n          typ &lt;cand-type&gt; [raddr &lt;rel-ip&gt; rport &lt;rel-port&gt;] [tcptype &lt;tcp-type&gt;] ...\n    返回 None 代表这条不能解析（比如空 candidate 或 end-of-candidates marker）。\n    \"\"\"\n    body = sdp_str.strip()\n    if body.startswith(\"candidate:\"):\n        body = body[len(\"candidate:\"):]\n    if not body:\n        # 空 candidate 行 — webrtcsink 偶尔会发\n        return None\n    parts = body.split()\n    if len(parts) &lt; 7:\n        print(f\"[ice] !! candidate 格式太短，跳过: {sdp_str[:120]}\")\n        return None\n    # 关键字段（按顺序）\n    foundation = parts[0]\n    component = int(parts[1])\n    protocol = parts[2]\n    priority = int(parts[3])\n    ip = parts[4]\n    port = int(parts[5])\n    # 找 \"typ\" 位置，type 在其后\n    try:\n        typ_idx = parts.index(\"typ\")\n    except ValueError:\n        print(f\"[ice] !! 找不到 typ 关键字，跳过: {sdp_str[:120]}\")\n        return None\n    cand_type = parts[typ_idx + 1]\n    # 扩展字段（raddr/rport/tcptype）\n    related_address = None\n    related_port = None\n    tcp_type = None\n    i = typ_idx + 2\n    while i &lt; len(parts):\n        if parts[i] == \"raddr\" and i + 1 &lt; len(parts):\n            related_address = parts[i + 1]\n        elif parts[i] == \"rport\" and i + 1 &lt; len(parts):\n            related_port = int(parts[i + 1])\n        elif parts[i] == \"tcptype\" and i + 1 &lt; len(parts):\n            tcp_type = parts[i + 1]\n        i += 1\n    return RTCIceCandidate(\n        component=component,\n        foundation=foundation,\n        ip=ip,\n        port=port,\n        priority=priority,\n        protocol=protocol,\n        type=cand_type,\n        relatedAddress=related_address,\n        relatedPort=related_port,\n        sdpMid=sdp_mid,\n        sdpMLineIndex=sdp_mline_index,\n        tcpType=tcp_type,\n    )\nasync def connect_signalling(host: str, port: int):\n    \"\"\"连接到 webrtcsink 信令服务器并处理整个握手流程。\"\"\"\n    url = f\"ws://{host}:{port}\"\n    print(f\"[signalling] 连接 {url}\")\n    async with websockets.connect(url, max_size=8 * 1024 * 1024) as ws:\n        print(\"[signalling] 已连接，等待 welcome…\")\n        async for raw in ws:\n            msg = json.loads(raw)\n            mtype = msg.get(\"type\")\n            print(f\"[signalling] ← {mtype}\",\n                  msg.get(\"producers\") and f\"({len(msg['producers'])} producers)\" or \"\",\n                  msg.get(\"sessionId\") and f\"sid={msg['sessionId'][:8]}…\" or \"\")\n            if mtype == \"welcome\":\n                # 请求 producers 列表\n                await ws.send(json.dumps({\"type\": \"list\"}))\n            elif mtype == \"list\":\n                producers = msg.get(\"producers\") or []\n                if not producers:\n                    print(\"[signalling] !! 没有 producer — mediad 可能未在运行或 pipeline 未到 PLAYING\")\n                    return\n                producer = producers[0]\n                meta = producer.get(\"meta\") or {}\n                print(f\"[signalling] 选择 producer id={producer['id'][:12]}… name={meta.get('name', '?')}\")\n                await ws.send(json.dumps({\n                    \"type\": \"startSession\",\n                    \"peerId\": producer[\"id\"],\n                }))\n            elif mtype == \"sessionStarted\":\n                state.session_id = msg[\"sessionId\"]\n                # 配 Google 免费 STUN，才能 gather srflx（NAT 穿透）和 host candidate\n                config = RTCConfiguration(iceServers=[\n                    RTCIceServer(urls=\"stun:stun.l.google.com:19302\"),\n                    RTCIceServer(urls=\"stun:stun1.l.google.com:19302\"),\n                ])\n                state.pc = RTCPeerConnection(config)\n                print(f\"[signalling] session 建立: {state.session_id[:12]}…\")\n                @state.pc.on(\"track\")\n                def on_track(track):\n                    print(f\"[webrtc] track 到达: {track.kind} id={track.id[:12]}…\")\n                    if track.kind == \"video\":\n                        asyncio.create_task(_pull_video_frames(track))\n                @state.pc.on(\"connectionstatechange\")\n                def on_state():\n                    print(f\"[webrtc] connection state: {state.pc.connectionState}\")\n            elif mtype == \"peer\":\n                if state.pc is None:\n                    print(\"[signalling] !! peer 消息在 sessionStarted 之前到达\")\n                    continue\n                try:\n                    if msg.get(\"sdp\"):\n                        sdp = msg[\"sdp\"]\n                        print(f\"[signalling] → setRemoteDescription({sdp['type']}), \"\n                              f\"length={len(sdp['sdp'])}\")\n                        await state.pc.setRemoteDescription(\n                            RTCSessionDescription(sdp[\"sdp\"], sdp[\"type\"])\n                        )\n                        print(\"[signalling] → createAnswer…\")\n                        answer = await state.pc.createAnswer()\n                        # answer SDP 默认发 setup:active（想当 DTLS client），\n                        # 但我们是 ICE controlled（远端 offer 是 controlling），\n                        # 所以必须是 DTLS server，改成 passive。\n                        answer_sdp = answer.sdp.replace(\"a=setup:active\", \"a=setup:passive\")\n                        # H.264 profile-level-id 统一用远端 offer 里的值（42c028），\n                        # aiortc 默认填 42e01f，虽然兼容但远端可能发的 SPS/PPS 按\n                        # 自己的参数编码，导致 aiortc 解码报 \"non-existing PPS 0\"。\n                        answer_sdp = answer_sdp.replace(\n                            \"profile-level-id=42e01f\",\n                            \"profile-level-id=42c028\",\n                        )\n                        # 去掉 RTX（retransmission）codec line —— 它只是用来重传丢包的，\n                        # aiortc 会尝试给 \"video/rtx\" 建解码器然后崩溃\n                        lines = [l for l in answer_sdp.split(\"\\n\")\n                                 if \"rtx/\" not in l and \"apt=96\" not in l and \"apt=97\" not in l]\n                        answer_sdp = \"\\n\".join(lines)\n                        answer = RTCSessionDescription(answer_sdp, answer.type)\n                        print(\"[signalling] → setLocalDescription…\")\n                        await state.pc.setLocalDescription(answer)\n                        # aiortc 1.10.1 的 icecandidate 事件是坏的，但\n                        # setLocalDescription 内部已经同步跑完 gather()，\n                        # 所以 transceivers 上的 iceGatherer 已经有 candidates。\n                        # 先发送 answer SDP，让远端知道 DTLS role 协商结果，\n                        # 然后再发所有本地 ICE candidates。\n                        await ws.send(json.dumps({\n                            \"type\": \"peer\",\n                            \"sessionId\": state.session_id,\n                            \"sdp\": {\"type\": \"answer\", \"sdp\": answer.sdp},\n                        }))\n                        local_candidates = []\n                        for tr in state.pc.getTransceivers():\n                            ice_gatherer = tr._transport._transport.iceGatherer\n                            for cand in ice_gatherer.getLocalCandidates():\n                                local_candidates.append(cand)\n                        print(f\"[ice] → 本地 {len(local_candidates)} 条（手动 gather）\")\n                        for cand in local_candidates:\n                            sdp_str = _ice_candidate_to_sdp_str(cand)\n                            await ws.send(json.dumps({\n                                \"type\": \"peer\",\n                                \"sessionId\": state.session_id,\n                                \"ice\": {\"candidate\": sdp_str},\n                            }))\n                        print(\"[signalling] → answer + ICE 已发送\")\n                    elif msg.get(\"ice\"):\n                        ice = msg[\"ice\"]\n                        raw = ice[\"candidate\"]\n                        if not raw or \"typ\" not in raw:\n                            print(\"[ice] 跳过空 candidate\")\n                            continue\n                        print(f\"[ice] ← {raw[:80]}\")\n                        cand = _parse_ice_candidate(\n                            raw,\n                            sdp_mid=ice.get(\"sdpMid\"),\n                            sdp_mline_index=ice.get(\"sdpMLineIndex\"),\n                        )\n                        if cand is None:\n                            print(\"[ice] 跳过无效 candidate\")\n                            continue\n                        try:\n                            master_transport = state.pc.getTransceivers()[0]._transport._transport\n                            await master_transport.addRemoteCandidate(cand)\n                            print(f\"[ice] +{cand.type} {cand.ip}:{cand.port} \"\n                                  f\"→ state={master_transport.state}\")\n                        except Exception as exc:\n                            print(f\"[ice] !! addRemoteCandidate 失败: {exc}\")\n                        # 远端 webrtcsink 不发 end-of-candidates marker，\n                        # 远端 ICE 是快速连续到达的，所以收到第一条就立刻 trigger\n                        # connect() —— 后续到达的远端 ICE 会被 aioice 动态配对进\n                        # check_list。远端 2s 后会 endSession，不能等。\n                        if not hasattr(state, \"_connect_pending\"):\n                            state._connect_pending = True\n                            asyncio.create_task(_trigger_connect_now())\n                except Exception as exc:\n                    import traceback\n                    print(f\"[signalling] !! peer 处理失败: {exc}\")\n                    traceback.print_exc()\n            elif mtype == \"sessionEnded\":\n                reason = msg.get(\"reason\", \"\")\n                print(f\"[signalling] session 结束 {reason}\")\n                break\n            elif mtype == \"endSession\":\n                reason = msg.get(\"reason\", \"\")\n                print(f\"[signalling] endSession 收到 {reason}\")\n                break\n            elif mtype == \"error\":\n                print(f\"[signalling] !! error: {msg.get('details')}\")\n            elif mtype == \"sessionRejected\":\n                print(f\"[signalling] !! session 被拒绝: {msg.get('reason')}\")\n                break\n    await state.close()\n# ─── 视频帧提取 ─────────────────────────────────────────────────────────\nasync def _trigger_connect_now():\n    \"\"\"绕开 aiortc 1.10.1 的时序 bug：手动让 ICE + DTLS + RTP 都启动。\"\"\"\n    await asyncio.sleep(0.1)\n    if state.pc is None or shutdown.is_set():\n        return\n    try:\n        master_transport = state.pc.getTransceivers()[0]._transport._transport\n        dtls_transport = state.pc.getTransceivers()[0]._transport\n        transceiver = state.pc.getTransceivers()[0]\n        remote_params = state.pc._RTCPeerConnection__remoteIce.get(transceiver)\n        remote_dtls_params = state.pc._RTCPeerConnection__remoteDtls.get(transceiver)\n        conn = master_transport._connection\n        # 1. 设置 remote ICE params（ufrag/pwd）\n        if remote_params and remote_params.usernameFragment:\n            conn.remote_username = remote_params.usernameFragment\n            conn.remote_password = remote_params.password\n            conn.remote_is_lite = remote_params.iceLite\n        # 2. 手动触发 ICE connectivity check（aiortc 的 start() 被幂等保护挡了）\n        print(f\"[ice] connect() remote={len(conn.remote_candidates)} local={len(conn.local_candidates)}\")\n        await conn.connect()\n        print(f\"[ice] !! ICE OK → state={master_transport.state}\")\n        # 3. 启动 DTLS（我们已经改了 SDP setup:active→passive，所以我们是 DTLS server）\n        if dtls_transport.state == \"new\" and remote_dtls_params:\n            print(f\"[dtls] start → \", end=\"\", flush=True)\n            await dtls_transport.start(remote_dtls_params)\n            print(f\"state={dtls_transport.state}\")\n        # 4. 启动 RTP receiver\n        if transceiver.receiver.track is not None and transceiver.currentDirection in (\"recvonly\", \"sendrecv\"):\n            remote_rtp = state.pc._RTCPeerConnection__remoteRtp(transceiver)\n            print(f\"[rtp] receiver.receive() 启动\")\n            asyncio.create_task(transceiver.receiver.receive(remote_rtp))\n        print(f\"[webrtc] all started, CS={state.pc.connectionState} ICEgath={state.pc.iceGatheringState}\")\n    except Exception as exc:\n        print(f\"[!!] connect 链失败: {exc}\")\n        import traceback\n        traceback.print_exc()\nasync def _pull_video_frames(track: VideoStreamTrack):\n    \"\"\"持续从 WebRTC video track 拉帧，送入队列。\"\"\"\n    try:\n        while not shutdown.is_set():\n            frame = await track.recv()\n            state.put_frame(frame)\n    except Exception as exc:\n        print(f\"[video] track 结束: {exc}\")\n# ─── 输出模式 ──────────────────────────────────────────────────────────\nasync def output_display():\n    \"\"\"OpenCV 窗口预览。按 q 或 Esc 退出。\"\"\"\n    print(\"[output] OpenCV 预览窗口已打开，按 q 关闭\")\n    while not shutdown.is_set():\n        frame = await state.get_frame()\n        # aiortc VideoFrame → numpy (BGR)\n        img = frame.to_ndarray(format=\"bgr24\")\n        cv2.imshow(\"duck video\", img)\n        key = cv2.waitKey(1) &amp; 0xFF\n        if key in (ord(\"q\"), 27):\n            break\n    cv2.destroyAllWindows()\nasync def output_save_mp4(path: str):\n    \"\"\"保存为 H.264 MP4。\"\"\"\n    out_path = Path(path)\n    out_path.parent.mkdir(parents=True, exist_ok=True)\n    # 等待第一帧拿到尺寸\n    frame = await state.get_frame()\n    w, h = frame.width, frame.height\n    print(f\"[output] 保存到 {out_path}  ({w}x{h})\")\n    container = av.open(str(out_path), mode=\"w\")\n    stream = container.add_stream(\"libx264\", rate=30)\n    stream.width = w\n    stream.height = h\n    stream.pix_fmt = \"yuv420p\"\n    stream.options = {\"preset\": \"veryfast\", \"crf\": \"23\"}\n    n = 0\n    try:\n        while not shutdown.is_set():\n            try:\n                frame = await asyncio.wait_for(state.get_frame(), timeout=2.0)\n            except asyncio.TimeoutError:\n                continue\n            img = frame.to_ndarray(format=\"yuv420p\")\n            pkt = stream.encode(av.VideoFrame.from_ndarray(img, format=\"yuv420p\"))\n            if pkt:\n                container.mux(pkt)\n            n += 1\n            if n % 30 == 0:\n                print(f\"[output] 已写入 {n} 帧\", end=\"\\r\")\n    finally:\n        try:\n            container.close()\n        except Exception:\n            pass\n        print(f\"\\n[output] 完成，共 {n} 帧\")\nasync def output_save_frames(dir_path: str):\n    \"\"\"保存为 JPEG 帧序列。\"\"\"\n    out_dir = Path(dir_path)\n    out_dir.mkdir(parents=True, exist_ok=True)\n    print(f\"[output] 保存帧到 {out_dir}/\")\n    n = 0\n    try:\n        while not shutdown.is_set():\n            frame = await state.get_frame()\n            img = frame.to_ndarray(format=\"bgr24\")\n            cv2.imwrite(str(out_dir / f\"frame_{n:06d}.jpg\"), img, [cv2.IMWRITE_JPEG_QUALITY, 85])\n            n += 1\n            if n % 30 == 0:\n                print(f\"[output] 已保存 {n} 帧\", end=\"\\r\")\n    finally:\n        print(f\"\\n[output] 完成，共 {n} 帧\")\n# ─── 入口 ─────────────────────────────────────────────────────────────\ndef _install_signal_handlers() -&gt; None:\n    def _sig(signum, _frame):\n        print(f\"\\n[shutdown] 收到信号 {signum}\")\n        shutdown.set()\n    signal.signal(signal.SIGINT, _sig)\n    signal.signal(signal.SIGTERM, _sig)\nasync def main() -&gt; int:\n    ap = argparse.ArgumentParser(description=\"从 duck robot 的 8443 端口获取 WebRTC 视频流\")\n    ap.add_argument(\"host\", help=\"机器人 IP 或 hostname (如 duck.local 或 192.168.x.x)\")\n    ap.add_argument(\"--port\", type=int, default=8443, help=\"信令服务器端口 (默认 8443)\")\n    ap.add_argument(\"--output\", \"-o\", help=\"输出 MP4 路径 (如 video.mp4)\")\n    ap.add_argument(\"--save-frames\", \"-f\", help=\"保存 JPEG 帧序列到该目录\")\n    ap.add_argument(\"--duration\", \"-t\", type=float, help=\"录制/预览时长 (秒)，不指定则直到手动停止\")\n    args = ap.parse_args()\n    _install_signal_handlers()\n    tasks = []\n    # 信令任务\n    sig_task = asyncio.create_task(connect_signalling(args.host, args.port))\n    tasks.append(sig_task)\n    # 输出任务\n    if args.output:\n        out_task = asyncio.create_task(output_save_mp4(args.output))\n    elif args.save_frames:\n        out_task = asyncio.create_task(output_save_frames(args.save_frames))\n    else:\n        out_task = asyncio.create_task(output_display())\n    tasks.append(out_task)\n    # 时长限制\n    if args.duration:\n        def _time_up():\n            print(f\"\\n[shutdown] 时长 {args.duration}s 到期\")\n            shutdown.set()\n        loop = asyncio.get_running_loop()\n        loop.call_later(args.duration, _time_up)\n    try:\n        # 等 shutdown 或第一个任务完成\n        await shutdown.wait()\n        # 给正在进行的帧处理一点时间收尾\n        await asyncio.sleep(0.2)\n    finally:\n        for t in tasks:\n            t.cancel()\n        await asyncio.gather(*tasks, return_exceptions=True)\n        await state.close()\n    print(\"[done]\")\n    return 0\nif __name__ == \"__main__\":\n    sys.exit(asyncio.run(main()))\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-6\">9.6 microphone-test.sh\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/microphone-test.sh\">下载 microphone-test.sh\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\"># 设置音量\nsudo amixer -c aic3104 cset name='PGA Capture Volume' 60,60   # 0..119，约 +30 dB\n# -d 录音时间（秒）\narecord -D hw:1,0 -f cd -d 10 -vvv /tmp/mic_test.wav\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-7\">9.7 speaker-test.sh\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/speaker-test.sh\">下载 speaker-test.sh\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\"># LOP 输出级 MUTE（关键：off 会全静音）\nsudo amixer -c aic3104 cset name='Line Playback Volume'     9,9   \n# 1,0代表card1 device0，播放音频\naplay -D hw:1,0 /tmp/mic_test.wav\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s9-8\">9.8 tof_matrix.py\u003c/h3>\n\u003cp>\u003ca download=\"\" href=\"examples/raydino/bsp/tof_matrix.py\">下载 tof_matrix.py\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">import sys\nimport time\nfrom vl53l5cx.vl53l5cx import VL53L5CX\nfrom vl53l5cx.api import VL53L5CX_RESOLUTION_8X8\n# ============ 可调参数 ============\nI2C_BUS      = 3\nGRID         = 8          # 8x8 = 64 区域\nPOLL_DT      = 0.05       # 轮询周期(秒)\nHUE_NEAR     = 0.0        # 近 -&gt; 红 (hue 0)\nHUE_FAR      = 240.0      # 远 -&gt; 蓝 (hue 240)\nVALID_STATUS = (5, 9)     # 有效目标状态码\nMIN_SPAN     = 100        # 动态范围保护(mm)\n# ============ 颜色工具 ============\ndef hsv_to_rgb(h, s=1.0, v=1.0):\n    h %= 360.0\n    c = v * s\n    x = c * (1.0 - abs((h / 60.0) % 2.0 - 1.0))\n    m = v - c\n    if   h &lt;  60: r, g, b = c, x, 0.0\n    elif h &lt; 120: r, g, b = x, c, 0.0\n    elif h &lt; 180: r, g, b = 0.0, c, x\n    elif h &lt; 240: r, g, b = 0.0, x, c\n    elif h &lt; 300: r, g, b = x, 0.0, c\n    else:         r, g, b = c, 0.0, x\n    return int((r + m) * 255), int((g + m) * 255), int((b + m) * 255)\ndef color_of(t):\n    \"\"\"t=0 最近(红) -&gt; t=1 最远(蓝)，返回 ANSI 前景色前缀。\"\"\"\n    t = 0.0 if t &lt; 0.0 else (1.0 if t &gt; 1.0 else t)\n    r, g, b = hsv_to_rgb(HUE_NEAR + (HUE_FAR - HUE_NEAR) * t)\n    return f\"\\033[38;2;{r};{g};{b}m\"\nRESET = \"\\033[0m\"\nDIM   = \"\\033[90m\"\ndef cell(dist, ok, lo, hi):\n    \"\"\"生成一个固定宽度的带色单元格，保持 8x8 位置不变。\"\"\"\n    if not ok:\n        return f\"{DIM}  ---{RESET}\"\n    span = hi - lo\n    t = 0.0 if span &lt;= 0 else (dist - lo) / span\n    return f\"{color_of(t)}{dist:5d}{RESET}\"\n# ============ 初始化 ============\nprint(f\"检查 i2c-{I2C_BUS} 上的 0x29 ...\")\ntof = VL53L5CX(bus_id=I2C_BUS)\nif not tof.is_alive():\n    print(f\"失败: 0x29 在 i2c-{I2C_BUS} 上没有应答\")\n    raise SystemExit(1)\nprint(\"初始化传感器（上传固件，约数秒）...\")\ntry:\n    tof.init()\nexcept Exception as e:\n    print(f\"初始化失败: {e}\")\n    raise SystemExit(1)\ntof.set_resolution(VL53L5CX_RESOLUTION_8X8)\ntof.set_ranging_frequency_hz(15)\ntof.start_ranging()\n# ============ 主循环：彩色矩阵 ============\nsys.stdout.write(\"\\033[2J\\033[H\")   # 清屏 + 光标归位\nsys.stdout.flush()\ntry:\n    while True:\n        if not tof.check_data_ready():\n            time.sleep(POLL_DT)\n            continue\n        data   = tof.get_ranging_data()\n        dist   = list(data.distance_mm)      # 长度 64，行优先\n        status = list(data.target_status)\n        ok    = [s in VALID_STATUS and d &gt; 0 for d, s in zip(dist, status)]\n        valid = [d for d, o in zip(dist, ok) if o]\n        # 动态范围：让颜色对比度最大化\n        if valid:\n            lo, hi = min(valid), max(valid)\n            if hi - lo &lt; MIN_SPAN:\n                mid = (lo + hi) / 2.0\n                lo, hi = mid - MIN_SPAN / 2, mid + MIN_SPAN / 2\n        else:\n            lo, hi = 0, 1000\n        # 组装一帧画面（一次性输出，避免闪烁）\n        out = [\"\\033[H\"]\n        for row in range(GRID):\n            line = \" \".join(\n                cell(dist[row * GRID + col], ok[row * GRID + col], lo, hi)\n                for col in range(GRID)\n            )\n            out.append(line + \"\\033[K\")     # \\033[K 清到行尾\n        out.append(\"\\033[K\")\n        nearest = min(valid) if valid else None\n        out.append(\n            f\"有效 {len(valid):2d}/64   最近 \"\n            f\"{nearest if nearest is not None else '--'} mm   \"\n            f\"色标 \\033[38;2;255;0;0m红=近{RESET} → \"\n            f\"\\033[38;2;0;0;255m蓝=远{RESET}   \"\n            f\"范围 {lo:.0f}~{hi:.0f} mm\\033[K\"\n        )\n        out.append(\"\\033[J\")                # 清掉屏幕残留\n        sys.stdout.write(\"\\n\".join(out))\n        sys.stdout.flush()\n        time.sleep(POLL_DT)\nexcept KeyboardInterrupt:\n    print(\"\\n停止测距...\")\nfinally:\n    tof.stop_ranging()\n    sys.stdout.write(\"\\033[0m完成\\n\")\n    sys.stdout.flush()\n\u003c/code>\u003c/pre>"}], "videos": []}]}</script><script>const catalog=JSON.parse(document.querySelector('#product-catalog').textContent);
const $=s=>document.querySelector(s),node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
const records=[],searchIndex=[];let activeDoc='',observer;
for(const product of catalog.products){
 const line=node('div',undefined,'product-line');line.append(node('div',product.line,'line-title'));
 const group=node('details',undefined,'product-group');group.dataset.productId=product.id;group.open=true;
 const summary=node('summary');summary.append(node('span',undefined,'product-dot'),document.createTextNode(product.name),node('span',product.id==='raydino'?'':(product.model||'EDU'),'product-version'));group.append(summary);
 const nav=node('div',undefined,'doc-nav');nav.setAttribute('role','navigation');nav.setAttribute('aria-label',product.name+'文档');
 for(const doc of product.documents){
  const route='#'+product.id+'/'+doc.id,link=node('a');link.href=route;link.dataset.route=route;link.append(node('span','▤','doc-symbol'),document.createTextNode(doc.title));nav.append(link);
  const holder=node('div');holder.innerHTML=doc.html;
  holder.querySelectorAll('h2,h3,h4,h5').forEach((h,i)=>{if(!h.id)h.id=doc.id+'-heading-'+i;let text=h.textContent,n=h.nextElementSibling;while(n&&!/^H[2345]$/.test(n.tagName)){text+=' '+n.textContent;n=n.nextElementSibling;}searchIndex.push({product:product.name,doc:doc.title,heading:h.textContent,route:route+'/'+h.id,text:(product.name+' '+doc.title+' '+text).toLocaleLowerCase()});});
  holder.querySelectorAll('a[href^="#"]').forEach(a=>{const target=a.getAttribute('href').slice(1),parts=target.split('/');if(catalog.products.some(p=>p.id===parts[0]))return;if(product.documents.some(d=>d.id===parts[0]))a.href='#'+product.id+'/'+target;else if(holder.querySelector('[id="'+CSS.escape(target)+'"]'))a.href=route+'/'+target;});
  records.push({product,doc,route,html:holder.innerHTML});
 }
 const resource=node('a','教学视频与下载 ↗','product-resources');resource.href=product.resources_page;nav.append(resource);group.append(nav);line.append(group);$('.product-tree').append(line);
}
function closeMenu(){$('.sidebar').classList.remove('open');$('.backdrop').classList.remove('open');$('.menu-toggle').setAttribute('aria-expanded','false');}
$('.menu-toggle').onclick=()=>{const open=!$('.sidebar').classList.contains('open');$('.sidebar').classList.toggle('open',open);$('.backdrop').classList.toggle('open',open);$('.menu-toggle').setAttribute('aria-expanded',String(open));};$('.backdrop').onclick=closeMenu;
$('.print-button').onclick=()=>window.print();
function render(){
 const parts=location.hash.slice(1).split('/');let record,anchor;
 if(catalog.products.some(p=>p.id===parts[0])){record=records.find(r=>r.product.id===parts[0]&&r.doc.id===parts[1]);anchor=parts.slice(2).join('/');}
 else{record=records.find(r=>r.product.id==='gongka-edu'&&r.doc.id===parts[0]);anchor=parts.slice(1).join('/');if(!record&&parts[0]){record=records.find(r=>r.product.id==='gongka-edu'&&r.html.includes('id="'+parts[0]+'"'));anchor=parts[0];}}
 record=record||records[0];
 if(activeDoc!==record.route){
  activeDoc=record.route;observer?.disconnect();
  $('#doc-title').textContent=record.doc.title;$('#breadcrumb').textContent=record.doc.title;$('.current-product').textContent=record.product.name+(record.product.id==='raydino'?'':' · '+(record.product.model||'EDU'));$('.breadcrumb-product').textContent=record.product.name;$('.doc-description').textContent=record.doc.summary||'';$('.doc-version').textContent=record.doc.version||'';document.title=record.doc.title+' · '+record.product.name+' · 产品资料中心';$('#document').innerHTML=record.html;
  const pdf=$('.pdf-link');pdf.hidden=!record.doc.pdf;if(record.doc.pdf)pdf.href=record.doc.pdf;
  document.querySelectorAll('[data-route]').forEach(a=>{const active=a.dataset.route===record.route;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const group=document.querySelector('[data-product-id="'+record.product.id+'"]');group.open=true;
  const heads=[...$('#document').querySelectorAll('h2,h3,h4')];$('.page-toc').replaceChildren();heads.forEach(h=>{const a=node('a',h.textContent,h.tagName==='H2'?'':h.tagName==='H3'?'sub':'sub leaf');a.href=record.route+'/'+h.id;$('.page-toc').append(a);});
  observer=new IntersectionObserver(items=>{for(const item of items)if(item.isIntersecting)$('.page-toc').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.hash===record.route+'/'+item.target.id));},{rootMargin:'-100px 0px -65% 0px'});heads.forEach(h=>observer.observe(h));
  const siblings=records.filter(r=>r.product.id===record.product.id),index=siblings.indexOf(record);$('.doc-footer').replaceChildren();
  for(const [label,sibling] of [['上一篇',siblings[index-1]],['下一篇',siblings[index+1]]]){if(sibling){const a=node('a');a.href=sibling.route;a.append(node('span',label),document.createTextNode(sibling.doc.title));$('.doc-footer').append(a);}else $('.doc-footer').append(node('span'));}
 }
 closeMenu();if(anchor)requestAnimationFrame(()=>document.getElementById(anchor)?.scrollIntoView({behavior:'instant',block:'start'}));else window.scrollTo({top:0,behavior:'instant'});
}
$('.search').oninput=e=>{const q=e.target.value.trim().toLocaleLowerCase(),box=$('.search-results');box.replaceChildren();if(!q)return;const matches=searchIndex.filter(x=>x.text.includes(q));box.append(node('div',matches.length?'找到 '+matches.length+' 个章节':'未找到相关章节','search-status'));matches.slice(0,30).forEach(x=>{const b=node('button',x.heading,'search-result');b.append(node('small',x.product+' / '+x.doc));b.onclick=()=>{if(location.hash===x.route)render();else location.hash=x.route;};box.append(b);});};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});window.addEventListener('hashchange',render);render();
</script></body></html>
