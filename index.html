03c/figure>\u003ch3 id=\"s2-3\">2.3 装配步骤 3\u003c/h3>\u003cp>用 4 颗 M4×14 螺钉将底座组件安装到底板；再用 2 颗 M4×50 螺钉及 2 颗 M6 平垫，将底座组件安装到把手。\u003c/p>\u003cfigure>\u003cimg alt=\"滑座装配连接位置\" src=\"products/tangpa-edu/assets/manual/image14.png\"/>\u003cfigcaption>滑座装配连接位置\u003c/figcaption>\u003c/figure>\u003cp>装配完成后检查连接无松动、底座及接触面稳定。紧固作业使用该交付配置规定的工艺，不以相近规格替代；提手和头托不能自行作为吊装点。\u003c/p>\u003ch2 id=\"s3\">3 关节电机校零\u003c/h2>\u003ch3 id=\"s3-1\">3.1 准备与编号\u003c/h3>\u003cp>将调试电脑接入机器人所在网络。按维护权限拆下头部小门及左、右、前胸壳，露出校准位。头部小门有 4 颗螺钉。\u003c/p>\u003cfigure>\u003cimg alt=\"头部小门\" src=\"products/tangpa-edu/assets/manual/image16.png\"/>\u003cfigcaption>头部小门\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"躯体覆盖件位置\" src=\"products/tangpa-edu/assets/manual/image17.png\"/>\u003cfigcaption>躯体覆盖件位置\u003c/figcaption>\u003c/figure>\u003cp>本节校零对象共 14 个电机：头颈 1、2、3、4；躯体 11、12、13、14；左腿 15、17、19；右腿 16、18、20。该计数为本节校零电机范围。\u003c/p>\u003cfigure>\u003cimg alt=\"上半身电机编号\" src=\"products/tangpa-edu/assets/manual/image18.png\"/>\u003cfigcaption>上半身电机编号\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"下半身电机编号\" src=\"products/tangpa-edu/assets/manual/image19.png\"/>\u003cfigcaption>下半身电机编号\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s3-2\">3.2 工装对应关系\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth>工装\u003c/th>\u003cth>电机号\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>卡片 D\u003c/td>\u003ctd>1、3、11、12、15、16、17、18、19、20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱一\u003c/td>\u003ctd>13、14\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱二\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定柱三\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cfigure>\u003cimg alt=\"卡片 D\" src=\"products/tangpa-edu/assets/manual/image20.png\"/>\u003cfigcaption>卡片 D\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"标定柱一\" src=\"products/tangpa-edu/assets/manual/image21.png\"/>\u003cfigcaption>标定柱一\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"标定柱二\" src=\"products/tangpa-edu/assets/manual/image22.png\"/>\u003cfigcaption>标定柱二\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"标定柱三\" src=\"products/tangpa-edu/assets/manual/image23.png\"/>\u003cfigcaption>标定柱三\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s3-3\">3.3 逐关节对齐校零位\u003c/h3>\u003cp>按下列实物图确认对应电机的机械校零位。头颈自上而下为 4、3、2、1；左右躯体及腿部自上而下分别为 11、13、15、17、19 和 12、14、16、18、20。\u003c/p>\u003cfigure>\u003cimg alt=\"1 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image24.png\"/>\u003cfigcaption>1 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"2 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image25.png\"/>\u003cfigcaption>2 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"3 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image26.png\"/>\u003cfigcaption>3 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"4 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image27.png\"/>\u003cfigcaption>4 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"11 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image28.png\"/>\u003cfigcaption>11 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"13 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image29.png\"/>\u003cfigcaption>13 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"15 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image30.png\"/>\u003cfigcaption>15 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"17 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image31.png\"/>\u003cfigcaption>17 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"19 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image32.png\"/>\u003cfigcaption>19 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"12 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image33.png\"/>\u003cfigcaption>12 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"14 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image34.png\"/>\u003cfigcaption>14 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"16 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image35.png\"/>\u003cfigcaption>16 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"18 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image36.png\"/>\u003cfigcaption>18 号电机校零位\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"20 号电机校零位\" src=\"products/tangpa-edu/assets/manual/image37.png\"/>\u003cfigcaption>20 号电机校零位\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s3-4\">3.4 调用标定接口与结果\u003c/h3>\u003cp>确认机械位置和工装正确后，调用 MotorCalibration，指定对应 motor_id。《API 接口参考》第 2 节列出接口与状态语义。返回 STATUS_OK 仅表示已收到子系统状态；必须继续检查 response.state：succeeded 才是标定成功，failed 或 rejected 应停止并处理 message 中的原因。不得仅凭返回码 0 判断校零完成。\u003c/p>\u003ch2 id=\"s4\">4 IMU 工装与标定\u003c/h2>\u003ch3 id=\"s4-1\">4.1 工装安装\u003c/h3>\u003col>\u003cli>关机并可靠支撑，拆下左、右脚掌外观件；每侧拆下脚底最上面和最下面共 4 颗 M3×16 内六角沉头螺钉，保留原件。\u003c/li>\u003cli>每侧用 4 颗 M3×10 内六角圆柱头螺钉，将 4 根 M3×30 双通螺柱固定在对应脚底板 IMU 工装上。\u003c/li>\u003cli>每侧再用 4 颗 M3×10 内六角圆柱头螺钉，将脚掌连接到该侧 4 根螺柱上。两侧共用 16 颗 M3×10 和 8 根螺柱。\u003c/li>\u003cli>核对左右工装方向、连接与稳定性，再进行标定准备。\u003c/li>\u003c/ol>\u003cfigure>\u003cimg alt=\"脚底外观件拆卸螺钉位置\" src=\"products/tangpa-edu/assets/manual/image38.png\"/>\u003cfigcaption>脚底外观件拆卸螺钉位置\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"脚掌外观件拆下后\" src=\"products/tangpa-edu/assets/manual/image39.png\"/>\u003cfigcaption>脚掌外观件拆下后\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"右脚底板 IMU 工装\" src=\"products/tangpa-edu/assets/manual/image40.png\"/>\u003cfigcaption>右脚底板 IMU 工装\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"左脚底板 IMU 工装\" src=\"products/tangpa-edu/assets/manual/image41.png\"/>\u003cfigcaption>左脚底板 IMU 工装\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg alt=\"双脚与 IMU 工装连接\" src=\"products/tangpa-edu/assets/manual/image42.png\"/>\u003cfigcaption>双脚与 IMU 工装连接\u003c/figcaption>\u003c/figure>\u003ch3 id=\"s4-2\">4.2 标定条件\u003c/h3>\u003cp>机器人周围没有人员、线缆或障碍物妨碍关节归零。\u003c/p>\u003cp>机器人的标定工装已安装好。\u003c/p>\u003cp>地面坚硬、水平、稳定，不要在地毯、软垫或振动平台上标定。\u003c/p>\u003cp>IMU 已可靠固定，外壳和安装支架没有松动。\u003c/p>\u003cp>当前没有正常模式、调试模式或其他电机控制流程正在运行。\u003c/p>\u003cp>OTA 升级未在进行。\u003c/p>\u003cp>建议在机器人和 IMU 温度稳定后进行标定。标定期间不要触碰机器人。\u003c/p>\u003cp>开关机阶段保持滑座支撑。进入落地标定阶段前，由授权人员确认标准姿态、支撑转移方式和现场防倾倒安排。\u003c/p>\u003ch3 id=\"s4-3\">4.3 标定操作\u003c/h3>\u003col>\u003cli>手柄的G拨杆往右+B键，机器人所有关节回到零位。\u003c/li>\u003cli>将机器人放置到规定的标准落地姿态。\u003c/li>\u003cli>确认双脚或规定支撑点完全接触地面。\u003c/li>\u003cli>确认机器人没有摇晃、悬空或受到外力。\u003c/li>\u003cli>G拨杆往中+B键。\u003c/li>\u003cli>等待机器人完全静止。\u003c/li>\u003cli>手柄的G拨杆往右+B键。\u003c/li>\u003cli>等待一分钟后，标定结束。\u003c/li>\u003c/ol>\u003cp>等待时间结束后，由授权人员检查姿态及标定状态；异常时停止恢复运行。不要以经过一分钟作为唯一合格判据。\u003c/p>\u003ch3 id=\"s4-4\">4.4 恢复外观与维护\u003c/h3>\u003cp>在可靠支撑下关机，拆除标定工装，再分别使用每侧原有 4 颗 M3×16 沉头螺钉恢复脚掌外观件。复核连接和外观后再上电检查。至少每 180 天安排 IMU 标定；站姿异常时先停用并排查。\u003c/p>\u003ch2 id=\"s5\">5 配置、诊断与维护记录\u003c/h2>\u003cp>AP 配网见《用户手册》第 5.1 节。开发机配置与日志见《SDK 使用指南》第 2～3 节。系统状态、诊断和电量接口见《API 接口参考》第 3 节。\u003c/p>\u003cp>维护记录应包含本体序列号、软硬件版本、原因、受影响电机、工装、操作人员、时间及结果。标定失败、结构松动或异常摩擦未排除前，不恢复常规运行。\u003c/p>", "version": "V1.0", "date": "2026.11.17", "pdf": "products/tangpa-edu/pdf/tangpa-edu/镋钯机器人技术与维护手册-V1.0.pdf", "online": "index.html#tangpa-edu/technical-manual", "pages": 12, "bytes": 12173649}, {"id": "sdk-guide", "title": "SDK 使用指南", "summary": "发行前提、CMake、连接配置、日志、只读起步与示例", "html": "\u003ch2 id=\"s1\">1 环境与发行包\u003c/h2>\u003cp>Tangpa SDK 提供 ControlApiClient 和 SystemApiClient，分别用于控制/订阅/UWB 配置，以及诊断/状态/电量读取。采用 C++17 和 CMake。开始构建前，应取得与设备系统及架构匹配的完整 SDK 发行包，包含头文件、库文件及 CMake 包配置。\u003c/p>\u003cp>随附 SDK 资料包包含说明、示例、配置和 proto 协议定义，不能代替完整 SDK 二进制发行包。先确认完整发行包可被 find_package(tangpa_sdk_client REQUIRED) 找到。\u003c/p>\u003ch2 id=\"s2\">2 工程与构建\u003c/h2>\u003ch3 id=\"s2-1\">2.1 CMake 工程配置\u003c/h3>\n\u003cp>SDK 提供了 CMake 包配置文件，通过 \u003ccode>find_package\u003c/code> 即可引入。\u003c/p>\n\u003cp>\u003cstrong>项目目录结构：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>my_project/\n  CMakeLists.txt        # 顶层 CMake\n  main.cpp              # 源代码\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>CMakeLists.txt：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-cmake\">cmake_minimum_required(VERSION 3.8)\nproject(\"my_project\" VERSION 1.0.0 LANGUAGES CXX)\n\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\n\n# 将 SDK 根目录加入搜索路径（指向 SDK 包的顶级目录）\nlist(APPEND CMAKE_PREFIX_PATH \"/path/to/tangpa_sdk_client\")\nfind_package(tangpa_sdk_client REQUIRED)\n\nadd_executable(my_app main.cpp)\ntarget_link_libraries(my_app PRIVATE tangpa_sdk_client::chric_tangpa_sdk_module_api)\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>构建：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">cd my_project\nmkdir build &amp;&amp; cd build\ncmake ..\nmake -j$(nproc)\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>关于运行时库路径\u003c/strong>：SDK 的所有 .so 均内置 \u003ccode>$ORIGIN\u003c/code> 相对 RPATH，无需设置 \u003ccode>LD_LIBRARY_PATH\u003c/code>。将 SDK 目录整体移动到任意位置均可正常运行。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"s2-2\">2.2 就地构建（SDK 自带的 CMake 模板）\u003c/h3>\n\u003cp>SDK 包内已包含 CMake 模板项目，可直接在此基础上开发：\u003c/p>\n\u003cpre>\u003ccode class=\"language-cmake\"># 指向 SDK 自己\nlist(APPEND CMAKE_PREFIX_PATH \"${CMAKE_SOURCE_DIR}\")\nfind_package(tangpa_sdk_client REQUIRED)\n\u003c/code>\u003c/pre>\n\u003cp>就地构建时，CMake 会为二进制注入 SDK 库的绝对路径 RUNPATH。如果不需要，请在 \u003ccode>find_package\u003c/code> 之前设置：\u003c/p>\n\u003cpre>\u003ccode class=\"language-cmake\">set(CMAKE_SKIP_BUILD_RPATH ON)\n\u003c/code>\u003c/pre>\u003ch2 id=\"s3\">3 连接、配置与日志\u003c/h2>\u003cp>192.168.1.100:50051 为示例目标地址，替换为本体显示的实际 IP 和服务端口。localhost 仅适用于客户端和服务端在同一机器运行的场景。\u003c/p>\u003cp>SDK 通过 \u003ccode>config/config.yaml\u003c/code> 管理配置。\u003ccode>InterfacesClient\u003c/code> 构造时会自动加载并初始化日志系统。\u003c/p>\n\u003ch3 id=\"s3-1\">3.1 gRPC 客户端\u003c/h3>\n\u003cpre>\u003ccode class=\"language-yaml\">grpc_client:\n  connection:\n    default_target: \"192.168.1.100:50051\"\n    channel_ready_timeout_ms: 5000    # 通道就绪超时 (ms)\n  channel:\n    max_receive_mb: 100               # 最大接收消息大小 (MB)\n    max_send_mb: 100                  # 最大发送消息大小 (MB)\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s3-2\">3.2 日志\u003c/h3>\n\u003cpre>\u003ccode class=\"language-yaml\">logging:\n  log_level: 3                        # 0=FATAL, 1=ERROR, 2=WARN, 3=INFO, 4=DEBUG\n  log_dir: \"SDK-Client/logs\"          # 日志目录（相对可执行程序路径或绝对路径）\n  max_file_size_mb: 3                 # 单文件最大大小 (MB)\n  max_files_per_level: 10             # 每级别最多保留文件数\n  enable_async: true                  # true=异步写, false=同步写\n  enable_console_output: true         # true=控制台输出\n  enable_simple_output: true          # true=简洁格式, false=详细格式（含文件、行号、函数名）\n\u003c/code>\u003c/pre>\n\u003cp>日志按级别分目录输出，文件命名格式为 \u003ccode>log_&lt;pid&gt;_&lt;日期&gt;_&lt;时间&gt;_&lt;纳秒&gt;.txt\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode>SDK-Client/logs/\n  fatal/\n  error/\n  warning/\n  info/\n  debug/\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>编程方式控制（在创建任何 SDK 对象之前调用）：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-cpp\">#include \"chric/common/Log/wlog.hpp\"\n\n// 使用自定义配置文件\nWLogInitWithConfig(\"path/to/my_config.yaml\");\n\n// 或使用默认配置（DEBUG 级别，自动生成日志目录）\nWLogInit();\n\u003c/code>\u003c/pre>\u003ch2 id=\"s4\">4 只读起步示例\u003c/h2>\u003cp>先进行只读诊断，确认 Connect 成功且接口返回值为 0 后，再使用返回数据。下面示例不发送运动指令。\u003c/p>\u003cpre>\u003ccode class=\"language-cpp\">#include &lt;iostream&gt;\n#include \"chric/robot/tangpa/tangpa_system_api.h\"\n\nusing namespace humanoid_robot::sdk_client::robot;\nint main() {\n    tangpa_system_api::SystemApiClient client;\n    auto status = client.Connect(\"192.168.1.100\", 50051);\n    if (!status) {\n        std::cerr &lt;&lt; status.message() &lt;&lt; std::endl;\n        return 1;\n    }\n    tangpa_system_api::RobotStatus robot;\n    uint32_t rc = client.GetRobotStatus(robot);\n    if (rc == 0) std::cout &lt;&lt; robot.DebugString() &lt;&lt; std::endl;\n    client.Disconnect();\n    return rc == 0 ? 0 : 2;\n}\n\u003c/code>\u003c/pre>\u003cp>订阅接口返回大于 0 的订阅 ID 才表示成功；保存 ID，在回调使用完成后取消订阅，再断开客户端。连接返回 Status；业务查询通常返回 uint32_t；Disconnect 返回 void，IsConnected 返回 bool。\u003c/p>\u003ch2 id=\"s5\">5 示例与故障排查\u003c/h2>\u003cp>SDK 包内 \u003ccode>examples/\u003c/code> 目录提供了可编译运行的示例代码。\u003c/p>\n\u003cp>\u003cstrong>构建：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">cd tangpa_sdk_client\nmkdir build &amp;&amp; cd build\ncmake ..\nmake -j$(nproc)\n\u003c/code>\u003c/pre>\n\u003cp>构建完成后二进制在 \u003ccode>bin/\u003c/code> 目录下。有 data 文件的示例（如 benchmark）会输出到独立子目录，同时自动复制其 \u003ccode>data/\u003c/code> 文件夹。CMake 会自动将 \u003ccode>config/\u003c/code> 复制到构建目录，无需手动操作。\u003c/p>\n\u003cp>\u003cstrong>运行：\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\"># 无 data 依赖的示例（平铺在 bin/ 下）\n./bin/CHRIC_SDKClient_test\n./bin/system_test_gui\n\n# 有 data 依赖的示例（独立子目录）\n./bin/tangpa_api_benchmark/CHRIC_SDKClient_benchmark\n./bin/control_test_gui/control_test_gui\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>示例\u003c/th>\n\u003cth>二进制\u003c/th>\n\u003cth>运行路径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>功能测试\u003c/td>\n\u003ctd>\u003ccode>CHRIC_SDKClient_test\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>./bin/CHRIC_SDKClient_test\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>性能基准\u003c/td>\n\u003ctd>\u003ccode>CHRIC_SDKClient_benchmark\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>./bin/tangpa_api_benchmark/CHRIC_SDKClient_benchmark\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>控制API交互测试\u003c/td>\n\u003ctd>\u003ccode>control_test_gui\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>./bin/control_test_gui/control_test_gui\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统API交互测试\u003c/td>\n\u003ctd>\u003ccode>system_test_gui\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>./bin/system_test_gui\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>运行前请确保已根据实际环境修改 \u003ccode>config/config.yaml\u003c/code> 中的 \u003ccode>default_target\u003c/code> 地址和端口。\u003c/p>\n\u003c/blockquote>\u003cp>运动与标定示例只在授权开发环境、机械支撑和现场监护下运行。发送函数非阻塞返回不代表动作完成；断开连接也不能作为停止运动指令。具体契约见《API 接口参考》第 1～3 节。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>问题\u003c/th>\u003cth>检查顺序\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>找不到 CMake 包\u003c/td>\u003ctd>完整发行包是否存在；CMAKE_PREFIX_PATH 是否指向正确根目录；架构和依赖是否匹配。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>连接失败\u003c/td>\u003ctd>本体 IP、服务端口、网络可达性及服务运行状态。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>无数据/订阅无回调\u003c/td>\u003ctd>返回码/订阅 ID；对应服务与数据流；网络及日志。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "version": "V1.0", "date": "2026.11.17", "pdf": "products/tangpa-edu/pdf/tangpa-edu/镋钯机器人SDK使用指南-V1.0.pdf", "online": "index.html#tangpa-edu/sdk-guide", "pages": 6, "bytes": 971034}, {"id": "api-reference", "title": "API 接口参考", "summary": "客户端签名、返回语义、错误码、订阅与协议字段", "html": "\u003ch2 id=\"s1\">1 接口约定\u003c/h2>\u003cp>本册为 Tangpa SDK C++ 客户端接口参考。命名空间保留 humanoid_robot::sdk_client::robot 及 tangpa_control_api、tangpa_system_api。连接返回 Status，发布/查询/取消订阅返回 uint32_t，订阅返回 uint64_t ID，断开返回 void，连接状态返回 bool。\u003c/p>\u003cp>请求被接受、发布函数返回和最终运动完成是不同状态。MotorCalibration 返回 0 时仍需检查 response.state；failed 和 rejected 不是成功。运动发布接口不提供动作完成保证。\u003c/p>\u003ch2 id=\"s2\">2 ControlApiClient\u003c/h2>\u003ch3 id=\"s2-1\">2.1 连接管理\u003c/h3>\n\u003cpre>\u003ccode class=\"language-cpp\">Status Connect(const std::string&amp; server_address, int port);\nStatus Connect(const std::string&amp; target);\nStatus Connect();\nvoid Disconnect();\nbool IsConnected() const;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>重载\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>Connect(address, port)\u003c/code>\u003c/td>\n\u003ctd>指定地址和端口连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Connect(target)\u003c/code>\u003c/td>\n\u003ctd>指定完整目标字符串连接（如 \u003ccode>\"192.168.0.1:50051\"\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Connect()\u003c/code>\u003c/td>\n\u003ctd>读取 \u003ccode>config/config.yaml\u003c/code> 中 \u003ccode>grpc_client.connection.default_target\u003c/code> 自动连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Disconnect()\u003c/code>\u003c/td>\n\u003ctd>断开连接\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>注意：\u003c/strong> 已连接时重复调用 \u003ccode>Connect\u003c/code> 会返回错误，需先调用 \u003ccode>Disconnect()\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"s2-2\">2.2 数据快照：GetImuData\u003c/h3>\u003cpre>\u003ccode class=\"language-cpp\">uint32_t GetImuData(Imu&amp; imu_status);\n\u003c/code>\u003c/pre>\n\u003cp>获取一次 IMU 数据快照。\u003ccode>imu_status\u003c/code> 为 sensor_msgs/Imu（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/ros2/sensor_msgs/Imu.proto\">proto\u003c/a>）。网络通信超时 5 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>IMU 子系统错误，未获取到数据\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层通信错误，返回数据序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层服务端异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s2-3\">2.3 控制接口（gRPC）\u003c/h3>\n\u003ch4 id=\"s2-3-1\">2.3.1 MotorCalibration\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t MotorCalibration(const MotorCalibrationRequest&amp; request, MotorCalibrationResponse&amp; response);\n\u003c/code>\u003c/pre>\n\u003cp>对指定电机（\u003ccode>motor_id\u003c/code>）执行标定。\u003ccode>request\u003c/code> 为 \u003ccode>MotorCalibrationRequest\u003c/code>（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/api_service/tangpa/proto/control.proto\">proto\u003c/a>），包含 motor_id；\u003ccode>response\u003c/code> 为 \u003ccode>MotorCalibrationResponse\u003c/code>（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/api_service/tangpa/proto/control.proto\">proto\u003c/a>），含 state、motor_id、message。服务超时 5 秒，网络通信超时 30 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接口层通信错误，参数解析失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_INVALID_PARAMETER\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200006\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层通信错误，参数反序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_DESERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000004\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端错误，响应序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端超时（有/无缓存）\u003c/td>\n\u003ctd>\u003ccode>ERROR_TIMEOUT\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000001\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端，异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收到子系统 succeeded/failed/rejected\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s2-4\">2.4 控制接口（发布）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t SendMotorControl(const Cmotorcommand&amp; command);\nuint32_t SendJoyControl(const Joy&amp; command);\n\u003c/code>\u003c/pre>\n\u003cp>非阻塞，直接返回。适用高频控制场景，无需超时。\u003c/p>\n\u003ch3 id=\"s2-5\">2.5 订阅接口\u003c/h3>\n\u003cpre>\u003ccode class=\"language-cpp\">uint64_t SubscribeImu(const std::function&lt;void(const std::shared_ptr&lt;const Imu&gt;&amp;)&gt;&amp; callback);\nuint64_t SubscribeJoy(const std::function&lt;void(const std::shared_ptr&lt;const Joy&gt;&amp;)&gt;&amp; callback);\nuint64_t SubscribeJointState(const std::function&lt;void(const std::shared_ptr&lt;const JointState&gt;&amp;)&gt;&amp; callback);\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>回调参数类型\u003c/th>\n\u003cth>proto\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>Imu\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/ros2/sensor_msgs/Imu.proto\">Imu.proto\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Joy\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/ros2/sensor_msgs/Joy.proto\">Joy.proto\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>JointState\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/ros2/sensor_msgs/JointState.proto\">JointState.proto\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>&gt; 0\u003c/code>\u003c/td>\n\u003ctd>订阅 ID，用于取消订阅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003ctd>订阅失败\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t UnsubscribeImu(uint64_t subscription_id);\nuint32_t UnsubscribeJoy(uint64_t subscription_id);\nuint32_t UnsubscribeJointState(uint64_t subscription_id);\n\u003c/code>\u003c/pre>\n\u003cp>SDK 自动管理数据流：首次订阅启用服务端发布，最后取消时停止发布。订阅/取消为本地操作，无网络超时。\u003c/p>\n\u003ch3 id=\"s2-6\">2.6 UWB 配置与数据订阅\u003c/h3>\n\u003ch4 id=\"s2-6-1\">2.6.1 SetUWBConfigurator\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t SetUWBConfigurator(const UWBRequestHardware&amp; request);\n\u003c/code>\u003c/pre>\n\u003cp>配置 UWB 硬件参数。\u003ccode>request\u003c/code> 为 \u003ccode>UWBRequestHardware\u003c/code>（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/api_service/tangpa/proto/control.proto\">proto\u003c/a>），含 target_device、target_role、baud。服务超时 5 秒，网络通信超时 30 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接口层通信错误，参数解析失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_INVALID_PARAMETER\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200006\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层通信错误，参数反序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_DESERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000004\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子系统错误，configurator client 超时\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>configurator 子系统错误，参数设置失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>trigger client 子系统错误，超时\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子系统错误，trigger 执行失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端，异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s2-6-2\">2.6.2 SetUWBConfigManager\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t SetUWBConfigManager(const UWBRequestConfig&amp; request);\n\u003c/code>\u003c/pre>\n\u003cp>配置 UWB 跟随参数。\u003ccode>request\u003c/code> 为 \u003ccode>UWBRequestConfig\u003c/code>（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/api_service/tangpa/proto/control.proto\">proto\u003c/a>），含 target_role、target_distance。服务超时 5 秒，网络通信超时 30 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接口层通信错误，参数解析失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_INVALID_PARAMETER\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200006\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口层通信错误，参数反序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_DESERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000004\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子系统错误，config client 超时\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子系统错误，config 参数设置失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端，异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s2-6-3\">2.6.3 SubscribeUWBData\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint64_t SubscribeUWBData(const std::function&lt;void(const std::shared_ptr&lt;const LinktrackNodeframe7&gt;&amp;)&gt;&amp; callback);\n\u003c/code>\u003c/pre>\n\u003cp>订阅 UWB 定位数据。\u003ccode>callback\u003c/code> 参数为 \u003ccode>LinktrackNodeframe7\u003c/code>（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/tangpa_ros2_interfaces/control/nlink_parser/LinktrackNodeframe7.proto\">proto\u003c/a>），含 role、id、nodes 等字段。通过 zenoh 频道 \u003ccode>zenoh/nlink_linktrack_nodeframe7\u003c/code> 接收数据。SDK 自动管理数据流：首次订阅启用服务端发布，最后取消时停止发布。无网络超时。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>&gt; 0\u003c/code>\u003c/td>\n\u003ctd>订阅 ID，用于取消订阅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003ctd>订阅失败\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s2-6-4\">2.6.4 UnsubscribeUWBData\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t UnsubscribeUWBData(uint64_t subscription_id);\n\u003c/code>\u003c/pre>\n\u003cp>取消 UWB 定位数据订阅。本地操作，无网络超时。\u003c/p>\u003ch2 id=\"s3\">3 SystemApiClient\u003c/h2>\u003ch3 id=\"s3-1\">3.1 连接管理\u003c/h3>\n\u003cpre>\u003ccode class=\"language-cpp\">Status Connect(const std::string&amp; server_address, int port);\nStatus Connect(const std::string&amp; target);\nStatus Connect();\nvoid Disconnect();\nbool IsConnected() const;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>重载\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>Connect(address, port)\u003c/code>\u003c/td>\n\u003ctd>指定地址和端口连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Connect(target)\u003c/code>\u003c/td>\n\u003ctd>指定完整目标字符串连接（如 \u003ccode>\"192.168.0.1:50051\"\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Connect()\u003c/code>\u003c/td>\n\u003ctd>读取 \u003ccode>config/config.yaml\u003c/code> 中 \u003ccode>grpc_client.connection.default_target\u003c/code> 自动连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Disconnect()\u003c/code>\u003c/td>\n\u003ctd>断开连接\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>注意：\u003c/strong> 已连接时重复调用 \u003ccode>Connect\u003c/code> 会返回错误，需先调用 \u003ccode>Disconnect()\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"s3-2\">3.2 数据获取\u003c/h3>\n\u003ch4 id=\"s3-2-1\">3.2.1 GetDiagnosticData\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t GetDiagnosticData(DiagnosticMessage&amp; diagnostic_message);\n\u003c/code>\u003c/pre>\n\u003cp>获取诊断数据。\u003ccode>diagnostic_message\u003c/code> 为 \u003ccode>DiagnosticMessage\u003c/code>（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/api_service/tangpa/proto/system.proto\">proto\u003c/a>），含 messages（DiagnosticArray）和 result（int32）。网络通信超时 5 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>子系统错误，未获取到数据\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端错误，序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s3-2-2\">3.2.2 GetRobotStatus\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t GetRobotStatus(RobotStatus&amp; robot_status);\n\u003c/code>\u003c/pre>\n\u003cp>获取机器人状态。\u003ccode>robot_status\u003c/code> 为 \u003ccode>RobotStatus\u003c/code>（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/api_service/tangpa/proto/system.proto\">proto\u003c/a>），含 state_id、state_desc、battery、error_codes。网络通信超时 5 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>子系统错误，未获取到数据\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端错误，序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端异常（含 JSON 解析异常）\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"s3-2-3\">3.2.3 GetBatteryPercentage\u003c/h4>\n\u003cpre>\u003ccode class=\"language-cpp\">uint32_t GetBatteryPercentage(BatteryPercentage&amp; battery_percentage);\n\u003c/code>\u003c/pre>\n\u003cp>获取电池电量百分比。\u003ccode>battery_percentage\u003c/code> 为 \u003ccode>BatteryPercentage\u003c/code>（\u003ca href=\"products/tangpa-edu/assets/sdk/data/proto/api_service/tangpa/proto/system.proto\">proto\u003c/a>），含 info（电池信息）。网络通信超时 5 秒。\u003c/p>\n\u003cp>\u003cstrong>返回码：\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>返回码\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>子系统错误，未获取到数据\u003c/td>\n\u003ctd>\u003ccode>ERROR_SUBSYSTEM_NOT_READY\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00200007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端错误，序列化失败\u003c/td>\n\u003ctd>\u003ccode>ERROR_SERIALIZE_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00000003\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统接口层服务端异常\u003c/td>\n\u003ctd>\u003ccode>ERROR_FAILED\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x7FFFFFFF\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功\u003c/td>\n\u003ctd>\u003ccode>STATUS_OK\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\u003ch2 id=\"s4\">4 数据类型与字段\u003c/h2>\u003cp>以下表格列出随附 proto 的字段类型及注释。未定义单位、量程、坐标系或枚举映射的字段，必须由设备控制配置指定后使用；不得将示例数值当作运动限值。普通用户跟随间距固定约 1.8 m，SDK 的 target_distance 属于开发配置权限。\u003c/p>\u003ch3 id=\"s4-1\">4.1 control.proto\u003c/h3>\u003cp>JoyControllerResponse\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>results\u003c/td>\u003ctd>ros2.diagnostic_msgs.DiagnosticArray\u003c/td>\u003ctd>3\u003c/td>\u003ctd>协议字段\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>UWBRequestConfig\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>target_role\u003c/td>\u003ctd>int32\u003c/td>\u003ctd>1\u003c/td>\u003ctd>协议字段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>target_distance\u003c/td>\u003ctd>double\u003c/td>\u003ctd>2\u003c/td>\u003ctd>协议字段\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>UWBRequestHardware\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>target_device\u003c/td>\u003ctd>string\u003c/td>\u003ctd>1\u003c/td>\u003ctd>协议字段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>target_role\u003c/td>\u003ctd>int32\u003c/td>\u003ctd>2\u003c/td>\u003ctd>协议字段\u003c/td>\u003c/t gnosticMessage\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>messages\u003c/td>\u003ctd>ros2.diagnostic_msgs.DiagnosticArray\u003c/td>\u003ctd>1\u003c/td>\u003ctd>诊断结果数组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>result\u003c/td>\u003ctd>int32\u003c/td>\u003ctd>2\u003c/td>\u003ctd>执行结果\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>RobotStatus\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>state_id\u003c/td>\u003ctd>int64\u003c/td>\u003ctd>1\u003c/td>\u003ctd>状态码\u003c/td>\u003c/tr>\u003ctr>\u003ctd>state_desc\u003c/td>\u003ctd>string\u003c/td>\u003ctd>2\u003c/td>\u003ctd>状态描述\u003c/td>\u003c/tr>\u003ctr>\u003ctd>battery\u003c/td>\u003ctd>float\u003c/td>\u003ctd>3\u003c/td>\u003ctd>当前电量\u003c/td>\u003c/tr>\u003ctr>\u003ctd>error_codes\u003c/td>\u003ctd>repeated string\u003c/td>\u003ctd>4\u003c/td>\u003ctd>错误码列表（string 数组）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch3 id=\"s4-3\">4.3 Imu.proto\u003c/h3>\u003cp>Imu\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>header\u003c/td>\u003ctd>ros2.std_msgs.Header\u003c/td>\u003ctd>1\u003c/td>\u003ctd>消息头\u003c/td>\u003c/tr>\u003ctr>\u003ctd>orientation\u003c/td>\u003ctd>ros2.geometry_msgs.Quaternion\u003c/td>\u003ctd>2\u003c/td>\u003ctd>协议字段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>orientation_covariance\u003c/td>\u003ctd>repeated double\u003c/td>\u003ctd>3\u003c/td>\u003ctd>协议字段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>angular_velocity\u003c/td>\u003ctd>ros2.geometry_msgs.Vector3\u003c/td>\u003ctd>4\u003c/td>\u003ctd>协议字段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>angular_velocity_covariance\u003c/td>\u003ctd>repeated double\u003c/td>\u003ctd> h>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>motor_ids\u003c/td>\u003ctd>repeated uint32\u003c/td>\u003ctd>1\u003c/td>\u003ctd>电机ID数组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>control_modes\u003c/td>\u003ctd>repeated uint32\u003c/td>\u003ctd>2\u003c/td>\u003ctd>控制模式数组 0:位置 1:速度 2:力矩 3:力位混合\u003c/td>\u003c/tr>\u003ctr>\u003ctd>positions\u003c/td>\u003ctd>repeated float\u003c/td>\u003ctd>3\u003c/td>\u003ctd>位置值数组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>speeds\u003c/td>\u003ctd>repeated float\u003c/td>\u003ctd>4\u003c/td>\u003ctd>速度值数组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>torques\u003c/td>\u003ctd>repeated float\u003c/td>\u003ctd>5\u003c/td>\u003ctd>力矩数组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>kps\u003c/td>\u003ctd>repeated float\u003c/td>\u003ctd>6\u003c/td>\u003ctd>kp值数组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>kds\u003c/td>\u003ctd>repeated float\u003c/td>\u003ctd>7\u003c/td>\u003ctd>kd值数组\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch3 id=\"s4-7\">4.7 LinktrackNode7.proto\u003c/h3>\u003cp>LinktrackNode7\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>role\u003c/td>\u003ctd>uint32\u003c/td>\u003ctd>1\u003c/td>\u003ctd>节点角色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>id\u003c/td>\u003ctd>uint32\u003c/td>\u003ctd>2\u003c/td>\u003ctd>节点 ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>dis\u003c/td>\u003ctd>float\u003c/td>\u003ctd>3\u003c/td>\u003ctd>距离 distance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>angle0\u003c/td>\u003ctd>float\u003c/td>\u003ctd>4\u003c/td>\u003ctd>方位角/俯仰角\u003c/td>\u003c/tr>\u003ctr>\u003ctd>angle1\u003c/td>\u003ctd>float\u003c/td>\u003ctd>5\u003c/td>\u003ctd>方位角/俯仰角\u003c/td>\u003c/tr>\u003ctr>\u003ctd>fp_rssi\u003c/td>\u003ctd>float\u003c/td>\u003ctd>6\u003c/td>\u003ctd>First Path RSSI（首径信号强度）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rx_rssi\u003c/td>\u003ctd>float\u003c/td>\u003ctd>7\u003c/td>\u003ctd>Receive RSSI（接收总信号强度）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch3 id=\"s4-8\">4.8 LinktrackNodeframe7.proto\u003c/h3>\u003cp>LinktrackNodeframe7\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>编号\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>role\u003c/td>\u003ctd>uint32\u003c/td>\u003ctd>1\u003c/td>\u003ctd>本帧发送者/本设备角色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>id\u003c/td>\u003ctd>uint32\u003c/td>\u003ctd>2\u003c/td>\u003ctd>本帧发送者的ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>local_time\u003c/td>\u003ctd>uint32\u003c/td>\u003ctd>3\u003c/td>\u003ctd>设备本地时间戳\u003c/td>\u003c/tr>\u003ctr>\u003ctd>system_time\u003c/td>\u003ctd>uint32\u003c/td>\u003ctd>4\u003c/td>\u003ctd>系统时间戳\u003c/td>\u003c/tr>\u003ctr>\u003ctd>voltage\u003c/td>\u003ctd>float\u003c/td>\u003ctd>5\u003c/td>\u003ctd>设备电压\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nodes\u003c/td>\u003ctd>repeated LinktrackNode7\u003c/td>\u003ctd>6\u003c/td>\u003ctd>多个节点测量结果\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch2 id=\"s5\">5 调用边界与结果处理\u003c/h2>\u003cp>Cmotorcommand 中 motor_ids 与其余控制数组按相同电机顺序配对。控制模式为 0 位置、1 速度、2 力矩、3 力位混合。具体关节限位、增益、方向及单位须来自匹配版本的控制配置；本册不提供可直接执行的运动增益或位置示例。\u003c/p>\u003cp>BatteryPercentage.info 是 string；RobotStatus.battery 是 float。不要将前者直接当作数值，也不要在没有服务约定时假设后者的标度。连接、线程及资源的基本使用见《SDK 使用指南》第 3～4 节。\u003c/p>", "version": "V1.0", "date": "2026.11.17", "pdf": "products/tangpa-edu/pdf/tangpa-edu/镋钯机器人API接口参考-V1.0.pdf", "online": "index.html#tangpa-edu/api-reference", "pages": 12, "bytes": 985231}], "videos": [{"id": "guide-1", "title": "如何安装电池", "category": "日常操作", "status": "ready", "src": "products/tangpa-edu/assets/videos/guide-1.mp4", "poster": "products/tangpa-edu/assets/videos/guide-1.jpg"}, {"id": "guide-2", "title": "启动镋钯机器人", "category": "日常操作", "status": "ready", "src": "products/tangpa-edu/assets/videos/guide-2.mp4", "poster": "products/tangpa-edu/assets/videos/guide-2.jpg"}, {"id": "guide-3", "title": "遥控模式操作说明", "category": "日常操作", "status": "ready", "src": "products/tangpa-edu/assets/videos/guide-3.mp4", "poster": "products/tangpa-edu/assets/videos/guide-3.jpg"}, {"id": "guide-4", "title": "关闭机器与电池充电", "category": "日常操作", "status": "ready", "src": "products/tangpa-edu/assets/videos/guide-4.mp4", "poster": "products/tangpa-edu/assets/videos/guide-4.jpg"}, {"id": "guide-5", "title": "启动镋钯机器人（开发者模式）", "category": "开发调试", "status": "ready", "src": "products/tangpa-edu/assets/videos/guide-5.mp4", "poster": "products/tangpa-edu/assets/videos/guide-5.jpg"}]}, {"id": "raydino", "line": "RayX", "name": "RayDino（恐龙）", "english_name": "RayDino", "model": "RayDino", "resources_page": "products/raydino/resources.html", "documents": [{"id": "manual", "title": "用户手册", "version": "V1.3", "date": "2026.11.23", "pdf": "PDF/raydino/RayDino-manual-V1.3.pdf", "online": "index.html#raydino/manual", "pages": 11, "bytes": 7048844, "summary": "安全、启动、日常操作、电池充电与维护", "html": "\u003ch2 id=\"s1\">1 安全须知\u003c/h2>\n\u003ch3 id=\"s1-1\">1.1 使用环境\u003c/h3>\n\u003cp>在平整、干燥、稳固且无杂物的地面使用机器人。保持机器人在视线范围内，远离台阶、桌沿、水源、热源及易碎物品。\u003c/p>\n\u003cp>开始行走、转向或执行技能前，确认周围有足够活动空间，人员和物品不会进入机器人的运动范围。初次操作时，小幅推动摇杆，先进行短距离测试。\u003c/p>\n\u003ch3 id=\"s1-2\">1.2 运动部件\u003c/h3>\n\u003cp>机器人动作时，将手指、头发、衣物和线缆远离头部、关节及嘴部。夹取物品时，不将手指伸入嘴部接触区域。\u003c/p>\n\u003cp>不要在关节带力时强行扳动头部或肢体。搬运前关闭机器人电源，托住机身主体，不提拉头部、嘴部、腿部或线缆。\u003c/p>\n\u003cp>机器人尚未完成初始化、恢复站姿前，不发送行走和技能指令。不要在倒地或卡住状态下反复触发动作。\u003c/p>\n\u003ch3 id=\"s1-3\">1.3 电池与充电\u003c/h3>\n\u003cp>电池应从机器人上拆下后，通过白色插头连接配套充电转换器充电；黄色插头在充电时与机器人保持断开。拆装电池前，先关闭机器人并确认断电。仅使用与交付电池匹配的充电设备，不自行拆解电池。\u003c/p>\n\u003cp>电池、线缆或充电设备出现破损、鼓包、异味或异常发热时，停止使用。充电过程中保持设备干燥、通风，远离热源和易燃物品，并全程有人值守。\u003c/p>\n\u003ch3 id=\"s1-4\">1.4 异常处理\u003c/h3>\n\u003cp>出现持续抖动、动作异常、卡住或跌倒时，停止继续发送动作指令，让周围人员远离运动部件。不要用手硬掰关节，不反复尝试技能动作。\u003c/p>\n\u003cp>若机器人仍能响应遥控器，可按 START 菜单键使机器人回到倒地姿态，待动作结束后关闭手柄，再关闭尾部电源。\u003c/p>\n\u003cp>若遥控器无法控制机器人，不接触运动关节；确认能够安全触及尾部电源开关后再关闭电源。无法安全操作或异常持续时，联系交付方或技术支持处理。\u003c/p>\n\u003ch2 id=\"s2\">2 认识 RayDino\u003c/h2>\n\u003ch3 id=\"s2-1\">2.1 产品概述\u003c/h3>\n\u003cp>RayDino 是一款面向科技爱好者和开发者的小型双足机器人。机身具备头部和双腿关节，可接收控制端指令执行行走、坐站、夹取物品及踢腿等动作。\u003c/p>\n\u003cp>机身摄像头用于采集图像，麦克风和扬声器用于声音采集与播放。电源开关位于机器人的尾部，电池可在关机断电后拆卸更换。\u003c/p>\n\u003cdiv class=\"raydino-views\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:420px;margin:24px auto;text-align:center;\">\u003cfigure style=\"margin:0;min-width:0;\">\u003cimg alt=\"RayDino 本体侧前方\" src=\"assets/raydino/robot.png\" style=\"display:block;width:100%;height:240px;max-width:190px;margin:0 auto;object-fit:contain;\"/>\u003cfigcaption style=\"margin-top:8px;font-size:12px;color:#65756d;\">侧前方\u003c/figcaption>\u003c/figure>\u003cfigure style=\"margin:0;min-width:0;\">\u003cimg alt=\"RayDino 本体背面\" src=\"assets/raydino/rear.png\" style=\"display:block;width:100%;height:240px;max-width:190px;margin:0 auto;object-fit:contain;\"/>\u003cfigcaption style=\"margin-top:8px;font-size:12px;color:#65756d;\">背面\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003ch3 id=\"s2-2\">2.2 主要部件\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>部件\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>头部与嘴部\u003c/td>\n\u003ctd>调整头部姿态，通过嘴部开合夹取适配的小件物品。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>颈部与躯干\u003c/td>\n\u003ctd>连接头部和下肢，参与姿态调整。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>腿部与足部\u003c/td>\n\u003ctd>支撑机身并执行行走、坐站及踢腿等动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>摄像头\u003c/td>\n\u003ctd>采集前方图像。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>麦克风与扬声器\u003c/td>\n\u003ctd>采集声音，播放语音及提示音。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>快拆电池与尾部电源开关\u003c/td>\n\u003ctd>提供电能，并用于接通或关闭机器人电源。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s2-3\">2.3 电源与控制端\u003c/h3>\n\u003cp>使用尾部电源开关接通或关闭机器人电源。机器人与已配对的实体遥控器连接后，可通过遥控器完成初始化、姿态切换和动作控制。\u003c/p>\n\u003cp>长按 START 菜单键完成初始化与使能时，机器人仍处于倒地状态；随后短按一次 START，机器人恢复站姿，才可开始行走。结束使用时，再按 START 回到倒地姿态后关机。\u003c/p>\n\u003ch2 id=\"s3\">3 使用前准备与启动\u003c/h2>\n\u003ch3 id=\"s3-1\">3.1 开箱与安装电池\u003c/h3>\n\u003cp>在平整地面打开包装，检查机身、电池、遥控器和随箱附件有无可见损伤。按随箱交付清单核对物品，发现破损或缺件时先联系交付方。\u003c/p>\n\u003cp>关闭尾部电源，装入并固定电池，连接黄色供电插头，收好白色充电插头及导线。\u003c/p>\n\u003ch3 id=\"s3-2\">3.2 上电前摆放与检查\u003c/h3>\n\u003cp>上电前，将机器人平放在地面，使头部和关节自然伸直。检查关节、足部及线缆有无异物、破损或松动，清理周围的障碍物。\u003c/p>\n\u003cp>确认电池状态满足使用需要。需要充电时，按第 5 章将电池拆下充电，不通过机身直接给电池充电。\u003c/p>\n\u003ch3 id=\"s3-3\">3.3 启动步骤\u003c/h3>\n\u003col>\n\u003cli>\n\u003cp>将机器人按上述要求平放在地面，人员远离关节和嘴部的运动范围。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>操作机器人尾部的电源开关，接通机器人电源。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>打开已配对的实体遥控器，确认遥控器已连接目标机器人。首次配对由交付人员协助完成。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>长按遥控器 START 菜单键，完成初始化与使能，机器人保持倒地状态。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>确认周围活动空间充足，短按一次 START 菜单键，使机器人恢复站姿。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>等待机器人站姿稳定，再用十字方向键左键或右键选择行走模式。小幅推动左摇杆测试前进和后退，再用右摇杆测试转向。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"s3-4\">3.4 启动检查\u003c/h3>\n\u003cp>只有在机器人恢复站姿并保持稳定、遥控器连接正确后，才继续行走或执行技能。若机器人没有按预期恢复站姿，或出现持续抖动、碰撞和卡住，按第 6 章检查，不强行扳动机身。\u003c/p>\n\u003ch2 id=\"s4\">4 日常操作与结束使用\u003c/h2>\n\u003ch3 id=\"s4-1\">4.1 移动与姿态控制\u003c/h3>\n\u003cp>用十字方向键选择控制模式，再操作摇杆。切换模式前将摇杆回中。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>十字方向键\u003c/th>\n\u003cth>控制模式\u003c/th>\n\u003cth>左摇杆\u003c/th>\n\u003cth>右摇杆\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>按上\u003c/td>\n\u003ctd>头部控制\u003c/td>\n\u003ctd>控制头部运动\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按下\u003c/td>\n\u003ctd>躯干控制\u003c/td>\n\u003ctd>控制躯干运动\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按左或按右\u003c/td>\n\u003ctd>行走控制\u003c/td>\n\u003ctd>前进与后退\u003c/td>\n\u003ctd>左右转向\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>行走模式下，向前或向后推动左摇杆控制前进或后退；向左或向右推动右摇杆控制相应转向。操作时保持机器人在视线内，避免靠近台阶、桌沿或障碍物。\u003c/p>\n\u003ch3 id=\"s4-2\">4.2 基础动作\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>按键\u003c/th>\n\u003cth>对应动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>坐下／站立切换\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>从地面夹取物品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X\u003c/td>\n\u003ctd>前滚翻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左肩键／右肩键\u003c/td>\n\u003ctd>左踢腿／右踢腿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左扳机／右扳机\u003c/td>\n\u003ctd>控制嘴部开合度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>每次完成一个动作后再进行下一项操作。夹取物品时选择适配的小件物品，不强行夹取；踢腿和前滚翻前，确认对应腿部及机身前后有足够空间。\u003c/p>\n\u003ch3 id=\"s4-3\">4.3 结束使用与关机\u003c/h3>\n\u003col>\n\u003cli>\n\u003cp>结束当前动作输入，将摇杆回中，在平整地面为机身姿态变化留出空间。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>按 START 菜单键，使机器人回到倒地姿态；等待动作完成，确认机身已停止运动。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>关闭遥控器。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>关闭机器人尾部的电源开关。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>需要搬运、更换电池或充电时，确认机器人已经断电后再操作。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>机器人停止运动并断电后，再搬运或装箱。\u003c/p>\n\u003ch2 id=\"s5\">5 电池充电与日常维护\u003c/h2>\n\u003cp>RayDino 使用配套高性能锂电池。黄色插头连接机器人供电，白色三孔插头连接充电转换器。充电前将电池从机器人拆下，使用配套转换器和 USB 电源充电。\u003c/p>\n\u003ch3 id=\"s5-1\">5.1 电池与充电规格\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>参数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>电池类型\u003c/td>\n\u003ctd>高性能锂电池\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组合方式\u003c/td>\n\u003ctd>两节电芯串联\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标称容量\u003c/td>\n\u003ctd>3000 mAh\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标称电压\u003c/td>\n\u003ctd>7.36 V\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池标称充电电流\u003c/td>\n\u003ctd>1.5 A（0.5C）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池最大充电电流\u003c/td>\n\u003ctd>3 A（1C）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配套充电转换器\u003c/td>\n\u003ctd>USB 供电，最大充电电流 0.8 A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>USB 电源要求\u003c/td>\n\u003ctd>5 V，额定输出电流不低于 2 A\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s5-2\">5.2 识别插头与卡扣方向\u003c/h3>\n\u003ctable style=\"table-layout:fixed;width:100%;\">\u003ccolgroup>\u003ccol style=\"width:28%\"/>\u003ccol style=\"width:28%\"/>\u003ccol style=\"width:44%\"/>\u003c/colgroup>\n\u003cthead>\n\u003ctr>\n\u003cth>部件\u003c/th>\n\u003cth>用途\u003c/th>\n\u003cth>连接位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>黄色插头\u003c/td>\n\u003ctd>为机器人供电\u003c/td>\n\u003ctd>连接机器人电源接口；充电时保持断开。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>白色三孔插头\u003c/td>\n\u003ctd>为电池充电\u003c/td>\n\u003ctd>卡扣一侧对准转换器电池接口的最左侧，沿接口方向插入。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>转换器 USB 接口\u003c/td>\n\u003ctd>连接外部电源\u003c/td>\n\u003ctd>通过配套 USB 线连接 5 V、额定输出电流不低于 2 A 的电源。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cimg alt=\"高性能电池与两种插头\" src=\"assets/raydino/charging/battery-clean.png\" style=\"display:block;width:auto;height:auto;max-width:100%;max-height:280px;object-fit:contain;margin:18px auto;\"/>\u003c/p>\n\u003cp>图 5-1 高性能电池。黄色插头用于供电，白色三孔插头用于充电。\u003c/p>\n\u003cp>\u003cimg alt=\"配套USB充电转换器\" src=\"assets/raydino/charging/charger-clean.png\" style=\"display:block;width:auto;height:auto;max-width:100%;max-height:280px;object-fit:contain;margin:18px auto;\"/>\u003c/p>\n\u003cp>图 5-2 配套 USB 充电转换器。\u003c/p>\n\u003cp>正对转换器的电池接口，将白色插头带卡扣的一侧对准接口最左侧，再平直插入。插拔时握住插头外壳，保持接口方向一致。\u003c/p>\n\u003ch3 id=\"s5-3\">5.3 关机、拆下电池与检查\u003c/h3>\n\u003col>\n\u003cli>按第 4.3 节结束使用。待机器人动作结束后，关闭遥控器和机器人尾部电源。\u003c/li>\n\u003cli>握住黄色插头外壳，将电池与机器人断开，再解除电池固定并取出电池。\u003c/li>\n\u003cli>检查电池、导线、插头、转换器和 USB 线。电池鼓包、破损、异味或异常发热时停止使用。\u003c/li>\n\u003cli>将电池和转换器放在干燥、通风、稳定且不易燃的台面上，待电池恢复常温后充电，全程有人照看。\u003c/li>\n\u003c/ol>\n\u003cp>充电期间，电池与机器人保持断开，插头端子远离金属等导电物。\u003c/p>\n\u003ch3 id=\"s5-4\">5.4 连接与开始充电\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>电池侧\u003c/th>\n\u003cth>转换器\u003c/th>\n\u003cth>电源侧\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>白色三孔插头\u003c/td>\n\u003ctd>电池接口 → USB 接口\u003c/td>\n\u003ctd>USB 线 → 5 V USB 电源\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003col>\n\u003cli>将 USB 线连接到转换器，再连接符合第 5.1 节要求的电源，接通电源。\u003c/li>\n\u003cli>绿灯闪烁 3 次，转换器完成上电。\u003c/li>\n\u003cli>正对转换器电池接口，将白色插头的卡扣侧对准接口最左侧，平直插入到位。\u003c/li>\n\u003cli>红灯闪烁，开始充电。\u003c/li>\n\u003cli>黄色供电插头保持断开，电池及转换器保持通风、不受挤压。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cspan class=\"latch-figure\" style=\"display:block;position:relative;width:280px;max-width:100%;margin:20px auto;line-height:0;\">\u003cimg alt=\"白色插头卡扣在转换器接口最左侧的插接示意\" src=\"assets/raydino/charging/connection-clean.png\" style=\"display:block;width:100%;height:auto;max-width:100%;margin:0;\"/>\u003cspan aria-label=\"卡扣侧位于接口最左侧\" style=\"position:absolute;left:39.8%;top:68.4%;width:8%;aspect-ratio:1;border:2px solid #d85b27;border-radius:50%;box-sizing:border-box;\">\u003c/span>\u003cspan style=\"position:absolute;left:8%;top:70.7%;font-size:12px;line-height:1;color:#a0441e;\">卡扣侧\u003c/span>\u003cspan style=\"position:absolute;left:29%;top:71.4%;width:10.8%;border-top:2px solid #d85b27;\">\u003c/span>\u003c/span>\u003c/p>\n\u003cp>图 5-3 白色插头的卡扣侧位于转换器电池接口最左侧，图中圈出卡扣位置。USB 线接电源，黄色插头保持断开。\u003c/p>\n\u003ch3 id=\"s5-5\">5.5 指示灯、充满与断开\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指示灯\u003c/th>\n\u003cth>状态\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接通电源时绿灯闪烁 3 次\u003c/td>\n\u003ctd>转换器上电。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>红灯闪烁\u003c/td>\n\u003ctd>正在充电。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>绿灯持续常亮\u003c/td>\n\u003ctd>充电完成。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>红灯持续常亮\u003c/td>\n\u003ctd>充电异常，停止充电并检查连接、电源和电池。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003col>\n\u003cli>绿灯持续常亮后，关闭 USB 电源或拔下电源侧 USB 线。\u003c/li>\n\u003cli>握住白色插头外壳，将电池与转换器断开。\u003c/li>\n\u003cli>确认机器人尾部电源关闭，安装并固定电池，连接黄色供电插头。\u003c/li>\n\u003cli>收好白色充电插头和导线，按第 3 章启动机器人。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"s5-6\">5.6 充电常见问题\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>处理方法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>接通 USB 电源后无指示\u003c/td>\n\u003ctd>检查电源开关、USB 连接，以及电源的 5 V 输出和额定输出电流。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池接入后没有开始充电\u003c/td>\n\u003ctd>断开电源，检查白色插头卡扣侧是否位于接口最左侧，并确认插接到位后重新连接。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>红灯持续常亮\u003c/td>\n\u003ctd>切断输入电源并断开电池，检查插接、电源规格及电池状态。异常持续时联系技术支持。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池鼓包、异味、冒烟或异常发热\u003c/td>\n\u003ctd>立即停止使用，人员远离；能够安全操作时切断外部电源，联系技术支持处理。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s5-7\">5.7 清洁与检查\u003c/h3>\n\u003cp>关机断电后，用柔软干布清洁机身和摄像头表面，保持关节及接口干燥。\u003c/p>\n\u003cp>使用前后检查关节、紧固件、足部、线缆和电池接触部位。发现破损、松动或持续异常时，停止使用并联系技术人员。\u003c/p>\n\u003ch3 id=\"s5-8\">5.8 存放与软件维护\u003c/h3>\n\u003cp>长期不使用时，断开电池、机器人、转换器和电源，收好两个插头与导线。本体、电池及转换器存放于干燥、通风、避光的位置，远离热源、腐蚀性、易燃和易爆物品。\u003c/p>\n\u003cp>更新软件前结束机器人动作，保持供电和连接稳定，使用与本机版本匹配的工具及升级包。升级异常时联系技术支持。\u003c/p>\n\u003ch2 id=\"s6\">6 常见问题与故障排除\u003c/h2>\n\u003cp>出现异常时暂停操作，人员远离机器人运动范围，按下表检查处理。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>检查与处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>无法开机\u003c/td>\n\u003ctd>确认配套电池安装可靠、尾部电源已开启。检查电池和电源部位有无可见损伤；仍无法启动时停止尝试并联系技术支持。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>遥控器连接失败\u003c/td>\n\u003ctd>确认已打开机器人和手柄电源，连接的是目标设备。首次使用或配对信息变更后，请交付人员协助检查配对配置。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已连接但无法行走\u003c/td>\n\u003ctd>先确认已长按 START 完成初始化与使能，再短按 START 恢复站姿。待站姿稳定后，按方向键左或右选择行走模式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左摇杆控制头部或躯干\u003c/td>\n\u003ctd>当前处于头部或躯干模式。将摇杆回中，按方向键左或右切回行走模式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>动作异常 卡住或跌倒\u003c/td>\n\u003ctd>停止继续发送动作指令，人员远离运动部件。按第 1.4 节处理，不硬掰关节，不反复触发动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>电池或充电设备异常\u003c/td>\n\u003ctd>出现破损、鼓包、异味或异常发热时停止使用，不自行拆解；联系技术人员检查。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"s6-1\">6.1 异常后恢复使用\u003c/h3>\n\u003cp>重新操作前，确认机身、关节、足部和线缆无明显损伤，活动范围内无障碍物。涉及碰撞、关节卡住或电气异常时，请先由技术人员检查。\u003c/p>\n\u003cp>需要重新启动时，先完成正常关机，再按第 3 章的摆放、上电、连接、初始化和恢复站姿流程操作。不要直接在倒地或异常状态下反复触发行走和技能。\u003c/p>\n\u003ch3 id=\"s6-2\">6.2 联系技术支持\u003c/h3>\n\u003cp>报修时提供能够获取的设备编号、交付信息、软件版本、异常发生前的操作，以及能够说明问题的照片或视频。联系交付方获取对应的处理建议；在问题未排除前暂停使用。\u003c/p>\n\u003ch2 id=\"s7\">7 技术参数\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>参数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>产品名称\u003c/td>\n\u003ctd>RayDino\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>产品类型\u003c/td>\n\u003ctd>小型双足机器人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>站立高度\u003c/td>\n\u003ctd>280 mm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>整机重量\u003c/td>\n\u003ctd>约 950 g\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全身自由度\u003c/td>\n\u003ctd>15 个；头部 5 个，双腿共 10 个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前进速度\u003c/td>\n\u003ctd>0.2 m/s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>续航时间\u003c/td>\n\u003ctd>约 0.75 h，视使用情况变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>通信方式\u003c/td>\n\u003ctd>Wi-Fi、蓝牙\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>续航表现随动作类型、使用频率和实际工况变化。使用时留意电池状态，不在电量不足时继续执行连续运动。\u003c/p>\n\u003ch2 id=\"s8\">8 收纳 运输与相关资料\u003c/h2>\n\u003ch3 id=\"s8-1\">8.1 收纳与运输\u003c/h3>\n\u003cp>装箱前，按第 4.3 节让机器人回到倒地姿态并关闭电源。需要调整收纳姿态时，在断电状态下按交付人员示范的方法操作，不逆关节方向强行扳动。\u003c/p>\n\u003cp>将机器人放入专用包装箱，电池、遥控器及附件放入对应卡位。确认设备固定可靠后再合盖，必要时使用缓冲材料，避免运输中的挤压、撞击、摩擦和振动。\u003c/p>\n\u003ch3 id=\"s8-2\">8.2 相关资料与售后\u003c/h3>\n\u003cp>实体遥控器按键位置、控制模式和动作指令，参阅随附《遥控器使用指南》第 2 章“按钮映射”和第 4 章“基本操作”。Web 状态查询与板端维护见《BSP 技术与接口手册》第 2、6、7 章；应用开发见《应用开发与 API 参考》第 1～6 章。\u003c/p>\n\u003cp>电池充电与拆装见第 5 章。送修前与交付方确认设备、附件及包装要求。\u003c/p>"}, {"id": "controller", "title": "遥控器使用指南", "version": "V1.1", "date": "2026.11.18", "pdf": "PDF/raydino/RayDino-controller-V1.1.pdf", "online": "index.html#raydino/controller", "pages": 5, "bytes": 1794784, "summary": "按键图、控制模式、动作指令与结束使用", "html": "\u003ch2 id=\"s1\">1 简介\u003c/h2>\n\u003cp>遥控器用于控制小恐龙机器人的行走、头部及躯干运动，并触发坐下、站立、夹取物品和踢腿等动作。使用前，请先了解按键位置和控制模式，并在平整、干燥、无障碍物的地面操作。\u003c/p>\n\u003ch2 id=\"s2\">2 按钮映射\u003c/h2>\n\u003cp>\u003cimg alt=\"遥控器按钮映射\" src=\"assets/raydino/controller.png\"/>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>按键或部件\u003c/th>\n\u003cth>默认控制功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>左摇杆\u003c/td>\n\u003ctd>行走模式：前进／后退；其他模式：头部／躯干控制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>右摇杆\u003c/td>\n\u003ctd>行走模式：左右转向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>十字方向键\u003c/td>\n\u003ctd>上：头部；下：躯干；左或右：行走模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>START 菜单键\u003c/td>\n\u003ctd>长按：初始化与使能；短按：切换倒地／站立姿态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>A 键\u003c/td>\n\u003ctd>坐下／站立切换\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>B 键\u003c/td>\n\u003ctd>从地面夹取物品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>X 键\u003c/td>\n\u003ctd>前滚翻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>左肩键\u003c/td>\n\u003ctd>左踢腿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>右肩键\u003c/td>\n\u003ctd>右踢腿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>左扳机\u003c/td>\n\u003ctd>嘴部开合度控制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11\u003c/td>\n\u003ctd>右扳机\u003c/td>\n\u003ctd>嘴部开合度控制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"s3\">3 连接与使用准备\u003c/h2>\n\u003ch3 id=\"s3-1\">3.1 连接遥控器\u003c/h3>\n\u003cp>使用前，确认机器人已上电，并完成遥控器开机及与目标机器人的连接。开关机及配对操作应按随附手柄型号说明执行。连接过程中不要推动摇杆或按下技能键。\u003c/p>\n\u003cp>需要管理手柄配对时，可打开配套工具，点击“扫描”，找到目标机器人名称，点击“打开网页”，进入“手柄配对”入口。首次使用建议由交付人员完成连接配置。\u003c/p>\n\u003ch3 id=\"s3-2\">3.2 初始化与姿态恢复\u003c/h3>\n\u003col>\n\u003cli>\n\u003cp>上电前，将机器人平放在地面，使关节和头部自然伸直。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>机器人上电、遥控器连接完成后，长按 START 菜单键，初始化机器人。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>长按完成初始化与使能后，机器人仍保持倒地状态，不需要用手摆放直立。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>确认周围留有活动空间，短按一次 START 菜单键，使机器人恢复站姿。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>确认机器人姿态稳定后，再选择控制模式并进行遥控操作。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>注意：长按 START 菜单键用于初始化机器人，短按用于切换倒地／站立姿态。初始化不等于关机，START 菜单键不能作为专用急停键使用。\u003c/p>\n\u003ch2 id=\"s4\">4 基本操作\u003c/h2>\n\u003ch3 id=\"s4-1\">4.1 选择控制模式\u003c/h3>\n\u003cp>先使用十字方向键选择模式，再操作摇杆。十字方向键的“左”和“右”均用于进入行走模式，不直接控制机器人向左或向右运动。切换模式前，请将摇杆回中。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>十字方向键\u003c/th>\n\u003cth>控制模式\u003c/th>\n\u003cth>左摇杆功能\u003c/th>\n\u003cth>右摇杆功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>按上\u003c/td>\n\u003ctd>头部控制\u003c/td>\n\u003ctd>控制头部运动\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按下\u003c/td>\n\u003ctd>躯干控制\u003c/td>\n\u003ctd>控制躯干运动\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按左或按右\u003c/td>\n\u003ctd>行走控制\u003c/td>\n\u003ctd>前进、后退\u003c/td>\n\u003ctd>左右转向\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>“—”表示该模式下未列出右摇杆操作。摇杆回中指松开摇杆，使其回到中央位置。\u003c/p>\n\u003ch3 id=\"s4-2\">4.2 行走遥控\u003c/h3>\n\u003cp>进入行走模式后，向前推动左摇杆控制前进，向后推动控制后退；向左或向右推动右摇杆控制相应转向。首次操作请小幅推动摇杆，先进行短距离移动。\u003c/p>\n\u003ch3 id=\"s4-3\">4.3 头部与躯干遥控\u003c/h3>\n\u003cp>按十字方向键上键进入头部模式，操作左摇杆控制头部；按下键进入躯干模式，操作左摇杆控制躯干。操作前确认头部和机身周围无障碍物，避免强行扳动带力关节。\u003c/p>\n\u003ch2 id=\"s5\">5 遥控指令速查\u003c/h2>\n\u003cp>以下为机器人默认按键绑定。技能按键可由软件重新绑定，功能以当前交付配置为准。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>按键或部件\u003c/th>\n\u003cth>操作\u003c/th>\n\u003cth>对应功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>START 菜单键\u003c/td>\n\u003ctd>长按\u003c/td>\n\u003ctd>初始化与使能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>START 菜单键\u003c/td>\n\u003ctd>短按\u003c/td>\n\u003ctd>切换倒地／站立姿态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>十字方向键\u003c/td>\n\u003ctd>上／下\u003c/td>\n\u003ctd>选择头部／躯干控制模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>十字方向键\u003c/td>\n\u003ctd>左或右\u003c/td>\n\u003ctd>选择行走控制模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左摇杆\u003c/td>\n\u003ctd>前后推动\u003c/td>\n\u003ctd>行走模式下前进／后退\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>右摇杆\u003c/td>\n\u003ctd>左右推动\u003c/td>\n\u003ctd>行走模式下左右转向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A 键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>坐下／站立切换（sit_toggle）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B 键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>从地面夹取物品（ground_pick）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左肩键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>左踢腿（kick_left）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>右肩键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>右踢腿（kick_right）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X 键\u003c/td>\n\u003ctd>按下\u003c/td>\n\u003ctd>前滚翻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左右扳机\u003c/td>\n\u003ctd>改变按压程度\u003c/td>\n\u003ctd>控制嘴部开合度，与输入线性对应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>夹取物品时，选择适配的小件物品，确认嘴部与物品接触区域无人手靠近。踢腿前，确保对应腿部及前方无障碍物。完成一个技能动作后再进行下一项操作。\u003c/p>\n\u003ch2 id=\"s6\">6 使用注意事项\u003c/h2>\n\u003cp>• 机器人动作时，保持可见并留出活动空间，远离台阶、桌沿、水源和易碎物品。\u003c/p>\n\u003cp>• 切换模式或状态前先将摇杆回中。不要连续快速按下技能键，不要在关节带力时搬动或强行调整机身。\u003c/p>\n\u003cp>• 结束使用时，将摇杆回中，停止发送技能指令；按 START 使机器人回到倒地姿态，待动作结束后关闭手柄，再关闭机器人尾部电源。不要通过关闭手柄代替机器人断电。本体启动、充电和异常处理见《用户手册》第 3、5 和 1.4 节。\u003c/p>\n\u003cp>• 遥控器保持干燥，避免跌落、碰撞和液体进入。清洁时用柔软干布擦拭，不自行拆解或改变手柄硬件。\u003c/p>\n\u003ch2 id=\"s7\">7 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>处理方法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>已连接但无法行走\u003c/td>\n\u003ctd>确认已完成初始化、机器人姿态稳定；选择行走模式后再操作摇杆。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左摇杆控制头部或躯干\u003c/td>\n\u003ctd>将摇杆回中，按十字方向键左或右，切换到行走模式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>技能按键与说明不一致\u003c/td>\n\u003ctd>核对当前软件按键绑定，确认是否修改过配置。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无法连接或反应异常\u003c/td>\n\u003ctd>暂停操作，检查目标设备和连接配置；仍无法恢复时联系交付或技术人员。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>"}, {"id": "api", "title": "应用开发与 API 参考", "version": "V1.1", "date": "2026.11.18", "pdf": "PDF/raydino/RayDino-api-V1.1.pdf", "online": "index.html#raydino/api", "pages": 7, "bytes": 977694, "summary": "应用连接、请求契约、技能结果、事件、音频与资源清理", "html": "\u003cp>业务应用通过 \u003ccode>@raydiculousx/js-sdk/host/app\u003c/code> 的 \u003ccode>connectApp()\u003c/code> 获取 \u003ccode>RaydiculousX\u003c/code>；自行提供 \u003ccode>url\u003c/code>、\u003ccode>jti\u003c/code>、\u003ccode>sn\u003c/code> 时使用根入口 \u003ccode>connectDirect()\u003c/code>。两者均等控制通道建立且能力查询完成才返回。初始化不会自动运动。\u003c/p>\n\u003ch2 id=\"s1\">1 初始化与上下文\u003c/h2>\n\u003cpre>\u003ccode class=\"language-ts\">import { RaydiculousXError } from '@raydiculousx/js-sdk';\nimport { connectApp } from '@raydiculousx/js-sdk/host/app';\n\nconst robot = await connectApp(); // 默认信任同源 Host\nrobot.on('context', () =&gt; console.log(robot.context));\n\u003c/code>\u003c/pre>\n\u003cp>跨域应用的 \u003ccode>expectedHostOrigin\u003c/code> 必须来自应用可信配置，不能读取 URL 中自报的来源。重复的相同初始化复用 Promise；冲突配置、未完成退出或缺少可信宿主会失败。\u003c/p>\n\u003cp>\u003ccode>connectApp\u003c/code> 可配置 \u003ccode>signal\u003c/code> 和 \u003ccode>timeoutMs\u003c/code>（默认 45000 ms）。\u003ccode>connectDirect\u003c/code> 默认建连超时 20000 ms，接受 \u003ccode>requestTimeoutMs\u003c/code>、\u003ccode>cleanupTimeoutMs\u003c/code>、\u003ccode>iceServers\u003c/code>、\u003ccode>appId\u003c/code>、主题与业务配置，完整字段见包内 \u003ccode>DirectConnectionOptions\u003c/code> 声明（SDK 包内 \u003ccode>dist/lib/direct.d.ts\u003c/code>）。访问凭据不会出现在上下文中。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>属性\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>mode\u003c/code>\u003c/td>\n\u003ctd>固定为 \u003ccode>direct\u003c/code>；独立与商店启动采用同一连接实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>context: RobotContext\u003c/code>\u003c/td>\n\u003ctd>机器人 ID、应用 ID、本地会话、连接代次、连接状态、能力、最近状态快照、主题与公开配置的副本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>disposed\u003c/code>\u003c/td>\n\u003ctd>已进入离场或关闭，不能再发起请求；不代表异步清理已经结束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sitting\u003c/code>\u003c/td>\n\u003ctd>最近确认的坐姿状态；未知时为 null\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>peerConnection\u003c/code>\u003c/td>\n\u003ctd>当前机器人 WebRTC 连接；关闭后为 null\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>robotAudioTrack\u003c/code>\u003c/td>\n\u003ctd>已协商接收的机器人音轨；尚无音轨时为 null\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>context.capabilities\u003c/code> 使用 \u003ccode>move\u003c/code>、\u003ccode>skills\u003c/code>、\u003ccode>status\u003c/code>、\u003ccode>video\u003c/code>、\u003ccode>audioOut\u003c/code>、\u003ccode>audioIn\u003c/code>，每项含 \u003ccode>supported\u003c/code> 和 \u003ccode>schemaVersion\u003c/code>。连接状态为 \u003ccode>connecting\u003c/code>、\u003ccode>ready\u003c/code> 或 \u003ccode>disconnected\u003c/code>；断线不自动重连或重放动作。\u003c/p>\n\u003ch2 id=\"s2\">2 请求选项\u003c/h2>\n\u003cp>\u003ccode>RequestOptions\u003c/code> 包含 \u003ccode>timeoutMs\u003c/code>（1～120000 ms）与 \u003ccode>signal\u003c/code>。单次超时配置优先，其次使用连接级 \u003ccode>requestTimeoutMs\u003c/code>；均未配置时，技能 \u003ccode>wait=true\u003c/code> 为 35000 ms，其他请求为 5000 ms。超时和取消仅结束本地等待，不证明设备撤销动作；停止运动应主动调用 \u003ccode>stop()\u003c/code>。\u003c/p>\n\u003ch2 id=\"s3\">3 动作与查询\u003c/h2>\n\u003cp>这五个方法返回 Promise。\u003ccode>await\u003c/code> 得到经过 SDK 校验的设备 RPC 结果，不含 JSON-RPC 外层封装。参数错误、传输错误和非法响应通过 Promise 拒绝传递。回执字段不符合运行时校验时，错误为 \u003ccode>INVALID_RESPONSE\u003c/code>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>SDK 方法\u003c/th>\n\u003cth>设备 RPC\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>move()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.move\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stop()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.stop\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>doSkill()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.do\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>getStatus()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.status\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>getCapabilities()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>robot.capabilities\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>request()\u003c/code> 使用同一白名单与参数校验。其他方法（包括上位机协议中的 \u003ccode>robot.reset\u003c/code>）不属于应用 SDK 的设备请求接口。\u003c/p>\n\u003ch3 id=\"s3-1\">3.1 \u003ccode>move(params, options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">move(params: MoveParams, options?: RequestOptions): Promise&lt;AcceptedResult&gt;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003ccode>MoveParams\u003c/code> 字段\u003c/th>\n\u003cth>单位\u003c/th>\n\u003cth>约束\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>vx: number\u003c/code>\u003c/td>\n\u003ctd>m/s\u003c/td>\n\u003ctd>必填，有限数。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>vy?: number\u003c/code>\u003c/td>\n\u003ctd>m/s\u003c/td>\n\u003ctd>可选，有限数；省略时发送 \u003ccode>0\u003c/code>。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>vyaw: number\u003c/code>\u003c/td>\n\u003ctd>rad/s\u003c/td>\n\u003ctd>必填，有限数。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>SDK 仅发送这三个速度分量，不裁剪速度、不设置持续时间，也不自动定时续发。设备速度范围和执行策略由上位机定义。参数中出现 \u003ccode>duration_s\u003c/code> 会以 \u003ccode>INVALID_ARGUMENT\u003c/code> 拒绝，包括显式传入 \u003ccode>undefined\u003c/code> 的情况。\u003c/p>\n\u003cp>\u003ccode>await robot.move(...)\u003c/code> 得到 \u003ccode>AcceptedResult\u003c/code>，其中 \u003ccode>accepted\u003c/code> 必须为 \u003ccode>true\u003c/code>，表示速度请求已受理：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ \"accepted\": true }\n\u003c/code>\u003c/pre>\n\u003cp>SDK 不保证该回执提供移动进度或完成时间。设备看门狗、持续运动与控制频率约束由设备端协议约定，部署方需向上位机维护者确认；App 不应把本地 Promise 等待时间当作运动时长。\u003c/p>\n\u003ch3 id=\"s3-2\">3.2 \u003ccode>stop(options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">stop(options?: RequestOptions): Promise&lt;AcceptedResult&gt;\n\u003c/code>\u003c/pre>\n\u003cp>请求停车，\u003ccode>await robot.stop()\u003c/code> 得到与 \u003ccode>move()\u003c/code> 相同的 \u003ccode>AcceptedResult\u003c/code>，即上例的 \u003ccode>{ \"accepted\": true }\u003c/code>，表示停车请求已受理。回执不保证硬件已停稳或技能已取消。\u003c/p>\n\u003cp>停车使用同一设备通道，绕过移动频率限制，但仍可能因背压或断连失败，不等同于实体急停。\u003c/p>\n\u003ch3 id=\"s3-3\">3.3 \u003ccode>doSkill(skill, wait?, options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">doSkill(skill: string, wait?: boolean, options?: RequestOptions): Promise&lt;SkillResult&gt;\ndoSkill(skill: string, options?: RequestOptions): Promise&lt;SkillResult&gt;\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>skill\u003c/code> 必须是非空白字符串，长度最多 \u003ccode>256\u003c/code> 个 UTF-16 代码单元。SDK 保留原始名称，不自动裁剪空白或转换大小写；可用名称由设备的接入约定提供。\u003c/p>\n\u003cp>SDK 默认发送 \u003ccode>{ skill, wait: true }\u003c/code>，第二个参数传 \u003ccode>false\u003c/code> 时发送 \u003ccode>{ skill, wait: false }\u003c/code>。第二个参数也可以直接传本地请求配置，此时 \u003ccode>wait\u003c/code> 取默认值。\u003c/p>\n\u003cp>SDK 通过 \u003ccode>robot.status\u003c/code> 的 \u003ccode>policies.sitting\u003c/code> 和遥测的 \u003ccode>sit\u003c/code>、\u003ccode>stand\u003c/code> 更新 \u003ccode>robot.sitting\u003c/code>。该属性为 \u003ccode>null\u003c/code> 时，调用左踢、右踢、拾取或翻滚会先查询姿态。已知坐姿时，SDK 在本地返回 \u003ccode>accepted: false\u003c/code> 和起身提示。应用应由用户手动选择 \u003ccode>sit_toggle\u003c/code>，站起后重新选择目标动作。设备缺少姿态字段时，技能是否受理由设备决定。\u003c/p>\n\u003cp>支持完成回执的设备在 \u003ccode>wait: true\u003c/code> 时可返回以下结果。\u003ccode>durationMs\u003c/code> 是设备报告的耗时，单位为毫秒。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>设备结果\u003c/th>\n\u003cth>SDK 解析的回执示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>已确认执行完成\u003c/td>\n\u003ctd>\u003ccode>{\"accepted\": true, \"completed\": true, \"durationMs\": 1452.4}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等待超时，尚未确认完成\u003c/td>\n\u003ctd>\u003ccode>{\"accepted\": true, \"completed\": false, \"status\": \"timed_out\", \"durationMs\": 30000.0}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>两种回执都会正常解析 Promise。应用可用 \u003ccode>result.completed === true\u003c/code> 判断执行完成。仅含 \u003ccode>accepted\u003c/code> 的回执也有效，完成状态未知。\u003c/p>\n\u003cp>\u003ccode>SkillResult.accepted\u003c/code> 表示技能是否受理，\u003ccode>reason?: string\u003c/code> 为设备提供的未受理说明，可以省略。例如，未受理且未提供原因时，\u003ccode>await robot.doSkill(...)\u003c/code> 得到：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ \"accepted\": false }\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>accepted: false\u003c/code> 是正常业务结果，Promise 仍然完成，App 应检查该字段；\u003ccode>accepted: true\u003c/code> 也不表示技能完成。上位机返回 \u003ccode>reason: null\u003c/code> 时，SDK 将其归一为省略 \u003ccode>reason\u003c/code>；其他非字符串原因视为非法响应。协议或执行异常仍以 Promise 拒绝传递。\u003c/p>\n\u003ch3 id=\"s3-4\">3.4 \u003ccode>getStatus(options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">getStatus(options?: RequestOptions): Promise&lt;RobotStatus&gt;\n\u003c/code>\u003c/pre>\n\u003cp>查询执行器状态快照。例如，\u003ccode>await robot.getStatus()\u003c/code> 可以得到：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ \"state\": \"READY\", \"faultReason\": null }\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>state: ExecutorState\u003c/code> 为 \u003ccode>INIT | READY | RUNNING | FAULT\u003c/code>，表示当前执行器状态；\u003ccode>faultReason: string | null\u003c/code> 为故障说明，无故障时为 \u003ccode>null\u003c/code>。两者都是必需字段。设备提供的额外 JSON 诊断字段会被保留，但名称和结构不作保证。\u003ccode>RobotStatus\u003c/code> 不要求关节数组，与 \u003ccode>onTelemetry()\u003c/code> 接收的遥测类型不同。\u003c/p>\n\u003ch3 id=\"s3-5\">3.5 \u003ccode>getCapabilities(options?)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">getCapabilities(options?: RequestOptions): Promise&lt;RobotCapabilities&gt;\n\u003c/code>\u003c/pre>\n\u003cp>每次调用都发送查询，不缓存结果。\u003ccode>await robot.getCapabilities()\u003c/code> 得到包含以下全部必需字段的 \u003ccode>RobotCapabilities\u003c/code>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回字段\u003c/th>\n\u003cth>类型、含义与约束\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>protocol\u003c/code>\u003c/td>\n\u003ctd>固定字符串 \u003ccode>'v1'\u003c/code>，设备协议版本。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dof\u003c/code>\u003c/td>\n\u003ctd>固定数值 \u003ccode>15\u003c/code>，设备自由度。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>jointNames\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>string[]\u003c/code>，按设备顺序排列的 \u003ccode>15\u003c/code> 个非空关节名。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>maxCommandHz\u003c/code>\u003c/td>\n\u003ctd>正有限数，指令发送频率上限，单位 Hz；SDK 据此限制移动频率。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>telemetryHz\u003c/code>\u003c/td>\n\u003ctd>正有限数，遥测频率，单位 Hz；无新帧时设备可不推送。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hasVideo\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>boolean\u003c/code>，设备是否支持视频输出。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hasAudioOut\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>boolean\u003c/code>，设备是否支持音频输出。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hasAudioIn\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>boolean\u003c/code>，设备是否支持音频采集。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>音视频布尔字段描述设备能力。\u003ccode>hasAudioOut\u003c/code> 为 true 时仍需完成具有发送方向的 WebRTC 音频协商，才能使用 第 5 章“流式音频输出”。当前上位机根据运行环境中的 \u003ccode>aplay\u003c/code> 是否可用报告该字段，实际声音输出还取决于 ALSA 设备和权限；传入机器人音轨可通过 \u003ccode>robotAudioTrack\u003c/code> 读取；能力值不等于已协商出可用音轨。设备侧的具体配置由上位机部署方提供。\u003c/p>\n\u003ch3 id=\"s3-6\">3.6 由界面操作触发技能\u003c/h3>\n\u003cp>以下函数可由 App 的按钮事件调用；定义它不会发送机器人动作。\u003ccode>skill\u003c/code> 应来自已配置的设备技能列表。\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">import { RaydiculousXError } from '@raydiculousx/js-sdk';\nimport type { RaydiculousX } from '@raydiculousx/js-sdk';\n\nexport async function runSelectedSkill(\n  robot: RaydiculousX,\n  skill: string,\n  showMessage: (message: string) =&gt; void,\n): Promise&lt;void&gt; {\n  if (robot.disposed || robot.context.connectionState !== 'ready') {\n    showMessage('机器人尚未连接');\n    return;\n  }\n  try {\n    const result = await robot.doSkill(skill);\n    if (result.completed === true) {\n      showMessage('动作已执行完成');\n    } else if (result.status === 'timed_out') {\n      showMessage('设备等待超时，尚未确认动作完成');\n    } else {\n      showMessage(result.accepted ? '动作请求已受理' : result.reason ?? '动作未被接受');\n    }\n  } catch (error) {\n    showMessage(error instanceof RaydiculousXError ? `${error.code}: ${error.message}` : '请求失败');\n  }\n}\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s4\">4 事件与生命周期\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>onTelemetry(handler)\u003c/code>：接收经过校验的机器人状态；\u003ccode>onFault(handler)\u003c/code>：接收故障通知。\u003c/li>\n\u003cli>\u003ccode>on('context', handler)\u003c/code>：接收连接与上下文变化；首次状态请直接读取 \u003ccode>context\u003c/code>，订阅不回放。\u003c/li>\n\u003cli>\u003ccode>on('robot.audio.error', handler)\u003c/code>：接收上位机音频播放失败通知，payload 为 \u003ccode>{ reason: string, message: string }\u003c/code>。原因码由设备提供，例如 \u003ccode>audio_out_unavailable\u003c/code>、\u003ccode>audio_out_failed\u003c/code>；该事件不等于执行器 FAULT 或连接断开。\u003c/li>\n\u003cli>每个订阅返回独立退订函数。设备事件名为 \u003ccode>robot.state\u003c/code>、\u003ccode>robot.fault\u003c/code>、\u003ccode>robot.audio.error\u003c/code>，上下文事件名为 \u003ccode>context\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>request(method, params?, options?)\u003c/code>：仅开放五种机器人方法；不提供 Host 自定义路由。\u003c/li>\n\u003cli>\u003ccode>setAppState(state)\u003c/code>：将 JSON 业务状态通知外壳，不修改机器人状态。自行使用 \u003ccode>connectDirect()\u003c/code> 时需提供 \u003ccode>onAppState\u003c/code> 回调；没有回调时仅检查连接就绪，不校验或转发业务状态。\u003c/li>\n\u003cli>\u003ccode>requestLeave(reason?)\u003c/code>：请外壳协调退出；自行使用 connectDirect 且没有退出回调时清理本实例。\u003c/li>\n\u003cli>\u003ccode>onLeave(handler)\u003c/code>：登记应用资源清理，接收 \u003ccode>reason\u003c/code>、\u003ccode>deadline\u003c/code>；离场开始后不能再发送动作。\u003c/li>\n\u003cli>\u003ccode>await dispose()\u003c/code>：拒绝新请求、取消本地等待，等待清理回调、本地音频释放与必要的停车受理，最后尝试释放 PC/WSS。返回 \u003ccode>complete\u003c/code>、\u003ccode>failed\u003c/code> 或 \u003ccode>timeout\u003c/code>；超时不终止尚未完成的清理任务，\u003ccode>failed\u003c/code> 不保证信令已关闭，也不证明物理停稳或设备音频缓冲已清空。\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-ts\">const offAudioError = robot.on('robot.audio.error', payload =&gt; {\n  // on() 的公开 payload 类型为 JsonValue，使用前先收窄字段。\n  if (payload &amp;&amp; typeof payload === 'object' &amp;&amp; !Array.isArray(payload)\n      &amp;&amp; typeof payload.reason === 'string' &amp;&amp; typeof payload.message === 'string') {\n    console.warn(payload.reason, payload.message);\n  }\n});\nrobot.onLeave(offAudioError);\n\u003c/code>\u003c/pre>\n\u003cp>播放错误是异步通知，不会把已完成的 \u003ccode>writeAudio()\u003c/code> 或 \u003ccode>drainAudioOutput()\u003c/code> 改成失败；应用应订阅事件更新播放状态。初始化后是否有声音，还需设备端或现场反馈确认。\u003c/p>\n\u003ch2 id=\"s5\">5 流式音频输出\u003c/h2>\n\u003cp>音频与动作使用同一个客户端和 WebRTC 连接。\u003ccode>openAudioOutput(signal)\u003c/code> 必须传入 \u003ccode>AbortSignal\u003c/code>，要求设备 audioOut 能力及已协商发送方向；PCM 在业务页面排程并替换本页的 sender。应在用户操作的处理函数内打开音频，以满足浏览器播放策略；取消信号会结束初始化并释放本地输出。\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">const audioLifetime = new AbortController();\nawait robot.openAudioOutput(audioLifetime.signal);\n// 逐块调用 robot.writeAudio(pcm)，结束本次输出时：\naudioLifetime.abort();\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>完成语义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>openAudioOutput(signal: AbortSignal)\u003c/code>\u003c/td>\n\u003ctd>本页音频输出驱动准备完成；不代表设备已经发声\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>writeAudio(samples)\u003c/code>\u003c/td>\n\u003ctd>将 24 kHz 单声道 Float32 PCM 排入本页队列；每块 1～24000 个有限样本，值在 -1～1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>clearAudioOutput()\u003c/code>\u003c/td>\n\u003ctd>停止并移除本地已排程的音频片段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setAudioVolume(value)\u003c/code>\u003c/td>\n\u003ctd>设置发送端增益；有限数裁剪到 0～1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>drainAudioOutput()\u003c/code>\u003c/td>\n\u003ctd>等待本地排程结束，最长约 35 秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>closeAudioOutput()\u003c/code>\u003c/td>\n\u003ctd>发起媒体释放；不关闭机器人控制连接，完整退出由 dispose 等待\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>队列最多 30 秒。清空和排程结束都不是设备扬声器回执；不能撤回已经进入设备缓冲的声音。\u003c/p>\n\u003ch2 id=\"s6\">6 错误处理\u003c/h2>\n\u003cp>机器人请求以 \u003ccode>RaydiculousXError\u003c/code> 拒绝，含 \u003ccode>code\u003c/code>、\u003ccode>source\u003c/code> 与 \u003ccode>message\u003c/code>；例如参数错误 \u003ccode>INVALID_ARGUMENT\u003c/code>、不可用 \u003ccode>NOT_READY\u003c/code>、离场 \u003ccode>APP_DISPOSED\u003c/code>、超时 \u003ccode>REQUEST_TIMEOUT\u003c/code>、取消 \u003ccode>ABORTED\u003c/code>。设备错误保留字符串错误码及 \u003ccode>daemon\u003c/code> 来源，不自动重试。\u003c/p>\n\u003cp>初始化的 \u003ccode>DirectConnectionError\u003c/code> 还包含 \u003ccode>cleanupResult\u003c/code>；清理失败时不能自动交接下一连接。窗口被关闭或强制认证失效仅能尽力清理，设备端断线保护仍负责兜底。音频和启动配置也可能抛出普通 Error，调用方应处理所有拒绝。\u003c/p>\n\u003cp>类型与详细参数以包内的 客户端声明（SDK 包内 \u003ccode>dist/lib/raydiculousx.d.ts\u003c/code>）、直连配置声明（SDK 包内 \u003ccode>dist/lib/direct.d.ts\u003c/code>） 为准。\u003c/p>"}, {"id": "bsp", "title": "BSP 技术与接口手册", "version": "V1.1", "date": "2026.11.18", "pdf": "PDF/raydino/RayDino-bsp-V1.1.pdf", "online": "index.html#raydino/bsp", "pages": 26, "bytes": 1073222, "summary": "板端升级、状态查询、Web控制、音视频、ToF、模型配置与标定", "html": "\u003cp>本手册面向 RayDino（恐龙）的板端维护与接口集成。应用内 JS SDK 的连接、请求和生命周期见《应用开发与 API 参考》第 1～6 章；本册介绍 Web 遥控台、板端命令和硬件设备接口。运行命令前应确认操作目标为当前交付设备。涉及运动、标定和升级时，先结束其他控制端操作，确保活动范围内无人接触关节。\u003c/p>\n\u003ch2 id=\"s1\">1 接口层级与使用准备\u003c/h2>\n\u003ch3 id=\"s1-1\">1.1 连接入口\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层级\u003c/th>\n\u003cth>入口\u003c/th>\n\u003cth>用途与边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>App JS SDK\u003c/td>\n\u003ctd>@raydiculousx/js-sdk\u003c/td>\n\u003ctd>由可信 Host 或直连配置建立控制通道；不自动运动，不自动定时续发 move。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web 遥控台 HTTP\u003c/td>\n\u003ctd>示例默认 http://127.0.0.1:8000\u003c/td>\n\u003ctd>Python 示例通过 HTTP 查询与控制。远程运行时将 --host 改为机器人实际 IP。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>板端控制服务\u003c/td>\n\u003ctd>robotctl、robotd\u003c/td>\n\u003ctd>维护、配置、策略与设备控制；不等同于 App SDK 的五种请求白名单。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003c
