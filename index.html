<script id="product-catalog" type="application/json">{"site": {"entry": "index.html", "title": "产品资料中心", "company_name": "成都人形机器人创新中心"}, "products": [{"id": "gongka-edu", "line": "轮臂式人形机器人", "name": "贡嘎机器人", "english_name": "GONGKA Robot", "resources_page": "贡嘎产品页-教学与文档.html", "documents": [{"id": "intro", "title": "产品介绍", "summary": "认识贡嘎轮臂式人形机器人与 EDU 版技术参数。", "html": "\u003cdiv class=\"product-hero\">\u003cdiv>\u003cspan class=\"kicker\">GONGKA Robot · EDU\u003c/span>\u003ch2 id=\"intro-heading-0\">贡嘎轮臂式\u003cbr/>人形机器人\u003c/h2>\u003cp>产品结构与技术参数\u003c/p>\u003ca class=\"primary-link\" href=\"#manual\">阅读用户手册 →\u003c/a>\u003c/div>\u003cimg alt=\"贡嘎机器人 EDU 版产品外观\" src=\"assets/cover-robot.png\"/>\u003c/div>\u003csection>\u003ch2 id=\"intro-heading-1\">1　产品概述\u003c/h2>\u003cp>GONGKA Robot 是面向教学与开发的轮臂式人形机器人，集成移动底盘、升降立柱、伸缩机械臂、夹爪、视觉感知及语音交互功能。\u003c/p>\u003cul>\u003cli>13 个全身自由度，腕部负载 3.5 kg（含末端执行器）。\u003c/li>\u003cli>支持建图、导航、抓取放置与自主回充。\u003c/li>\u003cli>提供 C++ SDK、ROS 2 接口、LeRobot 框架和 Isaac Sim 仿真。\u003c/li>\u003c/ul>\u003c/section>\u003csection id=\"specs\">\u003ch2 id=\"intro-heading-2\">2　技术参数\u003c/h2>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>参数与条件\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>整机自重\u003c/td>\u003ctd>不高于 50 kg\u003c/td>\u003c/tr>\u003ctr>\u003ctd>站立总高\u003c/td>\u003ctd>166 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>全身自由度\u003c/td>\u003ctd>共计 13；单臂 6、头部 2、头部相机 2、底盘 2、立柱升降 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手臂最大高度\u003c/td>\u003ctd>131 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手臂最大长度\u003c/td>\u003ctd>86 cm，立柱中心至手臂腕部\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手臂伸缩范围\u003c/td>\u003ctd>429 mm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手臂上下移动行程\u003c/td>\u003ctd>993 mm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>腕部最大可承受重量\u003c/td>\u003ctd>3.5 kg，含末端执行器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>升降机构负载\u003c/td>\u003ctd>≥10 kg\u003c/td>\u003c/tr>\u003ctr>\u003ctd>默认末端开合度\u003c/td>\u003ctd>最大开合度优于 15 cm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>默认夹爪最大抓取力\u003c/td>\u003ctd>50 N\u003c/td>\u003c/tr>\u003ctr>\u003ctd>默认夹爪可触及高度\u003c/td>\u003ctd>0～1.35 m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手臂最大上下移动速度\u003c/td>\u003ctd>110 mm/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手臂最大前后伸缩速度\u003c/td>\u003ctd>50 mm/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>底盘最大直线速度\u003c/td>\u003ctd>0.7 m/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>底盘最大旋转速率\u003c/td>\u003ctd>0.75 rad/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>越障指标\u003c/td>\u003ctd>可通过高度 10 mm、宽度 10 cm 的障碍；不支持上下楼梯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>头部屏幕\u003c/td>\u003ctd>8 寸触摸屏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>激光雷达\u003c/td>\u003ctd>测距 0.15～12 m，扫描 0～360°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>主算力单元\u003c/td>\u003ctd>NVIDIA Jetson AGX Orin\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CPU\u003c/td>\u003ctd>12 核 Arm Cortex-A78AE，64 位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SSD\u003c/td>\u003ctd>256 GB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>通信\u003c/td>\u003ctd>Wi-Fi、蓝牙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>工作温度\u003c/td>\u003ctd>0～35 ℃\u003c/td>\u003c/tr>\u003ctr>\u003ctd>参考续航\u003c/td>\u003ctd>约 4.5 h，25 ℃、水平硬化地面、持续任务条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>充电时间\u003c/td>\u003ctd>10%～80% 不超过 2 h 30 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>充电桩输入\u003c/td>\u003ctd>180～264 VAC，47～63 Hz\u003c/td>\u003c/tr>\u003ctr>\u003ctd>系统\u003c/td>\u003ctd>Ubuntu 22.04、ROS 2 Humble\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开发语言与仿真\u003c/td>\u003ctd>C++、Python；支持 NVIDIA Isaac、MuJoCo、Gazebo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>深度相机\u003c/td>\u003ctd>\u003ca href=\"#technical/technical-heading-2\">Gemini 336L · 参数与话题\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>", "version": "", "date": "", "pdf": "", "pages": null, "bytes": null}, {"id": "manual", "title": "用户手册", "summary": "安全、开箱、网络连接、任务操作、充电与维护。", "html": "\u003csection id=\"safety\">\u003ch2 id=\"manual-heading-0\">1　安全须知\u003c/h2>\u003caside class=\"warning\">\u003cstrong>警告 · 远离运动部件\u003c/strong>\u003cp>机器人并非玩具。运行时，非操作人员应与机器人保持 2 米以上距离。操作人员也应避开底盘、升降机构、伸缩臂、腕部和夹爪的运动范围；不要用手接挡机器人或抓取正在运动的关节。\u003c/p>\u003c/aside>\u003ch3 id=\"manual-heading-1\">1.1　人员与现场\u003c/h3>\u003cul>\u003cli>16 岁以下人员不适合操作机器人。学校教学时由完成培训的教师或管理人员负责现场安全。\u003c/li>\u003cli>不得在醉酒、用药或其他意识受影响的状态下操作。不得推搡、脚踹或故意干扰运行。\u003c/li>\u003cli>清理电线、杂物和易碎物品。远离楼梯口、台阶边缘、水面及可能跌落的区域；不得操作机器人上下楼梯。\u003c/li>\u003cli>使用中保持视线可覆盖机器人及周围环境，明确急停按钮位置。人工遥控和自动任务应由操作人员协调，避免同时下发相互冲突的指令。\u003c/li>\u003c/ul>\u003ch3 id=\"manual-heading-2\">1.2　环境与负载\u003c/h3>\u003cul>\u003cli>在干燥、平整的室内硬化地面使用。不得在雨雪、雷电、沙尘等恶劣环境运行。\u003c/li>\u003cli>工作环境温度为 0～35 ℃；不得在坡度大于 10° 的地面使用。教学及首次调试应选择水平地面。\u003c/li>\u003cli>腕部最大可承受重量为 3.5 kg，包含末端执行器重量。\u003c/li>\u003cli>默认夹爪最大抓取力为 50 N。\u003c/li>\u003cli>不得抓取人员、动物或用夹爪夹持人体部位。演示优先使用轻质、不易破损、表面干燥的物体。\u003c/li>\u003c/ul>\u003ch3 id=\"manual-heading-3\">1.3　紧急停止\u003c/h3>\u003col class=\"steps\">\u003cli>出现运动不受控、即将碰撞等危险时，在确保自身安全的前提下，立即按下底盘上方的急停按钮。\u003c/li>\u003cli>停止继续发送动作指令，让周围人员退出运动范围。不要伸手进入夹爪、升降或伸缩机构内排障。\u003c/li>\u003cli>排除异常后，由技术人员恢复设备运行。\u003c/li>\u003c/ol>\u003c/section>\u003csection id=\"overview\">\u003ch2 id=\"manual-heading-4\">2　认识机器人\u003c/h2>\u003cfigure class=\"robot-diagram\">\u003csvg aria-label=\"机器人正侧方及背面结构图，部件序号1至8对应下方表格\" role=\"img\" viewbox=\"0 0 1640 1050\" xmlns=\"http://www.w3.org/2000/svg\">\u003cimage height=\"934\" href=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqoAAAOmCAIAAACsUiDyAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeYAcZZ3/8e/T3XNPMgkEkpCLQCCXQbLI7SJJEBQFcVVwVQRB8MKIHCpeoOBGBeRQQNFFERQBRWDVn0ggXBqVW0xIIOFIgCTknCRzd3f9/qiZSk1VdXX1VfV01fu1bOz0VFdXTWb6832OekoZhiEAACBJUlEfAAAACBvxDwBA4hD/AAAkDvEPAEDiEP8AACQO8Q8AQOIQ/wAAJA7xDwBA4hD/AAAkDvEPAEDiEP8AACQO8Q8AQOIQ/wAAJA7xDwBA4hD/AAAkDvEPAEDiEP8AACQO8Q8AQOIQ/wAAJA7xDwBA4hD/AAAkDvEPAEDiEP8AACQO8Q8AQOIQ/wAAJA7xDwBA4hD/AAAkDvEPAEDiEP8AACQO8Q8AQOJkoj4AaEQpFXBLwzBqeiQAgJoi/hOqUNKT6wCQBMR/UrjzvnZJH7wXwYHiAwDCQfzHmSOGaxSunmFf3nvZd0UpAAC1o/iQjZ8QQjSEwsJ6C35EAaDqiP/4CDn1fd6i7M5/zz2be+MHFQCqiM7/uhdOh7l/Bjvy/tQPnVb5e1lvZ/6pFKUqAFQNH6l1LMzmvnv/9nevMO8LueX 13bq6urStvb292hGcTmdAad1ud3l5OW+n8AndnJycoaGhCM81YF1AWAHrT0IuIOX7BG/St6WDF5xoW/kNQRAEQZBlWTuUIAiqqgb/or5Icf/RCJvGszXcJkEQop6sLfixaB/aGdNf5Fu1/17I/yEEQAQAWBoyEsDSEAEAloYIALA0RACApSECACwNEQBgaYgAAEtDBABYGiIAwNIQAQCWhggAsDREAIClIQIALA0RAGBpiAAAS0MEAFgaIgDA0hABAJaGCACwNEQAgKUhAgAsDREAYGmIAABLQwQAWBoiAMDSEAEAloYIALA0RACApSECACwNEQBgaYgAAEtDBABYGiIAwNL+D4T1AdV813l+AAAAAElFTkSuQmCC\"/>\u003cfigcaption>图 3　充电桩侧面\u003c/figcaption>\u003c/figure>\u003c/div>\u003cp>充电桩通过正面的充电极片与机器人背面的取电板对接，侧面设有电源接口。\u003c/p>\u003ch3 id=\"manual-heading-6\">2.2　本体与选配\u003c/h3>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>配置说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>机器人本体\u003c/td>\u003ctd>标准交付，含默认末端执行器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>充电桩\u003c/td>\u003ctd>标准交付，用于自主回桩充电\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VR 套件\u003c/td>\u003ctd>选配\u003c/td>\u003c/tr>\u003ctr>\u003ctd>说明书、合格证及其他附件\u003c/td>\u003ctd>按随箱交付清单核对\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection id=\"first\">\u003ch2 id=\"manual-heading-7\">3　首次使用\u003c/h2>\u003col class=\"steps\">\u003cli>\u003cb>核对物品。\u003c/b>检查包装和机身是否有可见损伤，核对本体、充电桩及所购选配件。缺件、破损或线缆异常时先联系交付方。\u003c/li>\u003cli>\u003cb>安置机器人。\u003c/b>在平整地面完成开箱，按交付人员示范的方法移出包装并摆放。不要通过头部、相机、伸缩臂或夹爪提拉整机。\u003c/li>\u003cli>\u003cb>检查运动范围。\u003c/b>确认底盘周围和手臂升降、伸缩、摆动路径没有障碍物，夹爪内没有异物。\u003c/li>\u003cli>\u003cb>检查电源与外设。\u003c/b>确认接口及连接线完好、电量满足任务需要；首次使用先完成交付人员讲解的充电与开机检查。\u003c/li>\u003cli>\u003cb>上电。\u003c/b>开机前确认急停处于释放状态，操作机身侧面的电源开关。\u003c/li>\u003cli>\u003cb>等待启动。\u003c/b>等待系统启动，检查屏幕及软件状态，再连接网络。\u003c/li>\u003cli>\u003cb>完成首次短距离测试。\u003c/b>由教师或技术人员在空旷水平地面低速测试底盘，再分别测试关节和夹爪，确认方向、停止方式及状态反馈符合预期。\u003c/li>\u003c/ol>\u003c/section>\u003csection>\u003ch2 id=\"manual-heading-8\">4　机器人连接与远程登录\u003c/h2>\u003cp>将开发电脑与机器人接入同一局域网，再通过 SSH 登录车载计算单元。\u003c/p>\u003ch3 id=\"manual-heading-9\">4.1　连接前准备\u003c/h3>\u003cul>\u003cli>机器人已正常开机，头部触摸屏可以操作。\u003c/li>\u003cli>准备一台可打开终端并支持 SSH 的开发 PC。\u003c/li>\u003cli>准备可用的外部 Wi-Fi 网络，建议使用 5 GHz 频段，以获得更稳定的数据传输。\u003c/li>\u003c/ul>\u003cp>注意：贡嘎机器人未内置默认热点，必须连接外部 Wi-Fi 网络；开发 PC 也需接入同一局域网。\u003c/p>\u003ch3 id=\"manual-heading-10\">4.2　配置机器人无线网络\u003c/h3>\u003col>\u003cli>在机器人头部触摸屏中，依次进入“系统设置”→“网络连接”。\u003c/li>\u003cli>在 Wi-Fi 列表中选择要连接的网络，输入密码并完成连接。\u003c/li>\u003cli>确认机器人显示网络连接成功，再将开发 PC 接入同一局域网。\u003c/li>\u003c/ol>\u003cp>开发 PC 可连接同一 Wi-Fi，也可通过网线接入同一路由器下的局域网。\u003c/p>\u003ch3 id=\"manual-heading-11\">4.3　获取机器人 IP 地址\u003c/h3>\u003cp>网络连接成功后，在触摸屏的“网络状态”或“关于本机”页面查看并记录机器人当前的 IPv4 地址。\u003c/p>\u003cp>下文以 192.168.1.15 为连接地址。\u003c/p>\u003cp>更换网络后，重新查看机器人 IP 地址。\u003c/p>\u003ch3 id=\"manual-heading-12\">4.4　SSH 远程登录\u003c/h3>\u003cp>在开发 PC 上打开终端，输入以下命令，并将其中的 IP 地址替换为机器人实际地址：\u003c/p>\u003cpre>\u003ccode>ssh chric@&lt;机器人IP地址&gt;\u003c/code>\u003c/pre>\u003cp>例如：\u003c/p>\u003cpre>\u003ccode>ssh chric@192.168.1.15\u003c/code>\u003c/pre>\u003cp>默认登录信息如下：\u003c/p>\u003cul>\u003cli>用户名：chric\u003c/li>\u003cli>密码：123456\u003c/li>\u003c/ul>\u003cp>首次连接时，终端可能提示确认主机指纹，核对连接地址后输入 yes 继续；随后按提示输入密码。登录成功后即可在终端中操作机器人车载计算单元。\u003c/p>\u003cp>首次登录后修改密码并妥善保管。\u003c/p>\u003ch3 id=\"manual-heading-13\">4.5　开发环境确认\u003c/h3>\u003cp>机器人车载计算单元预装以下开发环境：\u003c/p>\u003cul>\u003cli>操作系统：Ubuntu 22.04\u003c/li>\u003cli>机器人操作系统：ROS 2 Humble\u003c/li>\u003c/ul>\u003cp>建议开发 PC 安装相同或兼容的系统与 ROS 2 版本，以减少通信、编译和依赖不一致造成的问题。\u003c/p>\u003cp>登录后可执行以下命令检查当前环境：\u003c/p>\u003cpre>\u003ccode>lsb_release -ds\nprintenv ROS_DISTRO\u003c/code>\u003c/pre>\u003cp>正常情况下，第二条命令输出 humble。若未输出，可在当前终端加载 ROS 2 环境后重试：\u003c/p>\u003cpre>\u003ccode>source /opt/ros/humble/setup.bash\nprintenv ROS_DISTRO\u003c/code>\u003c/pre>\u003ch3 id=\"manual-heading-14\">4.6　连接异常排查\u003c/h3>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>现象\u003c/th>\u003cth>排查与处理方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>机器人无法连接 Wi-Fi\u003c/td>\u003ctd>确认 Wi-Fi 名称和密码正确，检查信号强度及外部网络是否正常。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开发 PC 无法 ping 通机器人\u003c/td>\u003ctd>确认两端处于同一局域网，并在触摸屏上重新核对机器人 IP 地址。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SSH 连接超时或被拒绝\u003c/td>\u003ctd>检查 IP 地址是否输入正确、机器人是否在线，以及局域网是否限制设备间通信。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>更换网络后无法使用原地址登录\u003c/td>\u003ctd>重新进入“网络状态”或“关于本机”页面获取当前 IP 地址，再重新登录。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>提示密码认证失败\u003c/td>\u003ctd>确认用户名为 chric，并使用当前有效密码；默认密码已修改时使用新密码。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>可使用以下命令先测试开发 PC 到机器人的网络连通性，再尝试 SSH 登录：\u003c/p>\u003cpre>\u003ccode>ping 192.168.1.15\u003c/code>\u003c/pre>\u003c/section>\u003csection id=\"tasks\">\u003ch2 id=\"manual-heading-15\">5　教学与任务操作\u003c/h2>\u003ch3 id=\"manual-heading-16\">5.1　导航到目标位置\u003c/h3>\u003col class=\"steps\">\u003cli>确认已加载本场地地图，并完成定位；地图中的机器人位置应与现场位置对应。场地布局变化后先检查地图是否仍适用。\u003c/li>\u003cli>在已部署的管理界面选择可通行区域内的目标，或由开发程序发送导航任务。\u003c/li>\u003cli>观察机器人运动和任务反馈。通过最终任务状态确认到达。\u003c/li>\u003cli>需要中止时，使用导航取消功能并确认实际停止；有即时危险时使用急停。\u003c/li>\u003c/ol>\u003ch3 id=\"manual-heading-17\">5.2　抓取与放置\u003c/h3>\u003col class=\"steps\">\u003cli>准备符合负载要求的教学物体，确认目标位置可见、可达，且手臂路径和放置面无障碍。\u003c/li>\u003cli>在已部署的任务入口选择目标物体和放置位置，或使用已配置的语音任务。\u003c/li>\u003cli>等待执行完成，观察夹持情况和状态反馈，不在执行中伸手调整物体。\u003c/li>\u003cli>失败时先取消或结束当前任务，确认机器人已停止后，再检查物体摆放与目标选择，不连续重复下发同一动作。\u003c/li>\u003c/ol>\u003ch3 id=\"manual-heading-18\">5.3　语音与组合任务\u003c/h3>\u003cp>语音识别和播报需联网并完成服务配置。说出“小微小微”或“贡嘎贡嘎”，等待唤醒应答结束，停顿约 0.5 秒后连贯说出指令；说完保持安静约 1 秒。每轮交互需要重新唤醒。\u003c/p>\u003cp>使用 Flash 决策版时，先录入固定位置，任务中同时说明来源和放置位置，并使用与录入时一致的名称。具体录入方法、追问处理和取消任务方式参阅\u003ca href=\"#technical/technical-heading-43\">技术手册中的 Flash 决策模块\u003c/a>。\u003c/p>\u003ch3 id=\"manual-heading-19\">5.4　VR 遥控套件（选配）\u003c/h3>\u003cp>先按\u003ca href=\"#technical/technical-heading-103\">技术手册 第 4.5 节\u003c/a>启动机器人端 VR 服务，使机器人与头显处于同一局域网，在头显中选择与启动日志名称和编号一致的机器人。\u003c/p>\u003col>\u003cli>将右手柄对准希望设定的机器人正前方，长按 Meta 键 3 秒校准方向。\u003c/li>\u003cli>按住手柄中部按钮启用机械臂遥控，松开按钮停用手柄遥控。\u003c/li>\u003cli>需要调整手柄位置时，先松开中部按钮，再移动手柄，随后重新按住按钮继续操作。\u003c/li>\u003c/ol>\u003cp>手柄应保持在头显可视范围内。定位丢失或运动异常时立即松开中部按钮，必要时急停。\u003c/p>\u003ch3 id=\"manual-heading-20\">5.5　结束使用\u003c/h3>\u003col class=\"steps\">\u003cli>通过当前控制方式取消或结束任务，停止底盘及各关节运动。\u003c/li>\u003cli>卸下抓取物体，按交付确认的方法将手臂置于安全收纳位置，确认周围无夹压风险。\u003c/li>\u003cli>保存本次地图、实验结果及必要日志；按已部署软件的停止流程结束程序。\u003c/li>\u003cli>确认机器人原地静止后，操作侧面电源开关关机。不要在保存或更新过程中切断电源。\u003c/li>\u003c/ol>\u003c/section>\u003csection id=\"charging\">\u003ch2 id=\"manual-heading-21\">6　充电与电池使用\u003c/h2>\u003ch3 id=\"manual-heading-22\">6.1　充电前检查\u003c/h3>\u003cul>\u003cli>检查电源线、充电设备和取电接触部位是否完好、干燥、无明显污损。\u003c/li>\u003cli>充电桩放在平整位置，留出机器人接近和对接的通道。\u003c/li>\u003cli>出现异常发热、异味、鼓包、变形或破损时停止使用，联系技术人员检查，不自行拆解电池和充电设备。\u003c/li>\u003c/ul>\u003ch3 id=\"manual-heading-23\">6.2　自主回桩充电\u003c/h3>\u003col class=\"steps\">\u003cli>确认充电桩已接通匹配电源，机器人已定位，回桩路径通畅。\u003c/li>\u003cli>通过已配置的管理入口启动回充任务；开发者也可调用充电任务接口。\u003c/li>\u003cli>观察机器人返回充电桩、对准并完成接触。不要站在对接路径中，也不要用手推压机器人强行对接。\u003c/li>\u003cli>机器人与充电桩对接后，查看充电状态和电池信息，确认充电开始。\u003c/li>\u003cli>结束充电时使用本机停止充电功能，并在机器人脱桩及状态确认后再下发移动任务。\u003c/li>\u003c/ol>\u003ch3 id=\"manual-heading-24\">6.3　有线充电\u003c/h3>\u003cp>使用配套有线充电器，将充电器接入交流电源后连接机器人充电口。充电时机器人处于开机状态。\u003c/p>\u003ch3 id=\"manual-heading-25\">6.4　电池维护\u003c/h3>\u003cp>不要在过热或过冷环境充电，不使用不匹配的充电设备。长期不使用时，按随配电池的维护要求安排存放电量和定期检查；不要将机器人存放在日晒、热源、潮湿或易燃易爆环境中。电池拆装由技术人员操作。\u003c/p>\u003c/section>\u003csection id=\"care\">\u003ch2 id=\"manual-heading-26\">7　维护、存放与技术支持\u003c/h2>\u003ch3 id=\"manual-heading-27\">7.1　清洁与检查\u003c/h3>\u003cp>关机并按本机要求断开外部供电后，使用柔软干布清洁机身和摄像头外表面。不冲洗，不向关节、散热孔及接口灌入清洁液，不用硬物擦划镜片。清洁充电接触部位前先断开充电设备电源。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>时机\u003c/th>\u003cth>检查内容\u003c/th>\u003cth>发现异常后的处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>每次使用前后\u003c/td>\u003ctd>关节与伸缩机构、覆盖件、线缆、夹爪及充电接触部位有无损伤、异物或明显松动\u003c/td>\u003ctd>停止使用，记录现象并联系技术人员；不要自行拆修关节和电气部件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>运行过程中\u003c/td>\u003ctd>持续异响、卡顿、异常发热、碰撞或明显姿态异常\u003c/td>\u003ctd>停止任务；存在危险时急停，问题未排除前不继续使用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>长期停用及重新启用前\u003c/td>\u003ctd>外观、存放环境、电池与充电设备状态\u003c/td>\u003ctd>按配套电池说明维护，恢复使用前完成上电前检查\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"manual-heading-28\">7.2　长期存放与收纳运输\u003c/h3>\u003cp>将机器人存放于干燥、通风、避免日晒的位置，远离热源、腐蚀性物品及易燃易爆物品。存放电量及补电周期按本机配套电池说明执行。不要自行拆卸内置电池。\u003c/p>\u003cp>运输前结束任务、卸下物体、关机并断开外部线缆。使用专用包装和缓冲固定，避免受挤压、撞击及振动。手臂收纳位置、搬运支撑点与包装固定方法按交付人员示范执行；不得强行扳动关节或通过手臂、头部提起整机。\u003c/p>\u003ch3 id=\"manual-heading-29\">7.3　软件更新\u003c/h3>\u003cp>使用与本机版本匹配、来源明确的升级包和工具。更新前保存必要数据并结束动作，更新中保持供电和连接稳定。不清楚版本兼容性或更新失败时联系技术支持，不反复断电或使用来源不明的升级包。\u003c/p>\u003ch3 id=\"manual-heading-30\">7.4　报修与服务\u003c/h3>\u003cp>无法排除异常时联系交付方或技术支持，问题解决前暂停使用。送修前确认寄送设备、附件及包装要求。保修范围及服务事项按随产品交付的保修文件办理。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>报修项目\u003c/th>\u003cth>建议提供内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>设备信息\u003c/td>\u003ctd>设备编号、交付信息、当前硬件与软件版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>发生过程\u003c/td>\u003ctd>发生时间、当时使用的功能、异常前的具体操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>现场证据\u003c/td>\u003ctd>提示或错误码截图、照片或视频，以及能获取的相关日志\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已进行的操作\u003c/td>\u003ctd>是否急停、是否重启、是否碰撞、是否更换外设或修改配置\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection>\u003ch2 id=\"manual-heading-31\">8　常见故障与处理\u003c/h2>\u003cul>\u003cli>无法连接机器人：\u003ca href=\"#manual/manual-heading-14\">检查网络与 SSH 登录\u003c/a>。\u003c/li>\u003cli>无法唤醒或播报：\u003ca href=\"#technical/technical-heading-67\">检查 ASR、TTS 与音频设备\u003c/a>。\u003c/li>\u003cli>地图缺失或导航失败：\u003ca href=\"#technical/technical-heading-84\">检查定位、目标点和导航状态\u003c/a>。\u003c/li>\u003cli>抓取提示 IK_solve_failed：\u003ca href=\"#technical/technical-heading-91\">检查目标可达范围与深度数据\u003c/a>。\u003c/li>\u003c/ul>\u003c/section>", "version": "V1.0", "date": "2026.11.16", "pdf": "PDF/GONGKA Robot 用户手册.pdf", "pages": 10, "bytes": 1906248}, {"id": "technical", "title": "技术手册", "summary": "传感器与电机驱动、决策与感知、语音、导航、控制、LeRobot、仿真及 VR。", "html": "\u003csection>\u003ch2 id=\"technical-heading-0\">1　传感器驱动及外设\u003c/h2>\u003ch3 id=\"technical-heading-1\">1.1　传感器与电机驱动启动\u003c/h3>\u003cp>机器人全部传感器（深度相机、激光雷达、IMU）与底盘电机驱动由同一脚本统一启动，无需分别单独启动。\u003c/p>\u003cp>⚠ 启动前请确认急停已释放、设备处于正常上电状态。\u003c/p>\u003cp>打开新终端，执行：\u003c/p>\u003cpre>\u003ccode>cd ~/konka/navigation/scripts\n./1_nav_drive.sh\u003c/code>\u003c/pre>\u003cp>检查驱动终端的运行日志，并验证下列话题持续输出数据。\u003c/p>\u003cp>启动完成后，可通过以下命令分别确认数据：\u003c/p>\u003cul>\u003cli>深度相机：ros2 topic hz /camera/color/image_raw（详见\u003ca href=\"#technical/technical-heading-2\">技术手册 第 1.2 节\u003c/a>）\u003c/li>\u003cli>激光雷达：ros2 topic hz /scan（详见\u003ca href=\"#technical/technical-heading-10\">技术手册 第 1.3 节\u003c/a>）\u003c/li>\u003cli>电机状态：ros2 topic echo /motorFbk_topic（详见\u003ca href=\"#technical/technical-heading-16\">技术手册 第 1.4 节\u003c/a>）\u003c/li>\u003c/ul>\u003ch3 id=\"technical-heading-2\">1.2　深度相机使用指南\u003c/h3>\u003cp>相机通过 USB 3.0 Type-C 连接，使用 gemini_330_series.launch.py 驱动。\u003c/p>\u003ch4 id=\"technical-heading-3\">1.2.1　相机简介\u003c/h4>\u003cp>Gemini 336L 是一款主动双目 + 被动立体视觉融合的 3D 相机，主要规格如下：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>参数\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>深度分辨率\u003c/td>\u003ctd>最高 1280×800 @30 fps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RGB 分辨率\u003c/td>\u003ctd>最高 1280×800 @60fps，全局快门\u003c/td>\u003c/tr>\u003ctr>\u003ctd>深度量程\u003c/td>\u003ctd>最佳 0.25~6 m（最远 20 m+），2 m 处精度 ≤0.8%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>视场角\u003c/td>\u003ctd>90° × 65°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>传感器\u003c/td>\u003ctd>双目 IR + 散斑投射 + RGB + 6 轴 IMU + 激光测距\u003c/td>\u003c/tr>\u003ctr>\u003ctd>接口\u003c/td>\u003ctd>USB 3.0 Type-C，IP65 防护\u003c/td>\u003c/tr>\u003ctr>\u003ctd>USB ID\u003c/td>\u003ctd>2bc5:0807\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>ROS2 驱动启动后会自动输出：彩色图、深度图、点云、红外图、IMU 及 TF 变换。\u003c/p>\u003ch4 id=\"technical-heading-4\">1.2.2　查看数据\u003c/h4>\u003ch5 id=\"technical-heading-5\">话题列表\u003c/h5>\u003cpre>\u003ccode>ros2 topic list\u003c/code>\u003c/pre>\u003cp>正常应包含以下话题：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>话题\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>/camera/color/image_raw\u003c/td>\u003ctd>RGB 图像（sensor_msgs/Image）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/camera/color/camera_info\u003c/td>\u003ctd>RGB 内参\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/camera/depth/image_raw\u003c/td>\u003ctd>深度图（单位：mm）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/camera/depth/camera_info\u003c/td>\u003ctd>深度相机内参\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/camera/depth/points\u003c/td>\u003ctd>点云（PointCloud2，默认开启）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/camera/left_ir/image_raw\u003c/td>\u003ctd>左红外图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/camera/right_ir/image_raw\u003c/td>\u003ctd>右红外图（部分固件）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/camera/imu\u003c/td>\u003ctd>IMU 数据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/diagnostics\u003c/td>\u003ctd>温度等诊断信息\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/tf、/tf_static\u003c/td>\u003ctd>相机坐标系变换\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch5 id=\"technical-heading-6\">命令行验证\u003c/h5>\u003cpre>\u003ccode># 频率检查（RGB 默认 30fps，深度 30fps）\nros2 topic hz /camera/color/image_raw\nros2 topic hz /camera/depth/image_raw\n\n# 类型检查\nros2 topic info /camera/depth/points\n\n# 查看当前深度分辨率\nros2 topic echo /camera/depth/camera_info --once\n\n# 查看彩色图的 frame_id（RViz 里要用）\nros2 topic echo /camera/color/image_raw --once | grep frame_id\n\n# 服务：获取 SDK 版本\nros2 service call /camera/get_sdk_version orbbec_camera_msgs/srv/GetString '{}'\n\n# 参数\nros2 param list /camera\u003c/code>\u003c/pre>\u003ch5 id=\"technical-heading-7\">图像可视化\u003c/h5>\u003cpre>\u003ccode># 方式一：rqt_image_view（可下拉切换所有图像话题）\nros2 run rqt_image_view rqt_image_view\n\n# 方式二：RViz2 同时看图像和点云\nrviz2\u003c/code>\u003c/pre>\u003cp>RViz2 配置步骤：\u003c/p>\u003col>\u003cli>Global Options → Fixed Frame 填 camera_link\u003c/li>\u003cli>Add → By topic → /camera/color/image_raw → Image：查看 RGB\u003c/li>\u003cli>Add → By topic → /camera/depth/image_raw → Image：查看深度图（DepthMap 配色）\u003c/li>\u003cli>Add → By topic → /camera/depth/points → PointCloud2：查看 3D 点云（Style 选 Points，Size 设 0.005）\u003c/li>\u003cli>TF 插件可查看相机各坐标系关系\u003c/li>\u003c/ol>\u003ch4 id=\"technical-heading-8\">1.2.3　关键启动参数\u003c/h4>\u003cp>自定义相机启动参数如下。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>默认值\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>color_width/height/fps\u003c/td>\u003ctd>1280/800/30\u003c/td>\u003ctd>RGB 分辨率帧率\u003c/td>\u003c/tr>\u003ctr>\u003ctd>depth_width/height/fps\u003c/td>\u003ctd>1280/800/30\u003c/td>\u003ctd>深度分辨率帧率（带宽紧张可改 848×480）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>enable_point_cloud\u003c/td>\u003ctd>true\u003c/td>\u003ctd>是否发布点云\u003c/td>\u003c/tr>\u003ctr>\u003ctd>enable_colored_point_cloud\u003c/td>\u003ctd>false\u003c/td>\u003ctd>发布彩色点云（更耗资源）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>enable_ir\u003c/td>\u003ctd>true\u003c/td>\u003ctd>红外图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>enable_imu\u003c/td>\u003ctd>true\u003c/td>\u003ctd>IMU 数据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>serial_number\u003c/td>\u003ctd>空\u003c/td>\u003ctd>多相机时指定 SN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>depth_registration\u003c/td>\u003ctd>true\u003c/td>\u003ctd>深度对齐到彩色坐标系\u003c/td>\u003c/tr>\u003ctr>\u003ctd>camera_name\u003c/td>\u003ctd>camera\u003c/td>\u003ctd>话题前缀\u003c/td>\u003c/tr>\u003ctr>\u003ctd>depth_work_mode\u003c/td>\u003ctd>—\u003c/td>\u003ctd>深度工作模式（官方文档有多种预设）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-9\">1.2.4　常见问题排查\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>现象\u003c/th>\u003cth>原因\u003c/th>\u003cth>解决办法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>list_devices_node 找不到设备\u003c/td>\u003ctd>udev 规则没装/未生效\u003c/td>\u003ctd>重新插拔相机，检查 udev 规则\u003c/td>\u003c/tr>\u003ctr>\u003ctd>openUsbDevice failed 权限错误\u003c/td>\u003ctd>设备节点权限不足\u003c/td>\u003ctd>临时 sudo chmod 666 /dev/bus/usb/XXX/XXX\u003c/td>\u003c/tr>\u003ctr>\u003ctd>图像卡顿、花屏、丢帧\u003c/td>\u003ctd>插在了 USB2.0 口/带宽不足\u003c/td>\u003ctd>换 USB3 口；降低分辨率帧率；加大 usbfs 内存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RViz 全红 Global Status: Error\u003c/td>\u003ctd>Fixed Frame 错误\u003c/td>\u003ctd>Fixed Frame 设置为实际图像或点云的 frame_id\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RTAB-Map 等算法收不到图像\u003c/td>\u003ctd>QoS 不匹配\u003c/td>\u003ctd>算法侧加 qos:=2（BEST_EFFORT）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>深度图全是 0\u003c/td>\u003ctd>距离超出量程或强反光\u003c/td>\u003ctd>目标放在 0.25~6 m 内测试\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"technical-heading-10\">1.3　激光雷达使用指南\u003c/h3>\u003cp>雷达数据发布到 /scan，消息类型为 sensor_msgs/msg/LaserScan。\u003c/p>\u003ch4 id=\"technical-heading-11\">1.3.1　命令行查看数据\u003c/h4>\u003cp>雷达驱动启动后，数据发布在 /scan 话题上。\u003c/p>\u003cpre>\u003ccode># 确认 /scan 话题存在\nros2 topic list\n\n# 查看发布频率（A1 通常约 5~10 Hz）\nros2 topic hz /scan\n\n# 逐条打印原始数据\nros2 topic echo /scan\u003c/code>\u003c/pre>\u003cp>/scan（LaserScan）消息字段说明：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>angle_min / angle_max\u003c/td>\u003ctd>扫描起始/结束角度（A1 是 -3.14 ~ +3.14 弧度，360°）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>angle_increment\u003c/td>\u003ctd>相邻两束激光的角度步长\u003c/td>\u003c/tr>\u003ctr>\u003ctd>range_min / range_max\u003c/td>\u003ctd>量程范围（A1 约 0.15 ~ 12 m）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ranges[]\u003c/td>\u003ctd>每个角度的距离（米），数组长度 = 全角度束数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>intensities[]\u003c/td>\u003ctd>反射强度，A1 此功能较弱\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-12\">1.3.2　RViz 可视化\u003c/h4>\u003cpre>\u003ccode>rviz2\u003c/code>\u003c/pre>\u003cp>在 RViz 中依次配置：\u003c/p>\u003col>\u003cli>Fixed Frame：填雷达的 frame_id（默认是 laser，以启动参数里设置的为准）\u003c/li>\u003cli>点击左下角 Add → 添加 LaserScan 插件\u003c/li>\u003cli>在 LaserScan 的 Topic 下拉框中选择 /scan\u003c/li>\u003c/ol>\u003cp>出现 frame does not exist 时，将 RViz 的 Fixed Frame 设置为雷达实际 frame_id。需要在底盘坐标系显示时，加载机器人标定得到的 TF 变换。\u003c/p>\u003cp>也可直接使用驱动自带的带 RViz 的 launch 文件：\u003c/p>\u003cpre>\u003ccode>ros2 launch rplidar_ros view_rplidar_a1_launch.py\u003c/code>\u003c/pre>\u003ch4 id=\"technical-heading-13\">1.3.3　Python 脚本读取数据\u003c/h4>\u003cp>保存为 check_scan.py：\u003c/p>\u003cpre>\u003ccode>import rclpy\nfrom rclpy.node import Node\nfrom sensor_msgs.msg import LaserScan\n\nclass Check(Node):\n    def __init__(self):\n        super().__init__('check_scan')\n        self.create_subscription(LaserScan, 'scan', self.cb, 10)\n\n    def cb(self, msg):\n        valid = [r for r in msg.ranges if msg.range_min &lt; r &lt; msg.range_max]\n        if valid:\n            self.get_logger().info(\n                f'有效点数: {len(valid)}/{len(msg.ranges)}  最近距离: {min(valid):.2f} m'\n            )\n        else:\n            self.get_logger().warn('无有效数据!')\n\nrclpy.init()\nrclpy.spin(Check())\u003c/code>\u003c/pre>\u003ch4 id=\"technical-heading-14\">1.3.4　常见问题排查\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>现象\u003c/th>\u003cth>可能原因\u003c/th>\u003cth>解决办法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ros2 topic hz /scan 无输出\u003c/td>\u003ctd>驱动没跑起来\u003c/td>\u003ctd>检查串口名、权限、波特率（A1 为 115200）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/scan 有数据但全是 inf\u003c/td>\u003ctd>雷达前方空旷或超出量程\u003c/td>\u003ctd>在雷达前方 0.5 m 处放一块障碍物再测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RViz 显示 Global Status: Error\u003c/td>\u003ctd>Fixed Frame 填错，或 TF 缺失\u003c/td>\u003ctd>Fixed Frame 设置为实际雷达 frame_id，并加载机器人 TF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数据时断时续\u003c/td>\u003ctd>USB 供电不稳\u003c/td>\u003ctd>换 USB 口，或外接供电\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-15\">1.3.5　最快验证流程\u003c/h4>\u003col>\u003cli>ros2 topic hz /scan —— 确认话题在发布\u003c/li>\u003cli>拿一块板子挡在雷达前方\u003c/li>\u003cli>ros2 topic echo /scan —— 看 ranges 中对应方向出现小数值\u003c/li>\u003cli>打开 RViz —— 看到点云图像\u003c/li>\u003c/ol>\u003ch3 id=\"technical-heading-16\">1.4　电机驱动使用方法\u003c/h3>\u003ch4 id=\"technical-heading-17\">1.4.1　通信机制\u003c/h4>\u003cp>电机协议层接口采用 ROS2 话题通信机制（V1.0）。\u003c/p>\u003ch4 id=\"technical-heading-18\">1.4.2　运动指令话题\u003c/h4>\u003cp>话题名称：/motorDrive_topic\u003c/p>\u003cp>功能：接收电机运动命令。\u003c/p>\u003cp>消息类型中 string[] joint 和 int32[] mode 为必填项。joint 是需要运动的关节名称，和 URDF 对应。所支持的关节名称如下：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>关节名称\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>wrist_yaw_joint\u003c/td>\u003ctd>腕部偏航关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>wrist_pitch_joint\u003c/td>\u003ctd>腕部俯仰关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>wrist_roll_joint\u003c/td>\u003ctd>腕部横滚关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gripper_joint\u003c/td>\u003ctd>夹爪关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>head_yaw_joint\u003c/td>\u003ctd>头部偏航关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>head_pitch_joint\u003c/td>\u003ctd>头部俯仰关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>head_camera_yaw_joint\u003c/td>\u003ctd>头部相机偏航关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>head_camera_pitch_joint\u003c/td>\u003ctd>头部相机俯仰关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>right_wheel_joint\u003c/td>\u003ctd>右轮关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>left_wheel_joint\u003c/td>\u003ctd>左轮关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>arm_lift_joint\u003c/td>\u003ctd>升降臂关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>arm_joint\u003c/td>\u003ctd>臂关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>arm_yaw_joint\u003c/td>\u003ctd>臂偏航关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>none\u003c/td>\u003ctd>特殊关节（不产生运动，用于通信测试）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>⚠ 当关节名称为 none 时，不会产生运动。可用于通信测试，或方便将电机命令中的某一个关节去掉。\u003c/p>\u003cp>int32[] mode 为电机控制模式，规定如下：\u003c/p>\u003cp>ROS 2 协议层支持模式 1、2、3、4；SDK 的 SendMotorControl 支持模式 1、3、4。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模式值\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>绝对位置模式（相对零位的运动距离）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>相对位置模式（相对当前位置的运动距离）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>速度模式（以指定速度持续运动，需要上位机自行判断何时停止）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>搜零（仅对升降臂有用）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>float64[] pos 和 float64[] vel 分别为关节的位置和速度，运动单位如下：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>关节类型\u003c/th>\u003cth>位置单位\u003c/th>\u003cth>速度单位\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>旋转关节\u003c/td>\u003ctd>rad\u003c/td>\u003ctd>rad/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>直线关节\u003c/td>\u003ctd>m\u003c/td>\u003ctd>m/s\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>⚠ 这是关节运动模式而不是电机类型，旋转电机带动关节进行直线运动的属于直线关节。\u003c/p>\u003ch4 id=\"technical-heading-19\">1.4.3　启动方法\u003c/h4>\u003cp>konka1_base 下存在名为 comm_nodes 功能包，运行该功能包的同名节点，进程提示\"打开串口 xxx\"即可：\u003c/p>\u003cpre>\u003ccode>cd path_to_konka1_base\nsource install/setup.bash\nros2 run comm_nodes comm_nodes\u003c/code>\u003c/pre>\u003ch4 id=\"technical-heading-20\">1.4.4　发布命令\u003c/h4>\u003cp>joint、mode、pos、vel 数组按同一关节顺序填写。\u003c/p>\u003cpre>\u003ccode>msg = MotorDrive()\nmsg.joint = ['none']\nmsg.pos = [0.0]\nmsg.vel = [0.0]\nmsg.mode = [1]\npublisher.publish(msg)\u003c/code>\u003c/pre>\u003cp>\u003ccode>none\u003c/code> 用于通信测试，不驱动关节运动。\u003c/p>\u003ch4 id=\"technical-heading-21\">1.4.5　状态反馈话题\u003c/h4>\u003cp>话题名称：/motorFbk_topic\u003c/p>\u003cp>功能：固定频率发布所有电机状态。其中 header 包含了时间戳信息。\u003c/p>\u003ch4 id=\"technical-heading-22\">1.4.6　状态查询服务\u003c/h4>\u003cp>服务名称：/motorFbk_service\u003c/p>\u003cp>功能：提供查询电机状态的服务，暂不启用。\u003c/p>\u003ch4 id=\"technical-heading-23\">1.4.7　注意事项\u003c/h4>\u003cul>\u003cli>部分关节电机不完全支持上述模式，当控制模式和硬件不符时，电机不会运动，并返回警告。\u003c/li>\u003cli>当命令位置超出关节限制时，所有电机都不再运动，并返回警告。\u003c/li>\u003cli>升降臂（arm_lift_joint）需要靠底部的光电传感器进行标零，每次断电后，需要使用模式 4 进行搜零。可以通过重启协议层自动进行搜零。\u003c/li>\u003c/ul>\u003ch2 id=\"technical-heading-24\">2　决策与感知模块\u003c/h2>\u003ch3 id=\"technical-heading-25\">2.1　决策模块使用说明书\u003c/h3>\u003cp>适用交付包：brain-planner-v2\u003c/p>\u003ch4 id=\"technical-heading-26\">2.1.1　概述\u003c/h4>\u003cp>决策模块运行时需要依次启动以下三个程序：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>启动顺序\u003c/th>\u003cth>程序\u003c/th>\u003cth>启动脚本\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>特征计算服务\u003c/td>\u003ctd>model_embedding_service/start_embedding_services.sh\u003c/td>\u003ctd>加载感知所需的特征模型，当前监听端口 8000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>模型管理服务\u003c/td>\u003ctd>run_model_manage_service.sh\u003c/td>\u003ctd>管理并转发特征请求，当前监听端口 6001\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>决策模块\u003c/td>\u003ctd>run_brain_planner.sh\u003c/td>\u003ctd>启动机器人决策节点\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>项目目录：/home/chric/konka/decision/brain-planner-v2。\u003c/p>\u003ch4 id=\"technical-heading-27\">2.1.2　启动前配置\u003c/h4>\u003ch5 id=\"technical-heading-28\">确认配置文件路径\u003c/h5>\u003cp>决策模块使用的配置文件为：\u003c/p>\u003cpre>\u003ccode>brain-planner-v2/dev_ws/src/brain_planner/brain_planner/thirdpart/multimodal-agent/agent/config/config.yaml\u003c/code>\u003c/pre>\u003cp>将 run_brain_planner.sh 中的 AGENT_CONFIG_PATH 设置为该配置文件的绝对路径。\u003c/p>\u003ch5 id=\"technical-heading-29\">确认运行条件\u003c/h5>\u003col>\u003cli>decision_env 环境已经安装并可正常激活。\u003c/li>\u003cli>模型文件、install/ 目录及配置文件完整。\u003c/li>\u003cli>GPU 可用，端口 8000 和 6001 未被其他程序占用。\u003c/li>\u003cli>使用云端模型时，机器人可以访问互联网，且 run_brain_planner.sh 已配置有效的 API Key。\u003c/li>\u003cli>使用 Rerun 场景展示时，机器人能够访问配置的 Rerun 服务地址。\u003c/li>\u003c/ol>\u003ch4 id=\"technical-heading-30\">2.1.3　启动方法\u003c/h4>\u003cp>三个程序分别在独立终端中启动。每个终端均先激活 decision_env，并进入项目目录。\u003c/p>\u003ch5 id=\"technical-heading-31\">启动特征计算服务（终端 1）\u003c/h5>\u003cpre>\u003ccode>conda activate decision_env\ncd /home/chric/konka/decision/brain-planner-v2\nbash model_embedding_service/start_embedding_services.sh\u003c/code>\u003c/pre>\u003cp>该脚本在后台启动特征计算服务。可使用以下命令检查：\u003c/p>\u003cpre>\u003ccode>curl -s http://127.0.0.1:8000/health\u003c/code>\u003c/pre>\u003cp>当前配置使用 YOLOE 特征模型。响应中的 models_status.yoloe 显示 initialized 后，再启动下一项服务。\u003c/p>\u003ch5 id=\"technical-heading-32\">启动模型管理服务（终端 2）\u003c/h5>\u003cpre>\u003ccode>conda activate decision_env\ncd /home/chric/konka/decision/brain-planner-v2\nbash run_model_manage_service.sh\u003c/code>\u003c/pre>\u003cp>保持该终端打开。终端显示模型管理服务已经启动并监听 6001 端口后，再启动决策模块。\u003c/p>\u003ch5 id=\"technical-heading-33\">启动决策模块（终端 3）\u003c/h5>\u003cpre>\u003ccode>conda activate decision_env\ncd /home/chric/konka/decision/brain-planner-v2\nbash run_brain_planner.sh\u003c/code>\u003c/pre>\u003cp>保持该终端打开。出现 robot_agent initialized 信息表示决策核心初始化完成。\u003c/p>\u003ch4 id=\"technical-heading-34\">2.1.4　停止与重启\u003c/h4>\u003ch5 id=\"technical-heading-35\">统一停止\u003c/h5>\u003cp>停止继续下发任务，等待机器人当前动作结束后，在新终端执行：\u003c/p>\u003cpre>\u003ccode>cd /home/chric/konka/decision/brain-planner-v2\nbash kill_brain_planner.sh\u003c/code>\u003c/pre>\u003ch5 id=\"technical-heading-36\">分模块停止\u003c/h5>\u003cul>\u003cli>决策模块：在运行 run_brain_planner.sh 的终端按 Ctrl+C。\u003c/li>\u003cli>模型管理服务：在运行 run_model_manage_service.sh 的终端按 Ctrl+C。\u003c/li>\u003cli>特征计算服务：执行以下命令：\u003c/li>\u003c/ul>\u003cpre>\u003ccode>cd /home/chric/konka/decision/brain-planner-v2\nbash model_embedding_service/stop_embedding_services.sh\u003c/code>\u003c/pre>\u003cp>⚠ 停止决策进程不等同于机器人急停。机器人正在执行物理动作时，应按照整机安全操作要求停止执行机构。\u003c/p>\u003ch4 id=\"technical-heading-37\">2.1.5　关键参数配置\u003c/h4>\u003ch5 id=\"technical-heading-38\">模型配置\u003c/h5>\u003cp>打开 agent/config/config.yaml，找到 model_service 下的 chat_model：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>chat_model_url\u003c/td>\u003ctd>模型服务地址。使用阿里云百炼时保留交付地址；使用本地模型时填写本地 OpenAI 兼容服务地址\u003c/td>\u003c/tr>\u003ctr>\u003ctd>chat_model_name\u003c/td>\u003ctd>决策实际调用的多模态模型名称，必须与服务端提供的模型标识完全一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>use_local\u003c/td>\u003ctd>false 表示使用云端服务及 API Key；true 表示使用本地模型服务\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch5 id=\"technical-heading-39\">API Key 配置\u003c/h5>\u003cp>API Key 不在 config.yaml 中，而是在 run_brain_planner.sh 中通过 DASHSCOPE_API_KEY 设置：\u003c/p>\u003cpre>\u003ccode>export DASHSCOPE_API_KEY=\"替换为实际获取的API_Key\"\u003c/code>\u003c/pre>\u003ch5 id=\"technical-heading-40\">Rerun 场景展示\u003c/h5>\u003cp>Rerun 用于展示决策记忆中的增量场景点云。在 config.yaml 中修改以下参数：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>incremental_visual\u003c/td>\u003ctd>true 开启场景展示并连接 Rerun 服务；false 关闭展示\u003c/td>\u003c/tr>\u003ctr>\u003ctd>remote_host\u003c/td>\u003ctd>Rerun 服务连接地址，格式为 rerun+http://IP:9876/proxy\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-41\">2.1.6　日志查看\u003c/h4>\u003cp>所有日志命令均在 brain-planner-v2 项目目录中执行。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>日志\u003c/th>\u003cth>位置\u003c/th>\u003cth>查看命令\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>决策详细日志\u003c/td>\u003ctd>log/agent.log\u003c/td>\u003ctd>tail -n 100 log/agent.log 或 tail -f log/agent.log\u003c/td>\u003c/tr>\u003ctr>\u003ctd>特征计算服务日志\u003c/td>\u003ctd>model_embedding_service/logs/\u003c/td>\u003ctd>tail -f model_embedding_service/logs/gpu_0_port_8000.log\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型管理服务日志\u003c/td>\u003ctd>启动终端\u003c/td>\u003ctd>直接显示在 run_model_manage_service.sh 终端\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-42\">2.1.7　常见问题\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>问题\u003c/th>\u003cth>处理方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>决策启动时提示配置文件不存在\u003c/td>\u003ctd>检查 run_brain_planner.sh 中的 AGENT_CONFIG_PATH 是否为现场实际路径\u003c/td>\u003c/tr>\u003ctr>\u003ctd>特征服务进程已建立，但后续服务不可用\u003c/td>\u003ctd>等待模型加载，并确认 /health 中 models_status.yoloe 为 initialized\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型管理服务连接失败\u003c/td>\u003ctd>检查 8000 服务状态、new_models.json 配置及启动终端错误\u003c/td>\u003c/tr>\u003ctr>\u003ctd>决策无法访问特征服务\u003c/td>\u003ctd>检查 emb_model_url 是否为模型管理服务的 6001 地址\u003c/td>\u003c/tr>\u003ctr>\u003ctd>云端模型调用失败\u003c/td>\u003ctd>检查网络、API Key、chat_model_url、模型名称和账号权限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rerun 没有画面\u003c/td>\u003ctd>检查展示开关、Rerun 服务、IP、9876 端口和决策日志\u003c/td>\u003c/tr>\u003ctr>\u003ctd>修改配置后未生效\u003c/td>\u003ctd>确认修改的是 AGENT_CONFIG_PATH 指向的文件，并完整重启决策模块\u003c/td>\u003c/tr>\u003ctr>\u003ctd>停止后端口仍被占用\u003c/td>\u003ctd>执行 kill_brain_planner.sh，确认三个程序的 PID 记录均已清理\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"technical-heading-43\">2.2　决策模块使用说明书（Flash版本）\u003c/h3>\u003ch4 id=\"technical-heading-44\">2.2.1　概述\u003c/h4>\u003cp>Flash 版本采用逐步规划方式执行机器人任务。收到任务后，系统根据已录入的场景位置、实时感知画面和动作执行结果，持续规划下一步操作，直至任务完成或终止。\u003c/p>\u003cp>Flash 决策包：brain-planner-v2-flash；规划模块：multimodal-agent-flash。\u003c/p>\u003ch4 id=\"technical-heading-45\">2.2.2　运行组成\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>启动顺序\u003c/th>\u003cth>程序\u003c/th>\u003cth>启动方式\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>特征计算服务\u003c/td>\u003ctd>model_embedding_service/start_embedding_services.sh\u003c/td>\u003ctd>为配套感知服务能力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>模型管理服务\u003c/td>\u003ctd>run_model_manage_service.sh\u003c/td>\u003ctd>管理并转发配套特征请求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>本地定位服务\u003c/td>\u003ctd>按现场交付方式启动\u003c/td>\u003ctd>为抓取目标和放置点提供图像定位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Flash 决策模块\u003c/td>\u003ctd>run_brain_planner.sh\u003c/td>\u003ctd>接收任务、生成规划、驱动机器人执行\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-46\">2.2.3　大物体位置录入\u003c/h4>\u003cp>Flash 版本执行搬运任务前，需要先录入机器人可以到达的固定位置，例如桌子、茶几、沙发、床头柜和垃圾桶。\u003c/p>\u003ch5 id=\"technical-heading-47\">录入前准备\u003c/h5>\u003col>\u003cli>确认感知模块正在持续输出有效场景信息。\u003c/li>\u003cli>将机器人移动到适合观察和操作目标位置的安全位姿。\u003c/li>\u003cli>保证目标区域无遮挡，机器人后续能够再次到达该位姿。\u003c/li>\u003cli>使用清晰且稳定的名称；任务指令中的位置名称应与录入名称一致。\u003c/li>\u003c/ol>\u003ch5 id=\"technical-heading-48\">录入操作\u003c/h5>\u003cp>在 Flash 决策模块运行终端输入 mem，根据提示输入大物体名称（如\"黑色桌子\"）。机器人到位且感知画面稳定后，直接按一次回车，记录当前位姿。完成该位置的录入后输入 q。重复以上步骤录入所有位置。\u003c/p>\u003ch5 id=\"technical-heading-49\">查看已录入位置\u003c/h5>\u003cp>在运行终端输入 objs，终端和 log/agent.log 将显示已录入的大物体名称。\u003c/p>\u003ch4 id=\"technical-heading-50\">2.2.4　任务使用\u003c/h4>\u003cp>完成位置录入后，可通过整机语音交互下达任务。任务应同时说明待操作物体的来源位置和放置位置，例如：\"请把黑色桌子上的矿泉水瓶放到茶几上。\"\u003c/p>\u003cp>当目标或位置存在歧义时，系统会通过语音追问。应在 feedback_timeout_sec 规定的时间内直接回答问题。需要取消当前任务时，只需唤醒语音后说明停止任务即可。\u003c/p>\u003ch4 id=\"technical-heading-51\">2.2.5　关键参数\u003c/h4>\u003ch5 id=\"technical-heading-52\">大物体记忆\u003c/h5>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>说明\u003c/th>\u003cth>建议\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>is_clear_mem\u003c/td>\u003ctd>启动时是否清空已录入的大物体位置\u003c/td>\u003ctd>日常运行设置为 false；仅在需要重建全部位置时临时设为 true\u003c/td>\u003c/tr>\u003ctr>\u003ctd>mem_path\u003c/td>\u003ctd>大物体位置记录文件的保存路径\u003c/td>\u003ctd>使用现场实际的绝对路径，并保证运行账号具有写入权限\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch5 id=\"technical-heading-53\">任务控制\u003c/h5>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>max_task_steps\u003c/td>\u003ctd>单个任务允许的最大规划与执行步数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>feedback_timeout_sec\u003c/td>\u003ctd>系统追问后等待用户回答的秒数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>max_action_retry_times\u003c/td>\u003ctd>单个动作执行失败时允许的最大尝试次数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>max_clarify_rounds\u003c/td>\u003ctd>单个任务允许的最大追问次数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-54\">2.2.6　常见问题\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>问题\u003c/th>\u003cth>处理方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>启动时提示配置文件不存在\u003c/td>\u003ctd>检查 AGENT_CONFIG_PATH 是否指向 Flash 版本的 config.yaml\u003c/td>\u003c/tr>\u003ctr>\u003ctd>启动后不是 Flash 行为\u003c/td>\u003ctd>确认 brain-planner-v2-flash 为 Flash 配套交付包，且加载路径为 multimodal-agent-flash\u003c/td>\u003c/tr>\u003ctr>\u003ctd>输入 mem 后无法记录\u003c/td>\u003ctd>确认决策进程在前台运行、感知模块正常启动、semantic_map 正在输出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重启后已录入位置消失\u003c/td>\u003ctd>检查 is_clear_mem 是否为 false，以及 mem_path 文件是否存在并可读写\u003c/td>\u003c/tr>\u003ctr>\u003ctd>提示记忆中找不到位置\u003c/td>\u003ctd>使用 objs 检查录入名称，并使用一致的位置名称重新下达任务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>云端模型调用失败\u003c/td>\u003ctd>检查网络、API Key、模型地址、模型名称和账号权限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>抓取框或放置点定位失败\u003c/td>\u003ctd>检查 locate_model_url、定位服务状态、网络和当前感知图像\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"technical-heading-55\">2.3　感知模块使用说明书\u003c/h3>\u003cp>适用交付包：konka_percept_second_bat_cython\u003c/p>\u003ch4 id=\"technical-heading-56\">2.3.1　概述\u003c/h4>\u003cp>感知模块对机器人画面进行物体识别、轮廓分割和目标跟踪。模型及程序已经包含在交付包中，日常使用无需重新编译。\u003c/p>\u003cp>安装目录：/home/chric/konka/perception/konka_percept_second_bat_cython\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>文件\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>start_perception.sh\u003c/td>\u003ctd>启动感知服务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>server_config.yaml\u003c/td>\u003ctd>配置识别阈值、处理帧率、结果保存和服务端口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>logs/pipeline.log\u003c/td>\u003ctd>记录模型初始化、图像处理耗时和运行异常\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-57\">2.3.2　启动前检查\u003c/h4>\u003col>\u003cli>perception_env 环境已经安装并可正常激活。\u003c/li>\u003cli>相机及整机图像服务已经启动。\u003c/li>\u003cli>GPU、模型文件和交付目录完整可用。\u003c/li>\u003cli>服务端口 50051 未被其他程序占用。\u003c/li>\u003cli>server_config.yaml 中的消息大小已经填写为整数。\u003c/li>\u003c/ol>\u003ch4 id=\"technical-heading-58\">2.3.3　启动与运行检查\u003c/h4>\u003cp>在机器人终端执行：\u003c/p>\u003cpre>\u003ccode>conda activate perception_env\ncd /home/chric/konka/perception/konka_percept_second_bat_cython\nbash start_perception.sh\u003c/code>\u003c/pre>\u003cp>感知服务以前台方式运行，启动终端应保持打开。同一台机器人只启动一个实例。\u003c/p>\u003cp>判断是否启动完成：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>终端或日志信息\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Initializing Pipeline...\u003c/td>\u003ctd>模型和处理流程正在初始化，应继续等待\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gRPC Server listening on 50051\u003c/td>\u003ctd>感知服务已经开始监听 50051 端口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ROS Subscribed to ...\u003c/td>\u003ctd>已连接交付配置中的图像输入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>持续出现 pre_time、infer_time、all_time\u003c/td>\u003ctd>正在持续接收并处理图像\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-59\">2.3.4　停止与重启\u003c/h4>\u003cp>在另一终端执行停止命令，或在启动终端按 Ctrl+C。随后检查服务是否已经退出：\u003c/p>\u003cpre>\u003ccode>pgrep -af 'run_konka_percept_server.py'\u003c/code>\u003c/pre>\u003cp>命令没有输出表示服务已经停止。\u003c/p>\u003cp>⚠ 不要直接关闭终端后立即重复启动，以免旧进程继续占用 GPU 或 50051 端口。修改 server_config.yaml 后不支持运行中自动重新加载，需先停止再启动。\u003c/p>\u003ch4 id=\"technical-heading-60\">2.3.5　关键参数配置\u003c/h4>\u003ch5 id=\"technical-heading-61\">识别阈值\u003c/h5>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>交付值\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>conf_threshold\u003c/td>\u003ctd>0.2\u003c/td>\u003ctd>识别置信度下限（0~1）。提高后结果更严格，可减少误检，但可能增加漏检\u003c/td>\u003c/tr>\u003ctr>\u003ctd>iou_threshold\u003c/td>\u003ctd>0.7\u003c/td>\u003ctd>重叠框去重阈值（0~1）。降低后更积极地删除重叠框\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch5 id=\"technical-heading-62\">处理帧率\u003c/h5>\u003cp>target_fps 表示每秒接收图像的上限，并不保证实际处理速度一定达到该值。填写 0 表示不主动限制接收帧率。\u003c/p>\u003ch5 id=\"technical-heading-63\">显示与结果保存\u003c/h5>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>img_show\u003c/td>\u003ctd>是否在机器人本机显示实时识别画面。普通 SSH 环境应保持 false\u003c/td>\u003c/tr>\u003ctr>\u003ctd>img_save\u003c/td>\u003ctd>是否保存输入图像\u003c/td>\u003c/tr>\u003ctr>\u003ctd>img_result_save\u003c/td>\u003ctd>是否保存带目标框和轮廓的结果图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>json_result_save\u003c/td>\u003ctd>是否保存结构化识别结果\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>调试结束后关闭图像与结果保存；普通 SSH 环境设置 img_show=false。\u003c/p>\u003ch5 id=\"technical-heading-64\">服务端口与消息大小\u003c/h5>\u003cp>server_port 默认为 50051。消息大小参数（max_send_message_length 和 max_receive_message_length）必须填写整数（如 1048576），不能保留表达式。出现 RESOURCE_EXHAUSTED 时可调整为 16777216（16 MiB）。\u003c/p>\u003ch4 id=\"technical-heading-65\">2.3.6　日志查看\u003c/h4>\u003cpre>\u003ccode>cd /home/chric/konka/perception/konka_percept_second_bat_cython\ntail -n 100 logs/pipeline.log\ntail -f logs/pipeline.log\u003c/code>\u003c/pre>\u003cp>日志文件达到约 10 MiB 后自动轮换，最多保留 5 个历史文件。\u003c/p>\u003ch4 id=\"technical-heading-66\">2.3.7　常见问题\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>问题\u003c/th>\u003cth>处理方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>启动提示模块或环境不存在\u003c/td>\u003ctd>确认已激活 perception_env，并从完整交付目录运行 start_perception.sh\u003c/td>\u003c/tr>\u003ctr>\u003ctd>启动时出现消息长度类型错误\u003c/td>\u003ctd>将两项消息大小改为整数，不能保留表达式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>提示端口已经占用或服务已经运行\u003c/td>\u003ctd>检查并停止旧进程，确认 50051 已释放后再启动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已监听端口但没有持续处理日志\u003c/td>\u003ctd>检查相机及整机图像服务是否正常\u003c/td>\u003c/tr>\u003ctr>\u003ctd>持续处理但识别不到目标\u003c/td>\u003ctd>检查光照、遮挡、目标类别及 conf_threshold 是否过高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>误检或重复结果较多\u003c/td>\u003ctd>逐项调整置信度和重叠框阈值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开启显示后报错\u003c/td>\u003ctd>无图形桌面时关闭 img_show，使用 img_result_save 保存结果图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>修改配置后没有变化\u003c/td>\u003ctd>确认修改的是实际运行目录中的 server_config.yaml，完整停止并重新启动\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"technical-heading-67\">2.4　语音模块使用说明书\u003c/h3>\u003cp>适用交付包：sound_work_sdk_v2_cython\u003c/p>\u003ch4 id=\"technical-heading-68\">2.4.1　概述\u003c/h4>\u003cp>语音模块提供唤醒、语音识别（ASR）和语音播报（TTS）功能。唤醒词检测在本地运行，语音识别和语音合成需要连接云端服务。机器人任务执行需配合决策及执行模块。\u003c/p>\u003cp>安装目录：/home/chric/Desktop/package_sound/sound_work_sdk_v2\u003c/p>\u003ch4 id=\"technical-heading-69\">2.4.2　启动与停止\u003c/h4>\u003cp>启动前确认麦克风、扬声器工作正常，设备可访问云端服务，且两个启动脚本均已配置有效的 API Key。\u003c/p>\u003cp>在终端 1 中启动语音播报：\u003c/p>\u003cpre>\u003ccode>bash /home/chric/Desktop/package_sound/sound_work_sdk_v2/run_tts.sh\u003c/code>\u003c/pre>\u003cp>在终端 2 中启动语音识别：\u003c/p>\u003cpre>\u003ccode>bash /home/chric/Desktop/package_sound/sound_work_sdk_v2/run_asr.sh\u003c/code>\u003c/pre>\u003cp>脚本自动激活 audio_env 并加载运行环境。运行期间保持两个终端打开，同一脚本不要重复启动。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模块\u003c/th>\u003cth>启动完成标志\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>语音播报\u003c/td>\u003ctd>终端显示 TTS Control Node started (service + direct topic)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>语音识别\u003c/td>\u003ctd>终端显示 音频输入流已打开、等待唤醒词\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-70\">2.4.3　功能检查\u003c/h4>\u003cp>语音交互流程见\u003ca href=\"#manual/manual-heading-18\">语音与组合任务\u003c/a>。\u003c/p>\u003cp>单独检查扬声器播报：\u003c/p>\u003cpre>\u003ccode>conda activate audio_env\nsource /home/chric/Desktop/package_sound/sound_work_sdk_v2/install/setup.bash\nros2 topic pub --once /brain/tts_play std_msgs/msg/String \\\n  \"data: '你好，我是贡嘎机器人'\"\u003c/code>\u003c/pre>\u003ch4 id=\"technical-heading-71\">2.4.4　参数配置\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>配置文件\u003c/th>\u003cth>配置内容\u003c/th>\u003cth>生效方式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>run_asr.sh\u003c/td>\u003ctd>安装路径、API Key、应答音色、收音阈值、录音时长\u003c/td>\u003ctd>保存后重启 ASR\u003c/td>\u003c/tr>\u003ctr>\u003ctd>run_tts.sh\u003c/td>\u003ctd>安装路径、API Key、播报音色\u003c/td>\u003ctd>保存后重启 TTS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>audio_depends/model_files/keywords.txt\u003c/td>\u003ctd>唤醒词\u003c/td>\u003ctd>保存后重启 ASR\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch5 id=\"technical-heading-72\">API Key 获取与配置\u003c/h5>\u003col>\u003cli>访问阿里云百炼控制台，注册并登录阿里云账号，按页面提示开通服务。\u003c/li>\u003cli>进入 API Key 管理页面，创建并复制 API Key。\u003c/li>\u003cli>分别打开 run_asr.sh 和 run_tts.sh，将 DASHSCOPE_API_KEY 替换为获取的 Key。\u003c/li>\u003cli>保存两个文件，分别重启 ASR 和 TTS。\u003c/li>\u003c/ol>\u003ch5 id=\"technical-heading-73\">主要参数说明\u003c/h5>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>配置位置\u003c/th>\u003cth>交付配置值\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>WORK_DIR\u003c/td>\u003ctd>两个启动脚本\u003c/td>\u003ctd>安装目录路径\u003c/td>\u003ctd>程序安装目录，两个脚本应保持一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DASHSCOPE_API_KEY\u003c/td>\u003ctd>两个启动脚本\u003c/td>\u003ctd>已配置凭证\u003c/td>\u003ctd>云端服务访问凭证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VOICE\u003c/td>\u003ctd>两个启动脚本\u003c/td>\u003ctd>Cherry\u003c/td>\u003ctd>语音合成音色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MIC_ENERGY_THRESHOLD\u003c/td>\u003ctd>run_asr.sh\u003c/td>\u003ctd>0.0001\u003c/td>\u003ctd>唤醒后判断有效语音的能量门槛\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MIC_VAD_THRESHOLD\u003c/td>\u003ctd>run_asr.sh\u003c/td>\u003ctd>0.08\u003c/td>\u003ctd>唤醒后语音短帧占比的判定门槛\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RECORD_MAX_SECONDS\u003c/td>\u003ctd>run_asr.sh\u003c/td>\u003ctd>20\u003c/td>\u003ctd>单次录音时长上限，单位秒\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-74\">2.4.5　常见问题\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>问题\u003c/th>\u003cth>处理方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>启动提示\"进入目录失败\"\u003c/td>\u003ctd>检查两个脚本中的 WORK_DIR 是否与实际安装目录一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>找不到运行环境或 install/setup.bash\u003c/td>\u003ctd>联系维护人员检查预装环境及交付文件完整性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>无法唤醒\u003c/td>\u003ctd>确认 ASR 已就绪、唤醒检测已开启，检查默认麦克风并完整说出唤醒词\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已唤醒但未识别到指令\u003c/td>\u003ctd>应答结束后稍作停顿再说话；检查说话距离、等待开口时间及收音阈值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>唤醒正常，语音识别失败\u003c/td>\u003ctd>检查网络、API Key 和 ASR 终端错误；本地唤醒正常不代表云端服务可用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>播报没有声音\u003c/td>\u003ctd>确认 TTS 已启动，检查默认扬声器、系统音量、网络和 API Key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>修改音色后唤醒应答未变化\u003c/td>\u003ctd>检查是否使用已有本地应答音频\u003c/td>\u003c/tr>\u003ctr>\u003ctd>播报触发了新的唤醒\u003c/td>\u003ctd>将麦克风与扬声器适当隔离，必要时暂停唤醒检测\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2 id=\"technical-heading-75\">3　导航模块\u003c/h2>\u003cp>导航脚本目录：~/konka/navigation/scripts。\u003c/p>\u003ch3 id=\"technical-heading-76\">3.1　建图与定位操作\u003c/h3>\u003cp>开始导航前释放急停。\u003c/p>\u003cp>开始导航操作前，请先按\u003ca href=\"#technical/technical-heading-1\">第 1.1 节\u003c/a>启动全部传感器与电机驱动，并确认各传感器数据正常。\u003c/p>\u003cp>如果场景不变，且已经完成过地图构建，可跳过建图步骤，直接执行重定位（\u003ca href=\"#technical/technical-heading-79\">见第 3.1.3 节\u003c/a>）。\u003c/p>\u003ch4 id=\"technical-heading-77\">3.1.1　运行关节复位\u003c/h4>\u003cp>打开新终端，执行：\u003c/p>\u003cpre>\u003ccode>cd ~/konka/navigation/scripts\n./2_nav_head_cam_control.sh\u003c/code>\u003c/pre>\u003cp>通过状态反馈及现场技术人员确认各关节已使能，尤其检查头部相机关节。复位及使能期间不要用手扳动或触碰关节进行验证。\u003c/p>\u003ch4 id=\"technical-heading-78\">3.1.2　建图\u003c/h4>\u003cp>打开新终端，执行建图启动脚本：\u003c/p>\u003cpre>\u003ccode>cd ~/konka/navigation/scripts\n./3_nav_split_start.sh\u003c/code>\u003c/pre>\u003cp>再打开一个新窗口，运行键盘控制器，控制机器人扫描环境：\u003c/p>\u003cpre>\u003ccode>ros2 run teleop_twist_keyboard teleop_twist_keyboard\u003c/code>\u003c/pre>\u003cp>键盘按键说明：I 前进、，后退、J 逆时针转、L 顺时针转。\u003c/p>\u003cp>⚠ 建图时速度控制在 0.1 m/s 为佳，过程中尽量避免原地自转。走慢、多停，每个房间都要走到，避免漏区域。\u003c/p>\u003cp>建图过程中可在 RViz 中观察地图与轨迹：\u003c/p>\u003cul>\u003cli>订阅 /map 查看 2D 栅格地图，检查墙线是否连续、有无重影。\u003c/li>\u003cli>订阅 /rtabmap/mapPath 和 /rtabmap/mapGraph 查看轨迹，回到起点时轨迹应闭合。\u003c/li>\u003c/ul>\u003cp>完成建图后，在建图终端按一次 Ctrl+C，让程序自动关闭并保存地图。\u003c/p>\u003cp>⚠ 保存地图请使用 Ctrl+C 正常退出，不要使用 kill -9，否则会丢失未保存的地图数据。地图数据库默认保存在 ~/.ros/rtabmap.db，建图完成后建议及时备份该文件。\u003c/p>\u003ch4 id=\"technical-heading-79\">3.1.3　重定位\u003c/h4>\u003cp>在已建图的环境中重新启动时，使用重定位模式：\u003c/p>\u003cpre>\u003ccode>cd ~/konka/navigation/scripts\n./3_nav_split_start_reloc.sh\u003c/code>\u003c/pre>\u003cp>成功运行后，让机器人多走动一下（键盘控制），在 RViz 上可看到地图被加载出来：\u003c/p>\u003cpre>\u003ccode>ros2 run teleop_twist_keyboard teleop_twist_keyboard\u003c/code>\u003c/pre>\u003cp>按终端显示的键位逐步调整速度，并核对显示值；建议以约 0.2 m/s 的低速，控制机器人在环境中走一圈，基本可以完成定位匹配。\u003c/p>\u003ch4 id=\"technical-heading-80\">3.1.4　启动场景图与调度器\u003c/h4>\u003cp>打开新终端，执行：\u003c/p>\u003cpre>\u003ccode>cd ~/konka/navigation/scripts\n./4_semantic.sh\u003c/code>\u003c/pre>\u003ch4 id=\"technical-heading-81\">3.1.5　建图注意事项\u003c/h4>\u003cul>\u003cli>走太快或转太快会导致地图丢帧，宁可慢一点，每个房间多转两圈。\u003c/li>\u003cli>漏走的区域在地图中是未知区域，需补走一圈。\u003c/li>\u003cli>建图完成后及时备份地图文件，防止下次启动被清空。\u003c/li>\u003cli>建图时场地内尽量避免有走动的人，否则会被当成障碍物。\u003c/li>\u003c/ul>\u003ch4 id=\"technical-heading-82\">3.1.6　地图可用性判断标准\u003c/h4>\u003col>\u003cli>回到起点时轨迹闭合。\u003c/li>\u003cli>墙线连续、无重影。\u003c/li>\u003cli>切到定位模式后能稳定规划并到达目标。\u003c/li>\u003c/ol>\u003ch4 id=\"technical-heading-83\">3.1.7　磁盘空间检查\u003c/h4>\u003cp>磁盘空间不足时，先查看占用情况：\u003c/p>\u003cpre>\u003ccode>df -h\ndu -sh /home/chric/konka/semantic_map\u003c/code>\u003c/pre>\u003cp>备份场景数据后，清理不再需要的图像和结果文件。\u003c/p>\u003ch3 id=\"technical-heading-84\">3.2　导航使用操作\u003c/h3>\u003ch4 id=\"technical-heading-85\">3.2.1　发送导航目标\u003c/h4>\u003cp>重定位完成后，可直接在 RViz 中发送导航目标：\u003c/p>\u003col>\u003cli>点击 RViz 工具栏的 \"2D Goal Pose\"。\u003c/li>\u003cli>在地图上点击目标位置，并拖动箭头指定朝向。\u003c/li>\u003cli>机器人自动规划路径并驶向目标点。\u003c/li>\u003c/ol>\u003cp>也可通过上层决策模块下发导航任务（如语音指令），由导航调度器自动转换为导航目标执行。\u003c/p>\u003ch4 id=\"technical-heading-86\">3.2.2　上层任务接口\u003c/h4>\u003cp>二次开发时，可通过以下话题与导航调度器交互：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>接口\u003c/th>\u003cth>类型\u003c/th>\u003cth>方向\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>/brain/commands\u003c/td>\u003ctd>std_msgs/msg/String（JSON）\u003c/td>\u003ctd>订阅\u003c/td>\u003ctd>目标位置 JSON\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/brain/feedback\u003c/td>\u003ctd>std_msgs/msg/String（JSON）\u003c/td>\u003ctd>发布\u003c/td>\u003ctd>执行状态回传（working/succeeded/failed/canceled）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/brain/heartbeat\u003c/td>\u003ctd>std_msgs/msg/String\u003c/td>\u003ctd>订阅\u003c/td>\u003ctd>上层心跳\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>指令示例：{\"cmd_type\":\"goto\", \"position\":{\"x\":1.0,\"y\":2.0}}。新任务会自动抢占旧任务，无需手动取消。\u003c/p>\u003ch4 id=\"technical-heading-87\">3.2.3　速度限制\u003c/h4>\u003cp>导航系统默认速度限制如下，日常使用无需修改：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>限制值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>最大前进速度\u003c/td>\u003ctd>0.5 m/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大后退速度\u003c/td>\u003ctd>0.2 m/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大旋转速度\u003c/td>\u003ctd>0.4 rad/s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大线加速度\u003c/td>\u003ctd>1.0 m/s²\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大角加速度\u003c/td>\u003ctd>1.5 rad/s²\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-88\">3.2.4　安全注意事项\u003c/h4>\u003cul>\u003cli>导航过程中遇到障碍物，机器人会自动减速或绕行；狭窄通道可能出现犹豫，属正常现象。\u003c/li>\u003cli>导航失败时机器人会自动尝试恢复（清图、后退、旋转等），多次失败后任务终止。\u003c/li>\u003cli>急停断电后重新上电，需确认没有程序在下发运动命令，并等待升降电机搜零完成。\u003c/li>\u003cli>目标点不要直接设置在障碍物内部（如柜子里面），应设在障碍物前方可到达的位置。\u003c/li>\u003c/ul>\u003ch4 id=\"technical-heading-89\">3.2.5　常见问题排查\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>现象\u003c/th>\u003cth>处理方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RViz 中看不到地图\u003c/td>\u003ctd>确认已执行重定位脚本并控制机器人走动完成匹配\u003c/td>\u003c/tr>\u003ctr>\u003ctd>发目标点后机器人不动\u003c/td>\u003ctd>检查定位是否完成、传感器是否正常、目标点是否在障碍物内\u003c/td>\u003c/tr>\u003ctr>\u003ctd>机器人反复规划失败\u003c/td>\u003ctd>将目标点移到开阔位置，远离墙壁和障碍物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>导航中机器人画龙/摇摆\u003c/td>\u003ctd>降低速度后重试；仍异常则联系维护人员调整参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>定位丢失/位置跳变\u003c/td>\u003ctd>重新执行重定位流程，控制机器人慢速走一圈\u003c/td>\u003c/tr>\u003ctr>\u003ctd>建图后下次启动地图丢失\u003c/td>\u003ctd>建图启动会清空旧地图，务必提前备份 ~/.ros/rtabmap.db\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2 id=\"technical-heading-90\">4　控制模块\u003c/h2>\u003ch3 id=\"technical-heading-91\">4.1　控制模块设计框架\u003c/h3>\u003cp>控制模块由三个核心节点组成：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>节点\u003c/th>\u003cth>职责\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>定位节点\u003c/td>\u003ctd>视觉分割，定位目标点位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>控制节点\u003c/td>\u003ctd>提供各种夹爪运动控制子服务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小脑节点\u003c/td>\u003ctd>接收任务命令，管理控制模块状态，并调用子服务组合完成任务\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>以 pickup 任务为例，执行流程如下：\u003c/p>\u003col>\u003cli>决策下发 pickup 任务给小脑节点\u003c/li>\u003cli>小脑节点调用定位服务获取物体质心坐标\u003c/li>\u003cli>调用运动服务控制夹爪运动至指定坐标\u003c/li>\u003cli>合拢夹爪\u003c/li>\u003cli>关节复位\u003c/li>\u003c/ol>\u003ch4 id=\"technical-heading-92\">4.1.1　常见注意事项\u003c/h4>\u003cul>\u003cli>报错\"运动规划失败：IK_solve_failed\"：此提示为目标位置不可达。\u003c/li>\u003cli>定位和避障基于深度信息，在光线不佳或者面对透明、吸光物体时，可能产生误差。\u003c/li>\u003cli>在运动过程中如果进行急停断电，重新上电前需确认没有程序在下发电机运动命令，上电后等待升降电机进行搜零。\u003c/li>\u003c/ul>\u003ch3 id=\"technical-heading-93\">4.2　控制模块子服务\u003c/h3>\u003ch4 id=\"technical-heading-94\">4.2.1　定位节点子服务\u003c/h4>\u003cp>通过框选的像素坐标进行深度信息分割，并计算出目标物体的质心位置。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>消息类型\u003c/td>\u003ctd>motion_interface.srv.GetPose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>服务名称\u003c/td>\u003ctd>/get_grasp_poses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>request 参数\u003c/td>\u003ctd>left_top（左上角）、right_bottom（右下角）、point_2d（点选坐标）、image_rgb_url、image_depth_url\u003c/td>\u003c/tr>\u003ctr>\u003ctd>response 参数\u003c/td>\u003ctd>is_success（是否成功）、pose（目标物体质心位姿）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-95\">4.2.2　轨迹规划运动子服务\u003c/h4>\u003cp>基于英伟达 curobo 库进行末端夹爪轨迹规划并执行。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>消息类型\u003c/td>\u003ctd>motion_interface.srv.GripperMove\u003c/td>\u003c/tr>\u003ctr>\u003ctd>服务名称\u003c/td>\u003ctd>/motion_controller/plan_srv\u003c/td>\u003c/tr>\u003ctr>\u003ctd>request 参数\u003c/td>\u003ctd>depth_url、target_pos、target_roll/pitch/yaw、set_joint &amp; set_position、use_envmesh、move_mode\u003c/td>\u003c/tr>\u003ctr>\u003ctd>response 参数\u003c/td>\u003ctd>is_success、failure_reason\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-96\">4.2.3　夹爪受力子服务\u003c/h4>\u003cp>通过控制夹爪来控制电子皮肤压力，在达到期望压力前夹爪会持续收紧。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>消息类型\u003c/td>\u003ctd>motion_interface.srv.GripperMove\u003c/td>\u003c/tr>\u003ctr>\u003ctd>服务名称\u003c/td>\u003ctd>/motion_controller/force_srv\u003c/td>\u003c/tr>\u003ctr>\u003ctd>request 参数\u003c/td>\u003ctd>target_force（期望受力）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>response 参数\u003c/td>\u003ctd>is_success、failure_reason\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 id=\"technical-heading-97\">4.2.4　关节运动子服务\u003c/h4>\u003cp>监控关节直接运动，在关节抵达目标位置后返回。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>消息类型\u003c/td>\u003ctd>motion_interface.srv.JointMove\u003c/td>\u003c/tr>\u003ctr>\u003ctd>服务名称\u003c/td>\u003ctd>/motion_controller/joint_move_srv\u003c/td>\u003c/tr>\u003ctr>\u003ctd>request 参数\u003c/td>\u003ctd>joint（受控电机名称）、pos（目标位置）、vel（运动速度）、mode（运动模式）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>response 参数\u003c/td>\u003ctd>is_success、failure_reason\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"technical-heading-98\">4.3　LeRobot 框架\u003c/h3>\u003cp>本机已部署 LeRobot 框架，并打包了机器人 API 用于训练：lerobot_robot_my_robot/my_robot.py。此部分代码完全开源，可方便地用于二次开发。\u003c/p>\u003cp>二次开发可参考官网教程：https://huggingface.co/docs/lerobot/index\u003c/p>\u003ch4 id=\"technical-heading-99\">4.3.1　数据采集\u003c/h4>\u003cp>在 lerobot/config 中设置数采参数。系统数据流：遥控器 → 机器人API → 运动控制器 → 电机驱动，同时数据保存。\u003c/p>\u003ch4 id=\"technical-heading-100\">4.3.2　模型训练\u003c/h4>\u003cp>数采结束后，将数据发送到服务器上，使用以下命令开始训练：\u003c/p>\u003cpre>\u003ccode>python lerobot_train.py \\\n  --dataset.repo_id \"/mnt/data0/Peiyan_WS/lerobot/my_dataset/test_task1\" \\\n  --policy.type \"smolvla\" \\\n  --policy.pretrained_path \"lerobot/smolvla_base\" \\\n  --policy.push_to_hub False \\\n  --steps 14000 \\\n  --batch_size 64 \\\n  --num_workers 32 \\\n  --policy.chunk_size 64 \\\n  --policy.n_obs_steps 1 \\\n  --save_freq 1000 \\\n  --eval_freq 1000 \\\n  --wandb.enable False \\\n  --output_dir \"./outputs/smolvla_test_task1\"\u003c/code>\u003c/pre>\u003cp>可以更改上述参数，选择模型、训练轮数等。\u003c/p>\u003ch4 id=\"technical-heading-101\">4.3.3　模型部署\u003c/h4>\u003cp>训练完成后，将模型文件放到机器人本地，在 run_policy_config.json 中指明模型路径，运行 run_policy.py 来执行模型。\u003c/p>\u003cp>⚠ 数采脚本是通用型设计：在没有遥控器操控时执行模型输出；在有遥控器输出时以遥控器为主。将遥控器设为空、数据采集设为否，并指明模型路径，即是一个纯粹的模型执行脚本。\u003c/p>\u003ch3 id=\"technical-heading-102\">4.4　Isaac Sim 控制仿真\u003c/h3>\u003cp>控制模块还提供了开源的 Isaac Sim 代码级仿真，位于 konka_motion_v3.1 的 sim_driver 之中。\u003c/p>\u003cp>运行命令：\u003c/p>\u003cpre>\u003ccode>ros2 run sim_driver sim_driver\u003c/code>\u003c/pre>\u003cp>⚠ 该仿真应运行于个人电脑或服务器上，并已提前安装好 Isaac Sim 软件并配置对应环境。\u003c/p>\u003cp>该仿真代码将 Isaac Sim 运行代码打包为一个 ROS2 节点，并嵌入了机器人的电机和深度相机 API。运行时可以通过 ROS2 模拟机器人本体，驱动方式和机器人一致。用户可以在运动代码部署之前，于仿真中验证是否安全。\u003c/p>\u003ch3 id=\"technical-heading-103\">4.5　VR 遥控\u003c/h3>\u003cp>依次启动机器人端服务、打开头显程序并连接设备。\u003c/p>\u003ch4 id=\"technical-heading-104\">4.5.1　使用前准备\u003c/h4>\u003cul>\u003cli>机器人正常开机，机械臂周围无障碍物，运动范围内无人员停留。\u003c/li>\u003cli>机器人与 VR 头显接入同一局域网，网络连接正常。\u003c/li>\u003cli>VR 头显和手柄电量充足，手柄定位与追踪正常。\u003c/li>\u003c/ul>\u003ch4 id=\"technical-heading-105\">4.5.2　启动机器人端 VR 服务\u003c/h4>\u003cp>通过 SSH 登录机器人，或直接在机器人端打开终端，执行：\u003c/p>\u003cpre>\u003ccode>cd /home/chric/konka/control/xr_action_processor\n./start_vr.sh\u003c/code>\u003c/pre>\u003cp>脚本运行后保持终端开启，并检查启动日志。出现以下信息表示关键服务已启动：\u003c/p>\u003cul>\u003cli>mDNS service registered：机器人发现服务已注册。\u003c/li>\u003cli>WebRTC streamer started：WebRTC 视频流服务已启动。\u003c/li>\u003cli>Established under name '…'：机器人已以指定名称发布服务。\u003c/li>\u003c/ul>\u003cp>记录启动日志中的设备名称与编号，在 VR 程序中选择同一设备。\u003c/p>\u003ch4 id=\"technical-heading-106\">4.5.3　启动 VR 程序并连接机器人\u003c/h4>\u003col>\u003cli>确认 VR 头显已连接与机器人相同的局域网。\u003c/li>\u003cli>按下手柄 Meta 键打开菜单，进入“未知来源”，运行机器人 VR 程序。\u003c/li>\u003cli>程序发现机器人后，选择名称及设备编号与机器人端日志一致的条目进行连接。\u003c/li>\u003cli>如果提示“未能发现机器人”，选择“配置机器人”，再选择对应的机器人条目。\u003c/li>\u003c/ol>\u003cp>如果仍未发现机器人，请检查机器人端 start_vr.sh 是否持续运行、两端是否处于同一局域网，并重新确认机器人名称和设备编号。\u003c/p>\u003cp>手柄校准和启停方法见\u003ca href=\"#manual/manual-heading-19\">VR 遥控操作\u003c/a>。\u003c/p>\u003c/section>\u003csection id=\"hardware\">\u003ch2 id=\"technical-heading-107\">5　硬件接口与扩展\u003c/h2>\u003cp class=\"lead\">连接第三方设备前，先确认接口用途、电压范围及功率要求。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>接口\u003c/th>\u003cth>配置或用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>通用 USB\u003c/td>\u003ctd>底盘 USB 3.0 × 4，腕部 × 1，头部 × 1；用于匹配的外设和数据设备\u003c/td>\u003c/tr>\u003ctr>\u003ctd>专用 Type-C\u003c/td>\u003ctd>主板刷机用途，按技术人员指导使用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>网口\u003c/td>\u003ctd>底盘网口 × 1，网络参数按本机部署配置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>直流外放电\u003c/td>\u003ctd>底盘及腕部；输出电压范围为 18～25.2 V，随电池电压变化\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cstrong>外放电接口\u003c/strong>\u003cp>输出电压为 18～25.2 V，随电池电压变化。连接前检查负载输入电压、接口针脚、极性及允许电流。\u003c/p>\u003cp>USB 设备应满足接口兼容与供电要求。更换末端执行器后，应核对机械连接、线束余量、重量、控制参数及标定要求；不得超出腕部承重。刷机、固件升级、标零和相机标定属于技术操作，应使用与设备版本匹配的工具和正式资料。\u003c/p>\u003c/section>", "version": "V1.0", "date": "2026.11.16", "pdf": "PDF/GONGKA Robot 技术手册.pdf", "pages": 27, "bytes": 1813988}, {"id": "sdk", "title": "SDK 使用指南", "summary": "SDK 环境配置、构建方法、连接及使用。", "html": "\u003csection>\u003ch2 id=\"sdk-heading-0\">1　概述\u003c/h2>\u003ch3 id=\"sdk-heading-1\">1.1　基本介绍\u003c/h3>\u003cp>GONGKA Robot SDK 提供四类客户端，用于与 GONGKA Robot进行通信和控制。 各类客户端的详细接口定义见\u003ca href=\"#api/api-heading-0\">API 接口参考 第 1 节\u003c/a>。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>客户端\u003c/th>\u003cth>职责\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ControlApiClient\u003c/td>\u003ctd>关节信息、动作控制（点头/抓取放置）、夹爪移动、抓取位姿、电机反馈订阅、电机驱动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NavigationApiClient\u003c/td>\u003ctd>位姿与栅格地图获取、启动/取消导航、剩余路径距离、开始/停止充电\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SystemApiClient\u003c/td>\u003ctd>电池与开关/拨码状态、灯光/风扇/电源/温光信息、红外充电与超声波订阅、风扇/灯光控制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PerceptionApiClient\u003c/td>\u003ctd>语音 ASR/TTS、大脑配置与开关、感知配置与感知结果、语音识别流与感知结果流\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"sdk-heading-2\">1.2　运行环境\u003c/h3>\u003cul>\u003cli>操作系统： Ubuntu 22.04.1\u003c/li>\u003cli>CPU 架构： x86_64 或 aarch64\u003c/li>\u003c/ul>\u003ch3 id=\"sdk-heading-3\">1.3　构建环境\u003c/h3>\u003cul>\u003cli>编译器： GCC 11.4.0 或以上\u003c/li>\u003cli>CMake 版本： 3.8.0 或以上\u003c/li>\u003c/ul>\u003ch2 id=\"sdk-heading-4\">2　快速开始\u003c/h2>\u003ch3 id=\"sdk-heading-5\">2.1　CMake 工程配置\u003c/h3>\u003cp>SDK 提供了 CMake 包配置文件，通过 find_package 即可引入。\u003c/p>\u003cp>项目目录结构：\u003c/p>\u003cpre>\u003ccode>my_project/\n  CMakeLists.txt        # 顶层 CMake\n  main.cpp              # 源代码\u003c/code>\u003c/pre>\u003cp>CMakeLists.txt：\u003c/p>\u003cpre>\u003ccode>cmake_minimum_required(VERSION 3.8)\nproject(\"my_project\" VERSION 1.0.0 LANGUAGES CXX)\n\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\n\n# 将 SDK 根目录加入搜索路径（指向 SDK 包的顶级目录）\nlist(APPEND CMAKE_PREFIX_PATH \"/path/to/konka_sdk_client\")\nfind_package(konka_sdk_client REQUIRED)\n\nadd_executable(my_app main.cpp)\ntarget_link_libraries(my_app PRIVATE konka_sdk_client::chric_konka_sdk_module_api)\u003c/code>\u003c/pre>\u003cp>编辑示例代码 main.cpp：\u003c/p>\u003cpre>\u003ccode>// 引入 SDK 客户端头文件\n#include \"chric/robot/konka/konka_control_api.h\"\n#include \"chric/robot/konka/konka_system_api.h\"\n\n#include &lt;chrono&gt;\n#include &lt;iostream&gt;\n#include &lt;memory&gt;\n#include &lt;thread&gt;\n\nusing namespace humanoid_robot::sdk_client::robot;\n\nint main() {\n    // 创建系统客户端\n    auto system_client = std::make_unique&lt;system_api::SystemApiClient&gt;();\n\n    // 连接系统客户端\n    auto conn_status = system_client-&gt;Connect(\"192.168.1.15\", 50050);\n    if (!conn_status) {\n        std::cerr &lt;&lt; \"Failed to connect: \" &lt;&lt; conn_status.message() &lt;&lt; std::endl;\n        return 1;\n    }\n\n    // 获取电池信息\n    system_api::BatteryInfo battery_info;\n    uint32_t status = system_client-&gt;GetBatteryInfo(battery_info);\n    if (status == 0) {\n        std::cout &lt;&lt; \"Battery: \" &lt;&lt; battery_info.charge_percentage() &lt;&lt; \"%\" &lt;&lt; std::endl;\n    }\n\n    system_client-&gt;Disconnect();\n    return 0;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"sdk-heading-6\">2.2　构建示例\u003c/h3>\u003cpre>\u003ccode>cd my_project\nmkdir build &amp;&amp; cd build\ncmake ..\nmake -j$(nproc)\u003c/code>\u003c/pre>\u003cp>SDK 共享库通过 $ORIGIN 相对 RPATH 定位库内依赖。示例程序构建时会写入 SDK 的绝对 RUNPATH；移动 SDK 目录后，重新配置并构建示例程序。\u003c/p>\u003cp>设置以下选项可关闭构建 RUNPATH，并自行配置运行库搜索路径：\u003c/p>\u003cpre>\u003ccode>set(CMAKE_SKIP_BUILD_RPATH ON)\u003c/code>\u003c/pre>\u003ch3 id=\"sdk-heading-7\">2.3　运行示例\u003c/h3>\u003cp>准备配置文件：\u003c/p>\u003cpre>\u003ccode>cd my_project/build\nmkdir -p config &amp;&amp; cat &gt; config/config.yaml &lt;&lt;'EOF'\ngrpc_client:\n  connection:\n    default_target: \"192.168.1.15:50050\"\n    channel_ready_timeout_ms: 5000    # 通道就绪超时 (ms)\n  channel:\n    max_receive_mb: 100               # 最大接收消息大小 (MB)\n    max_send_mb: 100                  # 最大发送消息大小 (MB)\nEOF\u003c/code>\u003c/pre>\u003cp>运行程序：\u003c/p>\u003cpre>\u003ccode>cd my_project/build\n./my_app\u003c/code>\u003c/pre>\u003ch2 id=\"sdk-heading-8\">3　与机器人建立连接\u003c/h2>\u003cp>创建客户端后，需要先与机器人的 API 服务端建立连接。\u003c/p>\u003cp>连接方式：\u003c/p>\u003cul>\u003cli>编程方式：调用 Connect(const std::string&amp; host, int port) 或 Connect(const std::string&amp; target) 方法直接指定地址，详见连接管理（见\u003ca href=\"#api/api-heading-1\">API 接口参考 第 1.1 节\u003c/a>）\u003c/li>\u003cli>配置文件方式：源码中调用 Connect() 方法后，程序会加载 config/config.yaml 中的 default_target 自动连接，详见配置文件说明（见\u003ca href=\"#sdk/sdk-heading-9\">第 4 节\u003c/a>）\u003c/li>\u003c/ul>\u003cp>四种客户端（ControlApiClient、NavigationApiClient、SystemApiClient、PerceptionApiClient）的连接相互独立，需各自建立连接。\u003c/p>\u003ch2 id=\"sdk-heading-9\">4　配置文件说明\u003c/h2>\u003cp>SDK 通过 config/config.yaml 管理配置。各客户端在初始化时会自动加载并初始化日志系统。\u003c/p>\u003ch3 id=\"sdk-heading-10\">4.1　gRPC 客户端\u003c/h3>\u003cpre>\u003ccode>grpc_client:\n  connection:\n    default_target: \"192.168.1.15:50050\"\n    channel_ready_timeout_ms: 5000    # 通道就绪超时 (ms)\n  channel:\n    max_receive_mb: 100               # 最大接收消息大小 (MB)\n    max_send_mb: 100                  # 最大发送消息大小 (MB)\u003c/code>\u003c/pre>\u003ch3 id=\"sdk-heading-11\">4.2　日志\u003c/h3>\u003cpre>\u003ccode>logging:\n  log_level: 3                        # 0=FATAL, 1=ERROR, 2=WARN, 3=INFO, 4=DEBUG\n  log_dir: \"SDK-Client/logs\"          # 日志目录（相对可执行程序路径或绝对路径）\n  max_file_size_mb: 3                 # 单文件最大大小 (MB)\n  max_files_per_level: 10             # 每级别最多保留文件数\n  enable_async: true                  # true=异步写, false=同步写\n  enable_console_output: true         # true=控制台输出\n  enable_simple_output: true          # true=简洁格式, false=详细格式（含文件、行号、函数名）\u003c/code>\u003c/pre>\u003cp>日志按级别分目录输出，文件命名格式为 log_&lt;pid&gt;_&lt;日期&gt;_&lt;时间&gt;_&lt;纳秒&gt;.txt：\u003c/p>\u003cpre>\u003ccode>SDK-Client/logs/\n  fatal/\n  error/\n  warning/\n  info/\n  debug/\u003c/code>\u003c/pre>\u003cp>编程方式控制（在创建任何 SDK 对象之前调用）：\u003c/p>\u003cpre>\u003ccode>#include \"chric/common/Log/wlog.hpp\"\n\n// 使用自定义配置文件\nWLogInitWithConfig(\"path/to/my_config.yaml\");\n\n// 或使用默认配置（DEBUG 级别，自动生成日志目录）\nWLogInit();\u003c/code>\u003c/pre>\u003ch2 id=\"sdk-heading-12\">5　示例程序\u003c/h2>\u003cp>SDK 包内 examples/ 目录提供了可编译运行的示例代码。\u003c/p>\u003cp>构建：\u003c/p>\u003cpre>\u003ccode>cd konka_sdk_client\nmkdir build &amp;&amp; cd build\ncmake ..\nmake -j$(nproc)\u003c/code>\u003c/pre>\u003cp>构建完成后二进制在 bin/ 目录下。CMake 会自动将 config/ 复制到构建目录，无需手动操作。\u003c/p>\u003cp>运行前请确保已根据实际环境修改 config/config.yaml 中的 default_target 地址和端口。\u003c/p>\u003ch2 id=\"sdk-heading-13\">6　常见问题\u003c/h2>\u003ch3 id=\"sdk-heading-14\">6.1　连接失败\u003c/h3>\u003col class=\"converted-steps\">\u003cli>检查机器人 API 服务端是否运行\u003c/li>\u003cli>检查地址和端口是否正确\u003c/li>\u003cli>检查防火墙设置\u003c/li>\u003c/ol>\u003ch3 id=\"sdk-heading-15\">6.2　订阅无回调\u003c/h3>\u003col class=\"converted-steps\">\u003cli>检查机器人 API 服务端是否已启用对应数据流\u003c/li>\u003cli>检查网络连接是否正常\u003c/li>\u003c/ol>\u003c/section>", "version": "V1.0", "date": "2026.11.16", "pdf": "PDF/GONGKA Robot SDK 使用指南.pdf", "pages": 6, "bytes": 1569220}, {"id": "api", "title": "API 接口参考", "summary": "控制、导航、系统和感知客户端的接口定义。", "html": "\u003csection>\u003ch2 id=\"api-heading-0\">1　API 接口定义\u003c/h2>\u003ch3 id=\"api-heading-1\">1.1　连接管理\u003c/h3>\u003cp>ControlApiClient、NavigationApiClient、SystemApiClient、PerceptionApiClient 的连接管理接口一致，但相互独立，都需要建立各自的连接才能使用业务接口。\u003c/p>\u003ch4 id=\"api-heading-2\">1.1.1　Connect\u003c/h4>\u003cpre>\u003ccode>Status Connect(const std::string&amp; server_address, int port);\nStatus Connect(const std::string&amp; target);\nStatus Connect();\u003c/code>\u003c/pre>\u003cp>功能： 与机器人的 API 服务端建立连接。\u003c/p>\u003cp>参数：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>server_address\u003c/td>\u003ctd>const std::string&amp;\u003c/td>\u003ctd>服务端地址（如 \"192.168.1.15\"）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>port\u003c/td>\u003ctd>int\u003c/td>\u003ctd>服务端端口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>target\u003c/td>\u003ctd>const std::string&amp;\u003c/td>\u003ctd>完整目标字符串（如 \"192.168.1.15:50050\"）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>重载：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>形式\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Connect(server_address, port)\u003c/td>\u003ctd>指定地址和端口连接\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Connect(target)\u003c/td>\u003ctd>指定完整目标字符串连接\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Connect()\u003c/td>\u003ctd>读取 config/config.yaml 中 grpc_client.connection.default_target 自动连接\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>返回值： Status，成功返回 OK，失败返回错误状态。\u003c/p>\u003cp>备注： 已连接时重复调用 Connect 会返回错误，需先调用 Disconnect()。\u003c/p>\u003ch4 id=\"api-heading-3\">1.1.2　Disconnect\u003c/h4>\u003cpre>\u003ccode>void Disconnect();\u003c/code>\u003c/pre>\u003cp>功能： 断开与 API 服务端的连接。\u003c/p>\u003cp>参数： 无。\u003c/p>\u003cp>返回值： 无。\u003c/p>\u003ch4 id=\"api-heading-4\">1.1.3　IsConnected\u003c/h4>\u003cpre>\u003ccode>bool IsConnected() const;\u003c/code>\u003c/pre>\u003cp>功能： 查询当前是否已与服务端建立连接。\u003c/p>\u003cp>参数： 无。\u003c/p>\u003cp>返回值： bool，true 已连接，false 未连接。\u003c/p>\u003ch3 id=\"api-heading-5\">1.2　ControlApiClient 业务接口\u003c/h3>\u003ch4 id=\"api-heading-6\">1.2.1　GetJointInfo\u003c/h4>\u003cpre>\u003ccode>uint32_t GetJointInfo(const RequestGetJointInfo&amp; request_get_joint_info, ResponseGetJointInfo&amp; response_get_joint_info);\u003c/code>\u003c/pre>\u003cp>功能： 获取机器人当前在线的关节状态信息。\u003c/p>\u003cp>参数：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>request_get_joint_info\u003c/td>\u003ctd>RequestGetJointInfo\u003c/td>\u003ctd>输入参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>response_get_joint_info\u003c/td>\u003ctd>ResponseGetJointInfo\u003c/td>\u003ctd>输出参数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>RequestGetJointInfo：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>with_support_mode\u003c/td>\u003ctd>bool\u003c/td>\u003ctd>是否返回每个关节支持的运动模式\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>ResponseGetJointInfo：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>joint_details\u003c/td>\u003ctd>repeated JointDetail\u003c/td>\u003ctd>关节状态详情列表\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>JointDetail：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>joint_name\u003c/td>\u003ctd>string\u003c/td>\u003ctd>机器人关节名称，如 head_yaw_joint、arm_joint\u003c/td>\u003c/tr>\u003ctr>\u003ctd>support_modes\u003c/td>\u003ctd>repeated int32\u003c/td>\u003ctd>支持的运动模式：1=位置模式，3=速度模式，4=升降搜零模式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>min_limit\u003c/td>\u003ctd>double\u003c/td>\u003ctd>最小限位，单位：rad、m，根据关节类型而定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>max_limit\u003c/td>\u003ctd>double\u003c/td>\u003ctd>最大限位，单位：rad、m，根据关节类型而定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>joint_type\u003c/td>\u003ctd>JointType\u003c/td>\u003ctd>关节类型\u003c/td>\u003c/tr>\u003ctr>\u003ctd>current_position\u003c/td>\u003ctd>double\u003c/td>\u003ctd>当前位置，单位：rad、m，根据关节类型而定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>current_velocity\u003c/td>\u003ctd>double\u003c/td>\u003ctd>当前速度，单位：rad/s、m/s，根据关节类型而定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>current_torque\u003c/td>\u003ctd>double\u003c/td>\u003ctd>当前力矩，单位：N·m，根据关节类型而定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>current_error\u003c/td>\u003ctd>int32\u003c/td>\u003ctd>当前错误码（0=无错误，其他值=错误）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>JointType：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>常量\u003c/th>\u003cth>枚举值\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>REVOLUTE\u003c/td>\u003ctd>0\u003c/td>\u003ctd>旋转关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CONTINUOUS\u003c/td>\u003ctd>1\u003c/td>\u003ctd>连续关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PRISMATIC\u003c/td>\u003ctd>2\u003c/td>\u003ctd>平移关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PLANAR\u003c/td>\u003ctd>3\u003c/td>\u003ctd>平面关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FLOATING\u003c/td>\u003ctd>4\u003c/td>\u003ctd>浮动关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FIXED\u003c/td>\u003ctd>5\u003c/td>\u003ctd>固定关节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UNKNOWN\u003c/td>\u003ctd>6\u003c/td>\u003ctd>未知关节类型\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>返回值： uint32_t，状态码。\u003c/p>\u003cul>\u003cli>超时： 请求超时 5 秒。\u003c/li>\u003c/ul>\u003ch4 id=\"api-heading-7\">1.2.2　NodAction\u003c/h4>\u003cpre>\u003ccode>uint32_t NodAction(const RequestNodAction&amp; request_nod_action, ResponseNodAction&amp; response_nod_action);\u003c/code>\u003c/pre>\u003cp>功能： 控制机器人执行点头动作。\u003c/p>\u003cp>参数：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>request_nod_action\u003c/td>\u003ctd>RequestNodAction\u003c/td>\u003ctd>输入参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>response_nod_action\u003c/td>\u003ctd>ResponseNodAction\u003c/td>\u003ctd>输出参数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>RequestNodAction：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>speed\u003c/td>\u003ctd>double\u003c/td>\u003ctd>动作执行速度，单位：弧度/秒\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nod_times\u003c/td>\u003ctd>int32\u003c/td>\u003ctd>点头次数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>ResponseNodAction：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>success\u003c/td>\u003ctd>bool\u003c/td>\u003ctd>动作是否执行成功\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>返回值： uint32_t，状态码。\u003c/p>\u003cp>超时： 超时 30 秒。\u003c/p>\u003cp>约束：\u003c/p>\u003cul>\u003cli>speed 取值范围：[0.25, 1.5]\u003c/li>\u003cli>nod_times 取值范围：[1, 10]\u003c/li>\u003c/ul>\u003ch4 id=\"api-heading-8\">1.2.3　PickupReleaseAction\u003c/h4>\u003cpre>\u003ccode>uint32_t PickupReleaseAction(const RequestPickupRelease&amp; request_pickup_release, ResponsePickupRelease&amp; response_pickup_release);\u003c/code>\u003c/pre>\u003cp>功能： 发送机器人执行抓取或放置动作指令，使用此接口前请先关闭大脑功能。当前抓取或释放动作状态通过 GetPickupReleaseState 接口获取。\u003c/p>\u003cp>参数：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>request_pickup_release\u003c/td>\u003ctd>RequestPickupRelease\u003c/td>\u003ctd>输入参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>response_pickup_release\u003c/td>\u003ctd>ResponsePickupRelease\u003c/td>\u003ctd>输出参数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>RequestPickupRelease：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u
